<!-- ============================================
     MONKOS 메타 태그 템플릿
     {{}} 부분을 서비스에 맞게 교체
     ============================================ -->

<!-- 기본 메타 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{설명}}">
<meta name="author" content="MONKOS">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{서비스명}}">
<meta property="og:description" content="{{설명}}">
<meta property="og:url" content="https://{{도메인}}">
<meta property="og:site_name" content="MONKOS">
<meta property="og:locale" content="{{ko_KR / ja_JP}}">
<meta property="og:image" content="https://{{도메인}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{서비스명}}">
<meta name="twitter:description" content="{{설명}}">
<meta name="twitter:image" content="https://{{도메인}}/og-image.png">

<!-- Favicon -->
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="/monkos-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Canonical + Hreflang (서비스에 맞게 조정) -->
<link rel="canonical" href="https://{{도메인}}/">
