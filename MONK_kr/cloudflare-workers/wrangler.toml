name = "monk-gemini-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Workers AI 바인딩 (Gemma 7B 사용)
[ai]
binding = "AI"

# D1 데이터베이스 바인딩 (MONK 서비스 맵)
[[d1_databases]]
binding = "DB"
database_name = "monk-services-db"
database_id = "1c88fa57-743a-470d-905e-d9054988fcdd"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "monk-chat-logs"
