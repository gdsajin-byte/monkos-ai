<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 성공 | MONK.kr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ai: '#60A5FA',
                        so: '#F472B6',
                        dark: '#030508'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center p-4">
    <div class="text-center max-w-sm">
        <div class="w-20 h-20 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-emerald-400 text-4xl"></i>
        </div>
        <h1 class="text-2xl font-black mb-2">로그인 성공!</h1>
        <p id="welcome-message" class="text-gray-400 mb-6">환영합니다</p>
        
        <div id="user-info" class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-6 text-left">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 bg-so/20 rounded-full flex items-center justify-center">
                    <i id="provider-icon" class="fas fa-user text-so"></i>
                </div>
                <div>
                    <p id="user-name" class="font-bold">로딩 중...</p>
                    <p id="user-email" class="text-xs text-gray-500"></p>
                </div>
            </div>
            <div class="flex items-center justify-between text-sm">
                <span class="text-gray-400">보유 크레딧</span>
                <span class="font-bold text-yellow-400"><i class="fas fa-coins mr-1"></i><span id="user-credits">100</span> cr</span>
            </div>
        </div>
        
        <p class="text-xs text-gray-500 mb-4">잠시 후 자동으로 이동합니다...</p>
        
        <button onclick="goToService()" class="w-full py-3 bg-so text-white font-bold rounded-xl">
            서비스 시작하기 →
        </button>
    </div>

    <script>
        // URL 파라미터에서 토큰과 사용자 정보 추출
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const userJson = params.get('user');
        
        if (token && userJson) {
            try {
                const user = JSON.parse(userJson);
                
                // localStorage에 저장
                localStorage.setItem('monk_auth_token', token);
                localStorage.setItem('monk_user', JSON.stringify(user));
                
                // UI 업데이트
                document.getElementById('welcome-message').textContent = `${user.name}님, 환영합니다!`;
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-email').textContent = user.email || '';
                
                // 프로바이더 아이콘
                const providerIcon = document.getElementById('provider-icon');
                if (user.provider === 'kakao') {
                    providerIcon.className = 'fas fa-comment text-yellow-400';
                } else if (user.provider === 'google') {
                    providerIcon.className = 'fab fa-google text-red-400';
                }
                
                // 크레딧 조회
                fetchCredits(token);
                
                // 3초 후 자동 이동
                setTimeout(goToService, 3000);
                
            } catch (e) {
                console.error('Parse error:', e);
            }
        } else {
            document.getElementById('welcome-message').textContent = '로그인 정보를 찾을 수 없습니다';
        }
        
        async function fetchCredits(token) {
            try {
                const res = await fetch('/api/auth?action=me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success && data.user) {
                    document.getElementById('user-credits').textContent = data.user.credits || 100;
                    localStorage.setItem('monkos_credits', data.user.credits || 100);
                }
            } catch (e) {
                console.error('Fetch credits error:', e);
            }
        }
        
        function goToService() {
            // 이전 페이지 또는 기본 페이지로 이동
            const returnUrl = sessionStorage.getItem('monk_return_url') || '/ai_lab/so_so/apps/ai_photo.html';
            sessionStorage.removeItem('monk_return_url');
            window.location.href = returnUrl;
        }
    </script>
</body>
</html>
