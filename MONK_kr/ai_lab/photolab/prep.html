<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C2H9ZM85F7"></script>

  window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030508">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MONKOS AI 증명사진</title>

    <!-- Open Graph -->
    <meta property="og:title" content="MONKOS AI 증명사진">
    <meta property="og:description" content="AI 코칭과 함께 완벽한 증명사진을 촬영하세요">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://monkos.ai/og-image.png">

    <!-- 파비콘 -->
    <link rel="icon" href="/monkos-icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="app.css">

    <!-- 토스페이먼츠 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
    <!-- 인앱 브라우저 안내 배너 -->
    <div id="inapp-banner" data-show="inappBrowser" style="display:none; background:#ff6b35; color:#fff; text-align:center; padding:10px 16px; font-size:13px; font-weight:600; line-height:1.4; position:fixed; top:0; left:0; right:0; z-index:9999;">
        ⚠️ Google 로그인이 필요합니다. <strong>Chrome/Safari</strong>에서 열어주세요.
        <button onclick="openExternal()" style="background:#fff; color:#ff6b35; border:none; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:700; margin-left:8px; cursor:pointer;">열기</button>
    </div>

    <!-- 데스크탑 차단 -->
    <div id="desktop-blocker" data-class="desktopBlocked:active">
        <div class="icon">📱</div>
        <h2>스마트폰에서 이용해 주세요</h2>
        <p>AI 증명사진은 스마트폰의<br>전면 카메라로 촬영하는 전용 서비스입니다</p>
        <div class="qr-wrap">
            <img id="qr-code" data-bind-src="qrCodeUrl" src="" alt="QR코드">
        </div>
        <div class="url-text" data-bind="pageUrl"></div>
    </div>

    <!-- 헤더 -->
    <div id="header">
        <div>
            <h1><span class="brand">MONKOS</span> <span>AI 증명사진</span></h1>
            <span id="step-label" data-bind="stepLabel">촬영 준비</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="credit-badge" id="creditBadge" data-show="user.id" data-class="creditLow:low">
                <span>💎</span>
                <span data-bind="user.credits">0</span>c
            </div>
        </div>
    </div>

    <!-- 크레딧 부족 모달 -->
    <div id="credit-modal" data-class="creditModalOpen:active">
        <div class="credit-modal-box">
            <div class="credit-modal-icon">💎</div>
            <div class="credit-modal-title" data-bind="creditModalTitle">크레딧이 부족합니다</div>
            <div class="credit-modal-desc" data-bind="creditModalDesc">
                이 작업을 수행하려면 크레딧이 필요합니다.
            </div>
            <div class="credit-modal-cost">
                <div class="cost-item">
                    <div class="label">필요</div>
                    <div class="value" data-bind="creditRequired">10</div>
                </div>
                <div class="cost-item">
                    <div class="label">보유</div>
                    <div class="value red" data-bind="user.credits">0</div>
                </div>
            </div>
            <div class="credit-packages">
                <button class="credit-pkg" onclick="buyCreditsKR(12900, 10)">
                    <div class="pkg-credits">10c</div>
                    <div class="pkg-price">₩12,900</div>
                </button>
                <button class="credit-pkg popular" onclick="buyCreditsKR(29900, 30)">
                    <div class="pkg-badge">BEST</div>
                    <div class="pkg-credits">30c</div>
                    <div class="pkg-price">₩29,900</div>
                    <div class="pkg-save">23% 할인</div>
                </button>
                <button class="credit-pkg" onclick="buyCreditsKR(45900, 50)">
                    <div class="pkg-credits">50c</div>
                    <div class="pkg-price">₩45,900</div>
                    <div class="pkg-save">29% 할인</div>
                </button>
            </div>
            <button class="credit-modal-btn secondary" onclick="closeCreditModal()">닫기</button>
        </div>
    </div>

    <!-- === 키오스크 퍼널 (동적 렌더링) === -->
    <div id="prep-screen">
        <div class="kiosk-nav">
            <button class="kiosk-back" id="kiosk-back" onclick="kioskBack()" style="visibility:hidden">&#8249;</button>
            <div class="kiosk-progress" id="kiosk-progress"></div>
            <a class="kiosk-home" href="index.html">&#8962;</a>
        </div>
        <div class="kiosk-body" id="kiosk-body"></div>
        <div class="kiosk-footer">카메라 접근을 허용해 주세요</div>

        <!-- 챗봇 플로팅 버튼 -->
        <button id="chat-fab" onclick="toggleChat()" style="
            position:fixed; bottom:24px; right:16px; z-index:50;
            width:52px; height:52px; border-radius:50%; border:none;
            background:linear-gradient(135deg, #a78bfa, #7c3aed);
            color:#fff; font-size:24px; cursor:pointer;
            box-shadow:0 4px 16px rgba(167,139,250,0.4);
            display:flex; align-items:center; justify-content:center;
        ">💬</button>

        <!-- 챗봇 패널 -->
        <div id="chat-panel" style="
            display:none; position:fixed; bottom:88px; right:16px; left:16px; z-index:50;
            max-width:360px; margin-left:auto;
            background:#0d1117; border:1px solid rgba(167,139,250,0.2);
            border-radius:16px; overflow:hidden;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
            max-height:60vh; flex-direction:column;
        ">
            <!-- 헤더 -->
            <div style="padding:12px 16px; background:rgba(167,139,250,0.08); display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:600; color:#a78bfa; font-size:14px;">MONKOS 준비실 코치</span>
                <button onclick="toggleChat()" style="background:none; border:none; color:#8892a8; font-size:18px; cursor:pointer;">✕</button>
            </div>

            <!-- 메시지 영역 -->
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:12px 16px; min-height:200px; max-height:40vh;">
                <div class="chat-bubble bot">
                    안녕하세요! 촬영 준비에 궁금한 점이 있으시면 물어보세요 😊
                </div>
            </div>

            <!-- 입력 영역 -->
            <div style="padding:8px 12px; border-top:1px solid rgba(167,139,250,0.1); display:flex; gap:8px;">
                <input id="chat-input" type="text" placeholder="메시지 입력..."
                       style="flex:1; background:#1a1f2e; border:1px solid rgba(167,139,250,0.15); border-radius:8px; padding:8px 12px; color:#fff; font-size:14px; outline:none;"
                       onkeydown="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()" style="background:#a78bfa; border:none; border-radius:8px; padding:8px 14px; color:#fff; font-weight:600; font-size:14px; cursor:pointer;">전송</button>
            </div>
        </div>
    </div>

    <div id="log"></div>

    <!-- 앱 스크립트 -->
    <script type="module" src="prep.js"></script>
</body>
</html>
