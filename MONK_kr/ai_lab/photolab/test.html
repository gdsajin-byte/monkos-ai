<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monk.js 단위 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #111;
      color: #0f0;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 18px; margin-bottom: 20px; }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    .pending { color: #ff0; }
    button {
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 8px 16px;
      margin: 4px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 10px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .test-section {
      border: 1px solid #333;
      padding: 10px;
      margin: 10px 0;
    }
    .test-section h2 { font-size: 14px; margin: 0 0 10px 0; }
    .screen { display: none; padding: 10px; border: 1px dashed #444; margin: 5px 0; }
    .screen.active { display: block; border-color: #0f0; }
    video { max-width: 200px; margin: 10px 0; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>monk.js Framework Unit Test</h1>

  <!-- Screen 테스트용 더미 화면 -->
  <div class="test-section">
    <h2>Screen Test</h2>
    <div id="screen-a" class="screen">Screen A Content</div>
    <div id="screen-b" class="screen">Screen B Content</div>
    <button id="btn-screen">Screen Test 실행</button>
    <span id="result-screen" class="pending">대기</span>
  </div>

  <!-- Store 바인딩 테스트용 -->
  <div class="test-section">
    <h2>Store Test</h2>
    <div>name: <span data-bind="name">초기값</span></div>
    <div>user.credits: <span data-bind="user.credits">0</span></div>
    <button id="btn-store">Store Test 실행</button>
    <span id="result-store" class="pending">대기</span>
  </div>

  <!-- Pipe REST 테스트용 -->
  <div class="test-section">
    <h2>Pipe REST Test (Mock)</h2>
    <button id="btn-pipe">Pipe Test 실행</button>
    <span id="result-pipe" class="pending">대기</span>
  </div>

  <!-- Agent 테스트용 -->
  <div class="test-section">
    <h2>Agent Test</h2>
    <button id="btn-agent">Agent Test 실행</button>
    <span id="result-agent" class="pending">대기</span>
  </div>

  <!-- Media 테스트용 (수동) -->
  <div class="test-section">
    <h2>Media Test (수동 확인)</h2>
    <video id="test-video" autoplay playsinline muted></video>
    <canvas id="test-canvas"></canvas>
    <br>
    <button id="btn-media-start">카메라 시작</button>
    <button id="btn-media-stop" disabled>카메라 정지</button>
    <button id="btn-media-capture" disabled>캡처</button>
    <span id="result-media" class="pending">대기</span>
  </div>

  <!-- 전체 테스트 -->
  <div class="test-section">
    <button id="btn-all">전체 테스트 실행</button>
  </div>

  <!-- 로그 출력 -->
  <pre id="log"></pre>

  <script type="module">
    import Monk from './monk.js';

    const logEl = document.getElementById('log');
    const log = (msg, type = '') => {
      const time = new Date().toLocaleTimeString('ko-KR');
      const line = `[${time}] ${msg}`;
      console.log(line);
      const span = document.createElement('span');
      span.className = type;
      span.textContent = line + '\n';
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    };

    const setResult = (id, pass, msg) => {
      const el = document.getElementById(id);
      el.className = pass ? 'pass' : 'fail';
      el.textContent = pass ? `PASS: ${msg}` : `FAIL: ${msg}`;
    };

    // === Screen Test ===
    const testScreen = async () => {
      log('=== Screen Test 시작 ===');
      try {
        const screen = Monk.screens({
          screenA: { el: '#screen-a' },
          screenB: { el: '#screen-b' },
        });

        // 초기 상태 확인
        const elA = document.getElementById('screen-a');
        const elB = document.getElementById('screen-b');

        // Screen A로 이동
        await screen.go('screenA');
        const aActive = elA.classList.contains('active');
        const bInactive = !elB.classList.contains('active');
        log(`  go('screenA') → A.active=${aActive}, B.active=${!bInactive}`);

        // Screen B로 이동
        await screen.go('screenB');
        const aInactive = !elA.classList.contains('active');
        const bActive = elB.classList.contains('active');
        log(`  go('screenB') → A.active=${!aInactive}, B.active=${bActive}`);

        // current 확인
        const currentOK = screen.current === 'screenB';
        log(`  screen.current = '${screen.current}'`);

        const pass = aActive && bInactive && aInactive && bActive && currentOK;
        setResult('result-screen', pass, pass ? '화면 전환 정상' : '화면 전환 실패');
        return pass;
      } catch (e) {
        log(`  Error: ${e.message}`, 'fail');
        setResult('result-screen', false, e.message);
        return false;
      }
    };

    // === Store Test ===
    const testStore = async () => {
      log('=== Store Test 시작 ===');
      try {
        const state = Monk.store({
          name: '',
          user: { credits: 0 },
        });

        // 바인딩 스캔을 위해 약간 대기
        await new Promise(r => setTimeout(r, 50));

        // 단순 값 변경
        state.name = '테스트유저';
        const nameEl = document.querySelector('[data-bind="name"]');
        const nameOK = nameEl.textContent === '테스트유저';
        log(`  state.name = '테스트유저' → DOM: '${nameEl.textContent}'`);

        // 중첩 객체 변경
        state.user = { credits: 100 };
        const creditsEl = document.querySelector('[data-bind="user.credits"]');
        const creditsOK = creditsEl.textContent === '100';
        log(`  state.user = { credits: 100 } → DOM: '${creditsEl.textContent}'`);

        const pass = nameOK && creditsOK;
        setResult('result-store', pass, pass ? 'DOM 바인딩 정상' : 'DOM 바인딩 실패');
        return pass;
      } catch (e) {
        log(`  Error: ${e.message}`, 'fail');
        setResult('result-store', false, e.message);
        return false;
      }
    };

    // === Pipe Test ===
    const testPipe = async () => {
      log('=== Pipe Test 시작 ===');
      try {
        let errorCaught = false;
        let creditShortCaught = false;

        const p = Monk.pipe({
          mockApi: { type: 'post', path: '/api/mock' },
        }, {
          baseUrl: 'https://invalid.test',
          onError: (name, err) => {
            log(`  onError 호출: ${name}, status=${err.status || 'network'}`);
            errorCaught = true;
          },
          onCreditShort: (err) => {
            log(`  onCreditShort 호출`);
            creditShortCaught = true;
          },
        });

        // 존재하지 않는 URL 호출 → 에러 발생 예상
        try {
          await p.run('mockApi', { test: true });
        } catch (e) {
          log(`  예상된 에러 발생: ${e.message || 'fetch failed'}`);
        }

        // Pipe 객체 구조 확인
        const hasRun = typeof p.run === 'function';
        const hasStartLoop = typeof p.startLoop === 'function';
        const hasStopLoop = typeof p.stopLoop === 'function';
        const hasAgentCallbacks = typeof p._agentCallbacks === 'object';
        log(`  run: ${hasRun}, startLoop: ${hasStartLoop}, stopLoop: ${hasStopLoop}, _agentCallbacks: ${hasAgentCallbacks}`);

        const pass = hasRun && hasStartLoop && hasStopLoop && hasAgentCallbacks;
        setResult('result-pipe', pass, pass ? 'Pipe API 정상' : 'Pipe API 불완전');
        return pass;
      } catch (e) {
        log(`  Error: ${e.message}`, 'fail');
        setResult('result-pipe', false, e.message);
        return false;
      }
    };

    // === Agent Test ===
    const testAgent = async () => {
      log('=== Agent Test 시작 ===');
      try {
        const p = Monk.pipe({
          vision: { type: 'post', path: '/api/vision' },
        }, { baseUrl: 'https://invalid.test' });

        const vision = Monk.agent('vision', {
          pipe: p,
          endpoint: 'vision',
          type: 'rest',
          interval: 1000,
        });

        // API 존재 확인
        const hasOnResult = typeof vision.onResult === 'function';
        const hasStart = typeof vision.start === 'function';
        const hasStop = typeof vision.stop === 'function';
        const hasName = vision.name === 'vision';
        log(`  onResult: ${hasOnResult}, start: ${hasStart}, stop: ${hasStop}, name: ${hasName}`);

        // onResult 콜백 등록 확인
        let callbackRegistered = false;
        vision.onResult((result) => {
          callbackRegistered = true;
        });
        const cbRegistered = p._agentCallbacks['vision'] !== undefined;
        log(`  onResult() 호출 후 _agentCallbacks 등록: ${cbRegistered}`);

        const pass = hasOnResult && hasStart && hasStop && hasName && cbRegistered;
        setResult('result-agent', pass, pass ? 'Agent API + 콜백 등록 정상' : 'Agent 불완전');
        return pass;
      } catch (e) {
        log(`  Error: ${e.message}`, 'fail');
        setResult('result-agent', false, e.message);
        return false;
      }
    };

    // === Media Test (수동) ===
    let mediaInstance = null;
    const btnStart = document.getElementById('btn-media-start');
    const btnStop = document.getElementById('btn-media-stop');
    const btnCapture = document.getElementById('btn-media-capture');

    btnStart.onclick = async () => {
      log('=== Media Test 시작 ===');
      try {
        mediaInstance = Monk.media({
          video: '#test-video',
          canvas: '#test-canvas',
          maxSize: 320,
          mirror: true,
        });
        await mediaInstance.start();
        log('  카메라 시작 성공');
        btnStart.disabled = true;
        btnStop.disabled = false;
        btnCapture.disabled = false;
        setResult('result-media', true, '카메라 시작됨 (수동 확인)');
      } catch (e) {
        log(`  카메라 에러: ${e.message}`, 'fail');
        setResult('result-media', false, e.message);
      }
    };

    btnStop.onclick = () => {
      if (mediaInstance) {
        mediaInstance.stop();
        log('  카메라 정지');
        btnStart.disabled = false;
        btnStop.disabled = true;
        btnCapture.disabled = true;
      }
    };

    btnCapture.onclick = () => {
      if (mediaInstance) {
        const dataUrl = mediaInstance.capture();
        if (dataUrl) {
          log(`  캡처 성공: ${dataUrl.substring(0, 50)}...`);
        } else {
          log('  캡처 실패: 비디오 없음', 'fail');
        }
      }
    };

    // === 버튼 이벤트 ===
    document.getElementById('btn-screen').onclick = testScreen;
    document.getElementById('btn-store').onclick = testStore;
    document.getElementById('btn-pipe').onclick = testPipe;
    document.getElementById('btn-agent').onclick = testAgent;

    document.getElementById('btn-all').onclick = async () => {
      log('========== 전체 테스트 시작 ==========');
      const results = [];
      results.push(await testScreen());
      results.push(await testStore());
      results.push(await testPipe());
      results.push(await testAgent());
      const passed = results.filter(r => r).length;
      const total = results.length;
      log(`========== 결과: ${passed}/${total} PASS ==========`, passed === total ? 'pass' : 'fail');
    };

    log('monk.js 테스트 페이지 로드 완료. 버튼을 클릭하여 테스트 실행.');
  </script>
</body>
</html>
