<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030508">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MONKOS AI 증명사진 — 촬영</title>

    <!-- Open Graph -->
    <meta property="og:title" content="MONKOS AI 증명사진">
    <meta property="og:description" content="AI 코칭과 함께 완벽한 증명사진을 촬영하세요">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://monkos.ai/og-image.png">

    <!-- 파비콘 -->
    <link rel="icon" href="/monkos-icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="app.css">

    <!-- 촬영실 전용 스타일 (app.css 수정 금지) -->
    <style>
        #selection-summary {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            z-index: 5;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            white-space: nowrap;
            pointer-events: none;
        }
    </style>

    <!-- 토스페이먼츠 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
    <!-- 인앱 브라우저 안내 배너 -->
    <div id="inapp-banner" data-show="inappBrowser" style="display:none; background:#ff6b35; color:#fff; text-align:center; padding:10px 16px; font-size:13px; font-weight:600; line-height:1.4; position:fixed; top:0; left:0; right:0; z-index:9999;">
        ⚠️ Google 로그인이 필요합니다. <strong>Chrome/Safari</strong>에서 열어주세요.
        <button onclick="openExternal()" style="background:#fff; color:#ff6b35; border:none; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:700; margin-left:8px; cursor:pointer;">열기</button>
    </div>

    <!-- 데스크탑 차단 -->
    <div id="desktop-blocker" data-class="desktopBlocked:active">
        <div class="icon">📱</div>
        <h2>스마트폰에서 이용해 주세요</h2>
        <p>AI 증명사진은 스마트폰의<br>전면 카메라로 촬영하는 전용 서비스입니다</p>
        <div class="qr-wrap">
            <img id="qr-code" data-bind-src="qrCodeUrl" src="" alt="QR코드">
        </div>
        <div class="url-text" data-bind="pageUrl"></div>
    </div>

    <!-- 헤더 -->
    <div id="header">
        <div>
            <h1><span class="brand">MONKOS</span> <span>AI 증명사진</span></h1>
            <span id="step-label" data-bind="stepLabel">촬영 중</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="credit-badge" id="creditBadge" data-show="user.id" data-class="creditLow:low">
                <span>💎</span>
                <span data-bind="user.credits">0</span>c
            </div>
            <button id="btn-voice" onclick="toggleVoice()" title="음성 ON"
                style="background:none; border:none; font-size:18px; cursor:pointer; padding:4px;">🔊</button>
        </div>
    </div>

    <!-- 크레딧 부족 모달 -->
    <div id="credit-modal" data-class="creditModalOpen:active">
        <div class="credit-modal-box">
            <div class="credit-modal-icon">💎</div>
            <div class="credit-modal-title" data-bind="creditModalTitle">크레딧이 부족합니다</div>
            <div class="credit-modal-desc" data-bind="creditModalDesc">
                이 작업을 수행하려면 크레딧이 필요합니다.
            </div>
            <div class="credit-modal-cost">
                <div class="cost-item">
                    <div class="label">필요</div>
                    <div class="value" data-bind="creditRequired">10</div>
                </div>
                <div class="cost-item">
                    <div class="label">보유</div>
                    <div class="value red" data-bind="user.credits">0</div>
                </div>
            </div>
            <div class="credit-packages">
                <button class="credit-pkg" onclick="buyCreditsKR(12900, 10)">
                    <div class="pkg-credits">10c</div>
                    <div class="pkg-price">₩12,900</div>
                </button>
                <button class="credit-pkg popular" onclick="buyCreditsKR(29900, 30)">
                    <div class="pkg-badge">BEST</div>
                    <div class="pkg-credits">30c</div>
                    <div class="pkg-price">₩29,900</div>
                    <div class="pkg-save">23% 할인</div>
                </button>
                <button class="credit-pkg" onclick="buyCreditsKR(45900, 50)">
                    <div class="pkg-credits">50c</div>
                    <div class="pkg-price">₩45,900</div>
                    <div class="pkg-save">29% 할인</div>
                </button>
            </div>
            <button class="credit-modal-btn secondary" onclick="closeCreditModal()">닫기</button>
        </div>
    </div>

    <!-- === 카메라 화면 === -->
    <div id="camera-area">
        <video id="camera-video" autoplay playsinline muted></video>
        <div id="face-guide" data-guide-text="여기에 얼굴을 맞춰주세요" data-class="coaching.ready:ready"></div>

        <!-- 선택 요약 뱃지 (읽기 전용, 카메라 위 상단) -->
        <div id="selection-summary"></div>

        <!-- 코칭 오버레이 -->
        <div id="coaching-overlay" data-class="coaching.active:active">
            <div class="coaching-inner">
                <div id="coaching-label">
                    <span class="coaching-pulse"></span>
                    <span>AI 코칭 중</span>
                </div>
                <div id="coaching-text" data-bind="coaching.text">자세를 체크하고 있습니다...</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-capture" onclick="capturePhoto()" data-class="coaching.ready:ready"></button>
    </div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <div id="log"></div>

    <!-- 앱 스크립트 -->
    <script type="module" src="camera.js?v=20260221c"></script>
</body>
</html>
