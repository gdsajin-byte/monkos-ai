<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | MONK.kr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ai: '#60A5FA',
                        so: '#F472B6',
                        dark: '#030508'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .kakao-btn {
            background: #FEE500;
            color: #191919;
        }
        .kakao-btn:hover {
            background: #F5DC00;
        }
        .google-btn {
            background: white;
            color: #333;
        }
        .google-btn:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <!-- 로고 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tight mb-2">MONK<span class="text-so">.kr</span></h1>
            <p class="text-gray-400 text-sm">AI 크리에이티브 스튜디오</p>
        </div>
        
        <!-- 로그인 박스 -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h2 class="text-xl font-bold text-center mb-2">로그인</h2>
            <p class="text-gray-400 text-sm text-center mb-6">소셜 계정으로 간편하게 시작하세요</p>
            
            <!-- 소셜 로그인 버튼 -->
            <div class="space-y-3">
                <!-- 구글 로그인 (활성화) -->
                <button onclick="loginGoogle()" class="google-btn w-full py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 border border-gray-300">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    구글로 시작하기
                </button>
                
                <!-- 카카오 로그인 (준비 중) -->
                <button disabled class="w-full py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gray-800 text-gray-500 cursor-not-allowed">
                    <svg width="18" height="18" viewBox="0 0 18 18">
                        <path fill="#666" d="M9 1C4.582 1 1 3.883 1 7.449c0 2.295 1.528 4.308 3.823 5.447-.168.629-.61 2.281-.698 2.636-.11.437.16.432.337.314.139-.093 2.206-1.502 3.098-2.108.467.067.948.102 1.44.102 4.418 0 8-2.883 8-6.391C17 3.883 13.418 1 9 1"/>
                    </svg>
                    카카오 (준비 중)
                </button>
            </div>
            
            <!-- 혜택 안내 -->
            <div class="mt-6 pt-6 border-t border-gray-800">
                <p class="text-center text-xs text-gray-500 mb-3">회원 혜택</p>
                <div class="flex justify-center gap-6 text-xs text-gray-400">
                    <div class="flex items-center gap-1">
                        <i class="fas fa-gift text-yellow-400"></i>
                        <span>100cr 지급</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <i class="fas fa-save text-emerald-400"></i>
                        <span>작업 저장</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <i class="fas fa-history text-blue-400"></i>
                        <span>이용 내역</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 비회원 진행 -->
        <div class="mt-4 text-center">
            <button onclick="continueAsGuest()" class="text-gray-500 text-sm hover:text-gray-300">
                비회원으로 계속하기 →
            </button>
        </div>
        
        <!-- 약관 -->
        <p class="mt-6 text-center text-[10px] text-gray-600">
            로그인 시 <a href="#" class="underline">서비스 이용약관</a> 및 
            <a href="#" class="underline">개인정보처리방침</a>에 동의합니다.
        </p>
    </div>

    <script>
        // 이미 로그인되어 있으면 리다이렉트
        const token = localStorage.getItem('monk_auth_token');
        if (token) {
            const returnUrl = sessionStorage.getItem('monk_return_url') || '/ai_lab/so_so/apps/ai_photo.html';
            window.location.href = returnUrl;
        }
        
        // return URL 저장 (이전 페이지)
        const referrer = document.referrer;
        if (referrer && referrer.includes(window.location.host)) {
            sessionStorage.setItem('monk_return_url', referrer);
        }
        
        function loginKakao() {
            window.location.href = '/api/auth?action=login&provider=kakao';
        }
        
        function loginGoogle() {
            window.location.href = '/api/auth?action=login&provider=google';
        }
        
        function continueAsGuest() {
            const returnUrl = sessionStorage.getItem('monk_return_url') || '/ai_lab/ai_lab.html';
            sessionStorage.removeItem('monk_return_url');
            window.location.href = returnUrl;
        }
    </script>
</body>
</html>
