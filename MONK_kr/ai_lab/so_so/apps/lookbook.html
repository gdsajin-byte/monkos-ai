<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOKBOOK | SO-SO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ai: '#60A5FA',
                        so: '#F472B6',
                        dark: '#05070A'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 데스크톱 최적화 */
        .so-glow {
            box-shadow: 0 0 80px rgba(244, 114, 182, 0.2);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 80px rgba(244, 114, 182, 0.2); }
            50% { box-shadow: 0 0 120px rgba(244, 114, 182, 0.35); }
        }
        .category-badge {
            transition: all 0.2s;
            cursor: pointer;
        }
        .category-badge.active {
            background: #F472B6;
            color: white;
        }
        
        /* 드래그 앤 드롭 강화 (데스크톱) */
        @media (min-width: 768px) {
            .upload-zone {
                min-height: 300px;
            }
            .upload-zone:hover {
                border-color: #F472B6;
                background: rgba(244, 114, 182, 0.02);
            }
        }
        
        /* 2단 레이아웃 (큰 화면) */
        @media (min-width: 1024px) {
            .desktop-layout {
                display: grid;
                grid-template-columns: 1fr 400px;
                gap: 2rem;
            }
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 bg-dark/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="../../../index.html" class="text-2xl font-black tracking-tight">MONK<span class="text-so">.kr</span></a>
            <div class="flex items-center space-x-6">
                <a href="../so_so.html" class="text-sm text-gray-400 hover:text-white transition-colors">← Back to SO-SO</a>
            </div>
        </div>
    </header>

    <main class="flex-grow px-4 md:px-8 py-8 md:py-16 max-w-7xl mx-auto w-full">
        
        <div class="text-center mb-8 md:mb-12">
            <div class="inline-block px-4 py-1 rounded-full bg-so/10 border border-so/20 text-so text-xs font-bold mb-4 uppercase tracking-widest">
                LOOKBOOK
            </div>
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-black mb-4 tracking-tight">
                커머스 비주얼
            </h1>
            <p class="text-gray-500 text-sm md:text-base">룩북, 상세페이지, 제품 화보 등 고감도 이미지 생성</p>
        </div>

        <!-- Category Selection -->
        <div class="flex flex-wrap justify-center gap-2 md:gap-3 mb-8">
            <span onclick="selectCategory('fashion')" id="cat-fashion" class="category-badge active px-4 md:px-6 py-2 rounded-full bg-gray-800 text-xs md:text-sm font-bold">패션</span>
            <span onclick="selectCategory('product')" id="cat-product" class="category-badge px-4 md:px-6 py-2 rounded-full bg-gray-800 text-xs md:text-sm font-bold">제품</span>
            <span onclick="selectCategory('food')" id="cat-food" class="category-badge px-4 md:px-6 py-2 rounded-full bg-gray-800 text-xs md:text-sm font-bold">푸드</span>
            <span onclick="selectCategory('interior')" id="cat-interior" class="category-badge px-4 md:px-6 py-2 rounded-full bg-gray-800 text-xs md:text-sm font-bold">인테리어</span>
            <span onclick="selectCategory('beauty')" id="cat-beauty" class="category-badge px-4 md:px-6 py-2 rounded-full bg-gray-800 text-xs md:text-sm font-bold">뷰티</span>
        </div>

        <!-- Desktop 2단 레이아웃 -->
        <div class="desktop-layout">
            
            <!-- 업로드 영역 (데스크톱: 왼쪽, 넓게) -->
            <div class="so-glow bg-gray-900 border border-so/30 rounded-3xl p-6 md:p-8 lg:p-10">
                <label class="block text-sm font-bold mb-4 text-gray-300">이미지 업로드</label>
                <div class="upload-zone relative border-2 border-dashed border-gray-700 rounded-2xl p-8 md:p-12 text-center hover:border-so/50 transition-colors cursor-pointer" onclick="document.getElementById('image-input').click()">
                    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    <div id="upload-placeholder">
                        <i class="fas fa-cloud-upload-alt text-6xl md:text-7xl text-gray-600 mb-6"></i>
                        <p class="text-gray-400 text-base md:text-lg font-medium mb-2">드래그하여 이미지 업로드</p>
                        <p class="text-gray-600 text-sm">또는 클릭하여 파일 선택 (JPG, PNG, 최대 10MB)</p>
                    </div>
                </div>
                
                <!-- 미리보기 -->
                <div id="preview-container" class="hidden mt-6">
                    <img id="preview-image" src="" class="w-full rounded-2xl border border-gray-700">
                </div>
            </div>

            <!-- 옵션 패널 (데스크톱: 오른쪽 사이드바) -->
            <div>
                <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 md:p-8 space-y-6">
                    <h3 class="text-lg font-bold mb-4">생성 옵션</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">프롬프트</label>
                            <textarea 
                                id="prompt-input" 
                                placeholder="화이트 티셔츠, 미니멀한 배경..."
                                class="w-full h-24 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:border-so focus:outline-none resize-none text-sm"
                            ></textarea>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">무드</label>
                            <select id="mood" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-so focus:outline-none">
                                <option value="minimal">미니멀</option>
                                <option value="luxury">럭셔리</option>
                                <option value="vintage">빈티지</option>
                                <option value="modern">모던</option>
                                <option value="natural">내추럴</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">레이아웃</label>
                            <select id="layout" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-so focus:outline-none">
                                <option value="center">중앙 배치</option>
                                <option value="flat">플랫레이</option>
                                <option value="scene">씬 연출</option>
                                <option value="detail">디테일샷</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">비율</label>
                            <select id="aspect" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-so focus:outline-none">
                                <option value="1:1">정사각형 (1:1)</option>
                                <option value="4:5">세로형 (4:5)</option>
                                <option value="16:9">와이드 (16:9)</option>
                                <option value="9:16">모바일 (9:16)</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 mb-2 block">배경</label>
                            <select id="background" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-so focus:outline-none">
                                <option value="white">화이트 배경</option>
                                <option value="studio">스튜디오</option>
                                <option value="lifestyle">라이프스타일</option>
                                <option value="transparent">투명 배경</option>
                            </select>
                        </div>
                    </div>

                    <button 
                        onclick="generateLookbook()" 
                        id="generate-btn"
                        class="w-full py-4 bg-gradient-to-r from-so via-purple-500 to-ai text-white font-black rounded-2xl uppercase tracking-widest hover:shadow-lg hover:shadow-so/50 transition-all disabled:opacity-50"
                    >
                        <i class="fas fa-images mr-2"></i>Generate
                    </button>

                    <div id="status" class="text-center text-xs text-gray-400"></div>
                </div>
            </div>
        </div>

        <!-- Result -->
        <div id="result-container" class="mt-8 hidden">
            <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6">
                <img id="generated-image" src="" alt="Generated" class="w-full rounded-2xl">
                <div class="flex justify-between items-center mt-4">
                    <span class="text-xs text-gray-500">생성 완료</span>
                    <button onclick="downloadImage()" class="px-4 py-2 bg-so text-white rounded-lg text-sm font-bold hover:bg-so/80 transition-colors">
                        <i class="fas fa-download mr-2"></i>다운로드
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="border-t border-white/5 py-8 px-6 text-center text-gray-500 text-xs">
        <p>© 2026 MONK STUDIO. SO-SO LOOKBOOK</p>
    </footer>

    <script>
        let currentCategory = 'fashion';
        const IMAGEN_API_URL = 'https://monk-imagen-proxy.gdsajin.workers.dev';

        function selectCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-badge').forEach(badge => {
                badge.classList.remove('active');
            });
            document.getElementById('cat-' + category).classList.add('active');

            const prompts = {
                'fashion': '화이트 티셔츠, 미니멀한 배경, 자연스러운 조명',
                'product': '화장품 제품, 깔끔한 배경, 상세 디테일',
                'food': '플레이팅된 요리, 자연광, 감성적인 분위기',
                'interior': '모던한 거실, 따뜻한 조명, 심플한 가구',
                'beauty': '스킨케어 제품, 투명한 질감, 고급스러운 분위기'
            };
            document.getElementById('prompt-input').placeholder = `${prompts[category]}...`;
        }

        async function generateLookbook() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const mood = document.getElementById('mood').value;
            const layout = document.getElementById('layout').value;
            const aspect = document.getElementById('aspect').value;
            const background = document.getElementById('background').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('generate-btn');

            if (!prompt) {
                status.textContent = '⚠️ 제작할 비주얼을 입력하세요';
                status.classList.add('text-yellow-400');
                return;
            }

            const enhancedPrompt = `Professional ${currentCategory} photography: ${prompt}, ${mood} mood, ${layout} composition, ${background} background, commercial quality, high-end lookbook style, 8K resolution`;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>생성 중...';
            status.textContent = 'AI가 고감도 비주얼을 생성하고 있습니다...';
            status.classList.remove('text-yellow-400', 'text-red-400');
            status.classList.add('text-so');

            try {
                const response = await fetch(IMAGEN_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: enhancedPrompt,
                        aspectRatio: aspect,
                        style: 'realistic'
                    })
                });

                if (!response.ok) throw new Error(`API 오류: ${response.status}`);

                const data = await response.json();
                
                if (data.imageUrl) {
                    document.getElementById('generated-image').src = data.imageUrl;
                    document.getElementById('result-container').classList.remove('hidden');
                    status.textContent = '✓ 생성 완료!';
                } else {
                    throw new Error('이미지 URL을 받지 못했습니다');
                }

            } catch (error) {
                status.textContent = `❌ 오류: ${error.message}`;
                status.classList.remove('text-so');
                status.classList.add('text-red-400');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-images mr-2"></i>Generate Lookbook';
            }
        }

        function downloadImage() {
            const img = document.getElementById('generated-image');
            const link = document.createElement('a');
            link.href = img.src;
            link.download = `lookbook-${currentCategory}-${Date.now()}.png`;
            link.click();
        }

        document.getElementById('prompt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateLookbook();
            }
        });
    </script>

</body>
</html>
