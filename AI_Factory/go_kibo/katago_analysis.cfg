# go_kibo 실수 사전 — KataGo v1.18.2 analysis 엔진 설정 (4060, b18)
# 배치: 4060 C:\Users\smuse73\go_kibo\katago_analysis.cfg (레포 사본이 정본)
# 값은 흑 기준으로 보고 → analyze_mistakes.py가 작가님 기준으로 뒤집는다.

logDir = analysis_logs
reportAnalysisWinratesAs = BLACK

# visits는 질의(maxVisits)가 정한다. 여기 값은 상한.
maxVisits = 500

# 저visits 다국면 처리 → 분석 스레드를 넓게, 탐색 스레드는 좁게
numAnalysisThreads = 16
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true

# b10 학습과 GPU 공유 — 장치 0, FP16
cudaUseFP16 = true
