<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030508">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MONKOS AI 증명사진</title>

    <!-- Open Graph -->
    <meta property="og:title" content="MONKOS AI 증명사진">
    <meta property="og:description" content="AI 코칭과 함께 완벽한 증명사진을 촬영하세요">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://monkos.ai/og-image.png">

    <!-- 파비콘 -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://monkos.ai/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://monkos.ai/apple-touch-icon.png">

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="cr-coin.css">

    <!-- 토스페이먼츠 -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
    <!-- 인앱 브라우저 안내 배너 -->
    <div id="inapp-banner" data-show="inappBrowser" style="display:none; background:#ff6b35; color:#fff; text-align:center; padding:10px 16px; font-size:13px; font-weight:600; line-height:1.4; position:fixed; top:0; left:0; right:0; z-index:9999;">
        ⚠️ Google 로그인이 필요합니다. <strong>Chrome/Safari</strong>에서 열어주세요.
        <button onclick="openExternal()" style="background:#fff; color:#ff6b35; border:none; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:700; margin-left:8px; cursor:pointer;">열기</button>
    </div>

    <!-- 헤더 -->
    <div id="header">
        <div>
            <h1><span class="brand">MONKOS</span> <span>AI 증명사진</span></h1>
            <span id="step-label" data-bind="stepLabel">촬영 준비</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="header-balance" id="creditBadge" data-show="user.id">
                <div class="header-coin-wrap">
                    <div class="header-sparkle"></div>
                    <div class="header-sparkle"></div>
                    <div class="header-coin">
                        <div class="header-coin-face">
                            <div class="header-shimmer"></div>
                            <span class="cr-sym">Cr</span>
                        </div>
                    </div>
                </div>
                <span class="balance-amount" data-bind="user.credits">0</span>
                <span class="balance-unit">Cr</span>
            </div>
        </div>
    </div>

    <!-- 크레딧 부족 모달 -->
    <div id="credit-modal" data-class="creditModalOpen:active">
        <div class="credit-modal-box">
            <div class="credit-modal-icon">
                <div class="event-coin-wrap" style="width:48px;height:48px;margin:0 auto;">
                    <div class="event-coin" style="animation:none;">
                        <div class="event-coin-face">
                            <span class="cr-sym" style="font-size:16px;">Cr</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="credit-modal-title" data-bind="creditModalTitle">크레딧이 부족합니다</div>
            <div class="credit-modal-desc" data-bind="creditModalDesc">
                이 작업을 수행하려면 크레딧이 필요합니다.
            </div>
            <div class="credit-modal-cost">
                <div class="cost-item">
                    <div class="label">필요</div>
                    <div class="value" data-bind="creditRequired">10</div>
                </div>
                <div class="cost-item">
                    <div class="label">보유</div>
                    <div class="value red" data-bind="user.credits">0</div>
                </div>
            </div>
            <div class="credit-packages">
                <button class="credit-pkg" onclick="buyCreditsKR(1450, 10)">
                    <div class="pkg-credits">10 Cr</div>
                    <div class="pkg-price">₩1,450</div>
                </button>
                <button class="credit-pkg" onclick="buyCreditsKR(13050, 100)">
                    <div class="pkg-credits">100 Cr</div>
                    <div class="pkg-price">₩13,050</div>
                    <div class="pkg-save">10% 할인</div>
                </button>
                <button class="credit-pkg popular" onclick="buyCreditsKR(34800, 300)">
                    <div class="pkg-badge">BEST</div>
                    <div class="pkg-credits">300 Cr</div>
                    <div class="pkg-price">₩34,800</div>
                    <div class="pkg-save">20% 할인</div>
                </button>
                <button class="credit-pkg" onclick="buyCreditsKR(50750, 500)">
                    <div class="pkg-credits">500 Cr</div>
                    <div class="pkg-price">₩50,750</div>
                    <div class="pkg-save">30% 할인</div>
                </button>
            </div>
            <button class="credit-modal-btn secondary" onclick="closeCreditModal()">닫기</button>
        </div>
    </div>

    <!-- === 키오스크 퍼널 (동적 렌더링) === -->
    <div id="prep-screen">
        <div class="kiosk-nav">
            <button class="kiosk-back" id="kiosk-back" onclick="kioskBack()" style="visibility:hidden">&#8249;</button>
            <div class="kiosk-progress" id="kiosk-progress"></div>
            <a class="kiosk-home" href="/">&#8962;</a>
        </div>
        <div class="kiosk-body" id="kiosk-body"></div>
        <div class="kiosk-footer">카메라 접근을 허용해 주세요</div>

    </div>

    <div id="log"></div>

    <!-- 앱 스크립트 -->
    <script type="module" src="prep.js?v=migration01"></script>
</body>
</html>
