<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JPZWSJ3323"></script>
<script src="/ga-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030508">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MONKOS AI 증명사진</title>

    <!-- Open Graph -->
    <meta property="og:title" content="MONKOS AI 증명사진">
    <meta property="og:description" content="AI 코칭과 함께 완벽한 증명사진을 촬영하세요">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://monkos.ai/og-image.png">

    <!-- 파비콘 -->
    <link rel="icon" href="/monkos-icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="cr-coin.css">

</head>
<body>
    <!-- 인앱 브라우저 안내 배너 -->
    <div id="inapp-banner" data-show="inappBrowser" style="display:none; background:#ff6b35; color:#fff; text-align:center; padding:10px 16px; font-size:13px; font-weight:600; line-height:1.4; position:fixed; top:0; left:0; right:0; z-index:9999;">
        ⚠️ Google 로그인이 필요합니다. <strong>Chrome/Safari</strong>에서 열어주세요.
        <button onclick="openExternal()" style="background:#fff; color:#ff6b35; border:none; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:700; margin-left:8px; cursor:pointer;">열기</button>
    </div>

    <!-- 헤더 -->
    <div id="header">
        <div>
            <h1><span class="brand">MONKOS</span> <span>AI 증명사진</span></h1>
            <span id="step-label" data-bind="stepLabel">촬영 준비</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="header-balance" id="creditBadge" data-show="user.id">
                <div class="header-coin-wrap">
                    <div class="header-sparkle"></div>
                    <div class="header-sparkle"></div>
                    <div class="header-coin">
                        <div class="header-coin-face">
                            <div class="header-shimmer"></div>
                            <span class="cr-sym">Cr</span>
                        </div>
                    </div>
                </div>
                <span class="balance-amount" data-bind="user.credits">0</span>
                <span class="balance-unit">Cr</span>
            </div>
        </div>
    </div>

    <!-- 프로그레스 바 (4단계) -->
    <div id="prep-progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">1 / 4</span>
    </div>

    <!-- 페이지 컨테이너 -->
    <div id="prep-pages">
        <section id="page-format" class="prep-page active"></section>
        <section id="page-profile" class="prep-page"></section>
        <section id="page-style" class="prep-page"></section>
        <section id="page-confirm" class="prep-page"></section>
    </div>

    <!-- 하단 네비게이션 -->
    <div id="prep-nav">
        <button id="btnPrev" onclick="prevPage()">이전</button>
        <button id="btnNext" onclick="nextPage()">다음</button>
    </div>

    <div id="log"></div>

    <!-- 앱 스크립트 -->
    <script type="module" src="prep.js?v=v5"></script>
</body>
</html>
