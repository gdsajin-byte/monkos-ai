<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배경 제거 테스트 — MediaPipe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    h1 { font-size: 18px; margin-bottom: 16px; }
    .controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-upload { background: #6c5ce7; color: #fff; }
    .btn-process { background: #00b894; color: #fff; }
    .btn-process:disabled { background: #555; cursor: not-allowed; }
    select { padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #2d2d44; color: #eee; font-size: 14px; }
    .canvas-row { display: flex; gap: 20px; flex-wrap: wrap; }
    .canvas-box { text-align: center; }
    .canvas-box canvas, .canvas-box img { max-width: 400px; max-height: 500px; border-radius: 8px; border: 1px solid #333; }
    .label { font-size: 12px; color: #888; margin-top: 6px; }
    .status { margin: 12px 0; font-size: 14px; color: #fdcb6e; }
    .timing { color: #00b894; font-weight: 600; }
    input[type="file"] { display: none; }
    input[type="color"] { width: 40px; height: 36px; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>배경 제거 테스트 — MediaPipe Selfie Segmentation</h1>

  <div class="controls">
    <button class="btn btn-upload" id="btnUpload">사진 업로드</button>
    <button class="btn btn-process" id="btnProcess" disabled>배경 제거</button>
    <select id="bgSelect">
      <option value="#FFFFFF">흰색 배경</option>
      <option value="#E8E8E8">연회색 배경</option>
      <option value="#D4E6F1">연파랑 배경</option>
      <option value="transparent">투명 배경</option>
    </select>
    <input type="color" id="bgCustom" value="#FFFFFF" title="커스텀 배경색">
    <select id="modelSelect">
      <option value="0">General (모델 0)</option>
      <option value="1" selected>Landscape (모델 1 — 가벼움)</option>
    </select>
  </div>

  <div class="status" id="status">사진을 업로드하세요</div>

  <div class="canvas-row">
    <div class="canvas-box">
      <canvas id="canvasOriginal"></canvas>
      <div class="label">원본</div>
    </div>
    <div class="canvas-box">
      <canvas id="canvasMask"></canvas>
      <div class="label">마스크</div>
    </div>
    <div class="canvas-box">
      <canvas id="canvasResult"></canvas>
      <div class="label">결과</div>
    </div>
  </div>

  <input type="file" accept="image/*" id="fileInput">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const btnUpload = document.getElementById('btnUpload');
    const btnProcess = document.getElementById('btnProcess');
    const bgSelect = document.getElementById('bgSelect');
    const bgCustom = document.getElementById('bgCustom');
    const modelSelect = document.getElementById('modelSelect');
    const status = document.getElementById('status');
    const canvasOrig = document.getElementById('canvasOriginal');
    const canvasMask = document.getElementById('canvasMask');
    const canvasResult = document.getElementById('canvasResult');

    let loadedImage = null;
    let segmenter = null;

    btnUpload.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        const ctx = canvasOrig.getContext('2d');
        canvasOrig.width = img.width;
        canvasOrig.height = img.height;
        ctx.drawImage(img, 0, 0);
        btnProcess.disabled = false;
        status.textContent = `이미지 로드 완료 (${img.width}×${img.height})`;
      };
      img.src = URL.createObjectURL(file);
    });

    btnProcess.addEventListener('click', async () => {
      if (!loadedImage) return;
      btnProcess.disabled = true;
      status.textContent = '모델 로딩 중...';

      const modelIdx = parseInt(modelSelect.value);

      const t0 = performance.now();

      if (!segmenter) {
        segmenter = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });
        segmenter.setOptions({ modelSelection: modelIdx, selfieMode: false });
      } else {
        segmenter.setOptions({ modelSelection: modelIdx });
      }

      const t1 = performance.now();

      segmenter.onResults((results) => {
        const t2 = performance.now();
        const w = loadedImage.width;
        const h = loadedImage.height;

        // 마스크 그리기
        canvasMask.width = w;
        canvasMask.height = h;
        const mctx = canvasMask.getContext('2d');
        mctx.drawImage(results.segmentationMask, 0, 0, w, h);

        // 마스크 데이터 읽기
        const maskData = mctx.getImageData(0, 0, w, h);

        // 원본 데이터 읽기
        const octx = canvasOrig.getContext('2d');
        const origData = octx.getImageData(0, 0, w, h);

        // 결과 캔버스
        canvasResult.width = w;
        canvasResult.height = h;
        const rctx = canvasResult.getContext('2d');
        const resultData = rctx.createImageData(w, h);

        // 배경색
        let bgColor = bgSelect.value;
        if (bgColor === 'transparent') {
          bgColor = null;
        }
        let bgR = 255, bgG = 255, bgB = 255, bgA = 0;
        if (bgColor) {
          bgR = parseInt(bgColor.slice(1, 3), 16);
          bgG = parseInt(bgColor.slice(3, 5), 16);
          bgB = parseInt(bgColor.slice(5, 7), 16);
          bgA = 255;
        }

        // 합성
        for (let i = 0; i < w * h; i++) {
          const pi = i * 4;
          const alpha = maskData.data[pi]; // 마스크 R 채널 = 사람 영역 밝기

          if (alpha > 128) {
            // 사람 영역 — 원본 유지
            resultData.data[pi] = origData.data[pi];
            resultData.data[pi + 1] = origData.data[pi + 1];
            resultData.data[pi + 2] = origData.data[pi + 2];
            resultData.data[pi + 3] = 255;
          } else if (alpha > 30) {
            // 경계 — 블렌딩
            const t = alpha / 255;
            resultData.data[pi] = origData.data[pi] * t + bgR * (1 - t);
            resultData.data[pi + 1] = origData.data[pi + 1] * t + bgG * (1 - t);
            resultData.data[pi + 2] = origData.data[pi + 2] * t + bgB * (1 - t);
            resultData.data[pi + 3] = bgColor ? 255 : Math.round(alpha);
          } else {
            // 배경 — 교체
            resultData.data[pi] = bgR;
            resultData.data[pi + 1] = bgG;
            resultData.data[pi + 2] = bgB;
            resultData.data[pi + 3] = bgA;
          }
        }

        rctx.putImageData(resultData, 0, 0);

        const t3 = performance.now();
        status.innerHTML = `완료 — <span class="timing">모델 로드: ${(t1 - t0).toFixed(0)}ms · 추론: ${(t2 - t1).toFixed(0)}ms · 합성: ${(t3 - t2).toFixed(0)}ms · 총: ${(t3 - t0).toFixed(0)}ms</span>`;
        btnProcess.disabled = false;
      });

      status.textContent = '세그멘테이션 추론 중...';
      await segmenter.send({ image: loadedImage });
    });

    bgCustom.addEventListener('input', (e) => {
      bgSelect.value = '';
      bgSelect.options[0].value = e.target.value;
      bgSelect.options[0].text = '커스텀';
      bgSelect.selectedIndex = 0;
    });
  </script>
</body>
</html>
