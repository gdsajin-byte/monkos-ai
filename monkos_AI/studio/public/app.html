<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#030508">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MONKOS Studio — 내부용</title>

    <link rel="icon" href="/monkos-icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="studio-layout">
        <!-- 헤더 -->
        <header class="studio-header">
            <div style="display:flex;align-items:center;gap:20px;">
                <h1><span class="brand">MONKOS</span> Studio</h1>
                <nav style="display:flex;gap:4px;">
                    <a href="/app" style="padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;color:#a78bfa;background:rgba(167,139,250,0.1);text-decoration:none;">증명사진</a>
                    <a href="/profiles" style="padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;color:#888;text-decoration:none;">프로필</a>
                </nav>
            </div>
            <span class="internal-badge">INTERNAL</span>
        </header>

        <!-- ══ 사이드바 ══ -->
        <aside class="studio-sidebar" id="sidebar">
            <!-- 파일 입력 -->
            <div class="sidebar-section">
                <div id="file-drop" class="file-drop">
                    <div class="file-drop-icon">📁</div>
                    <div class="file-drop-title">이미지 업로드</div>
                    <div class="file-drop-desc">클릭 또는 드래그</div>
                    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" style="display:none;">
                </div>
                <div id="sidebar-preview" class="sidebar-preview">
                    <img id="preview-img" src="" alt="미리보기">
                    <div class="file-info" id="file-info"></div>
                    <button class="btn-change-file" id="btn-change">다른 이미지</button>
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <!-- 규격 -->
            <div class="sidebar-section">
                <div class="sidebar-label">규격</div>
                <div class="opt-chips" data-field="format">
                    <button class="opt-chip selected" data-val="passport">여권/신분증</button>
                    <button class="opt-chip" data-val="id">증명사진</button>
                </div>
            </div>

            <!-- 성별 -->
            <div class="sidebar-section">
                <div class="sidebar-label">성별</div>
                <div class="opt-chips" data-field="gender">
                    <button class="opt-chip selected" data-val="f">여성</button>
                    <button class="opt-chip" data-val="m">남성</button>
                </div>
            </div>

            <!-- 연령 -->
            <div class="sidebar-section">
                <div class="sidebar-label">연령</div>
                <div class="opt-chips" data-field="age">
                    <button class="opt-chip" data-val="baby">영유아</button>
                    <button class="opt-chip" data-val="child">어린이</button>
                    <button class="opt-chip" data-val="teen">청소년</button>
                    <button class="opt-chip selected" data-val="adult">성인</button>
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <!-- 스타일 아코디언 (JS 렌더링) -->
            <div class="sidebar-section" id="style-section"></div>

            <!-- 생성 버튼 (sticky) -->
            <div class="sidebar-footer">
                <button class="btn-generate" id="btn-generate" disabled>생성</button>
            </div>
        </aside>

        <!-- ══ 워크스페이스 ══ -->
        <main class="studio-workspace">
            <div class="workspace-content">
                <div class="image-panel">
                    <div class="image-frame" id="frame-before">
                        <div class="placeholder" id="ph-before">이미지를 업로드하세요</div>
                        <img id="img-before" src="" alt="Before" style="display:none;">
                    </div>
                    <div class="image-label">Before</div>
                </div>
                <div class="image-panel">
                    <div class="image-frame" id="frame-after">
                        <div class="placeholder" id="ph-after">생성 대기</div>
                        <img id="img-after" src="" alt="After" style="display:none;">
                        <div class="loading-overlay" id="loading-overlay">
                            <div class="loading-spinner"></div>
                            <div class="loading-text">AI 보정 중...</div>
                            <div class="loading-sub">잠시만 기다려주세요</div>
                            <div class="gen-progress">
                                <div class="gen-progress-fill" id="progress-fill"></div>
                            </div>
                        </div>
                    </div>
                    <div class="image-label">After</div>
                </div>
            </div>
            <div class="workspace-actions">
                <button class="wbtn wbtn-retry" id="btn-retry" disabled>다시 하기</button>
                <button class="wbtn wbtn-dl-after" id="btn-dl-after" disabled>After 다운로드</button>
                <button class="wbtn wbtn-dl-compare" id="btn-dl-compare" disabled>비교 컷 다운로드</button>
            </div>
        </main>

        <!-- ══ 아카이브 (Phase C 대비) ══ -->
        <aside class="archive-panel">
            <p>아카이브 (준비 중)</p>
        </aside>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
