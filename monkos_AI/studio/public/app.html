<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#030508">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MONKOS Studio — 내부용</title>

    <link rel="icon" href="/monkos-icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="app.css">

    <style>
        /* 업로드 영역 */
        .upload-area {
            border: 2px dashed rgba(167,139,250,0.3);
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            margin: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(167,139,250,0.04);
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #a78bfa;
            background: rgba(167,139,250,0.1);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-title {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        .upload-desc {
            font-size: 13px;
            color: #8892a8;
            line-height: 1.5;
        }

        /* 미리보기 */
        .preview-area {
            display: none;
            padding: 16px;
            text-align: center;
        }
        .preview-area.active { display: block; }
        .preview-img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 16px;
            border: 1px solid rgba(167,139,250,0.2);
            object-fit: contain;
        }
        .preview-info {
            margin-top: 12px;
            font-size: 12px;
            color: #8892a8;
        }

        /* 옵션 패널 */
        .options-panel {
            display: none;
            padding: 0 16px 16px;
        }
        .options-panel.active { display: block; }
        .option-group {
            margin-bottom: 16px;
        }
        .option-label {
            font-size: 12px;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .option-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .option-chip {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(167,139,250,0.2);
            background: rgba(167,139,250,0.06);
            color: #c4b5fd;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-chip:hover { background: rgba(167,139,250,0.15); }
        .option-chip.selected {
            background: rgba(167,139,250,0.25);
            border-color: #a78bfa;
            color: #fff;
        }

        /* 액션 버튼 */
        .action-bar {
            display: none;
            padding: 16px;
            gap: 10px;
        }
        .action-bar.active { display: flex; }
        .btn-generate {
            flex: 2;
            padding: 14px;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-reset {
            flex: 1;
            padding: 14px;
            background: rgba(255,255,255,0.06);
            color: #c4b5fd;
            border: 1px solid rgba(167,139,250,0.2);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 내부용 배지 */
        .internal-badge {
            position: fixed;
            top: 8px;
            right: 8px;
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 100;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="internal-badge">INTERNAL</div>

    <!-- 헤더 -->
    <div id="header">
        <div>
            <h1><span class="brand">MONKOS</span> <span>Studio</span></h1>
            <span id="step-label">이미지 업로드</span>
        </div>
    </div>

    <!-- 업로드 영역 -->
    <div id="upload-area" class="upload-area">
        <div class="upload-icon">📁</div>
        <div class="upload-title">이미지를 업로드하세요</div>
        <div class="upload-desc">
            클릭하여 선택하거나<br>이미지를 여기에 드래그하세요<br>
            <span style="font-size:11px; opacity:0.6;">JPG, PNG, WebP · 최대 10MB</span>
        </div>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" style="display:none;">
    </div>

    <!-- 미리보기 -->
    <div id="preview-area" class="preview-area">
        <img id="preview-img" class="preview-img" src="" alt="미리보기">
        <div class="preview-info" id="preview-info"></div>
    </div>

    <!-- 옵션 패널 -->
    <div id="options-panel" class="options-panel">
        <div class="option-group">
            <div class="option-label">규격</div>
            <div class="option-chips" data-option="format">
                <div class="option-chip selected" data-value="passport">여권사진</div>
                <div class="option-chip" data-value="id">증명사진</div>
            </div>
        </div>
        <div class="option-group">
            <div class="option-label">성별</div>
            <div class="option-chips" data-option="gender">
                <div class="option-chip selected" data-value="f">여성</div>
                <div class="option-chip" data-value="m">남성</div>
            </div>
        </div>
        <div class="option-group">
            <div class="option-label">연령</div>
            <div class="option-chips" data-option="age">
                <div class="option-chip" data-value="baby">영유아</div>
                <div class="option-chip" data-value="child">어린이</div>
                <div class="option-chip" data-value="teen">청소년</div>
                <div class="option-chip selected" data-value="adult">성인</div>
            </div>
        </div>
    </div>

    <!-- 액션 버튼 -->
    <div id="action-bar" class="action-bar">
        <button class="btn-reset" id="btn-reset">다른 이미지</button>
        <button class="btn-generate" id="btn-generate">AI 보정 시작</button>
    </div>

    <div id="log"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
