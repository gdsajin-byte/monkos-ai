<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Camera lens background -->
  <circle cx="256" cy="256" r="256" fill="#0f0f23"/>

  <!-- Lens ring -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#a78bfa" stroke-width="8"/>

  <!-- S ear (left, behind head) -->
  <path d="M 138 145 C 90 145, 90 178, 138 183 C 186 188, 90 220, 138 236"
        fill="none" stroke="#a78bfa" stroke-width="17" stroke-linecap="round"/>

  <!-- K ear (right, behind head) -->
  <path d="M 374 145 V 236" stroke="#a78bfa" stroke-width="17" stroke-linecap="round"/>
  <path d="M 374 188 L 415 150" stroke="#a78bfa" stroke-width="15" stroke-linecap="round"/>
  <path d="M 374 188 L 417 230" stroke="#a78bfa" stroke-width="15" stroke-linecap="round"/>

  <!-- Soft M-legs (behind head, rounded) -->
  <path d="
    M 166 290
    V 395
    Q 166 416, 187 416
    Q 208 416, 208 395
    V 345
    Q 256 392, 304 345
    V 395
    Q 304 416, 325 416
    Q 346 416, 346 395
    V 290
    Z
  " fill="#a78bfa"/>

  <!-- Left paw toes (3, cat style) -->
  <circle cx="175" cy="424" r="11" fill="#a78bfa"/>
  <circle cx="192" cy="428" r="11" fill="#a78bfa"/>
  <circle cx="209" cy="424" r="11" fill="#a78bfa"/>

  <!-- Right paw toes (3, cat style) -->
  <circle cx="313" cy="424" r="11" fill="#a78bfa"/>
  <circle cx="330" cy="428" r="11" fill="#a78bfa"/>
  <circle cx="347" cy="424" r="11" fill="#a78bfa"/>

  <!-- Round head (ping pong ball, on top) -->
  <circle cx="256" cy="185" r="118" fill="#a78bfa"/>

  <!-- Eyes: camera lens OO -->
  <circle cx="216" cy="165" r="28" fill="#fff"/>
  <circle cx="216" cy="165" r="18" fill="#a78bfa" opacity="0.55"/>
  <circle cx="216" cy="165" r="10" fill="#0f0f23"/>
  <circle cx="222" cy="159" r="4" fill="#fff"/>

  <circle cx="296" cy="165" r="28" fill="#fff"/>
  <circle cx="296" cy="165" r="18" fill="#a78bfa" opacity="0.55"/>
  <circle cx="296" cy="165" r="10" fill="#0f0f23"/>
  <circle cx="302" cy="159" r="4" fill="#fff"/>

  <!-- N nose -->
  <path d="M 243 200 V 220 L 269 200 V 220"
        fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
