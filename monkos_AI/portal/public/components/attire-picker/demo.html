<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AttirePicker 데모 — 공유 의상 피커 살아있는 스펙</title>
<link rel="stylesheet" href="./attire-picker.css">
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; background: #f3f4f6; margin: 0; padding: 24px 16px; }
  .demo-wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; }
  .demo-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .demo-controls label { font-size: 12px; color: #555; display: inline-flex; align-items: center; gap: 4px; }
  select { font-size: 13px; padding: 4px 6px; }
  #payload { background: #111827; color: #a7f3d0; font-size: 11px; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; margin-top: 14px; }
  .demo-note { font-size: 12px; color: #6b7280; margin-top: 10px; }
</style>
</head>
<body>
<div class="demo-wrap">
  <h1>AttirePicker — 공유 의상 피커 데모</h1>
  <div class="demo-controls">
    <label>service
      <select id="svc">
        <option value="idpass" selected>idpass (passport·visa·resume)</option>
        <option value="headshot">headshot (headshot·profile)</option>
        <option value="student">student (학생증·반명함)</option>
        <option value="styler">styler (전체)</option>
      </select>
    </label>
    <label>lang
      <select id="lng">
        <option value="ko" selected>ko</option><option value="ja">ja</option><option value="en">en</option>
      </select>
    </label>
  </div>

  <div id="picker-root"></div>

  <pre id="payload">// 선택 시 generate body에 실릴 페이로드가 여기 표시됩니다</pre>
  <p class="demo-note">※ active:true 12종(런칭 세트)만 노출. inactive 20종은 스키마 그릇. thumbnail 채우면 스와치가 이미지 칩으로 자동 전환됩니다(v1.5).</p>
</div>

<script src="./attire-picker.js"></script>
<script>
  var root = document.getElementById('picker-root');
  var payload = document.getElementById('payload');
  var picker;

  function show(sel) {
    payload.textContent = JSON.stringify({
      attireId: sel.id,
      attireDesc: sel.attire_desc,
      label: sel.labels
    }, null, 2);
  }
  function boot() {
    root.innerHTML = '';
    picker = AttirePicker.mount(root, {
      service: document.getElementById('svc').value,
      lang: document.getElementById('lng').value,
      presetsUrl: './attire-presets.json?v=' + Date.now(), // 데모=살아있는 스펙 — 항상 최신 데이터
      onChange: show,
      onReady: function (p) { show(p.getSelection()); }
    });
  }
  document.getElementById('svc').addEventListener('change', boot);
  document.getElementById('lng').addEventListener('change', boot);
  boot();
</script>
</body>
</html>
