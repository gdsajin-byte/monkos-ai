<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Photo Review — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f5f5; --surface: #ffffff; --surface2: #fafafa;
  --accent: #6d28d9; --accent2: #4f46e5;
  --text: #334155; --text-dim: #64748b; --text-bright: #0f172a;
  --border: rgba(0, 0, 0, 0.1); --border-hover: rgba(109, 40, 217, 0.3);
  --success: #059669; --danger: #dc2626; --warn: #ea580c;
}
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
.nav-logo { font-size: 20px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 14px; color: var(--text-dim); }
.nav-back:hover { color: var(--accent); }

.container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
h1 { font-size: 24px; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }
.sub { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }

.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.tabs { display: flex; gap: 8px; }
.tab {
  padding: 6px 18px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text-dim); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.toolbar .meta { margin-left: auto; font-size: 13px; color: var(--text-dim); }
.btn-reload {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer;
}
.btn-reload:hover { border-color: var(--border-hover); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.pair {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; display: flex; flex-direction: column;
}
.pair-imgs { display: grid; grid-template-columns: 1fr 1fr; background: #0f172a; }
.pair-imgs figure { position: relative; margin: 0; }
.pair-imgs img {
  width: 100%; aspect-ratio: 3 / 4; object-fit: contain; display: block;
  background: #1e293b; cursor: zoom-in;
}
.pair-imgs figcaption {
  position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 4px; color: #fff; letter-spacing: 0.5px;
}
.cap-original { background: rgba(100,116,139,0.9); }
.cap-generated { background: rgba(109,40,217,0.9); }
.pair-missing {
  display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  font-size: 12px; aspect-ratio: 3 / 4; background: #1e293b;
}
.pair-body { padding: 10px 12px; font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pair-body .uid { font-family: monospace; color: var(--text); word-break: break-all; }
.pair-body .ts { white-space: nowrap; }
.pair-body .slug-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  background: var(--surface2); border: 1px solid var(--border); color: var(--accent2);
}
.pair-body .gate-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border);
  background: var(--surface2); white-space: nowrap;
}
.pair-body .gate-paid { color: #22c55e; border-color: #22c55e55; }
.pair-body .gate-welcome { color: #60a5fa; border-color: #60a5fa55; }
.pair-body .gate-free { color: var(--muted); }
/* 테스트 딱지 (ORDER_20261105) — dev 서비스·인증된 시험 표시 생성 기록 */
.pair-body .test-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid #ea580c66; background: #fff7ed; color: var(--warn); font-weight: 600; white-space: nowrap; }
.pair.is-test { opacity: .7; border-style: dashed; }
.test-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; user-select: none; }
.legend { font-size: 11px; color: var(--text-dim); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.legend .gate-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface2); }
.legend .gate-paid { color: #22c55e; border-color: #22c55e55; }
.legend .gate-welcome { color: #60a5fa; border-color: #60a5fa55; }
.legend .gate-free { color: var(--muted); }

.loading, .empty { text-align: center; padding: 64px 0; color: var(--text-dim); font-size: 14px; }
.error-msg { color: var(--danger); font-size: 13px; padding: 12px; background: #fef2f2; border-radius: 8px; }

.load-more-wrap { text-align: center; padding: 24px 0; }
.btn-more {
  padding: 10px 32px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.btn-more:hover { border-color: var(--accent); color: var(--accent); }

/* 라이트박스 */
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
  align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; padding: 24px;
}
.lightbox.on { display: flex; }
.lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <a href="/admin/" class="nav-back">&larr; CMS</a>
</nav>

<div class="container" id="main" style="display:none">
  <h1>ID Photo Review</h1>
  <p class="sub">Firestore generations 기반 실시간 리뷰. 어드민 전용 · 내부 QA. 이미지 링크 1시간 후 만료.</p>

  <div class="toolbar">
    <div class="tabs" id="serviceTabs">
      <button class="tab active" data-service="kr">🇰🇷 KR</button>
      <button class="tab" data-service="jp">🇯🇵 JP</button>
      <button class="tab" data-service="headshot">📸 Headshot</button>
      <button class="tab" data-service="all">전체</button>
    </div>
    <button class="btn-reload" id="reloadBtn">↻ 새로고침</button>
    <label class="test-toggle" title="dev 서비스·시험 표시 생성 기록 — 기본 숨김"><input type="checkbox" id="includeTest"> 테스트 포함</label>
    <span class="meta" id="meta"></span>
  </div>

  <div id="error"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none">결과물이 없습니다.</div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="btn-more" id="loadMoreBtn">더 보기</button>
  </div>
</div>

<div class="loading" id="loadingMsg">로딩 중...</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script>var region = 'kr'; var lang = 'ko';</script>
<script src="/js/auth.js"></script>
<script>
let currentService = 'kr';
let lastCreated = null;
let totalLoaded = 0;
let hiddenTestTotal = 0;
const includeTestEl = () => document.getElementById('includeTest').checked;

async function apiFetch(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (r.status === 401) { location.href = '/admin/'; throw new Error('Unauthorized'); }
  return r.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function imgCell(url, kind, label) {
  if (!url) return `<div class="pair-missing">${label} 없음</div>`;
  return `<figure>
    <figcaption class="cap-${kind}">${label}</figcaption>
    <!-- decoding=async + fetchpriority=low — 40건 × 2장 = 81장 동시 요청으로 초기 로드가 느렸다.
         lazy만으로는 3열 그리드 특성상 대부분이 뷰포트 근처라 실효가 낮았다 (2026-08-26) -->
    <img src="${esc(url)}" alt="${label}" loading="lazy" decoding="async" fetchpriority="low" data-full="${esc(url)}">
  </figure>`;
}

// createdAt은 UTC ISO 정본 — 화면은 KST로 변환해 표기한다 (2026-08-26).
// 종전에는 ISO를 그대로 잘라 써서 실제보다 9시간 이른 시각으로 읽혔다(운영 오판 사례 발생).
function kst(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(0, 16).replace('T', ' ');
  const p = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(d);
  return p.replace('T', ' ') + ' KST';
}

// 게이트 분류 — 돈이 오간 건(초록)과 아닌 건을 한눈에 가른다 (2026-09-26 배지 분리)
//   free              → 무료
//   credits + welcome → 웰컴 (가입 보너스 10c 소진, 매출 아님)
//   credits + purchased → 구매크레딧 (충전 결제 후 사용)
//   credits + 미상    → 크레딧 (판정 실패 폴백, 매출 단정 금지)
//   token             → 즉시결제 (₩2,000 단건)
//   gate 없음 + T1    → 유료(T1) (08-26 이전 구기록)
const GATE_KINDS = {
  free:      { label: '무료',      cls: 'gate-free' },
  welcome:   { label: '웰컴',      cls: 'gate-welcome' },
  purchased: { label: '구매크레딧', cls: 'gate-paid' },
  credits:   { label: '크레딧',    cls: 'gate-welcome' },
  token:     { label: '즉시결제',   cls: 'gate-paid' },
  t1:        { label: '유료(T1)',  cls: 'gate-paid' },
};
function gateKind(p) {
  if (p.gate === 'free') return 'free';
  if (p.gate === 'token') return 'token';
  if (p.gate === 'credits') {
    if (p.creditSource === 'purchased') return 'purchased';
    if (p.creditSource === 'welcome') return 'welcome';
    return 'credits';
  }
  return p.hasT1 ? 't1' : null;
}
function gateBadge(p) {
  const k = gateKind(p);
  if (!k) return '';
  const g = GATE_KINDS[k];
  return `<span class="gate-tag ${g.cls}">${g.label}</span>`;
}
// 범례 집계 — 현재 로드된 카드 기준. 매출 건(구매크레딧+즉시결제)만 초록.
const gateCounts = {};
function countGates(results) {
  for (const p of results) { const k = gateKind(p) || 'none'; gateCounts[k] = (gateCounts[k] || 0) + 1; }
}
function legendHtml() {
  const order = ['token', 'purchased', 'welcome', 'credits', 'free', 't1'];
  const parts = order.filter(k => gateCounts[k]).map(k => `<span class="gate-tag ${GATE_KINDS[k].cls}">${GATE_KINDS[k].label} ${gateCounts[k]}</span>`);
  const paid = (gateCounts.token || 0) + (gateCounts.purchased || 0);
  return `<span class="legend">매출 ${paid}건 · ${parts.join(' ')}</span>`;
}

function renderCard(p) {
  const slugDisplay = p.slug || p.style || '';
  const uidLabel = p.authenticated ? p.userId : p.userId + ' (비로그인)';
  const testTag = p.isTest ? `<span class="test-tag" title="${esc(p.originService || '')}${p.testReason ? ' · ' + esc(p.testReason) : ''}">테스트</span>` : '';
  return `<div class="pair${p.isTest ? ' is-test' : ''}">
    <div class="pair-imgs">
      ${imgCell(p.originalUrl, 'original', '원본')}
      ${imgCell(p.generatedUrl, 'generated', 'AI 결과')}
    </div>
    <div class="pair-body">
      <span class="uid" title="${esc(uidLabel)}">${esc(uidLabel.length > 20 ? uidLabel.slice(0, 20) + '…' : uidLabel)}</span>
      ${slugDisplay ? `<span class="slug-tag">${esc(slugDisplay)}</span>` : ''}
      ${testTag}
      ${gateBadge(p)}
      <span class="ts">${esc(kst(p.created))}</span>
    </div>
  </div>`;
}

async function load(service, append) {
  const grid = document.getElementById('grid');
  const errEl = document.getElementById('error');
  const emptyEl = document.getElementById('emptyMsg');
  const metaEl = document.getElementById('meta');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  errEl.innerHTML = '';
  emptyEl.style.display = 'none';
  loadMoreWrap.style.display = 'none';

  if (!append) {
    grid.innerHTML = '<div class="loading" style="grid-column:1/-1">불러오는 중...</div>';
    metaEl.textContent = '';
    lastCreated = null;
    totalLoaded = 0;
    hiddenTestTotal = 0;
    for (const k of Object.keys(gateCounts)) delete gateCounts[k];
  }

  try {
    let fetchUrl = `/api/admin/idphoto/results?service=${service}&limit=40${includeTestEl() ? '&includeTest=1' : ''}&_t=${Date.now()}`;
    if (append && lastCreated) {
      fetchUrl += `&after=${encodeURIComponent(lastCreated)}`;
    }
    const d = await apiFetch(fetchUrl);
    if (d.error) throw new Error(d.error);

    if (!append && !d.results.length) {
      grid.innerHTML = '';
      emptyEl.style.display = 'block';
      metaEl.textContent = '0건';
      return;
    }

    if (!append) {
      grid.innerHTML = '';
    }

    grid.insertAdjacentHTML('beforeend', d.results.map(renderCard).join(''));
    totalLoaded += d.results.length;
    countGates(d.results);
    hiddenTestTotal += d.hiddenTest || 0;
    const testNote = includeTestEl() ? ' · 테스트 포함' : (hiddenTestTotal ? ` · 테스트 ${hiddenTestTotal}건 숨김` : '');
    metaEl.innerHTML = `${totalLoaded}건 (최신순)${testNote} — ${legendHtml()}`;

    if (d.results.length > 0) {
      lastCreated = d.results[d.results.length - 1].created;
    }

    if (d.hasMore) {
      loadMoreWrap.style.display = 'block';
    }
  } catch (err) {
    if (!append) grid.innerHTML = '';
    errEl.innerHTML = `<div class="error-msg">로드 실패: ${esc(err.message)}</div>`;
  }
}

// 라이트박스
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
document.getElementById('grid').addEventListener('click', e => {
  const full = e.target.dataset?.full;
  if (full) { lightboxImg.src = full; lightbox.classList.add('on'); }
});
lightbox.addEventListener('click', () => { lightbox.classList.remove('on'); lightboxImg.src = ''; });

document.getElementById('serviceTabs').addEventListener('click', e => {
  const svc = e.target.dataset.service;
  if (!svc || svc === currentService) return;
  currentService = svc;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.service === svc));
  load(svc, false);
});
document.getElementById('reloadBtn').addEventListener('click', () => load(currentService, false));
document.getElementById('includeTest').addEventListener('change', () => load(currentService, false));
document.getElementById('loadMoreBtn').addEventListener('click', () => load(currentService, true));

var _origUpdateAuthUI = updateAuthUI;
updateAuthUI = function() { if (currentUser) { location.reload(); } };

async function init() {
  await loadGISWithRetry();
  await initGoogleAuth();
  try {
    const r = await fetch('/api/auth/verify-cookie', { credentials: 'include' });
    if (!r.ok) throw new Error('Not authenticated');

    const adminCheck = await fetch('/api/admin/blog', { credentials: 'include' });
    if (adminCheck.status === 401) { location.href = '/admin/'; return; }

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    load(currentService, false);
  } catch {
    location.href = '/admin/';
  }
}
init();
</script>
</body>
</html>
