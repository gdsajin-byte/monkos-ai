<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f5f5; --surface: #ffffff; --surface2: #fafafa;
  --accent: #6d28d9; --accent2: #4f46e5;
  --text: #334155; --text-dim: #64748b; --text-bright: #0f172a;
  --border: rgba(0, 0, 0, 0.1); --border-hover: rgba(109, 40, 217, 0.3);
  --success: #059669; --danger: #dc2626;
}
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.nav-logo { font-size: 20px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 14px; color: var(--text-dim); }

.container { max-width: 700px; margin: 0 auto; padding: 40px 24px; }
h1 { font-size: 24px; font-weight: 700; color: var(--text-bright); margin-bottom: 32px; }

.form-row { margin-bottom: 20px; }
.form-row label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.form-row textarea {
  width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  line-height: 1.7; resize: vertical;
}
.form-row textarea:focus { border-color: var(--accent); }
.form-row .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.btn {
  padding: 12px 32px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 24px;
  background: var(--success); color: #fff; border-radius: 8px;
  font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s;
  z-index: 1000;
}
.toast.show { opacity: 1; }

.updated-at { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <a href="/admin/" class="nav-back">&larr; Dashboard</a>
</nav>

<div class="container">
  <h1>Settings</h1>

  <div class="form-row">
    <label>Intro Text (homepage)</label>
    <textarea id="intro" rows="5" placeholder="홈페이지 인트로 문구를 입력하세요"></textarea>
    <div class="hint">HTML 일부 허용 (&lt;strong&gt; 등). 홈 메인 영역에 표시됩니다.</div>
  </div>

  <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()">Save</button>
  <div class="updated-at" id="updatedAt"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/admin/settings';

async function loadSettings() {
  try {
    const r = await fetch(API, { credentials: 'include' });
    if (r.status === 401) { location.href = '/admin/'; return; }
    const data = await r.json();
    document.getElementById('intro').value = data.intro || '';
    if (data.updatedAt) {
      document.getElementById('updatedAt').textContent = 'Last updated: ' + data.updatedAt.substring(0, 16).replace('T', ' ');
    }
  } catch (err) {
    showToast('Load failed: ' + err.message, true);
  }
}

async function saveSettings() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const r = await fetch(API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        intro: document.getElementById('intro').value,
      }),
    });
    if (r.status === 401) { location.href = '/admin/'; return; }
    const data = await r.json();
    if (r.ok) {
      showToast('Saved!');
      if (data.updatedAt) {
        document.getElementById('updatedAt').textContent = 'Last updated: ' + data.updatedAt.substring(0, 16).replace('T', ' ');
      }
    } else {
      showToast(data.error || 'Save failed', true);
    }
  } catch (err) {
    showToast('Error: ' + err.message, true);
  } finally {
    btn.disabled = false;
  }
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--success)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadSettings();
</script>
</body>
</html>
