<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Management — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a1a; --surface: #141428; --surface2: #1a1a35;
  --accent: #a78bfa; --accent2: #818cf8;
  --text: #e2e8f0; --text-dim: #8892a8; --text-bright: #f8fafc;
  --border: rgba(167, 139, 250, 0.12); --border-hover: rgba(167, 139, 250, 0.3);
  --success: #34d399; --danger: #f87171;
}
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.nav-logo { font-size: 20px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 14px; color: var(--text-dim); }

.container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.header h1 { font-size: 24px; font-weight: 700; color: var(--text-bright); }
.btn-new {
  padding: 10px 20px; background: var(--accent); color: var(--bg);
  border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn-new:hover { background: var(--accent2); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 32px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
}
.modal h2 { font-size: 20px; color: var(--text-bright); margin-bottom: 20px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 12px; margin-top: 20px; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

/* Table */
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; padding: 12px 16px; font-size: 13px; color: var(--text-dim);
  border-bottom: 1px solid var(--border); font-weight: 500;
}
tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
tbody tr:hover { background: var(--surface); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.badge-pub { background: rgba(52, 211, 153, 0.15); color: var(--success); }
.badge-draft { background: rgba(136, 146, 168, 0.15); color: var(--text-dim); }

.actions { display: flex; gap: 8px; }
.btn-sm {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

.empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 24px;
  background: var(--success); color: var(--bg); border-radius: 8px;
  font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 1000;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <a href="/admin/" class="nav-back">&larr; Dashboard</a>
</nav>

<div class="container">
  <div class="header">
    <h1>FAQ Management</h1>
    <button class="btn-new" onclick="openModal()">+ New FAQ</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Question</th>
        <th>Category</th>
        <th>Order</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="faqTable">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">New FAQ</h2>
    <div class="form-row">
      <label>Question</label>
      <input type="text" id="faqQuestion" placeholder="Enter question">
    </div>
    <div class="form-row">
      <label>Answer (Markdown)</label>
      <textarea id="faqAnswer" rows="6" placeholder="Enter answer"></textarea>
    </div>
    <div class="form-row">
      <label>Category</label>
      <input type="text" id="faqCategory" placeholder="e.g. 결제, 촬영, 증명사진 규격" value="일반">
    </div>
    <div class="form-row">
      <label>Language</label>
      <select id="faqLang">
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="form-row">
      <label>Order (sort number)</label>
      <input type="number" id="faqOrder" value="0">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="saveFaq()">Save</button>
      <button class="btn btn-primary" onclick="saveFaq(true)">Save & Publish</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/admin/faq';
let editId = null;

async function loadItems() {
  try {
    const r = await fetch(API, { credentials: 'include' });
    if (r.status === 401) { location.href = '/admin/'; return; }
    const { items } = await r.json();

    const tbody = document.getElementById('faqTable');
    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No FAQ items. Create your first one!</td></tr>';
      return;
    }

    tbody.innerHTML = items.map(f => `
      <tr>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.question)}</td>
        <td>${esc(f.category)}</td>
        <td>${f.order}</td>
        <td><span class="badge ${f.published ? 'badge-pub' : 'badge-draft'}">${f.published ? 'Published' : 'Draft'}</span></td>
        <td class="actions">
          <button class="btn-sm" onclick="editFaq('${f.id}')">Edit</button>
          <button class="btn-sm" onclick="togglePub('${f.id}', ${!f.published})">${f.published ? 'Unpublish' : 'Publish'}</button>
          <button class="btn-sm danger" onclick="deleteFaq('${f.id}')">Delete</button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    document.getElementById('faqTable').innerHTML = `<tr><td colspan="5" class="empty">Error: ${err.message}</td></tr>`;
  }
}

function openModal(data) {
  editId = data ? data.id : null;
  document.getElementById('modalTitle').textContent = editId ? 'Edit FAQ' : 'New FAQ';
  document.getElementById('faqQuestion').value = data?.question || '';
  document.getElementById('faqAnswer').value = data?.answer || '';
  document.getElementById('faqCategory').value = data?.category || '일반';
  document.getElementById('faqLang').value = data?.lang || 'ko';
  document.getElementById('faqOrder').value = data?.order ?? 0;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editId = null;
}

async function editFaq(id) {
  const r = await fetch(API, { credentials: 'include' });
  const { items } = await r.json();
  const item = items.find(f => f.id === id);
  if (item) openModal(item);
}

async function saveFaq(publish) {
  const body = {
    question: document.getElementById('faqQuestion').value.trim(),
    answer: document.getElementById('faqAnswer').value.trim(),
    category: document.getElementById('faqCategory').value.trim() || '일반',
    lang: document.getElementById('faqLang').value,
    order: parseInt(document.getElementById('faqOrder').value, 10) || 0,
    published: publish || false,
  };
  if (!body.question || !body.answer) { showToast('Question and answer required', true); return; }

  const url = editId ? `${API}/${encodeURIComponent(editId)}` : API;
  const method = editId ? 'PUT' : 'POST';
  const r = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' },
    credentials: 'include', body: JSON.stringify(body),
  });
  if (r.ok) {
    showToast(publish ? 'Published!' : 'Saved!');
    closeModal();
    loadItems();
  } else {
    const data = await r.json();
    showToast(data.error || 'Failed', true);
  }
}

async function togglePub(id, published) {
  await fetch(`${API}/${encodeURIComponent(id)}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', body: JSON.stringify({ published }),
  });
  loadItems();
}

async function deleteFaq(id) {
  if (!confirm('Delete this FAQ?')) return;
  await fetch(`${API}/${encodeURIComponent(id)}`, { method: 'DELETE', credentials: 'include' });
  loadItems();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--success)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadItems();
</script>
</body>
</html>
