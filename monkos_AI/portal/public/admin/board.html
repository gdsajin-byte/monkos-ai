<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Management — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a1a; --surface: #141428; --surface2: #1a1a35;
  --accent: #a78bfa; --accent2: #818cf8;
  --text: #e2e8f0; --text-dim: #8892a8; --text-bright: #f8fafc;
  --border: rgba(167, 139, 250, 0.12); --border-hover: rgba(167, 139, 250, 0.3);
  --success: #34d399; --danger: #f87171;
}
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.nav-logo { font-size: 20px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 14px; color: var(--text-dim); }

.container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }

.header { margin-bottom: 24px; }
.header h1 { font-size: 24px; font-weight: 700; color: var(--text-bright); }

table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; padding: 12px 16px; font-size: 13px; color: var(--text-dim);
  border-bottom: 1px solid var(--border); font-weight: 500;
}
tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
tbody tr:hover { background: var(--surface); }
.td-title { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-bright); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.badge-pub { background: rgba(52, 211, 153, 0.15); color: var(--success); }
.badge-hidden { background: rgba(136, 146, 168, 0.15); color: var(--text-dim); }
.badge-replied { background: rgba(167, 139, 250, 0.15); color: var(--accent); }
.badge-pending { background: rgba(248, 113, 113, 0.15); color: var(--danger); }

.actions { display: flex; gap: 6px; }
.btn-sm {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

/* Reply inline form */
.reply-form {
  display: none; padding: 12px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.reply-form.open { display: flex; gap: 8px; align-items: center; }
.reply-form textarea {
  flex: 1; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  resize: none; height: 40px;
}
.reply-form textarea:focus { border-color: var(--accent); }
.reply-form button {
  padding: 8px 16px; background: var(--accent); color: var(--bg);
  border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  white-space: nowrap;
}

.empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 24px;
  background: var(--success); color: var(--bg); border-radius: 8px;
  font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 1000;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <a href="/admin/" class="nav-back">&larr; Dashboard</a>
</nav>

<div class="container">
  <div class="header">
    <h1>Board Management</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Reply</th>
        <th>Status</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="boardTable">
      <tr><td colspan="7" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/admin/board';

async function loadPosts() {
  try {
    const r = await fetch(API, { credentials: 'include' });
    if (r.status === 401) { location.href = '/admin/'; return; }
    const { posts } = await r.json();

    const tbody = document.getElementById('boardTable');
    if (!posts || posts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No posts yet.</td></tr>';
      return;
    }

    // 미답변 우선 정렬
    posts.sort((a, b) => {
      if (a.hasReply === b.hasReply) return 0;
      return a.hasReply ? 1 : -1;
    });

    tbody.innerHTML = posts.map(p => `
      <tr>
        <td class="td-title">${esc(p.title)}</td>
        <td>${esc(p.author)}</td>
        <td>${esc(p.category)}</td>
        <td><span class="badge ${p.hasReply ? 'badge-replied' : 'badge-pending'}">${p.hasReply ? 'Replied' : 'Pending'}</span></td>
        <td><span class="badge ${p.published ? 'badge-pub' : 'badge-hidden'}">${p.published ? 'Public' : 'Hidden'}</span></td>
        <td style="color:var(--text-dim);font-size:13px">${(p.createdAt || '').substring(0, 10)}</td>
        <td class="actions">
          <button class="btn-sm" onclick="toggleReply('${p.id}')">Reply</button>
          <button class="btn-sm" onclick="toggleVis('${p.id}')">${p.published ? 'Hide' : 'Show'}</button>
          <button class="btn-sm danger" onclick="deletePost('${p.id}')">Del</button>
        </td>
      </tr>
      <tr class="reply-form" id="reply-${p.id}">
        <td colspan="7" style="padding:0">
          <div style="display:flex;gap:8px;align-items:center;padding:12px 16px;">
            <textarea id="replyText-${p.id}" placeholder="Write a reply..."></textarea>
            <button onclick="sendReply('${p.id}')">Send</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    document.getElementById('boardTable').innerHTML = `<tr><td colspan="7" class="empty">Error: ${err.message}</td></tr>`;
  }
}

function toggleReply(id) {
  const row = document.getElementById('reply-' + id);
  row.classList.toggle('open');
  row.style.display = row.classList.contains('open') ? 'table-row' : 'none';
}

async function sendReply(id) {
  const text = document.getElementById('replyText-' + id).value.trim();
  if (!text) return;
  const r = await fetch(`${API}/${encodeURIComponent(id)}/reply`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ text }),
  });
  if (r.ok) {
    showToast('Reply sent!');
    loadPosts();
  } else {
    const data = await r.json();
    showToast(data.error || 'Failed', true);
  }
}

async function toggleVis(id) {
  await fetch(`${API}/${encodeURIComponent(id)}/toggle`, {
    method: 'PUT', credentials: 'include',
  });
  loadPosts();
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  await fetch(`${API}/${encodeURIComponent(id)}`, { method: 'DELETE', credentials: 'include' });
  loadPosts();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--success)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadPosts();
</script>
</body>
</html>
