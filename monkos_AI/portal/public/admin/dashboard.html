<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f5f5; --surface: #ffffff; --surface2: #fafafa;
  --accent: #6d28d9; --accent2: #4f46e5;
  --text: #334155; --text-dim: #64748b; --text-bright: #0f172a;
  --border: rgba(0,0,0,0.08); --border-hover: rgba(109,40,217,0.3);
  --success: #059669; --danger: #dc2626; --orange: #ea580c;
}
body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
.nav-logo { font-size: 18px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 13px; color: var(--text-dim); }
.nav-back:hover { color: var(--accent); }

.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }

/* --- Row 1: KPI Strip --- */
.kpi-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: center; }
.kpi-value { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.2; }
.kpi-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.5px; }
.kpi-delta { font-size: 11px; margin-top: 4px; font-weight: 600; }
.kpi-delta.up { color: var(--success); }
.kpi-delta.down { color: var(--danger); }
.kpi-delta.flat { color: var(--text-dim); }

/* --- Row 2: Compressed Trends --- */
.trends-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.chart-compact { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; max-height: 180px; overflow: hidden; }
.chart-compact .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.chart-compact .chart-title { font-size: 12px; font-weight: 700; color: var(--text-bright); }
.period-tabs { display: flex; gap: 4px; }
.period-tab { padding: 3px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text-dim); font-size: 11px; cursor: pointer; }
.period-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* --- Row 3: User 360° Table --- */
.section { margin-bottom: 20px; }
.section-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.section-title { font-size: 14px; font-weight: 700; color: var(--text-bright); }
.table-controls { display: flex; gap: 12px; align-items: center; }
.table-controls input[type="text"] { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; width: 180px; }
.table-controls label { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; cursor: pointer; }

table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th { background: var(--surface2); color: var(--text-dim); font-weight: 600; text-align: left; padding: 8px 10px; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--accent); }
th .sort-icon { font-size: 10px; margin-left: 2px; }
td { padding: 8px 10px; border-top: 1px solid var(--border); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #f8f5ff; }
tr.test-row td { color: var(--text-dim); background: #fafafa; }

.provider-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.provider-kakao { background: #FEE500; color: #191919; }
.provider-google { background: #4285F4; color: #fff; }
.provider-line { background: #00B900; color: #fff; }
.provider-unknown { background: #e2e8f0; color: #64748b; }

.funnel-dots { display: flex; gap: 3px; align-items: center; }
.funnel-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; }
.funnel-dot.filled { background: var(--accent); }
.funnel-label { font-size: 10px; color: var(--text-dim); margin-left: 4px; }

.charge-yes { color: var(--success); font-weight: 600; }
.charge-no { color: var(--text-dim); }

.relative-time { color: var(--text-dim); }

/* --- Drill-down Panel --- */
.panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.panel-overlay.open { opacity: 1; pointer-events: auto; }
.drill-panel { position: fixed; top: 0; right: -420px; width: 420px; height: 100vh; background: var(--surface); box-shadow: -4px 0 20px rgba(0,0,0,0.1); z-index: 101; transition: right 0.3s ease; overflow-y: auto; padding: 24px; }
.drill-panel.open { right: 0; }
.panel-close { position: absolute; top: 12px; right: 16px; border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text-dim); line-height: 1; }
.panel-close:hover { color: var(--text-bright); }
.panel-name { font-size: 18px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
.panel-email { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
.panel-section { margin-bottom: 16px; }
.panel-section-title { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.panel-stat { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
.panel-stat .stat-value { font-size: 16px; font-weight: 700; color: var(--text-bright); }
.panel-stat .stat-label { font-size: 10px; color: var(--text-dim); }
.panel-tx-list { list-style: none; }
.panel-tx-item { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; }
.panel-tx-item:last-child { border-bottom: none; }
.panel-tx-amount.credit { color: var(--success); }
.panel-tx-amount.debit { color: var(--danger); }

.loading { text-align: center; padding: 60px 0; color: var(--text-dim); font-size: 14px; }
.error-msg { color: var(--danger); font-size: 12px; padding: 10px; background: #fef2f2; border-radius: 6px; margin-top: 8px; }

@media (max-width: 900px) {
  .kpi-strip { grid-template-columns: repeat(3, 1fr); }
  .trends-row { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .kpi-strip { grid-template-columns: repeat(2, 1fr); }
  .drill-panel { width: 100vw; right: -100vw; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/admin/" class="nav-back">&larr; CMS</a>
    <a href="/admin/citadel.html" class="nav-back">CITADEL &rarr;</a>
  </div>
</nav>

<div class="container" id="main" style="display:none">

  <!-- Row 1: KPI Strip -->
  <div class="kpi-strip">
    <div class="kpi-card"><div class="kpi-value" id="kpiSignups">-</div><div class="kpi-label">오늘 가입</div><div class="kpi-delta" id="kpiSignupsDelta"></div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiCharges">-</div><div class="kpi-label">결제</div><div class="kpi-delta" id="kpiChargesDelta"></div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiActive">-</div><div class="kpi-label">활성</div><div class="kpi-delta flat" id="kpiActiveDelta">—</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiRevenue">-</div><div class="kpi-label">매출</div><div class="kpi-delta" id="kpiRevenueDelta"></div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiConversion">-</div><div class="kpi-label">전환율</div><div class="kpi-delta flat" id="kpiConversionDelta">—</div></div>
    <div class="kpi-card"><div class="kpi-value" id="kpiConsumed">-</div><div class="kpi-label">소진크레딧</div><div class="kpi-delta" id="kpiConsumedDelta"></div></div>
  </div>

  <!-- Row 2: Compressed Trends -->
  <div class="trends-row">
    <div class="chart-compact">
      <div class="chart-header">
        <span class="chart-title">트래픽</span>
        <div class="period-tabs" id="trafficTabs">
          <button class="period-tab" data-days="7">7일</button>
          <button class="period-tab active" data-days="30">30일</button>
          <button class="period-tab" data-days="90">90일</button>
        </div>
      </div>
      <canvas id="trafficChart" height="90"></canvas>
      <div id="trafficError"></div>
    </div>
    <div class="chart-compact">
      <div class="chart-header">
        <span class="chart-title">가입 채널</span>
        <span class="chart-title" style="font-weight:400;color:var(--text-dim)" id="channelTotal"></span>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <div style="flex:0 0 120px"><canvas id="channelChart" height="90"></canvas></div>
        <div style="flex:1"><canvas id="dailySignupChart" height="90"></canvas></div>
      </div>
    </div>
  </div>

  <!-- Row 2.5: 외부 유입 채널 -->
  <div class="section" style="margin-bottom:20px">
    <div class="section-bar">
      <div class="section-title">외부 유입 채널</div>
      <div class="period-tabs" id="channelPeriodTabs">
        <button class="period-tab active" data-days="7">7일</button>
        <button class="period-tab" data-days="30">30일</button>
        <button class="period-tab" data-days="90">90일</button>
      </div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px" id="channelsCard">
      <div style="color:var(--text-dim);font-size:12px">로딩 중...</div>
    </div>
  </div>

  <!-- Row 3: User 360° Table -->
  <div class="section">
    <div class="section-bar">
      <div class="section-title">고객 360° <span style="font-weight:400;color:var(--text-dim);font-size:12px" id="userCount"></span></div>
      <div class="table-controls">
        <input type="text" placeholder="이름·이메일 검색..." id="userSearch">
        <label><input type="checkbox" id="showTest"> 테스트 표시</label>
      </div>
    </div>
    <table>
      <thead><tr>
        <th data-sort="name">유저 <span class="sort-icon"></span></th>
        <th data-sort="provider">채널 <span class="sort-icon"></span></th>
        <th data-sort="referrer">유입경로 <span class="sort-icon"></span></th>
        <th data-sort="createdAtRaw">가입 (KST) <span class="sort-icon"></span></th>
        <th data-sort="funnelStage">퍼널 <span class="sort-icon"></span></th>
        <th data-sort="generateCount">생성 <span class="sort-icon"></span></th>
        <th data-sort="hasCharge">결제 <span class="sort-icon"></span></th>
        <th data-sort="credits">잔액 <span class="sort-icon"></span></th>
        <th data-sort="lastActivityRaw">최근활동 <span class="sort-icon"></span></th>
      </tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<!-- Drill-down Panel -->
<div class="panel-overlay" id="panelOverlay"></div>
<div class="drill-panel" id="drillPanel">
  <button class="panel-close" id="panelClose">&times;</button>
  <div id="panelContent"></div>
</div>

<div class="loading" id="loadingMsg">대시보드 로딩 중...</div>

<script>var region = 'kr'; var lang = 'ko';</script>
<script src="/js/auth.js"></script>
<script>
const COLORS = { accent: '#6d28d9', accent2: '#4f46e5', success: '#059669', danger: '#dc2626', orange: '#ea580c', teal: '#0d9488', pink: '#db2777', slate: '#64748b' };
const PROVIDER_MAP = { kakao: '카톡', google: '구글', line: '라인', unknown: '직접' };
const FUNNEL_LABELS = ['방문', '가입', '생성', '결제', '다운'];

let trafficChartInst, channelChartInst, dailySignupChartInst;
let allUsers = [];
let sortKey = 'createdAtRaw', sortDir = -1;

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function apiFetch(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (r.status === 401) { location.href = '/admin/'; throw new Error('Unauthorized'); }
  return r.json();
}

function renderDelta(today, yesterday, el, prefix) {
  const diff = today - yesterday;
  if (diff > 0) { el.textContent = `▲ ${prefix || ''}${diff.toLocaleString()}`; el.className = 'kpi-delta up'; }
  else if (diff < 0) { el.textContent = `▼ ${prefix || ''}${Math.abs(diff).toLocaleString()}`; el.className = 'kpi-delta down'; }
  else { el.textContent = '—'; el.className = 'kpi-delta flat'; }
}

function relativeTime(isoStr) {
  if (!isoStr) return '';
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '방금';
  if (mins < 60) return `${mins}분 전`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}시간 전`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days}일 전`;
  return `${Math.floor(days / 30)}개월 전`;
}

// --- KPI Strip ---
async function loadSummary() {
  try {
    const d = await apiFetch('/api/admin/dashboard/summary');
    if (d.error) throw new Error(d.error);
    document.getElementById('kpiSignups').textContent = d.todaySignups;
    document.getElementById('kpiCharges').textContent = d.todayCharges;
    document.getElementById('kpiActive').textContent = d.activeToday;
    document.getElementById('kpiRevenue').textContent = d.todayRevenue ? `₩${d.todayRevenue.toLocaleString()}` : '₩0';
    document.getElementById('kpiConversion').textContent = `${d.conversionRate}%`;
    document.getElementById('kpiConsumed').textContent = d.todayConsumed;

    renderDelta(d.todaySignups, d.yesterdaySignups, document.getElementById('kpiSignupsDelta'));
    renderDelta(d.todayCharges, d.yesterdayCharges, document.getElementById('kpiChargesDelta'));
    renderDelta(d.todayRevenue, d.yesterdayRevenue, document.getElementById('kpiRevenueDelta'), '₩');
    renderDelta(d.todayConsumed, d.yesterdayConsumed, document.getElementById('kpiConsumedDelta'));
  } catch (err) { console.error('summary:', err); }
}

// --- Traffic Sparkline ---
async function loadTraffic(days) {
  const el = document.getElementById('trafficError');
  el.innerHTML = '';
  try {
    const d = await apiFetch(`/api/admin/dashboard/traffic?days=${days}`);
    if (d.error) throw new Error(d.error);
    const labels = d.daily.map(r => r.date.slice(5)).reverse();
    const sessions = d.daily.map(r => r.sessions).reverse();
    if (trafficChartInst) trafficChartInst.destroy();
    trafficChartInst = new Chart(document.getElementById('trafficChart'), {
      type: 'line',
      data: { labels, datasets: [
        { label: 'Sessions', data: sessions, borderColor: COLORS.accent, backgroundColor: COLORS.accent + '18', fill: true, tension: 0.4, borderWidth: 1.5, pointRadius: 0 },
        { label: 'New', data: d.daily.map(r => r.newUsers).reverse(), borderColor: COLORS.success, tension: 0.4, borderWidth: 1, pointRadius: 0 },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } } },
        scales: { x: { display: false }, y: { display: false } },
      },
    });
  } catch (err) {
    el.innerHTML = `<div class="error-msg">트래픽 로드 실패: ${esc(err.message)}</div>`;
  }
}

// --- Channel Donut + Daily Signup Bar ---
function renderChannelCharts(byProvider, daily) {
  const providers = Object.keys(byProvider);
  const total = providers.reduce((s, p) => s + byProvider[p], 0);
  document.getElementById('channelTotal').textContent = `${total}명`;
  const pColors = [COLORS.accent, COLORS.success, COLORS.teal, COLORS.orange, COLORS.pink, COLORS.slate];

  if (channelChartInst) channelChartInst.destroy();
  channelChartInst = new Chart(document.getElementById('channelChart'), {
    type: 'doughnut',
    data: { labels: providers.map(p => PROVIDER_MAP[p] || p), datasets: [{ data: providers.map(p => byProvider[p]), backgroundColor: pColors.slice(0, providers.length) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '60%' },
  });

  const slicedDaily = daily.slice(0, 14).reverse();
  if (dailySignupChartInst) dailySignupChartInst.destroy();
  dailySignupChartInst = new Chart(document.getElementById('dailySignupChart'), {
    type: 'bar',
    data: { labels: slicedDaily.map(r => r.date.slice(5)), datasets: [{ data: slicedDaily.map(r => r.count), backgroundColor: COLORS.accent + '88', borderRadius: 3 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 9 } }, grid: { display: false } }, y: { display: false, beginAtZero: true } },
    },
  });
}

// --- User 360° Table ---
async function loadUsers360() {
  try {
    const showTest = document.getElementById('showTest').checked ? '1' : '0';
    const d = await apiFetch(`/api/admin/dashboard/users360?test=${showTest}`);
    if (d.error) throw new Error(d.error);
    allUsers = d.users;
    document.getElementById('userCount').textContent = `(${d.total}명)`;
    renderChannelCharts(d.byProvider, d.daily);
    renderUsersTable();
  } catch (err) { console.error('users360:', err); }
}

function renderUsersTable() {
  const search = (document.getElementById('userSearch').value || '').toLowerCase();
  let filtered = allUsers;
  if (search) {
    filtered = filtered.filter(u =>
      (u.name || '').toLowerCase().includes(search) ||
      (u.email || '').toLowerCase().includes(search)
    );
  }

  filtered.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'boolean') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
    if (typeof va === 'number') return (va - vb) * sortDir;
    return String(va || '').localeCompare(String(vb || '')) * sortDir;
  });

  const tbody = document.getElementById('usersBody');
  tbody.innerHTML = filtered.map((u, i) => {
    const provCls = `provider-${u.provider || 'unknown'}`;
    const provLabel = PROVIDER_MAP[u.provider] || u.provider || '직접';
    const funnelHtml = Array.from({ length: 5 }, (_, j) =>
      `<div class="funnel-dot${j < u.funnelStage ? ' filled' : ''}"></div>`
    ).join('') + `<span class="funnel-label">${FUNNEL_LABELS[Math.min(u.funnelStage, 5) - 1] || ''}</span>`;
    const chargeHtml = u.hasCharge
      ? `<span class="charge-yes">✓ ₩${u.totalPaid.toLocaleString()}</span>`
      : `<span class="charge-no">✗</span>`;
    const rowCls = `clickable${u.isTest ? ' test-row' : ''}`;
    const refDomain = u.referrer ? (() => { try { return new URL(u.referrer).hostname; } catch { return u.referrer; } })() : (u.signupSource || '<span style="color:var(--accent);font-size:10px">클릭 확인</span>');
    return `<tr class="${rowCls}" data-idx="${i}">
      <td><strong>${esc(u.name || '—')}</strong><br><span style="color:var(--text-dim);font-size:11px">${esc(u.email)}</span></td>
      <td><span class="provider-badge ${provCls}">${provLabel}</span></td>
      <td style="font-size:11px;color:var(--text-dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(u.referrer || u.signupSource || '')}">${esc(refDomain)}</td>
      <td>${esc(u.createdAt)}</td>
      <td><div class="funnel-dots">${funnelHtml}</div></td>
      <td>${u.generateCount}</td>
      <td>${chargeHtml}</td>
      <td>${u.credits}</td>
      <td><span class="relative-time" title="${esc(u.lastActivity)}">${relativeTime(u.lastActivityRaw)}</span></td>
    </tr>`;
  }).join('');
}

// --- Sorting ---
document.querySelector('thead').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th || !th.dataset.sort) return;
  if (sortKey === th.dataset.sort) sortDir *= -1;
  else { sortKey = th.dataset.sort; sortDir = -1; }
  renderUsersTable();
});

// --- Search ---
document.getElementById('userSearch').addEventListener('input', () => renderUsersTable());

// --- Test Toggle ---
document.getElementById('showTest').addEventListener('change', () => loadUsers360());

// --- Drill-down Panel ---
const panelOverlay = document.getElementById('panelOverlay');
const drillPanel = document.getElementById('drillPanel');
const panelContent = document.getElementById('panelContent');

function openPanel(user) {
  const provLabel = PROVIDER_MAP[user.provider] || user.provider || '직접';
  const funnelHtml = Array.from({ length: 5 }, (_, j) =>
    `<div class="funnel-dot${j < user.funnelStage ? ' filled' : ''}" style="width:10px;height:10px"></div>`
  ).join('') + `<span class="funnel-label" style="font-size:11px">${FUNNEL_LABELS[Math.min(user.funnelStage, 5) - 1]}</span>`;

  const txHtml = (user.transactions || []).map(t => {
    const cls = t.amount > 0 ? 'credit' : 'debit';
    const sign = t.amount > 0 ? '+' : '';
    const dateStr = t.createdAt ? t.createdAt.replace('T', ' ').slice(0, 16) : '';
    return `<li class="panel-tx-item"><span>${dateStr}<br>${esc(t.description)}</span><span class="panel-tx-amount ${cls}">${sign}${t.amount}</span></li>`;
  }).join('') || '<li class="panel-tx-item" style="color:var(--text-dim)">거래 내역 없음</li>';

  panelContent.innerHTML = `
    <div class="panel-name">${esc(user.name || '—')}${user.isTest ? ' <span style="color:var(--text-dim);font-size:12px">(테스트)</span>' : ''}</div>
    <div class="panel-email">${esc(user.email)}</div>
    <div class="panel-section">
      <div class="panel-section-title">요약</div>
      <div class="panel-grid">
        <div class="panel-stat"><div class="stat-value"><span class="provider-badge provider-${user.provider || 'unknown'}">${provLabel}</span></div><div class="stat-label">채널</div></div>
        <div class="panel-stat"><div class="stat-value">${esc(user.createdAt)}</div><div class="stat-label">가입 (KST)</div></div>
        <div class="panel-stat"><div class="stat-value">${user.credits}</div><div class="stat-label">잔액</div></div>
        <div class="panel-stat"><div class="stat-value">${user.generateCount}</div><div class="stat-label">생성 횟수</div></div>
      </div>
    </div>
    <div class="panel-section">
      <div class="panel-section-title">퍼널</div>
      <div class="funnel-dots" style="margin-bottom:8px">${funnelHtml}</div>
    </div>
    <div class="panel-section">
      <div class="panel-section-title">결제</div>
      ${user.hasCharge
        ? `<div style="font-size:14px;font-weight:700;color:var(--success)">₩${user.totalPaid.toLocaleString()} (${user.chargeCount}건)</div>`
        : `<div style="color:var(--text-dim)">결제 내역 없음</div>`}
    </div>
    <div class="panel-section">
      <div class="panel-section-title">거래 내역</div>
      <ul class="panel-tx-list">${txHtml}</ul>
    </div>
  `;
  panelOverlay.classList.add('open');
  drillPanel.classList.add('open');
}

function closePanel() {
  panelOverlay.classList.remove('open');
  drillPanel.classList.remove('open');
}

document.getElementById('panelClose').addEventListener('click', closePanel);
panelOverlay.addEventListener('click', closePanel);

document.getElementById('usersBody').addEventListener('click', e => {
  const row = e.target.closest('tr.clickable');
  if (!row) return;
  const idx = parseInt(row.dataset.idx, 10);
  const search = (document.getElementById('userSearch').value || '').toLowerCase();
  let filtered = allUsers;
  if (search) {
    filtered = filtered.filter(u => (u.name || '').toLowerCase().includes(search) || (u.email || '').toLowerCase().includes(search));
  }
  filtered.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'boolean') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
    if (typeof va === 'number') return (va - vb) * sortDir;
    return String(va || '').localeCompare(String(vb || '')) * sortDir;
  });
  const user = filtered[idx];
  if (user) location.href = `/admin/user.html?id=${encodeURIComponent(user.id)}`;
});

// --- External Channels ---
let currentChannelDays = 7;

async function loadChannels(days) {
  const card = document.getElementById('channelsCard');
  card.innerHTML = '<div style="color:var(--text-dim);font-size:12px">로딩 중...</div>';
  try {
    const d = await apiFetch(`/api/admin/dashboard/channels?days=${days}`);
    if (d.error) throw new Error(d.error);
    const total = d.channels.reduce((s, c) => s + c.visits, 0) + d.directVisits;
    if (total === 0) { card.innerHTML = '<div style="color:var(--text-dim);font-size:12px">데이터 없음</div>'; return; }
    let html = '';
    const allRows = [...d.channels.map(c => ({ domain: c.domain, visits: c.visits, topLandings: c.topLandings, sampleUrls: c.sampleUrls }))];
    if (d.directVisits > 0) allRows.push({ domain: '(직접 접속)', visits: d.directVisits, topLandings: [], sampleUrls: [] });
    allRows.sort((a, b) => b.visits - a.visits);
    allRows.forEach((ch, i) => {
      const pct = Math.round((ch.visits / total) * 100);
      const barW = Math.max(pct, 2);
      const details = ch.sampleUrls.length > 0 || ch.topLandings.length > 0
        ? `<div class="ch-detail" id="chDetail${i}" style="display:none;margin-top:6px;padding:6px 8px;background:var(--surface2);border-radius:4px;font-size:10px;color:var(--text-dim)">
            ${ch.sampleUrls.length > 0 ? '<div style="margin-bottom:4px"><strong>소스 URL:</strong><br>' + ch.sampleUrls.map(u => esc(u)).join('<br>') + '</div>' : ''}
            ${ch.topLandings.length > 0 ? '<div><strong>랜딩 페이지:</strong><br>' + ch.topLandings.map(u => esc(u)).join('<br>') + '</div>' : ''}
          </div>`
        : '';
      const toggle = ch.sampleUrls.length > 0 || ch.topLandings.length > 0
        ? ` onclick="var el=document.getElementById('chDetail${i}');el.style.display=el.style.display==='none'?'block':'none'" style="cursor:pointer"`
        : '';
      html += `<div${toggle} style="margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px">
          <span style="min-width:160px;font-weight:600">${esc(ch.domain)}</span>
          <div style="flex:1;background:var(--border);border-radius:3px;height:8px"><div style="width:${barW}%;background:var(--accent);border-radius:3px;height:100%"></div></div>
          <span style="min-width:70px;text-align:right;font-variant-numeric:tabular-nums">${ch.visits} (${pct}%)</span>
        </div>${details}
      </div>`;
    });
    card.innerHTML = html;
  } catch (err) { card.innerHTML = `<div style="color:var(--danger);font-size:12px">로드 실패: ${esc(err.message)}</div>`; }
}

document.getElementById('channelPeriodTabs').addEventListener('click', e => {
  if (!e.target.dataset.days) return;
  currentChannelDays = parseInt(e.target.dataset.days, 10);
  document.querySelectorAll('#channelPeriodTabs .period-tab').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  loadChannels(currentChannelDays);
});
