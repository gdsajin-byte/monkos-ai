<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Editor — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f5f5; --surface: #ffffff; --surface2: #fafafa;
  --accent: #6d28d9; --accent2: #4f46e5;
  --text: #334155; --text-dim: #64748b; --text-bright: #0f172a;
  --border: rgba(0, 0, 0, 0.1); --border-hover: rgba(109, 40, 217, 0.3);
  --success: #059669; --danger: #dc2626;
}
body { font-family: 'Pretendard', 'Noto Sans JP', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
.nav-logo { font-size: 18px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 13px; color: var(--text-dim); }

/* 3-column layout */
.editor-layout {
  display: grid;
  grid-template-columns: 220px minmax(480px, 820px) 300px;
  gap: 20px;
  max-width: 100%;
  margin: 0 auto;
  padding: 20px 24px;
}
.editor-left {
  position: sticky;
  top: 80px;
  align-self: start;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
.editor-main { min-width: 0; }
.editor-right {
  position: sticky;
  top: 80px;
  align-self: start;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}

.sidebar-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
}
.sidebar-section label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-weight: 500;
}
.sidebar-section input, .sidebar-section select, .sidebar-section textarea {
  width: 100%; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 13px; outline: none;
}
.sidebar-section input:focus, .sidebar-section select:focus, .sidebar-section textarea:focus { border-color: var(--accent); }
.sidebar-hint { font-size: 10px; color: var(--text-dim); margin-top: 3px; display: block; }

.title-input {
  width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-bright); font-size: 18px; font-weight: 600; outline: none; margin-bottom: 16px;
}
.title-input:focus { border-color: var(--accent); }

.editor-wrap { margin-bottom: 0; }
#editor { min-height: 400px; }

/* Toast UI overrides */
.toastui-editor-defaultUI { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toastui-editor-defaultUI .toastui-editor-ww-container { background: var(--surface); }
.ProseMirror { color: var(--text); }

/* Buttons */
.btn {
  padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-success { background: var(--success); color: #fff; }
.btn-preview { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 24px;
  background: var(--success); color: #fff; border-radius: 8px;
  font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s;
  z-index: 1000;
}
.toast.show { opacity: 1; }

.pinned-row { display: flex; align-items: center; gap: 8px; }
.pinned-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }
.pinned-row label { margin-bottom: 0; cursor: pointer; font-size: 12px; }

/* Sidebar tabs */
.sidebar-tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  background: var(--surface);
  border-radius: 8px 8px 0 0;
  overflow: hidden;
}
.sidebar-tabs .tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  background: var(--surface2);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.sidebar-tabs .tab:hover { color: var(--text); background: var(--surface); }
.sidebar-tabs .tab.active {
  color: var(--accent);
  background: var(--surface);
  border-bottom-color: var(--accent);
}
.tab-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 8px 8px;
  padding: 14px;
}

/* Seed catalog */
.seed-search-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.seed-search-bar input {
  flex: 1;
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  outline: none;
}
.seed-search-bar input:focus { border-color: var(--accent); }
.seed-search-bar select {
  padding: 6px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
.seed-list {
  max-height: 60vh;
  overflow-y: auto;
}
.seed-item {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.seed-item:hover { border-color: var(--accent); background: rgba(109,40,217,0.03); }
.seed-item.used { opacity: 0.5; }
.seed-item-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.seed-score { font-size: 11px; font-weight: 700; color: #f59e0b; white-space: nowrap; }
.seed-id { font-size: 11px; color: var(--text-dim); font-weight: 500; }
.seed-cat {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  color: #fff;
}
.seed-cat.ARCH { background: #3b82f6; }
.seed-cat.DEBUG { background: #ef4444; }
.seed-cat.GOV { background: #8b5cf6; }
.seed-cat.PRODUCT { background: #10b981; }
.seed-cat.TEAM { background: #f97316; }
.seed-cat.BIZ { background: #06b6d4; }
.seed-title {
  font-size: 12px; font-weight: 600; color: var(--text-bright);
  line-height: 1.3; margin-bottom: 3px;
}
.seed-insight {
  font-size: 11px; color: var(--text-dim); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.seed-popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
}
.seed-popup {
  background: var(--surface);
  border-radius: 12px; padding: 24px;
  max-width: 480px; width: 90%;
  max-height: 80vh; overflow-y: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,0.2);
}
.seed-popup h3 { font-size: 16px; color: var(--text-bright); margin-bottom: 12px; line-height: 1.4; }
.seed-popup-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.seed-popup-meta span { font-size: 12px; color: var(--text-dim); }
.seed-popup-field { margin-bottom: 12px; }
.seed-popup-field label { font-size: 11px; color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 3px; }
.seed-popup-field p { font-size: 13px; color: var(--text); line-height: 1.5; margin: 0; }
.seed-popup-actions { display: flex; gap: 8px; margin-top: 16px; }
.seed-popup-actions button { flex: 1; }

/* Image library */
.img-thumb {
  position: relative;
  aspect-ratio: 1;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}
.img-thumb:hover { border-color: var(--accent); }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-delete {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.6); color: #fff;
  border: none; font-size: 14px; line-height: 1;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
}
.img-thumb:hover .img-delete { display: flex; }

/* Floating image toolbar */
.img-float-toolbar {
  position: fixed;
  display: flex;
  gap: 2px;
  background: rgba(0,0,0,0.75);
  border-radius: 6px;
  padding: 4px 6px;
  z-index: 200;
  white-space: nowrap;
}
.img-float-toolbar button {
  background: none;
  border: none;
  color: #fff;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 4px;
  white-space: nowrap;
}
.img-float-toolbar button:hover {
  background: rgba(255,255,255,0.2);
}

/* Research tab */
.research-search-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.research-search-bar input {
  flex: 1;
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  outline: none;
}
.research-search-bar input:focus { border-color: var(--accent); }
.research-search-bar button {
  padding: 6px 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.research-search-bar button:hover { opacity: 0.85; }
.research-source-toggle {
  display: flex;
  gap: 0;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.research-source-toggle button {
  flex: 1;
  padding: 6px 4px;
  border: none;
  background: var(--surface2);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.research-source-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
.research-source-toggle button.active { background: var(--accent); color: #fff; }
.research-results {
  max-height: 55vh;
  overflow-y: auto;
}
.research-item {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  transition: border-color 0.2s;
}
.research-item:hover { border-color: var(--accent); }
.research-item-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.4;
  margin-bottom: 3px;
}
.research-item-meta {
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.research-item-desc {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.research-item-actions {
  display: flex;
  gap: 6px;
}
.research-item-actions button {
  padding: 3px 8px;
  font-size: 11px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface2);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.research-item-actions button:hover { border-color: var(--accent); color: var(--accent); }
.research-img-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.research-img-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}
.research-img-item:hover { border-color: var(--accent); }
.research-img-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.research-copyright {
  font-size: 10px;
  color: var(--danger);
  background: rgba(220,38,38,0.05);
  padding: 6px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
  line-height: 1.4;
}
.research-history {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.research-history-item {
  padding: 2px 8px;
  font-size: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.research-history-item:hover { border-color: var(--accent); color: var(--accent); }
.research-more {
  display: block;
  width: 100%;
  padding: 8px;
  text-align: center;
  font-size: 12px;
  color: var(--accent);
  background: none;
  border: 1px dashed var(--border);
  border-radius: 6px;
  cursor: pointer;
  margin-top: 6px;
}
.research-more:hover { background: rgba(109,40,217,0.03); }
.research-loading {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  padding: 20px;
}
.research-suggest-toast {
  position: fixed;
  bottom: 70px;
  right: 24px;
  padding: 10px 16px;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
  box-shadow: 0 4px 12px rgba(109,40,217,0.3);
}
.research-suggest-toast.show { opacity: 1; }
.research-img-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.research-img-popup img {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.research-img-popup-src {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 11px;
  max-width: 80%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Admin share buttons */
.admin-share {
  display: flex; align-items: center; gap: 10px; margin-top: 16px;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
}
.admin-share.disabled { opacity: 0.4; pointer-events: none; }
.admin-share-label { font-size: 12px; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
.admin-share-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-dim); font-size: 13px;
  text-decoration: none; cursor: pointer; transition: all 0.2s;
}
.admin-share-btn:hover { border-color: var(--accent); color: var(--accent); }
.admin-share-copy-full {
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text-dim); font-size: 12px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit;
}
.admin-share-copy-full:hover { border-color: var(--accent); color: var(--accent); }

@media (max-width: 1200px) {
  .editor-layout { grid-template-columns: 200px minmax(400px, 820px); }
  .editor-right { display: none; }
}
@media (max-width: 700px) {
  .editor-layout { grid-template-columns: 1fr; }
  .editor-left { position: static; max-height: none; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="btn btn-secondary btn-sm" onclick="save(false)">임시저장</button>
    <button class="btn btn-success btn-sm" onclick="save(true)">발행</button>
    <button class="btn btn-preview btn-sm" onclick="preview()">미리보기</button>
    <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
    <div style="position:relative">
      <button id="myPostsBtn" onclick="loadMyPosts()" style="padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text-dim);font-size:13px;cursor:pointer">내 글 목록 ▾</button>
      <div id="myPostsDropdown" style="display:none;position:absolute;top:36px;right:0;width:320px;max-height:400px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:50"></div>
    </div>
    <a href="/admin/blog-list.html" class="nav-back">&larr; Blog List</a>
  </div>
</nav>

<div class="editor-layout">
  <!-- Left: Meta settings -->
  <div class="editor-left">
    <div class="sidebar-section">
      <label>카테고리</label>
      <select id="category">
        <option value="">-- 선택 --</option>
        <option value="사진">사진</option>
        <option value="패션">패션</option>
        <option value="헤어">헤어</option>
        <option value="메이크업">메이크업</option>
        <option value="AI">AI</option>
        <option value="news">News</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="sidebar-section">
      <label>언어</label>
      <select id="lang">
        <option value="ko">Korean (ko)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="en">English (en)</option>
      </select>
    </div>
    <div class="sidebar-section">
      <label>썸네일</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="text" id="thumbnail" placeholder="이미지 URL" style="flex:1">
        <button type="button" class="btn btn-secondary" id="thumbUploadBtn" onclick="uploadThumbnail()" style="padding:6px 10px;font-size:11px;white-space:nowrap">업로드</button>
        <input type="file" id="thumbFile" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="sidebar-section">
      <label>URL 주소</label>
      <input type="text" id="slug" placeholder="자동 생성">
      <span class="sidebar-hint">특수문자($ / 등) 사용 불가</span>
    </div>
    <div class="sidebar-section">
      <label>요약 (SEO)</label>
      <textarea id="summary" rows="3" maxlength="160" placeholder="검색 결과 요약문 (최대 160자)"></textarea>
    </div>
    <div class="sidebar-section">
      <div class="pinned-row">
        <input type="checkbox" id="pinned">
        <label for="pinned">매거진 고정</label>
      </div>
    </div>
    <div class="sidebar-section">
      <label>태그</label>
      <input type="text" id="tags" placeholder="콤마 구분">
    </div>
    <div class="sidebar-section" id="previewCard">
      <label>미리보기</label>
      <div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface2)">
        <div id="previewThumb" style="width:100%;aspect-ratio:1200/630;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <span style="color:var(--text-dim);font-size:11px">썸네일 없음</span>
        </div>
        <div style="padding:8px">
          <div id="previewTitle" style="font-size:13px;font-weight:600;color:var(--text-bright);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">제목 미입력</div>
          <div id="previewSummary" style="font-size:11px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">요약 미입력</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Center: Editor -->
  <div class="editor-main">
    <h1 id="pageTitle" style="font-size:20px;font-weight:700;color:var(--text-bright);margin-bottom:12px">New Post</h1>
    <input type="text" class="title-input" id="title" placeholder="제목을 입력하세요">
    <div class="editor-wrap">
      <div id="editor"></div>
    </div>
    <div class="admin-share disabled" id="shareSection">
      <span class="admin-share-label">공유</span>
      <a id="shareX" href="#" target="_blank" rel="noopener" class="admin-share-btn" title="X">𝕏</a>
      <a id="shareLine" href="#" target="_blank" rel="noopener" class="admin-share-btn" title="LINE">L</a>
      <a id="shareKakao" href="#" target="_blank" rel="noopener" class="admin-share-btn" title="KakaoStory">💬</a>
      <button class="admin-share-btn" onclick="copyShareLink()" title="링크 복사">🔗</button>
      <button class="admin-share-copy-full" onclick="copyShareFull()" title="제목+URL 복사">📋 복사</button>
    </div>
  </div>

  <!-- Right: Tabbed sidebar -->
  <div class="editor-right">
    <div class="sidebar-tabs">
      <button class="tab active" data-tab="images" onclick="switchTab('images')">이미지</button>
      <button class="tab" data-tab="seeds" onclick="switchTab('seeds')">시드</button>
      <button class="tab" data-tab="research" onclick="switchTab('research')">리서치</button>
    </div>
    <div class="tab-content" id="tab-images">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <label style="margin-bottom:0;font-size:12px;color:var(--text-dim);font-weight:500">이미지 저장소</label>
        <div style="display:flex;gap:4px">
          <button type="button" class="btn btn-secondary" id="imgUploadBtn" onclick="uploadToLibrary()" style="padding:4px 10px;font-size:11px">+ 업로드</button>
          <button type="button" class="btn btn-secondary" id="imgToggleBtn" onclick="toggleImageLibrary()" style="padding:4px 10px;font-size:11px">접기</button>
        </div>
        <input type="file" id="imgLibFile" accept="image/*" multiple style="display:none">
      </div>
      <div id="imageLibrary" style="display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;max-height:60vh;overflow-y:auto;transition:max-height 0.3s">
      </div>
    </div>
    <div class="tab-content" id="tab-seeds" style="display:none">
      <div class="seed-search-bar">
        <input type="text" id="seedSearch" placeholder="검색..." oninput="filterSeeds()">
        <select id="seedCatFilter" onchange="filterSeeds()">
          <option value="">전체</option>
          <option value="ARCH">ARCH</option>
          <option value="DEBUG">DEBUG</option>
          <option value="GOV">GOV</option>
          <option value="PRODUCT">PRODUCT</option>
          <option value="TEAM">TEAM</option>
          <option value="BIZ">BIZ</option>
        </select>
      </div>
      <div class="seed-list" id="seedList"></div>
    </div>
    <div class="tab-content" id="tab-research" style="display:none">
      <div id="researchHistory" class="research-history"></div>
      <div class="research-search-bar">
        <input type="text" id="researchQuery" placeholder="검색어 입력..." onkeydown="if(event.key==='Enter')doResearch()">
        <button onclick="doResearch()">검색</button>
      </div>
      <div class="research-source-toggle">
        <button class="active" data-src="news" onclick="switchResearchSource('news')">뉴스</button>
        <button data-src="blog" onclick="switchResearchSource('blog')">블로그</button>
        <button data-src="image" onclick="switchResearchSource('image')">이미지</button>
      </div>
      <div id="researchResults" class="research-results">
        <div class="research-loading" style="color:var(--text-dim)">검색어를 입력하세요</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
const API = '/api/admin/blog';
const params = new URLSearchParams(location.search);
const editSlug = params.get('slug');
let isEdit = false;
let currentPublished = false;

// Slug sanitize
document.getElementById('slug').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[\/$#\[\].]/g, '');
});

// Thumbnail upload
async function uploadThumbnail() {
  const fileInput = document.getElementById('thumbFile');
  fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const btn = document.getElementById('thumbUploadBtn');
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const form = new FormData();
      form.append('image', file, file.name);
      const r = await fetch('/api/admin/upload', { method: 'POST', credentials: 'include', body: form });
      const data = await r.json();
      if (data.url) {
        document.getElementById('thumbnail').value = data.url;
        showToast('썸네일 업로드 완료');
      } else {
        showToast('업로드 실패: ' + (data.error || 'Unknown'), true);
      }
    } catch (err) {
      showToast('업로드 에러: ' + err.message, true);
    } finally {
      btn.textContent = '업로드';
      btn.disabled = false;
      fileInput.value = '';
    }
  };
}

// My posts dropdown
async function loadMyPosts() {
  const dd = document.getElementById('myPostsDropdown');
  if (dd.style.display === 'block') { dd.style.display = 'none'; return; }
  dd.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:13px">불러오는 중...</div>';
  dd.style.display = 'block';
  try {
    const r = await fetch(API, { credentials: 'include' });
    const { posts } = await r.json();
    if (!posts || posts.length === 0) {
      dd.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:13px">글이 없습니다</div>';
      return;
    }
    dd.innerHTML = posts.slice(0, 10).map(p =>
      `<a href="/admin/blog-edit.html?slug=${encodeURIComponent(p.slug)}" style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);text-decoration:none">`
      + `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${p.title || '(무제)'}</span>`
      + `<span style="padding:2px 6px;border-radius:4px;font-size:11px;font-weight:500;margin-left:8px;flex-shrink:0;${p.published ? 'background:rgba(52,211,153,.15);color:#059669' : 'background:rgba(136,146,168,.15);color:var(--text-dim)'}">${p.published ? 'Published' : 'Draft'}</span>`
      + `</a>`
    ).join('') + '<a href="/admin/blog-list.html" style="display:block;padding:8px 12px;font-size:12px;color:var(--accent);font-weight:600;text-align:center">전체 목록 &rarr;</a>';
  } catch (err) {
    dd.innerHTML = '<div style="padding:12px;color:var(--danger);font-size:13px">에러: ' + err.message + '</div>';
  }
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('myPostsDropdown');
  if (dd && !e.target.closest('#myPostsBtn') && !e.target.closest('#myPostsDropdown')) dd.style.display = 'none';
});

// Image library
async function loadImageLibrary() {
  const container = document.getElementById('imageLibrary');
  container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:12px;padding:20px">불러오는 중...</div>';
  try {
    const r = await fetch('/api/admin/images', { credentials: 'include' });
    const { images } = await r.json();
    if (!images || images.length === 0) {
      container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:12px;padding:20px">업로드된 이미지가 없습니다</div>';
      return;
    }
    // 날짜별 그룹핑
    const groups = {};
    images.forEach(img => {
      const date = img.created ? img.created.substring(0, 10) : 'unknown';
      if (!groups[date]) groups[date] = [];
      groups[date].push(img);
    });
    container.innerHTML = Object.entries(groups).map(([date, imgs]) => {
      const dateHeader = `<div style="grid-column:1/-1;font-size:11px;color:var(--text-dim);padding:4px 0;border-bottom:1px solid var(--border);margin-top:8px">${date}</div>`;
      const imgCards = imgs.map(img => {
        const escapedUrl = img.url.replace(/'/g, "\\'");
        const escapedName = (img.name || 'image').replace(/'/g, "\\'");
        const tooltip = `${img.name}\n${img.created?.substring(0, 10) || ''}\n${img.size ? (img.size / 1024).toFixed(0) + 'KB' : ''}`;
        return `<div class="img-thumb" style="aspect-ratio:1;overflow:hidden;border-radius:4px;position:relative;cursor:pointer" onclick="showLibraryToolbar(event, '${escapedUrl}', '${escapedName}')" draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '![${escapedName}](${escapedUrl})')" title="${tooltip}"><img src="${img.url}" alt="${img.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover"><button class="img-delete" onclick="event.stopPropagation(); deleteImage('${escapedName}')" title="삭제">&times;</button></div>`;
      }).join('');
      return dateHeader + imgCards;
    }).join('');
  } catch (err) {
    container.innerHTML = '<div style="grid-column:1/-1;color:var(--danger);font-size:12px;padding:20px">이미지 로드 실패</div>';
  }
}

let _isInsertingImage = false;
function insertImage(url, name) {
  if (_isInsertingImage) return;
  _isInsertingImage = true;
  editor.exec('addImage', { imageUrl: url, altText: name || 'image' });
  showToast('이미지 삽입 완료');
  setTimeout(() => { _isInsertingImage = false; updatePreview(); }, 300);
}

async function deleteImage(filename) {
  try {
    const r = await fetch(`/api/admin/images/${encodeURIComponent(filename)}`, {
      method: 'DELETE', credentials: 'include'
    });
    const result = await r.json();

    if (result.warning) {
      const posts = result.usedIn.map(p => `  - ${p.title}`).join('\n');
      const msg = `⚠️ 이 이미지는 ${result.usedIn.length}개 글에서 사용 중입니다:\n${posts}\n\n삭제하면 해당 글에서 이미지가 깨집니다.\n정말 삭제하시겠습니까?`;
      if (!confirm(msg)) return;

      await fetch(`/api/admin/images/${encodeURIComponent(filename)}?force=true`, {
        method: 'DELETE', credentials: 'include'
      });
    }

    showToast('이미지 삭제 완료');
    loadImageLibrary();
  } catch (err) {
    showToast('삭제 실패: ' + err.message, true);
  }
}

function toggleImageLibrary() {
  const lib = document.getElementById('imageLibrary');
  const btn = document.getElementById('imgToggleBtn');
  if (lib.style.maxHeight === '0px') {
    lib.style.maxHeight = '60vh';
    lib.style.overflow = 'auto';
    btn.textContent = '접기';
  } else {
    lib.style.maxHeight = '0px';
    lib.style.overflow = 'hidden';
    btn.textContent = '펼치기';
  }
}

async function uploadToLibrary() {
  const fileInput = document.getElementById('imgLibFile');
  fileInput.click();
  fileInput.onchange = async () => {
    const files = fileInput.files;
    if (!files.length) return;
    const btn = document.getElementById('imgUploadBtn');
    btn.textContent = '업로드 중...';
    btn.disabled = true;
    try {
      for (const file of files) {
        const form = new FormData();
        form.append('image', file, file.name);
        await fetch('/api/admin/upload', { method: 'POST', credentials: 'include', body: form });
      }
      showToast(`${files.length}건 업로드 완료`);
      loadImageLibrary();
    } catch (err) {
      showToast('업로드 에러: ' + err.message, true);
    } finally {
      btn.textContent = '+ 업로드';
      btn.disabled = false;
      fileInput.value = '';
    }
  };
}

// Toast UI Editor — WYSIWYG mode
const editor = new toastui.Editor({
  el: document.getElementById('editor'),
  height: '70vh',
  initialEditType: 'wysiwyg',
  previewStyle: 'tab',
  hooks: {
    addImageBlobHook: async (blob, callback) => {
      try {
        const form = new FormData();
        form.append('image', blob, blob.name || 'image.png');
        const r = await fetch('/api/admin/upload', {
          method: 'POST',
          credentials: 'include',
          body: form,
        });
        const data = await r.json();
        if (data.url) {
          callback(data.url, blob.name || 'image');
          loadImageLibrary(); // refresh library after drag-drop upload
        } else {
          alert('Upload failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Upload error: ' + err.message);
      }
    }
  }
});

// Floating toolbar system
let activeFloatToolbar = null;
let activeFloatAnchor = null;

function removeFloatToolbar() {
  if (activeFloatToolbar) {
    activeFloatToolbar.remove();
    activeFloatToolbar = null;
    activeFloatAnchor = null;
  }
}

function createFloatToolbar(anchorEl, buttons) {
  if (activeFloatAnchor === anchorEl) {
    removeFloatToolbar();
    return;
  }
  removeFloatToolbar();
  const tb = document.createElement('div');
  tb.className = 'img-float-toolbar';
  buttons.forEach(({ label, action }) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = (e) => {
      e.stopPropagation();
      action();
      removeFloatToolbar();
    };
    tb.appendChild(btn);
  });
  document.body.appendChild(tb);
  const rect = anchorEl.getBoundingClientRect();
  const top = rect.top - 40;
  tb.style.top = (top < 8 ? rect.bottom + 4 : top) + 'px';
  tb.style.left = (rect.left + rect.width / 2) + 'px';
  tb.style.transform = 'translateX(-50%)';
  activeFloatToolbar = tb;
  activeFloatAnchor = anchorEl;
}

document.addEventListener('click', (e) => {
  if (activeFloatToolbar && !activeFloatToolbar.contains(e.target)) {
    removeFloatToolbar();
  }
});

function showEditorImageToolbar(img) {
  createFloatToolbar(img, [
    { label: '📌 썸네일 지정', action: () => setThumbnail(img.src) },
    { label: '🗑 삭제', action: () => {
      if (confirm('이 이미지를 삭제하시겠습니까?')) {
        const md = editor.getMarkdown();
        const imgSrc = img.src;
        const escapedSrc = imgSrc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const newMd = md.replace(new RegExp(`!\\[[^\\]]*\\]\\(${escapedSrc}\\)\\n?`), '');
        if (newMd !== md) {
          editor.setMarkdown(newMd);
        } else {
          // fallback: URL path만으로 매칭 시도
          try {
            const path = new URL(imgSrc).pathname;
            const escapedPath = path.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const fallbackMd = md.replace(new RegExp(`!\\[[^\\]]*\\]\\([^)]*${escapedPath}\\)\\n?`), '');
            editor.setMarkdown(fallbackMd);
          } catch { editor.setMarkdown(md); }
        }
        updatePreview();
      }
    }}
  ]);
}

function showLibraryToolbar(e, url, name) {
  e.stopPropagation();
  const thumb = e.currentTarget.querySelector('img') || e.currentTarget;
  createFloatToolbar(thumb, [
    { label: '📝 본문 삽입', action: () => insertImage(url, name) },
    { label: '📌 썸네일 지정', action: () => setThumbnail(url) }
  ]);
}

function setThumbnail(url) {
  document.getElementById('thumbnail').value = url;
  updatePreview();
  markThumbnailInEditor();
  showToast('📌 썸네일 지정 완료');
}

function markThumbnailInEditor() {
  const thumbUrl = document.getElementById('thumbnail').value;
  const wwContainer = document.querySelector('.toastui-editor-ww-container .ProseMirror');
  if (!wwContainer) return;
  wwContainer.querySelectorAll('img').forEach(img => {
    if (thumbUrl && img.src === thumbUrl) {
      img.style.outline = '3px solid #6d28d9';
      img.style.outlineOffset = '-3px';
    } else {
      img.style.outline = '';
      img.style.outlineOffset = '';
    }
  });
}

// Editor body image floating toolbar
editor.on('change', () => {
  const wwContainer = document.querySelector('.toastui-editor-ww-container .ProseMirror');
  if (!wwContainer) return;
  wwContainer.querySelectorAll('img').forEach(img => {
    if (img.dataset.toolbarReady) return;
    img.dataset.toolbarReady = 'true';
    img.style.cursor = 'pointer';
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      showEditorImageToolbar(img);
    });
  });
  markThumbnailInEditor();
  updatePreview();
});

// Preview card
function updatePreview() {
  const title = document.getElementById('title').value || '제목 미입력';
  const summary = document.getElementById('summary').value || '요약 미입력';
  const thumb = document.getElementById('thumbnail').value;
  document.getElementById('previewTitle').textContent = title;
  document.getElementById('previewSummary').textContent = summary;
  const thumbEl = document.getElementById('previewThumb');

  if (thumb) {
    thumbEl.innerHTML = `<img src="${thumb}" style="width:100%;height:100%;object-fit:cover">`;
    return;
  }

  // 1차: WYSIWYG HTML에서 직접 img 태그 추출
  const wwContainer = document.querySelector('.toastui-editor-ww-container .ProseMirror');
  if (wwContainer) {
    const firstImg = wwContainer.querySelector('img');
    if (firstImg && firstImg.src) {
      thumbEl.innerHTML = `<img src="${firstImg.src}" style="width:100%;height:100%;object-fit:cover">`;
      return;
    }
  }

  // 2차: 마크다운에서 추출 (fallback)
  const content = editor.getMarkdown();
  const match = content.match(/!\[.*?\]\((.*?)\)/);
  if (match) {
    thumbEl.innerHTML = `<img src="${match[1]}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    thumbEl.innerHTML = '<span style="color:var(--text-dim);font-size:11px">썸네일 없음</span>';
  }
}

// Image library drag-to-editor (capture phase to intercept before ProseMirror)
const editorEl = document.querySelector('.toastui-editor-ww-container');
if (editorEl) {
  editorEl.addEventListener('drop', (e) => {
    const text = e.dataTransfer.getData('text/plain');
    if (text && text.startsWith('![')) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      const match = text.match(/!\[(.*?)\]\((.*?)\)/);
      if (match) {
        insertImage(match[2], match[1]);
      }
    }
  }, true);
}

// Preview event bindings
document.getElementById('title').addEventListener('input', updatePreview);
document.getElementById('summary').addEventListener('input', updatePreview);
document.getElementById('thumbnail').addEventListener('input', updatePreview);

// Auto-generate slug from title
document.getElementById('title').addEventListener('input', (e) => {
  if (!isEdit) {
    const slug = e.target.value
      .toLowerCase()
      .replace(/[^\w\s가-힣ぁ-んァ-ヶ一-龥-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '')
      .substring(0, 100);
    document.getElementById('slug').value = slug;
  }
});

// Load existing post
async function loadPost() {
  if (!editSlug) return;
  isEdit = true;
  document.getElementById('pageTitle').textContent = 'Edit Post';

  try {
    const r = await fetch(`${API}/${encodeURIComponent(editSlug)}`, { credentials: 'include' });
    if (r.status === 401) { location.href = '/admin/'; return; }
    if (!r.ok) { showToast('Post not found', true); return; }

    const post = await r.json();
    document.getElementById('title').value = post.title || '';
    document.getElementById('slug').value = post.slug || '';
    document.getElementById('slug').readOnly = true;
    document.getElementById('summary').value = post.summary || '';
    document.getElementById('tags').value = (post.tags || []).join(', ');
    document.getElementById('thumbnail').value = post.thumbnail || '';
    document.getElementById('lang').value = post.lang || 'ko';
    document.getElementById('category').value = post.category || '';
    document.getElementById('pinned').checked = post.pinned || false;
    currentPublished = post.published || false;
    editor.setMarkdown(post.content || '');
    setTimeout(() => { updatePreview(); updateShareButtons(); }, 100);
  } catch (err) {
    showToast('Load failed: ' + err.message, true);
  }
}

async function save(published) {
  const title = document.getElementById('title').value.trim();
  const content = editor.getMarkdown();
  if (!title) { showToast('Title is required', true); return; }
  if (!content) { showToast('Content is required', true); return; }

  // 썸네일 미지정 시 본문 첫 이미지 자동 추출
  let thumbnail = document.getElementById('thumbnail').value.trim();
  if (!thumbnail) {
    // WYSIWYG DOM에서 직접 추출
    const wwContainer = document.querySelector('.toastui-editor-ww-container .ProseMirror');
    if (wwContainer) {
      const firstImg = wwContainer.querySelector('img');
      if (firstImg && firstImg.src) {
        thumbnail = firstImg.src;
      }
    }
    // fallback: 마크다운
    if (!thumbnail) {
      const imgMatch = content.match(/!\[.*?\]\((.*?)\)/);
      if (imgMatch) thumbnail = imgMatch[1];
    }
    if (thumbnail) {
      document.getElementById('thumbnail').value = thumbnail;
      updatePreview();
    }
  }

  const body = {
    title,
    slug: document.getElementById('slug').value.trim(),
    content,
    summary: document.getElementById('summary').value.trim(),
    tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
    thumbnail,
    lang: document.getElementById('lang').value,
    category: document.getElementById('category').value,
    pinned: document.getElementById('pinned').checked,
    published,
    author: 'MONKOS',
  };

  try {
    const url = isEdit ? `${API}/${encodeURIComponent(editSlug)}` : API;
    const method = isEdit ? 'PUT' : 'POST';
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body),
    });

    if (r.status === 401) { location.href = '/admin/'; return; }
    const data = await r.json();

    if (r.ok) {
      currentPublished = published;
      updateShareButtons();
      showToast(published ? 'Published!' : 'Draft saved!');
      if (!isEdit && data.slug) {
        history.replaceState(null, '', `/admin/blog-edit.html?slug=${encodeURIComponent(data.slug)}`);
        isEdit = true;
        document.getElementById('slug').readOnly = true;
        document.getElementById('pageTitle').textContent = 'Edit Post';
      }
    } else {
      showToast(data.error || 'Save failed', true);
    }
  } catch (err) {
    showToast('Error: ' + err.message, true);
  }
}

function preview() {
  const slug = document.getElementById('slug').value.trim();
  if (slug) window.open(`/blog/${slug}`, '_blank');
  else showToast('Save first to preview', true);
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--success)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Share buttons
function getShareUrl() {
  const slug = document.getElementById('slug').value.trim();
  const lang = document.getElementById('lang').value;
  if (!slug) return '';
  const prefix = lang === 'ko' ? '' : `/${lang}`;
  return `https://monkos.ai${prefix}/blog/${slug}`;
}

function updateShareButtons() {
  const section = document.getElementById('shareSection');
  const url = getShareUrl();
  const title = document.getElementById('title').value.trim();
  if (currentPublished && url) {
    section.classList.remove('disabled');
    document.getElementById('shareX').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
    document.getElementById('shareLine').href = `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}`;
    document.getElementById('shareKakao').href = `https://story.kakao.com/share?url=${encodeURIComponent(url)}`;
  } else {
    section.classList.add('disabled');
  }
}

function copyShareLink() {
  const url = getShareUrl();
  if (url) { navigator.clipboard.writeText(url); showToast('링크 복사 완료'); }
}

function copyShareFull() {
  const url = getShareUrl();
  const title = document.getElementById('title').value.trim();
  if (url && title) { navigator.clipboard.writeText(`${title}\n${url}`); showToast('제목+URL 복사 완료'); }
}

// Tab switching
function switchTab(tabName) {
  document.querySelectorAll('.sidebar-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
  document.querySelectorAll('.tab-content').forEach(tc => tc.style.display = 'none');
  const target = document.getElementById('tab-' + tabName);
  if (target) target.style.display = '';
}

// ===== Research tab =====
let researchSource = 'news';
let researchPage = 1;
let researchQuery = '';
let researchResults = { news: [], blog: [], image: [] };

function getSearchHistory() {
  try { return JSON.parse(localStorage.getItem('monkos_research_history') || '[]'); } catch { return []; }
}
function saveSearchHistory(query) {
  let history = getSearchHistory().filter(q => q !== query);
  history.unshift(query);
  history = history.slice(0, 5);
  localStorage.setItem('monkos_research_history', JSON.stringify(history));
  renderSearchHistory();
}
function renderSearchHistory() {
  const el = document.getElementById('researchHistory');
  const history = getSearchHistory();
  if (history.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = history.map(q =>
    `<span class="research-history-item" onclick="document.getElementById('researchQuery').value='${q.replace(/'/g,"\\'")}';doResearch()">${q}</span>`
  ).join('');
}

function switchResearchSource(src) {
  researchSource = src;
  document.querySelectorAll('.research-source-toggle button').forEach(b => b.classList.toggle('active', b.dataset.src === src));
  researchPage = 1;
  if (researchQuery) doResearch();
}

async function doResearch(append) {
  const q = document.getElementById('researchQuery').value.trim();
  if (!q) return;
  researchQuery = q;
  if (!append) researchPage = 1;
  saveSearchHistory(q);

  const container = document.getElementById('researchResults');
  if (!append) container.innerHTML = '<div class="research-loading">검색 중...</div>';

  try {
    const start = (researchPage - 1) * 10 + 1;
    const r = await fetch(`/api/admin/search?query=${encodeURIComponent(q)}&type=${researchSource}&start=${start}&display=10`, { credentials: 'include' });
    const data = await r.json();

    if (!r.ok) {
      container.innerHTML = `<div class="research-loading" style="color:var(--danger)">${data.error || '검색 실패'}</div>`;
      return;
    }

    if (!append) researchResults[researchSource] = [];
    researchResults[researchSource] = researchResults[researchSource].concat(data.items || []);

    renderResearchResults(data.total);
  } catch (err) {
    container.innerHTML = `<div class="research-loading" style="color:var(--danger)">오류: ${err.message}</div>`;
  }
}

function renderResearchResults(total) {
  const container = document.getElementById('researchResults');
  const items = researchResults[researchSource];

  if (!items || items.length === 0) {
    container.innerHTML = '<div class="research-loading">검색 결과가 없습니다</div>';
    return;
  }

  if (researchSource === 'image') {
    container.innerHTML = '<div class="research-copyright">저작권 주의: 오픈소스/CC 라이선스를 반드시 확인하세요. 이미지는 참조용이며 자동 저장되지 않습니다.</div>'
      + '<div class="research-img-grid">'
      + items.map((item, i) =>
        `<div class="research-img-item" onclick="showResearchImagePopup('${item.thumbnail || item.link}', '${(item.link || '').replace(/'/g,"\\'")}')"><img src="${item.thumbnail || item.link}" alt="${item.title}" loading="lazy"></div>`
      ).join('')
      + '</div>';
  } else {
    container.innerHTML = items.map(item => {
      const domain = extractDomain(item.link);
      const date = item.pubDate ? formatDate(item.pubDate) : '';
      return `<div class="research-item">
        <div class="research-item-title">${item.title}</div>
        <div class="research-item-meta">${date}${date && domain ? ' · ' : ''}${domain}</div>
        <div class="research-item-desc">${item.description}</div>
        <div class="research-item-actions">
          <button onclick="window.open('${item.link}','_blank')">열기 ↗</button>
          <button onclick="copyResearchRef('${item.title.replace(/'/g,"\\'")}', '${item.link}')">참조 📋</button>
        </div>
      </div>`;
    }).join('');
  }

  if (total && items.length < total) {
    container.innerHTML += `<button class="research-more" onclick="researchPage++;doResearch(true)">더보기... (${items.length}/${total})</button>`;
  }
}

function showResearchImagePopup(imgUrl, sourceUrl) {
  const popup = document.createElement('div');
  popup.className = 'research-img-popup';
  popup.onclick = () => popup.remove();
  popup.innerHTML = `<img src="${imgUrl}" onclick="event.stopPropagation()"><div class="research-img-popup-src">${sourceUrl}</div>`;
  document.body.appendChild(popup);
}

function copyResearchRef(title, url) {
  navigator.clipboard.writeText(`${title}\n${url}`);
  showToast('참조 복사 완료');
}

function extractDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch { return ''; }
}

function formatDate(dateStr) {
  try {
    const d = new Date(dateStr);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  } catch { return dateStr; }
}

renderSearchHistory();

// Title auto-suggest for research
let suggestTimeout = null;
document.getElementById('title').addEventListener('input', (e) => {
  if (suggestTimeout) clearTimeout(suggestTimeout);
  const title = e.target.value.trim();
  if (!title || title.length < 4) return;
  suggestTimeout = setTimeout(() => {
    const keywords = title.replace(/[^\w\s가-힣ぁ-んァ-ヶ一-龥]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!keywords) return;
    showResearchSuggest(keywords);
  }, 1500);
});

function showResearchSuggest(keywords) {
  let toast = document.getElementById('researchSuggestToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'researchSuggestToast';
    toast.className = 'research-suggest-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = '\uD83D\uDD0D "' + keywords.substring(0, 20) + (keywords.length > 20 ? '...' : '') + '" 리서치 검색';
  toast.onclick = () => {
    toast.classList.remove('show');
    document.getElementById('researchQuery').value = keywords;
    switchTab('research');
    doResearch();
  };
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 5000);
}

// Seed catalog
let seedCatalog = [];

async function loadSeedCatalog() {
  try {
    const r = await fetch('/admin/data/episode_catalog.json');
    seedCatalog = await r.json();
    renderSeeds(seedCatalog);
  } catch (err) {
    document.getElementById('seedList').innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:12px;padding:20px">카탈로그 로드 실패</div>';
  }
}

function filterSeeds() {
  const query = document.getElementById('seedSearch').value.toLowerCase();
  const cat = document.getElementById('seedCatFilter').value;
  const filtered = seedCatalog.filter(ep => {
    if (cat && ep.category !== cat) return false;
    if (query) {
      const text = (ep.title + ' ' + ep.summary + ' ' + ep.insight).toLowerCase();
      if (!text.includes(query)) return false;
    }
    return true;
  });
  renderSeeds(filtered);
}

function renderSeeds(episodes) {
  const sorted = [...episodes].sort((a, b) => b.blogScore - a.blogScore);
  const list = document.getElementById('seedList');
  if (sorted.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:12px;padding:20px">결과 없음</div>';
    return;
  }
  list.innerHTML = sorted.map(ep => {
    const stars = '\u2605'.repeat(ep.blogScore);
    return `<div class="seed-item${ep.used ? ' used' : ''}" onclick="showSeedDetail('${ep.id}')">
      <div class="seed-item-header">
        <span class="seed-score">${stars}</span>
        <span class="seed-id">${ep.id}</span>
        <span class="seed-cat ${ep.category}">${ep.category}</span>
      </div>
      <div class="seed-title">${ep.title}</div>
      <div class="seed-insight">${ep.insight}</div>
    </div>`;
  }).join('');
}

function showSeedDetail(id) {
  const ep = seedCatalog.find(e => e.id === id);
  if (!ep) return;
  const stars = '\u2605'.repeat(ep.blogScore) + '\u2606'.repeat(5 - ep.blogScore);
  const rstars = '\u2605'.repeat(ep.researchScore) + '\u2606'.repeat(5 - ep.researchScore);
  const overlay = document.createElement('div');
  overlay.className = 'seed-popup-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="seed-popup">
    <h3>${ep.title}</h3>
    <div class="seed-popup-meta">
      <span class="seed-cat ${ep.category}" style="font-size:12px;padding:2px 8px">${ep.category}</span>
      <span>${ep.id}</span>
      <span>${ep.period}</span>
    </div>
    <div class="seed-popup-field">
      <label>요약</label>
      <p>${ep.summary}</p>
    </div>
    <div class="seed-popup-field">
      <label>핵심 인사이트</label>
      <p>${ep.insight}</p>
    </div>
    <div class="seed-popup-field">
      <label>적합도</label>
      <p>블로그 ${stars} &nbsp; 연구서 ${rstars}</p>
    </div>
    <div class="seed-popup-actions">
      <button class="btn btn-secondary btn-sm" onclick="this.closest('.seed-popup-overlay').remove()">닫기</button>
      <button class="btn btn-success btn-sm" onclick="useSeedAsContent('${ep.id}')">글감으로 사용</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function useSeedAsContent(id) {
  const ep = seedCatalog.find(e => e.id === id);
  if (!ep) return;
  const titleEl = document.getElementById('title');
  if (!titleEl.value.trim()) {
    titleEl.value = ep.title;
    titleEl.dispatchEvent(new Event('input'));
  }
  document.querySelector('.seed-popup-overlay')?.remove();
  showToast('글감 삽입 완료');
}

loadPost();
loadImageLibrary();
loadSeedCatalog();
