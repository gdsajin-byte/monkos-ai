<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Editor — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f5f5; --surface: #ffffff; --surface2: #fafafa;
  --accent: #6d28d9; --accent2: #4f46e5;
  --text: #334155; --text-dim: #64748b; --text-bright: #0f172a;
  --border: rgba(0, 0, 0, 0.1); --border-hover: rgba(109, 40, 217, 0.3);
  --success: #059669; --danger: #dc2626;
}
body { font-family: 'Pretendard', 'Noto Sans JP', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.nav-logo { font-size: 20px; font-weight: 700; color: var(--text-bright); letter-spacing: 2px; }
.nav-back { font-size: 14px; color: var(--text-dim); }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

.form-row { margin-bottom: 16px; }
.form-row label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.editor-wrap { margin-bottom: 16px; }
#editor { min-height: 400px; }

/* Toast UI dark override */
.toastui-editor-defaultUI { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toastui-editor-defaultUI .toastui-editor-md-container { background: var(--surface); }
.toastui-editor-defaultUI .toastui-editor-md-container .toastui-editor-md-preview { background: var(--surface2); }
.ProseMirror { color: var(--text); }

.btn-group { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.btn {
  padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-success { background: var(--success); color: var(--bg); }
.btn-preview { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 24px;
  background: var(--success); color: var(--bg); border-radius: 8px;
  font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s;
  z-index: 1000;
}
.toast.show { opacity: 1; }

.title-row { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.title-row h1 { font-size: 22px; font-weight: 700; color: var(--text-bright); }

.meta-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); color: var(--text-dim); font-size: 13px;
  cursor: pointer; margin-bottom: 12px; user-select: none;
}
.meta-toggle:hover { border-color: var(--accent); color: var(--accent); }
.meta-panel { overflow: hidden; transition: max-height 0.3s ease; }
.meta-panel.collapsed { max-height: 0 !important; }
</style>
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="position:relative">
      <button id="myPostsBtn" onclick="loadMyPosts()" style="padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text-dim);font-size:13px;cursor:pointer">내 글 목록 ▾</button>
      <div id="myPostsDropdown" style="display:none;position:absolute;top:36px;right:0;width:320px;max-height:400px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:50"></div>
    </div>
    <a href="/admin/blog-list.html" class="nav-back">&larr; Blog List</a>
  </div>
</nav>

<div class="container">
  <div class="title-row">
    <h1 id="pageTitle">New Post</h1>
  </div>

  <div class="form-row">
    <label>Title</label>
    <input type="text" id="title" placeholder="Enter post title">
  </div>

  <button class="meta-toggle" id="metaToggle" onclick="toggleMeta()">설정 펼치기 ▼</button>
  <div class="meta-panel collapsed" id="metaPanel">

  <div class="form-grid">
    <div class="form-row">
      <label>URL 주소</label>
      <input type="text" id="slug" placeholder="제목에서 자동 생성됩니다 (수정 가능)">
      <span style="font-size:11px;color:var(--text-dim);margin-top:4px;display:block">블로그 주소에 사용됩니다. 특수문자($ / 등)는 사용할 수 없습니다.</span>
    </div>
    <div class="form-row">
      <label>Language</label>
      <select id="lang">
        <option value="ko">Korean (ko)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="en">English (en)</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <label>Summary (meta description, max 160 chars)</label>
    <textarea id="summary" rows="2" maxlength="160" placeholder="Brief summary for SEO"></textarea>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label>Category</label>
      <select id="category">
        <option value="">-- 선택 --</option>
        <option value="증명사진">증명사진</option>
        <option value="여권·비자">여권·비자</option>
        <option value="취업·이력서">취업·이력서</option>
        <option value="헤어·메이크업">헤어·메이크업</option>
        <option value="news">뉴스 (News)</option>
      </select>
    </div>
    <div class="form-row" style="display:flex;align-items:center;gap:8px;padding-top:22px">
      <input type="checkbox" id="pinned" style="width:auto;accent-color:var(--accent)">
      <label for="pinned" style="margin-bottom:0;cursor:pointer">매거진 영역 고정 (Pinned)</label>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags" placeholder="passport, photo, guide">
    </div>
    <div class="form-row">
      <label>Thumbnail</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="thumbnail" placeholder="https://storage.googleapis.com/..." style="flex:1">
        <button type="button" class="btn btn-secondary" id="thumbUploadBtn" onclick="uploadThumbnail()" style="padding:10px 14px;white-space:nowrap">업로드</button>
        <input type="file" id="thumbFile" accept="image/*" style="display:none">
      </div>
    </div>
  </div>

  </div><!-- /metaPanel -->

  <div class="editor-wrap">
    <label style="display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500">Content</label>
    <div id="editor"></div>
  </div>

  <div class="btn-group">
    <button class="btn btn-secondary" onclick="save(false)">Save Draft</button>
    <button class="btn btn-success" onclick="save(true)">Publish</button>
    <button class="btn btn-preview" onclick="preview()">Preview</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
const API = '/api/admin/blog';
const params = new URLSearchParams(location.search);
const editSlug = params.get('slug');
let isEdit = false;

// Meta panel toggle
function toggleMeta() {
  const panel = document.getElementById('metaPanel');
  const btn = document.getElementById('metaToggle');
  panel.classList.toggle('collapsed');
  btn.textContent = panel.classList.contains('collapsed') ? '설정 펼치기 ▼' : '설정 접기 ▲';
}

// Slug sanitize (remove $, /, and other invalid chars)
document.getElementById('slug').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[\/$#\[\].]/g, '');
});

// Thumbnail upload
async function uploadThumbnail() {
  const fileInput = document.getElementById('thumbFile');
  fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const btn = document.getElementById('thumbUploadBtn');
    btn.textContent = '업로드 중...';
    btn.disabled = true;
    try {
      const form = new FormData();
      form.append('image', file, file.name);
      const r = await fetch('/api/admin/upload', { method: 'POST', credentials: 'include', body: form });
      const data = await r.json();
      if (data.url) {
        document.getElementById('thumbnail').value = data.url;
        showToast('썸네일 업로드 완료');
      } else {
        showToast('업로드 실패: ' + (data.error || 'Unknown'), true);
      }
    } catch (err) {
      showToast('업로드 에러: ' + err.message, true);
    } finally {
      btn.textContent = '업로드';
      btn.disabled = false;
      fileInput.value = '';
    }
  };
}

// My posts dropdown
async function loadMyPosts() {
  const dd = document.getElementById('myPostsDropdown');
  if (dd.style.display === 'block') { dd.style.display = 'none'; return; }
  dd.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:13px">불러오는 중...</div>';
  dd.style.display = 'block';
  try {
    const r = await fetch(API, { credentials: 'include' });
    const { posts } = await r.json();
    if (!posts || posts.length === 0) {
      dd.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:13px">글이 없습니다</div>';
      return;
    }
    dd.innerHTML = posts.slice(0, 10).map(p =>
      `<a href="/admin/blog-edit.html?slug=${encodeURIComponent(p.slug)}" style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);text-decoration:none">`
      + `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${p.title || '(무제)'}</span>`
      + `<span style="padding:2px 6px;border-radius:4px;font-size:11px;font-weight:500;margin-left:8px;flex-shrink:0;${p.published ? 'background:rgba(52,211,153,.15);color:#059669' : 'background:rgba(136,146,168,.15);color:var(--text-dim)'}">${p.published ? 'Published' : 'Draft'}</span>`
      + `</a>`
    ).join('') + '<a href="/admin/blog-list.html" style="display:block;padding:8px 12px;font-size:12px;color:var(--accent);font-weight:600;text-align:center">전체 목록 &rarr;</a>';
  } catch (err) {
    dd.innerHTML = '<div style="padding:12px;color:var(--danger);font-size:13px">에러: ' + err.message + '</div>';
  }
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('myPostsDropdown');
  if (dd && !e.target.closest('#myPostsBtn') && !e.target.closest('#myPostsDropdown')) dd.style.display = 'none';
});

// Toast UI Editor
const editor = new toastui.Editor({
  el: document.getElementById('editor'),
  height: '70vh',
  initialEditType: 'markdown',
  previewStyle: 'vertical',
  hooks: {
    addImageBlobHook: async (blob, callback) => {
      try {
        const form = new FormData();
        form.append('image', blob, blob.name || 'image.png');
        const r = await fetch('/api/admin/upload', {
          method: 'POST',
          credentials: 'include',
          body: form,
        });
        const data = await r.json();
        if (data.url) {
          callback(data.url, blob.name || 'image');
        } else {
          alert('Upload failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Upload error: ' + err.message);
      }
    }
  }
});

// Auto-generate slug from title
document.getElementById('title').addEventListener('input', (e) => {
  if (!isEdit) {
    const slug = e.target.value
      .toLowerCase()
      .replace(/[^\w\s가-힣ぁ-んァ-ヶ一-龥-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '')
      .substring(0, 100);
    document.getElementById('slug').value = slug;
  }
});

// Load existing post for editing
async function loadPost() {
  if (!editSlug) {
    // 신규 글: 메타 패널 펼침
    document.getElementById('metaPanel').classList.remove('collapsed');
    document.getElementById('metaToggle').textContent = '설정 접기 ▲';
    return;
  }
  isEdit = true;
  document.getElementById('pageTitle').textContent = 'Edit Post';

  try {
    const r = await fetch(`${API}/${encodeURIComponent(editSlug)}`, { credentials: 'include' });
    if (r.status === 401) { location.href = '/admin/'; return; }
    if (!r.ok) { showToast('Post not found', true); return; }

    const post = await r.json();
    document.getElementById('title').value = post.title || '';
    document.getElementById('slug').value = post.slug || '';
    document.getElementById('slug').readOnly = true;
    document.getElementById('summary').value = post.summary || '';
    document.getElementById('tags').value = (post.tags || []).join(', ');
    document.getElementById('thumbnail').value = post.thumbnail || '';
    document.getElementById('lang').value = post.lang || 'ko';
    document.getElementById('category').value = post.category || '';
    document.getElementById('pinned').checked = post.pinned || false;
    editor.setMarkdown(post.content || '');
  } catch (err) {
    showToast('Load failed: ' + err.message, true);
  }
}

async function save(published) {
  const title = document.getElementById('title').value.trim();
  const content = editor.getMarkdown();
  if (!title) { showToast('Title is required', true); return; }
  if (!content) { showToast('Content is required', true); return; }

  const body = {
    title,
    slug: document.getElementById('slug').value.trim(),
    content,
    summary: document.getElementById('summary').value.trim(),
    tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
    thumbnail: document.getElementById('thumbnail').value.trim(),
    lang: document.getElementById('lang').value,
    category: document.getElementById('category').value,
    pinned: document.getElementById('pinned').checked,
    published,
    author: 'MONKOS',
  };

  try {
    const url = isEdit ? `${API}/${encodeURIComponent(editSlug)}` : API;
    const method = isEdit ? 'PUT' : 'POST';
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body),
    });

    if (r.status === 401) { location.href = '/admin/'; return; }
    const data = await r.json();

    if (r.ok) {
      showToast(published ? 'Published!' : 'Draft saved!');
      if (!isEdit && data.slug) {
        // 생성 후 편집 모드로 전환
        history.replaceState(null, '', `/admin/blog-edit.html?slug=${encodeURIComponent(data.slug)}`);
        isEdit = true;
        document.getElementById('slug').readOnly = true;
        document.getElementById('pageTitle').textContent = 'Edit Post';
      }
    } else {
      showToast(data.error || 'Save failed', true);
    }
  } catch (err) {
    showToast('Error: ' + err.message, true);
  }
}

function preview() {
  const slug = document.getElementById('slug').value.trim();
  if (slug) window.open(`/blog/${slug}`, '_blank');
  else showToast('Save first to preview', true);
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--success)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

loadPost();
</script>
</body>
</html>
