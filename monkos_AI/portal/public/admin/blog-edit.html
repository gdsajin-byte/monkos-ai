<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Editor — MONKOS Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<link rel="stylesheet" href="css/admin-common.css?v=20260322q">
<link rel="stylesheet" href="css/blog-editor.css?v=20260322q">
</head>
<body>

<nav class="nav">
  <a href="/admin/" class="nav-logo">MONKOS Admin</a>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="btn btn-secondary btn-sm" onclick="save(false)">임시저장</button>
    <button class="btn btn-success btn-sm" onclick="save(true)">발행</button>
    <button class="btn btn-preview btn-sm" onclick="preview()">미리보기</button>
    <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
    <div style="position:relative">
      <button id="myPostsBtn" onclick="loadMyPosts()" style="padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text-dim);font-size:13px;cursor:pointer">내 글 목록 ▾</button>
      <div id="myPostsDropdown" style="display:none;position:absolute;top:36px;right:0;width:320px;max-height:400px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:50"></div>
    </div>
    <a href="/admin/blog-list.html" class="nav-back">&larr; Blog List</a>
  </div>
</nav>

<div class="editor-layout">
  <!-- Left: Meta settings -->
  <div class="editor-left">
    <div class="sidebar-section">
      <label>카테고리</label>
      <select id="category">
        <option value="">-- 선택 --</option>
        <option value="사진">사진</option>
        <option value="패션">패션</option>
        <option value="헤어">헤어</option>
        <option value="메이크업">메이크업</option>
        <option value="AI">AI</option>
        <option value="news">News</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="sidebar-section">
      <label>언어</label>
      <select id="lang">
        <option value="ko">Korean (ko)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="en">English (en)</option>
      </select>
    </div>
    <div class="sidebar-section">
      <label>썸네일</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="text" id="thumbnail" placeholder="이미지 URL" style="flex:1">
        <button type="button" class="btn btn-secondary" id="thumbUploadBtn" onclick="uploadThumbnail()" style="padding:6px 10px;font-size:11px;white-space:nowrap">업로드</button>
        <input type="file" id="thumbFile" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="sidebar-section">
      <label>URL 주소</label>
      <input type="text" id="slug" placeholder="자동 생성">
      <span class="sidebar-hint">특수문자($ / 등) 사용 불가</span>
    </div>
    <div class="sidebar-section">
      <label>요약 (SEO)</label>
      <textarea id="summary" rows="3" maxlength="160" placeholder="검색 결과 요약문 (최대 160자)"></textarea>
    </div>
    <div class="sidebar-section">
      <div class="pinned-row">
        <input type="checkbox" id="pinned">
        <label for="pinned">매거진 고정</label>
      </div>
    </div>
    <div class="sidebar-section">
      <label>태그</label>
      <input type="text" id="tags" placeholder="콤마 구분">
    </div>
    <div class="sidebar-section" id="previewCard">
      <label>미리보기</label>
      <div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface2)">
        <div id="previewThumb" style="width:100%;aspect-ratio:1200/630;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <span style="color:var(--text-dim);font-size:11px">썸네일 없음</span>
        </div>
        <div style="padding:8px">
          <div id="previewTitle" style="font-size:13px;font-weight:600;color:var(--text-bright);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">제목 미입력</div>
          <div id="previewSummary" style="font-size:11px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">요약 미입력</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Center: Editor -->
  <div class="editor-main">
    <h1 id="pageTitle" style="font-size:20px;font-weight:700;color:var(--text-bright);margin-bottom:12px">New Post</h1>
    <input type="text" class="title-input" id="title" placeholder="제목을 입력하세요">
    <div class="editor-wrap">
      <div id="editor"></div>
    </div>
    <div class="admin-share disabled" id="shareSection">
      <span class="admin-share-label">공유</span>
      <a id="shareX" href="#" target="_blank" rel="noopener" class="admin-share-btn" title="X">𝕏</a>
      <a id="shareLine" href="#" target="_blank" rel="noopener" class="admin-share-btn" title="LINE">L</a>
      <a id="shareKakao" href="#" target="_blank" rel="noopener" class="admin-share-btn" title="KakaoStory">💬</a>
      <button class="admin-share-btn" onclick="copyShareLink()" title="링크 복사">🔗</button>
      <button class="admin-share-copy-full" onclick="copyShareFull()" title="제목+URL 복사">📋 복사</button>
    </div>
  </div>

  <!-- Right: Tabbed sidebar -->
  <div class="editor-right">
    <div class="sidebar-tabs">
      <button class="tab active" data-tab="images" onclick="switchTab('images')">이미지</button>
      <button class="tab" data-tab="seeds" onclick="switchTab('seeds')">시드</button>
      <button class="tab" data-tab="research" onclick="switchTab('research')">리서치</button>
      <button class="tab" data-tab="ai" onclick="switchTab('ai')">AI</button>
    </div>
    <div class="tab-content" id="tab-images">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <label style="margin-bottom:0;font-size:12px;color:var(--text-dim);font-weight:500">이미지 저장소</label>
        <div style="display:flex;gap:4px">
          <button type="button" class="btn btn-secondary" id="imgUploadBtn" onclick="uploadToLibrary()" style="padding:4px 10px;font-size:11px">+ 업로드</button>
          <button type="button" class="btn btn-secondary" id="imgToggleBtn" onclick="toggleImageLibrary()" style="padding:4px 10px;font-size:11px">접기</button>
        </div>
        <input type="file" id="imgLibFile" accept="image/*" multiple style="display:none">
      </div>
      <div id="imageLibrary">
      </div>
    </div>
    <div class="tab-content" id="tab-seeds" style="display:none">
      <div class="seed-search-bar">
        <input type="text" id="seedSearch" placeholder="검색..." oninput="filterSeeds()">
        <select id="seedCatFilter" onchange="filterSeeds()">
          <option value="">전체</option>
          <option value="ARCH">ARCH</option>
          <option value="DEBUG">DEBUG</option>
          <option value="GOV">GOV</option>
          <option value="PRODUCT">PRODUCT</option>
          <option value="TEAM">TEAM</option>
          <option value="BIZ">BIZ</option>
        </select>
      </div>
      <div class="seed-list" id="seedList"></div>
    </div>
    <div class="tab-content" id="tab-research" style="display:none">
      <div id="researchHistory" class="research-history"></div>
      <div class="research-search-bar">
        <input type="text" id="researchQuery" placeholder="검색어 입력..." onkeydown="if(event.key==='Enter')doResearch()">
        <button onclick="doResearch()">검색</button>
      </div>
      <div class="research-source-toggle">
        <button class="active" data-src="news" onclick="switchResearchSource('news')">뉴스</button>
        <button data-src="blog" onclick="switchResearchSource('blog')">블로그</button>
        <button data-src="image" onclick="switchResearchSource('image')">이미지</button>
      </div>
      <div id="researchResults" class="research-results">
        <div class="research-loading" style="color:var(--text-dim)">검색어를 입력하세요</div>
      </div>
    </div>
    <div class="tab-content" id="tab-ai" style="display:none">
      <!-- AI 이미지 생성 -->
      <div class="ai-section">
        <label class="ai-section-label">AI 이미지 생성</label>
        <div class="ai-style-row">
          <button class="ai-style-btn active" data-style="photo">📷 사진</button>
          <button class="ai-style-btn" data-style="illustration">🎨 일러스트</button>
          <button class="ai-style-btn" data-style="minimal">◻️ 미니멀</button>
          <button class="ai-style-btn" data-style="diagram">📊 다이어그램</button>
        </div>
        <textarea id="aiPromptText" class="ai-prompt-textarea" rows="3" placeholder="프롬프트 (자동생성됨, 수정 가능)"></textarea>
        <div class="ai-btn-row">
          <button id="aiGenerateBtn" class="btn btn-primary btn-sm">🎲 생성</button>
          <button id="aiRegenerateBtn" class="btn btn-secondary btn-sm">🔄 재생성</button>
        </div>
        <div id="aiStatus" class="ai-status"></div>
        <div id="aiImagePreview" class="ai-preview"></div>
        <div id="aiImageActions" class="ai-actions" style="display:none">
          <button id="aiInsertBtn" class="btn btn-primary btn-sm">본문 삽입</button>
          <button id="aiThumbBtn" class="btn btn-secondary btn-sm">📌 썸네일 지정</button>
          <button id="aiDownloadBtn" class="btn btn-secondary btn-sm">⬇ 다운로드</button>
        </div>
      </div>
      <!-- OG 썸네일 -->
      <div class="ai-section ai-section--border">
        <label class="ai-section-label">OG 썸네일</label>
        <div class="ai-radio-row">
          <label><input type="radio" name="ogBgType" value="blur"> 본문 첫 이미지 블러</label>
          <label><input type="radio" name="ogBgType" value="gradient" checked> 브랜드 그래디언트</label>
        </div>
        <button id="ogGenerateBtn" class="btn btn-primary btn-sm">🖼 자동 생성</button>
        <span class="ai-hint">1200×630</span>
        <div id="ogPreview" class="ai-preview"></div>
        <button id="ogApplyBtn" class="btn btn-success btn-sm" style="display:none">썸네일 적용</button>
      </div>
      <!-- SEO 제안 -->
      <div class="ai-section ai-section--border">
        <label class="ai-section-label">SEO 제안</label>
        <button id="seoGenerateBtn" class="btn btn-primary btn-sm">✨ 자동 생성</button>
        <div class="ai-seo-fields">
          <label class="ai-field-label">요약</label>
          <textarea id="seoSummary" rows="2" class="ai-seo-input" placeholder="자동 생성됩니다"></textarea>
          <label class="ai-field-label">태그</label>
          <input id="seoTags" class="ai-seo-input" placeholder="자동 생성됩니다">
        </div>
        <button id="seoApplyBtn" class="btn btn-success btn-sm" style="display:none">적용</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script type="module">
  import { initEditor, setupEditorBindings, loadPost, switchTab } from './js/blog-editor.js';
  import { setupImageHandlers } from './js/blog-image.js';
  import { loadSeedCatalog } from './js/blog-seed.js';
  import { initResearch } from './js/blog-research.js';
  import { initAiTab } from './js/blog-ai.js';
  import './js/blog-share.js';

  // 1. 에디터 초기화 (toastui CDN 로딩 후)
  initEditor();

  // 2. 이벤트 핸들러 셋업
  setupEditorBindings();
  setupImageHandlers();
  initResearch(switchTab);
  initAiTab();

  // 3. 데이터 로딩
  loadPost();
  window.loadImageLibrary();
  loadSeedCatalog();
</script>
</body>
</html>
