<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크레딧 충전 | MONKOS AI</title>
<meta name="description" content="MONKOS AI 크레딧을 충전하고 AI 증명사진 서비스를 이용하세요.">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://js.tosspayments.com/v1/payment"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a1a; --surface: #141428; --surface2: #1a1a35;
  --accent: #a78bfa; --accent2: #818cf8; --accent3: #c084fc;
  --text: #e2e8f0; --text-dim: #8892a8; --text-bright: #f8fafc;
  --border: rgba(167, 139, 250, 0.12); --border-hover: rgba(167, 139, 250, 0.3);
  --success: #34d399; --card-bg: rgba(20, 20, 40, 0.7);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.6; padding: 0 16px;
  min-height: 100vh;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 40px 0 80px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.back { display: inline-block; margin-bottom: 24px; font-size: 0.85rem; }

/* 헤더 */
.page-header { text-align: center; margin-bottom: 32px; }
.page-header h1 { font-size: 1.4rem; color: var(--text-bright); margin-bottom: 4px; }
.page-header .sub { font-size: 0.85rem; color: var(--text-dim); }

/* 잔액 카드 */
.balance-card {
  background: linear-gradient(135deg, rgba(167,139,250,0.15), rgba(129,140,248,0.1));
  border: 1.5px solid var(--border-hover);
  border-radius: 16px; padding: 20px 24px;
  text-align: center; margin-bottom: 28px;
}
.balance-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
.balance-value { font-size: 2rem; font-weight: 800; color: var(--accent); }
.balance-value span { font-size: 0.9rem; font-weight: 600; color: var(--text-dim); margin-left: 4px; }
.balance-user { font-size: 0.78rem; color: var(--text-dim); margin-top: 8px; }

/* 로그인 영역 */
.login-area {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px 24px; text-align: center; margin-bottom: 28px;
}
.login-area p { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 20px; }
.google-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 28px; background: #fff; color: #333;
  border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: box-shadow 0.2s;
}
.google-btn:hover { box-shadow: 0 4px 16px rgba(255,255,255,0.15); }
.google-btn svg { width: 20px; height: 20px; }

/* 패키지 */
.packages { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.pkg {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border: 1.5px solid var(--border);
  background: var(--card-bg); border-radius: 12px;
  cursor: pointer; transition: border-color 0.2s, background 0.2s;
  position: relative;
}
.pkg:hover { border-color: var(--border-hover); }
.pkg.selected { border-color: var(--accent); background: linear-gradient(135deg, rgba(167,139,250,0.18), rgba(124,58,237,0.12)); }
.pkg input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
.pkg-info { flex: 1; display: flex; justify-content: space-between; align-items: center; }
.pkg-name { font-size: 0.92rem; font-weight: 600; color: var(--text); }
.pkg-price { font-size: 0.88rem; font-weight: 600; color: var(--accent); }
.pkg-discount { font-size: 0.7rem; color: var(--success); margin-left: 6px; }
.pkg-desc { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
.pkg-badge {
  position: absolute; top: -8px; right: 12px;
  background: var(--accent); color: #fff; font-size: 0.62rem; font-weight: 700;
  padding: 2px 8px; border-radius: 8px;
}

/* 결제 버튼 */
.pay-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: 14px;
  font-size: 1.05rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 16px rgba(167,139,250,0.25);
  transition: opacity 0.2s;
}
.pay-btn:hover { opacity: 0.92; }
.pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 안내 */
.info-box {
  margin-top: 24px; padding: 16px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px;
}
.info-box h3 { font-size: 0.85rem; color: var(--text); margin-bottom: 8px; }
.info-box li { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; list-style: none; }
.info-box li::before { content: "· "; color: var(--accent); }

/* 토스트 */
.toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  padding: 14px 24px; border-radius: 12px;
  font-size: 0.9rem; font-weight: 600; z-index: 9999;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.success { background: rgba(52,211,153,0.95); color: #0a0a1a; }
.toast.error { background: rgba(239,68,68,0.95); color: #fff; }
.toast.show { opacity: 1; }

/* 로딩 */
.loading-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(10,10,26,0.85); backdrop-filter: blur(4px);
  z-index: 1000; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 0.9rem; color: var(--text-dim); }

footer { text-align: center; padding: 40px 0 20px; border-top: 1px solid rgba(167,139,250,0.08); color: var(--text-dim); font-size: 0.78rem; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">결제 확인 중...</div>
</div>

<div class="wrap">
  <a href="/" class="back">&larr; MONKOS AI</a>

  <div class="page-header">
    <h1>크레딧 충전</h1>
    <p class="sub">MONKOS AI 서비스에서 사용할 크레딧을 충전하세요</p>
  </div>

  <!-- 미로그인 -->
  <div id="loginArea" class="login-area" style="display:none;">
    <p>크레딧 충전을 위해 로그인이 필요합니다</p>
    <button class="google-btn" onclick="googleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
  </div>

  <!-- 로그인 상태 -->
  <div id="mainArea" style="display:none;">
    <div class="balance-card">
      <div class="balance-label">현재 잔액</div>
      <div class="balance-value"><span id="balanceCount">0</span><span>c</span></div>
      <div class="balance-user" id="balanceUser"></div>
    </div>

    <div class="packages" id="packages">
      <!-- JS로 렌더링 -->
    </div>

    <button class="pay-btn" id="payBtn" onclick="startPayment()">토스페이먼츠로 결제</button>

    <div class="info-box">
      <h3>안내</h3>
      <ul>
        <li>AI 증명사진 1장 = 리터칭 10c + 다운로드 70c = 80c</li>
        <li>크레딧 1c = ₩145 (부가세 포함)</li>
        <li>첫 로그인 10c 증정 (리터칭 1회 체험)</li>
        <li>충전한 크레딧은 MONKOS 전 서비스에서 사용 가능</li>
        <li>환불 정책은 <a href="/refund.html">여기</a>를 확인하세요</li>
      </ul>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 <a href="/">MONKOS AI</a> | <a href="/privacy.html">개인정보처리방침</a> | <a href="/terms.html">이용약관</a> | <a href="/refund.html">환불정책</a></p>
  </footer>
</div>

<script>
// === 설정 ===
var TOSS_CLIENT_KEY = 'test_ck_6bJXmgo28eBJk12vvDAW3LAnGKWx';
var GOOGLE_CLIENT_ID = '933456016842-clagcrpo1juvukjif1m454jq811bd2rq.apps.googleusercontent.com';

var PACKAGES = [
  { label: '70 크레딧', amount: 9900, credits: 70, bonus: 10, recommended: true },
  { label: '100 크레딧', amount: 12900, credits: 100, bonus: 30 },
  { label: '300 크레딧', amount: 34900, credits: 300, bonus: 120, best: true },
  { label: '500 크레딧', amount: 49900, credits: 500, bonus: 250 },
];

var selectedIdx = 0;
var currentUser = null;
var returnUrl = null;

// === 초기화 ===
window.addEventListener('DOMContentLoaded', async function() {
  // from 파라미터 → sessionStorage 보존 (Toss 리다이렉트 생존)
  var params = new URLSearchParams(window.location.search);
  var from = params.get('from');
  if (from) {
    sessionStorage.setItem('monkos_credits_from', from);
  }
  returnUrl = sessionStorage.getItem('monkos_credits_from') || null;

  renderPackages();
  await checkAuth();
  handleTossResult();
});

// === 패키지 렌더링 ===
function renderPackages() {
  var container = document.getElementById('packages');
  var html = '';
  for (var i = 0; i < PACKAGES.length; i++) {
    var p = PACKAGES[i];
    var totalC = p.credits + p.bonus;
    var strikePrice = totalC * 145;
    var saved = strikePrice - p.amount;
    var sel = i === 0 ? ' selected' : '';
    var chk = i === 0 ? ' checked' : '';
    var badge = p.recommended ? '<span class="pkg-badge">추천</span>' : '';
    if (p.best) badge = '<span class="pkg-badge" style="background:#f59e0b;">★ BEST</span>';
    var priceHtml = '<span style="text-decoration:line-through;color:#666;font-size:0.75rem;">₩' + strikePrice.toLocaleString() + '</span> <span class="pkg-price">₩' + p.amount.toLocaleString() + '</span>';
    var bonusHtml = p.bonus ? '<div style="font-size:0.72rem;color:#34d399;margin-top:3px;">+' + p.bonus + 'c 보너스 · ₩' + saved.toLocaleString() + '원 절약</div>' : '';
    html += '<label class="pkg' + sel + '" data-idx="' + i + '">' +
      badge +
      '<input type="radio" name="pkg" value="' + i + '"' + chk + '>' +
      '<div style="flex:1;">' +
        '<div class="pkg-info">' +
          '<span class="pkg-name">' + p.label + '</span>' +
          '<span>' + priceHtml + '</span>' +
        '</div>' +
        bonusHtml +
      '</div>' +
    '</label>';
  }
  container.innerHTML = html;

  container.querySelectorAll('.pkg').forEach(function(el) {
    el.addEventListener('click', function() {
      selectedIdx = parseInt(this.dataset.idx);
      container.querySelectorAll('.pkg').forEach(function(p) { p.classList.remove('selected'); });
      this.classList.add('selected');
    });
  });
}

// === 인증 ===
async function checkAuth() {
  try {
    var res = await fetch('/api/auth/verify-cookie', {
      credentials: 'include',
    });
    if (res.ok) {
      var data = await res.json();
      if (data.user && data.user.id) {
        currentUser = data.user;
        showLoggedIn(data.user);
        fetchBalance(data.user.id);
        return;
      }
    }
  } catch (e) {
    console.log('인증 실패');
  }
  showLogin();
}

function showLogin() {
  document.getElementById('loginArea').style.display = '';
  document.getElementById('mainArea').style.display = 'none';
}

function showLoggedIn(user) {
  document.getElementById('loginArea').style.display = 'none';
  document.getElementById('mainArea').style.display = '';
  document.getElementById('balanceUser').textContent = user.email || user.name || '';
}

function fetchBalance(userId) {
  fetch('/api/credits?userId=' + encodeURIComponent(userId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.credits !== undefined) {
        document.getElementById('balanceCount').textContent = data.credits;
        if (currentUser) {
          currentUser.credits = data.credits;
        }
      }
    })
    .catch(function() {});
}

function googleLogin() {
  var client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'email profile',
    callback: function(resp) {
      if (resp.error || !resp.access_token) return;
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: resp.access_token }),
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success && data.user) {
          currentUser = data.user;
          showLoggedIn(data.user);
          document.getElementById('balanceCount').textContent = data.user.credits || 0;
          if (data.isNewUser) {
            showToast('가입 완료! 10c 보너스가 지급되었습니다', 'success');
          }
        }
      })
      .catch(function() { showToast('로그인 실패', 'error'); });
    },
  });
  client.requestAccessToken();
}

// === 결제 ===
function startPayment() {
  if (!currentUser || !currentUser.id) {
    showToast('로그인이 필요합니다', 'error');
    return;
  }

  if (!TOSS_CLIENT_KEY) {
    showToast('결제 시스템 준비 중입니다', 'error');
    return;
  }

  var pkg = PACKAGES[selectedIdx];
  var orderId = 'MONKOS_' + currentUser.id.slice(0, 8) + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  try {
    var tossPayments = TossPayments(TOSS_CLIENT_KEY);

    tossPayments.requestPayment('카드', {
      amount: pkg.amount,
      orderId: orderId,
      orderName: 'MONKOS ' + (pkg.credits + pkg.bonus) + ' 크레딧',
      successUrl: window.location.origin + '/credits?toss=success',
      failUrl: window.location.origin + '/credits?toss=fail',
      customerEmail: currentUser.email || undefined,
      customerName: currentUser.name || undefined,
    });
  } catch (err) {
    if (err.code !== 'PAY_PROCESS_CANCELED' && err.code !== 'USER_CANCEL') {
      showToast('결제 오류: ' + (err.message || err.code), 'error');
    }
  }
}

// === 토스 결과 처리 ===
function handleTossResult() {
  var params = new URLSearchParams(window.location.search);

  if (params.get('toss') === 'fail') {
    var msg = params.get('message') || '결제가 취소되었습니다';
    history.replaceState({}, '', '/credits');
    showToast(msg, 'error');
    return;
  }

  if (params.get('toss') === 'success') {
    var paymentKey = params.get('paymentKey');
    var orderId = params.get('orderId');
    var amount = params.get('amount');

    if (!paymentKey || !orderId || !amount) {
      history.replaceState({}, '', '/credits');
      showToast('결제 정보가 올바르지 않습니다', 'error');
      return;
    }

    showLoading(true);
    history.replaceState({}, '', '/credits');

    var userId = (currentUser && currentUser.id) ? currentUser.id : '';

    fetch('/api/payments/toss/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        paymentKey: paymentKey,
        orderId: orderId,
        amount: parseInt(amount),
        userId: userId,
      }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      showLoading(false);
      if (data.success) {
        document.getElementById('balanceCount').textContent = data.credits || 0;
        if (currentUser) {
          currentUser.credits = data.credits;
        }
        showToast('+' + (data.creditsAdded || '') + 'c 충전 완료!', 'success');
        returnToService();
      } else {
        showToast('결제 확인 실패: ' + (data.error || ''), 'error');
      }
    })
    .catch(function(err) {
      showLoading(false);
      showToast('결제 확인 중 오류가 발생했습니다', 'error');
    });
  }
}

// === 서비스 복귀 ===
function isSafeReturnUrl(url) {
  try {
    var u = new URL(url, window.location.origin);
    var allowed = ['monkos.ai', 'www.monkos.ai', 'monk.kr', 'www.monk.kr',
                   'idphoto-kr.monkos.ai', 'idphoto-jp.monkos.ai'];
    if (u.hostname === 'localhost' || u.hostname === '127.0.0.1') return true;
    return allowed.indexOf(u.hostname) !== -1 && (u.protocol === 'https:' || u.protocol === 'http:');
  } catch(e) { return false; }
}

function returnToService() {
  if (!returnUrl || !isSafeReturnUrl(returnUrl)) return;
  // 충전 완료 후 복귀 버튼 표시 + 3초 자동 이동
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;padding:16px 20px;background:linear-gradient(135deg,#a78bfa,#818cf8);text-align:center;z-index:9999;';
  var link = document.createElement('a');
  link.href = returnUrl;
  link.style.cssText = 'color:#fff;font-weight:700;font-size:0.95rem;text-decoration:none;';
  link.textContent = '서비스로 돌아가기 ';
  var countdown = document.createElement('span');
  countdown.id = 'returnCountdown';
  countdown.textContent = '3';
  link.appendChild(countdown);
  link.appendChild(document.createTextNode('초'));
  bar.appendChild(link);
  document.body.appendChild(bar);
  var sec = 3;
  var timer = setInterval(function() {
    sec--;
    var cd = document.getElementById('returnCountdown');
    if (cd) cd.textContent = sec;
    if (sec <= 0) {
      clearInterval(timer);
      sessionStorage.removeItem('monkos_credits_from');
      window.location.href = returnUrl;
    }
  }, 1000);
  // 클릭 시 즉시 이동
  link.addEventListener('click', function(e) {
    e.preventDefault();
    clearInterval(timer);
    sessionStorage.removeItem('monkos_credits_from');
    window.location.href = returnUrl;
  });
}

// === UI 유틸 ===
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'success') + ' show';
  setTimeout(function() { el.classList.remove('show'); }, 3500);
}

function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('show', show);
}
</script>
</body>
</html>
