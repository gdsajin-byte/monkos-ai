<meta charset="UTF-8">

<title>MONKOS AI — 감사합니다</title>
<meta name="description" content="MONKOS AI를 이용해주셔서 감사합니다.">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<!-- 폰트 -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a1a;
  --surface: #141428;
  --accent: #a78bfa;
  --accent2: #818cf8;
  --text: #e2e8f0;
  --text-dim: #8892a8;
  --text-bright: #f8fafc;
  --border: rgba(167, 139, 250, 0.12);
  --success: #34d399;
}

body {
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bg-glow {
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 600px;
  background: radial-gradient(ellipse, rgba(167,139,250,0.1) 0%, rgba(129,140,248,0.04) 40%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 40px 24px;
  max-width: 480px;
  width: 100%;
}

.check-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(52, 211, 153, 0.1);
  border: 2px solid var(--success);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
  animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop-in {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.check-icon svg {
  width: 36px;
  height: 36px;
  stroke: var(--success);
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 12px;
}

.subtitle {
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 32px;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  text-decoration: none;
  transition: opacity 0.2s, transform 0.2s;
}
.home-btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.brand {
  margin-top: 48px;
  font-size: 11px;
  color: rgba(136, 146, 168, 0.5);
  letter-spacing: 2px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
  <div class="check-icon">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>

  <h1>ありがとうございます</h1>
  <p class="subtitle">
    MONKOS AIをご利用いただき、<br>誠にありがとうございます。
  </p>

  <a href="/" class="home-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    ホームに戻る
  </a>

  <p class="brand">MONKOS AI</p>
</div>

</body>
</html>
