<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 실패 | MONK.kr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ai: '#60A5FA',
                        so: '#F472B6',
                        dark: '#030508'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center p-4">
    <div class="text-center max-w-sm">
        <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-times text-red-400 text-4xl"></i>
        </div>
        <h1 class="text-2xl font-black mb-2">로그인 실패</h1>
        <p id="error-message" class="text-gray-400 mb-6">오류가 발생했습니다</p>
        
        <div class="space-y-3">
            <button onclick="retry()" class="w-full py-3 bg-so text-white font-bold rounded-xl">
                <i class="fas fa-redo mr-2"></i>다시 시도
            </button>
            <button onclick="goHome()" class="w-full py-3 bg-gray-800 text-white rounded-xl">
                홈으로 돌아가기
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        
        if (error) {
            document.getElementById('error-message').textContent = decodeURIComponent(error);
        }
        
        function retry() {
            window.location.href = '/ai_lab/login.html';
        }
        
        function goHome() {
            window.location.href = '/ai_lab/ai_lab.html';
        }
    </script>
</body>
</html>
