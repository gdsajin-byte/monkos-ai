name: Governance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: C7 — 내부 호칭 유출 검사 (헌법 4조 3항, ch8 1조)
        run: |
          HITS=$(grep -rn '쌍아\|막내\|소소\|용아\|민아' \
            --include="*.html" --include="*.js" --include="*.json" \
            MONK_kr/ monkos_AI/portal/public/ monkos_AI/idphoto-kr/public/ \
            monkos_AI/idphoto-jp/public/ monkos_AI/studio/public/ 2>/dev/null \
            | grep -v 'node_modules\|/admin/\|_legacy/\|_backup/\|_functions_backup\|\.min\.js' \
            || true)

          if [ -n "$HITS" ]; then
            echo "::warning::⚠️ 사용자 대면 코드에서 내부 호칭 발견 (헌법 4조 3항)"
            echo ""
            echo "$HITS"
            echo ""
            echo "총 $(echo "$HITS" | wc -l | tr -d ' ')건 — 의도적 노출이 아니면 수정 필요"
          else
            echo "✅ 내부 호칭 유출 없음"
          fi

      - name: C3 — 세션로그 월별 폴더 위반 검사 (ch4 4조)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          VIOLATIONS=""
          for FILE in $FILES; do
            case "$FILE" in
              monkos-ops/ops/sessions/*.md|monkos-ops/ops/reports/*.md|monkos-ops/ops/orders/*.md)
                DIR=$(dirname "$FILE")
                BASE=$(basename "$DIR")
                if [ "$BASE" = "sessions" ] || [ "$BASE" = "reports" ] || [ "$BASE" = "orders" ]; then
                  BASENAME=$(basename "$FILE")
                  if [ "$BASENAME" != "README.md" ]; then
                    VIOLATIONS="${VIOLATIONS}${FILE} "
                  fi
                fi
                ;;
            esac
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::❌ 월별 폴더(YYYY-MM/) 밖에 파일 배치 — ch4 4조 위반"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "파일은 YYYY-MM/ 서브폴더에 배치해야 합니다."
            exit 1
          else
            echo "✅ 월별 폴더 규칙 준수 (변경 파일 기준)"
          fi

      - name: C10 — 계층 동기화 스탬프 대조 (ch4 12조, PETITION_20260806 #10)
        run: |
          MISMATCH=""
          for F in .claude/rules/*.md monkos-ops/ops/templates/CONSTITUTION_ESSENCE.md; do
            [ -f "$F" ] || continue
            LINE=$(grep -m1 '^> source: ' "$F" || true)
            [ -z "$LINE" ] && continue
            SRC=$(echo "$LINE" | sed 's/^> source: //; s/@.*//')
            STAMP=$(echo "$LINE" | sed 's/.*@//' | tr -d ' ')
            if [ ! -f "$SRC" ]; then
              MISMATCH="${MISMATCH}
          ${F}: 정본 경로 미존재 (${SRC})"
              continue
            fi
            REAL=$(git log -1 --format=%as -- "$SRC")
            if [ "$STAMP" != "$REAL" ]; then
              MISMATCH="${MISMATCH}
          ${F}: 스탬프 ${STAMP} ≠ 정본 최종 개정 ${REAL} (${SRC})"
            fi
          done

          if [ -n "$MISMATCH" ]; then
            echo "::warning::⚠️ 발췌본 스탬프 ↔ 정본 개정일 불일치 (ch4 12조 — 발췌본 재동기화 필요)"
            echo "$MISMATCH"
          else
            echo "✅ 계층 동기화 스탬프 정상"
          fi

      - name: C11 — 배포 게이트 정적 검사 (ch5 6조, PETITION_20260902)
        run: |
          # ⚠️ 한계: 본 스텝은 게이트의 **존재 여부**만 본다. 구현이 조문에 맞는지(정확성)는 판정하지 않는다.
          #    예 — portal/deploy.sh는 드리프트 코드를 보유하나 로컬 산출물을 비교하여 조문 미충족이다
          #    (막내2 행정심사 적발 ④). 이 스텝을 "게이트 감사 완료"로 오인하지 말 것.
          TODAY=$(date +%F)
          EFFECTIVE="2026-09-02"
          D_125="2026-09-16"   # 게이트 1·2·5 유예 만료 (발효 +14일, ch5 6조 부칙)
          D_34="2026-11-01"    # 게이트 3·4 유예 만료 (발효 +60일)
          left() { python3 -c "import datetime,sys;print((datetime.date.fromisoformat(sys.argv[1])-datetime.date.fromisoformat(sys.argv[2])).days)" "$1" "$TODAY"; }
          L125=$(left "$D_125"); L34=$(left "$D_34")
          tag() { [ "$1" -gt 0 ] && echo "유예 D-$1" || echo "⛔유예 만료"; }

          # 이중 소스 대상은 references.md에서 파싱 (하드코딩 금지 — 정본 변경 시 자동 추종)
          DUAL=$(awk '/^\*\*⚠️ 이중 소스/{f=1;next} f&&/^$/{exit} f&&/^- /{print}' .claude/rules/references.md 2>/dev/null \
            | grep -oE '`[A-Za-z0-9_./-]+/`' | tr -d '`' | sed 's|/$||' | sort -u || true)
          # 주의: `[ ... ] && echo` 형태는 GH 러너 기본 셸(bash -e)에서 테스트 실패 시 스텝을 죽인다. if 문으로 쓸 것
          if [ -z "$DUAL" ]; then
            echo "⚠️ 이중 소스 목록 파싱 0건 — references.md 서식 변경 의심. 게이트5 미검사 (무음 강등 방지 고지)"
          fi

          FINDINGS=""; N=0; TOTAL=0
          for F in $(find . -name deploy.sh -not -path "*/node_modules/*" | sed 's|^\./||' | sort); do
            TOTAL=$((TOTAL+1)); ITEMS=""

            SETLINE=$(grep -m1 -E '^[[:space:]]*set[[:space:]]+-' "$F" || true)
            case "$SETLINE" in
              *pipefail*)
                case "$SETLINE" in
                  *u*) ;;
                  *) ITEMS="${ITEMS}
                · 게이트1 엄격모드 — \`-u\` 없음 ($(tag $L125))";;
                esac ;;
              *) ITEMS="${ITEMS}
                · 게이트1 엄격모드 — \`set -euo pipefail\` 부재 ($(tag $L125))" ;;
            esac

            grep -q 'status --porcelain' "$F" || ITEMS="${ITEMS}
                · 게이트2 미커밋 게이트 부재 ($(tag $L125))"

            if ! grep -qiE 'drift|드리프트' "$F"; then
              grep -qE '^[[:space:]]*#.*게이트[[:space:]]*3[[:space:]]*비적용' "$F" || ITEMS="${ITEMS}
                · 게이트3 드리프트 미구현 + 비적용 사유 주석 없음 ($(tag $L34))"
            fi

            if ! grep -qiE 'smoke|스모크|remote_health' "$F"; then
              grep -qE '^[[:space:]]*#.*게이트[[:space:]]*4[[:space:]]*비적용' "$F" || ITEMS="${ITEMS}
                · 게이트4 사후 스모크 미구현 + 비적용 사유 주석 없음 ($(tag $L34))"
            fi

            for D in $DUAL; do
              [ "$F" = "$D/deploy.sh" ] || continue
              grep -q '이중 소스' "$F" || ITEMS="${ITEMS}
                · 게이트5 이중 소스 경고 부재 ($(tag $L125))"
            done

            if [ -n "$ITEMS" ]; then
              FINDINGS="${FINDINGS}
              ${F}${ITEMS}"
              N=$((N+1))
            fi
          done

          if [ -n "$FINDINGS" ]; then
            echo "::warning::⚠️ 배포 게이트 미충족 ${N}/${TOTAL}본 (ch5 6조 — 발효 ${EFFECTIVE}, 유예 중이면 경고만)"
            echo "$FINDINGS"
            echo ""
            echo "비적용 사유 주석 서식: '# 게이트 3 비적용: {사유}' / '# 게이트 4 비적용: {사유}'"
          else
            echo "✅ 배포 게이트 정적 검사 통과 (deploy.sh ${TOTAL}본)"
          fi

          # ⚠️ 사각지대 명시 (ch5 6조 서문이 09-26 "배포 경로"로 확대됐으나 본 스텝은 deploy.sh만 순회한다.
          #    확대분을 무검사로 두고 "통과"만 출력하면 무음 강등이다 — 막내1 입법심사 이의).
          # 판정식은 C13과 동일 — 문자열 '언급'이 아니라 **실행 형태**를 본다 (명령 선두 또는 && ; || 뒤)
          DEPLOY_CMD='(^|&&|\|\||;)[[:space:]]*((npx|pnpm|yarn)[[:space:]]+)?wrangler[[:space:]]+(pages[[:space:]]+)?deploy|(^|&&|\|\||;)[[:space:]]*(\./|bash[[:space:]]+|sh[[:space:]]+)[A-Za-z0-9_./-]*deploy\.sh'
          WFL=$(grep -lE "$DEPLOY_CMD" .github/workflows/*.yml 2>/dev/null | tr '\n' ' ' || true)
          WF=$(printf '%s' "$WFL" | wc -w | tr -d ' ')
          echo "ℹ️ 배포 워크플로 ${WF}본은 본 스텝의 검사 대상이 아니다 (게이트 1·2·5는 셸 스크립트 형상 전용): ${WFL:-없음}"
          echo "   워크플로의 push 트리거 금지는 C13이, 미추적 입력 자산은 C14가 담당한다."

      - name: C13 — 배포 워크플로 자동 트리거 검사 (ch5 1조 1항, PETITION_20260924)
        run: |
          # 판정은 **내용 기준**이다. 파일명(deploy-*.yml) 매칭으로는 배포 명령을 가진 다른 이름의
          # 워크플로를 놓친다 (막내3 사법심사 부대의견 ④). 알림 전용 워크플로는 배포 명령이 없어
          # push 트리거를 가져도 정탐되지 않는다.
          # 판정식 — 배포 명령의 **실행 형태**만 잡는다. 문자열 언급(grep 패턴·주석·find -name)은 제외한다.
          # 이 구분이 없으면 governance-check 자신이 'deploy.sh'를 문자열로 포함해 자기 오탐한다 (09-26 스모크 적발).
          DEPLOY_CMD='(^|&&|\|\||;)[[:space:]]*((npx|pnpm|yarn)[[:space:]]+)?wrangler[[:space:]]+(pages[[:space:]]+)?deploy|(^|&&|\|\||;)[[:space:]]*(\./|bash[[:space:]]+|sh[[:space:]]+)[A-Za-z0-9_./-]*deploy\.sh'
          FOUND=0; VIOL=""; FLIST=""
          for F in .github/workflows/*.yml; do
            [ -f "$F" ] || continue
            # 주석 행 제외 — 주석 속 예시·금지 고지를 배포 명령으로 오인하지 않는다
            BODY=$(grep -vE '^[[:space:]]*#' "$F" || true)
            printf '%s\n' "$BODY" | grep -qE "$DEPLOY_CMD" || continue
            FOUND=$((FOUND+1)); FLIST="${FLIST} $(basename "$F")"
            # on: 블록만 잘라낸다 (다음 최상위 키에서 종료)
            TRIG=$(printf '%s\n' "$BODY" | awk '/^on:/{f=1;next} f&&/^[^[:space:]#]/{exit} f' \
              | grep -oE '^[[:space:]]+(push|schedule|repository_dispatch):' | tr -d ' :' | sort -u || true)
            if [ -n "$TRIG" ]; then
              VIOL="${VIOL}
              ${F} — 자동 트리거: $(printf '%s' "$TRIG" | tr '\n' ' ')"
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ 배포 명령 포함 워크플로 0건 — 탐지 패턴(wrangler pages deploy/deploy.sh) 변경 의심. 미검사 고지 (0건 ≠ 부재)"
          elif [ -n "$VIOL" ]; then
            echo "::warning::⚠️ 배포 워크플로에 자동 트리거 존재 (ch5 1조 1항 — 배포 ≠ push)"
            echo "$VIOL"
            echo ""
            echo "배포는 workflow_dispatch(승인자 트리거)만 허용한다. 알림이 필요하면 배포 스텝 없는 별도 워크플로로 분리할 것."
          else
            echo "✅ 배포 명령 포함 워크플로 ${FOUND}본 — 자동 트리거 없음 (workflow_dispatch 전용):${FLIST}"
          fi

      - name: C14 — 배포 루트 미추적 입력 자산 검사 (ch5 6조 게이트 6, PETITION_20260924)
        run: |
          # ⚠️ 한계 (무음 강등 방지 — 매 실행 고지): 러너는 **clean checkout**이므로 작업 트리에
          #    미추적·무시 파일이 애초에 존재하지 않는다. 본 스캔이 0건인 것은 "배포자 기기에
          #    미추적 자산이 없다"는 증거가 **아니다**. 09-19 이미지 결손(전역 *.jpg 무시 +
          #    예외 1줄)은 이 스캔으로 잡히지 않는다 — 실효 검사 방식은 미결(막내3 COMPLETION 보고).
          # ⚠️ core.quotePath=false 필수 — 기본값이면 한글 경로가 이스케이프되어 무음 스킵된다 (C12 선례).
          ROOTS="MONK_kr"
          BUILD_OUT='(^|/)(dist|build|out|\.next|node_modules)/'
          TOTAL=0; FINDINGS=""
          for R in $ROOTS; do
            [ -d "$R" ] || { echo "ℹ️ 배포 루트 $R 부재 — 스킵"; continue; }
            HITS=$(git -c core.quotePath=false ls-files --others --ignored --exclude-standard -- "$R" 2>/dev/null \
              | grep -vE "$BUILD_OUT" || true)
            if [ -n "$HITS" ]; then
              N=$(printf '%s\n' "$HITS" | wc -l | tr -d ' ')
              TOTAL=$((TOTAL+N))
              LIST=$(printf '%s\n' "$HITS" | head -20 | sed 's/^/    · /')
              FINDINGS=$(printf '%s\n  %s — %s건\n%s' "$FINDINGS" "$R" "$N" "$LIST")
            fi
          done

          if [ "$TOTAL" -gt 0 ]; then
            echo "::warning::⚠️ 배포 루트에 미추적 입력 자산 ${TOTAL}건 (ch5 6조 게이트 6 — 배포자 기기 종속)"
            echo "$FINDINGS"
            echo ""
            echo "빌드 산출물이면 제외 목록(BUILD_OUT)에 추가, 원본 자산이면 git 추적으로 편입할 것."
          else
            echo "ℹ️ 러너 스코프 미추적 입력 자산 0건 — **통과가 아니다**. 위 한계 주석 참조."
          fi

      - name: C12 — [예외] 태그 ↔ COMPLETION 대조 (ch1 2조 5항, PETITION_20260902)
        run: |
          # ⚠️ 한계: 태그를 **기재한** 건만 검증한다. 범위 초과인데 태그 자체를 안 남긴 **누락형 위반은
          #    기계 감지 불가**하다 (막내1 R12). 본 스텝은 완전 감사가 아니다.
          #    또한 본문에서 '[예외]'를 단순 인용·언급만 해도 검출되므로 오탐이 발생할 수 있다.
          # ⚠️ core.quotePath=false 필수 — 기본값(true)이면 한글 경로가 "..\354\214\215..." 로 이스케이프되어
          #    [ -f ] 를 통과하지 못하고 **전건 무음 스킵**된다. 세션로그는 전부 한글 에이전트명이라
          #    이 플래그가 없으면 C12는 아무것도 검사하지 않으면서 "✅ 없음"을 보고한다 (2026-09-02 러너 실측 적발).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD)
          else
            FILES=$(git -c core.quotePath=false diff --name-only --diff-filter=ACMR HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          MISSING=""; CHECKED=0
          for FILE in $FILES; do
            case "$FILE" in monkos-ops/ops/sessions/*/*.md) ;; *) continue ;; esac
            [ -f "$FILE" ] || continue
            grep -qF '[예외]' "$FILE" || continue
            BASE=$(basename "$FILE")
            DATE=$(echo "$BASE" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ -z "$DATE" ]; then continue; fi
            CHECKED=$((CHECKED+1))
            YM=$(echo "$DATE" | cut -c1-7)
            YMD=$(echo "$DATE" | tr -d '-')
            if ! ls monkos-ops/ops/reports/"$YM"/COMPLETION_"$YMD"_*.md >/dev/null 2>&1; then
              MISSING="${MISSING}
              ${FILE} — [예외] 기록 있으나 reports/${YM}/COMPLETION_${YMD}_* 부재"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::warning::⚠️ [예외] 기록 대비 COMPLETION 부재 (ch1 2조 5항 — 실행자 완료 요건 2건)"
            echo "$MISSING"
          elif [ "$CHECKED" -gt 0 ]; then
            echo "✅ [예외] 기록 ${CHECKED}건 — 대응 COMPLETION 전건 존재"
          else
            echo "✅ 이번 변경분에 [예외] 기록 없음"
          fi

      - name: C15 — PF 교차 링크 검사 (헌법 3조 2항 PF 갱신 의무, DESIGN_20260930_PF원장화)
        run: |
          # portfolio: 필드를 가진 최근 문서가 해당 PF 히스토리에 링크됐는지. 경고 전용(차단 아님).
          # mtime 기준이라 체크아웃 직후엔 전 파일이 '최근'이 된다 → 변경분 커밋 날짜로 좁히기 위해 --days 3 유지.
          python3 scripts/pf.py check --days 3 || echo "::warning::⚠️ PF 교차 링크 누락 — 위 목록 참조 (scripts/pf.sh append 로 보정)"
