name: Deploy monk.kr (CF Pages)

# 버튼 배포 — 푸시 자동 배포 아님 (법률 ch5 1조 개정 청구 PETITION_20260924 참조)
# 실행: GitHub Actions 탭 → Run workflow, 또는 `gh workflow run deploy-monk-kr.yml -f reason="..."`
on:
  workflow_dispatch:
    inputs:
      reason:
        description: '배포 사유 (세션 로그·COMPLETION 대조용)'
        required: true
        type: string

concurrency:
  group: deploy-monk-kr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 정본 = 루트 functions/ (ch5 1조). MONK_kr/functions는 없어야 한다
      - name: 정본 확인
        run: |
          test -d functions && test ! -L functions || { echo "루트 functions/ 부재 또는 symlink"; exit 1; }
          test ! -e MONK_kr/functions || { echo "MONK_kr/functions 존재 — 정본 이중화"; exit 1; }
          echo "사유: ${{ inputs.reason }}"

      # wrangler-action@v3는 러너의 npm 11에서 npx 자동 설치가 거부됨(첫 실행 실패 09-24) → 로컬과 동일하게 wrangler 직접 실행
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: wrangler 설치 (로컬 정본과 동일 버전)
        run: npm install -g wrangler@4.66.0

      - name: CF Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages deploy MONK_kr/ --project-name monk-kr --branch main --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[0-9a-f]+\.monk-kr\.pages\.dev' deploy.log | tail -1)
          [ -n "$url" ] || { echo "배포 URL 미검출"; exit 1; }
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      # 스모크 — 배포 고유 URL(pages.dev)을 2회 히트, 2차로 판정. monk.kr 자체는 CF가 러너 IP를 403으로 막으므로(09-24 실측) 참고 출력만.
      # 공개 도메인 최종 판정은 승인자 기기에서 2회 히트 (live-verify.md)
      - name: 스모크
        run: |
          sleep 15
          UA="Mozilla/5.0 monkos-deploy-smoke"
          for p in "" "monk_studio/monk_studio"; do
            curl -s -o /dev/null -A "$UA" "$DEPLOY_URL/$p"
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$DEPLOY_URL/$p")
            echo "$DEPLOY_URL/$p → $code"
            [ "$code" = "200" ] || { echo "스모크 실패 (배포 URL)"; exit 1; }
          done
          echo "monk.kr (참고, 러너 IP 차단 가능): $(curl -s -o /dev/null -w '%{http_code}' -A "$UA" https://monk.kr/)"
          echo "배포 커밋 $(git rev-parse --short HEAD) · $DEPLOY_URL · 사유: ${{ inputs.reason }}"
