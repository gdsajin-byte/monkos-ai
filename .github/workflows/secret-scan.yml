name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          FOUND=0

          # 변경된 파일만 스캔 (PR이면 base 대비, push면 직전 커밋 대비)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD 2>/dev/null || git ls-files)
          fi

          for FILE in $FILES; do
            [ ! -f "$FILE" ] && continue
            # 바이너리 스킵
            file --mime "$FILE" | grep -q "binary" && continue

            # 패턴 매칭 — 실제 키 형태 감지
            if grep -nEi \
              '(AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|ghp_[0-9a-zA-Z]{36}|gho_[0-9a-zA-Z]{36}|sk-[0-9a-zA-Z]{48}|"type":\s*"service_account"|-----BEGIN (RSA |EC )?PRIVATE KEY-----|xox[bpas]-[0-9a-zA-Z-]+)' \
              "$FILE" 2>/dev/null; then
              echo "::error file=$FILE::⚠️ 시크릿 패턴 감지: $FILE"
              FOUND=1
            fi

            # .env 파일이 커밋에 포함됐는지 체크
            if echo "$FILE" | grep -qE '(^|/)\.env(\.local|\.prod|\.dev)?$'; then
              echo "::error file=$FILE::⚠️ .env 파일 커밋 감지: $FILE"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ 시크릿 누출 감지 — push 차단 (헌법 4조 1항)"
            exit 1
          else
            echo "✅ 시크릿 스캔 통과"
          fi
