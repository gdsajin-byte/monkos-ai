name: Daily Briefing

on:
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 = KST 05:00 (일배치)
    - cron: '0 0 1 * *'   # UTC 00:00 매월 1일 = KST 09:00 (월배치)
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      # --- MARKET_EYE 일배치 (매일) ---
      - name: Collect GSC daily
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/collectors/collect_gsc.js

      - name: Collect GA4 daily
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/collectors/collect_ga4.js

      # --- MARKET_EYE 월배치 (매월 1일) ---
      - name: Collect Keywords monthly
        if: github.event.schedule == '0 0 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_ADS_DEV_TOKEN: ${{ secrets.GOOGLE_ADS_DEV_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
          NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
          NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/collectors/collect_keywords.js

      - name: Collect Trends monthly
        if: github.event.schedule == '0 0 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
          NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/collectors/collect_trends.js

      - name: Generate briefing
        id: gen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          NAVER_SEARCHAD_API_KEY: ${{ secrets.NAVER_SEARCHAD_API_KEY }}
          NAVER_SEARCHAD_SECRET_KEY: ${{ secrets.NAVER_SEARCHAD_SECRET_KEY }}
          NAVER_SEARCHAD_CUSTOMER_ID: ${{ secrets.NAVER_SEARCHAD_CUSTOMER_ID }}
          NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
          NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
          BING_WMT_API_KEY: ${{ secrets.BING_WMT_API_KEY }}
        run: python .github/scripts/daily_briefing.py

      - name: Commit and push
        run: |
          git config user.name "monkos-autopilot"
          git config user.email "autopilot@monkos.ai"
          git add monkos-ops/ops/briefings/
          git commit -m "[briefing] $(date +%Y-%m-%d) 데일리 브리핑 자동 생성" || exit 0
          git push

      - name: Create Issue
        id: issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.gen.outputs.run_date }}"
          FILE="${{ steps.gen.outputs.briefing_file }}"
          if [ -f "$FILE" ]; then
            BODY=$(cat "$FILE")
          else
            BODY="브리핑 파일 생성 확인 필요: $FILE"
          fi
          ISSUE_URL=$(gh issue create \
            --title "📊 데일리 브리핑 ${DATE}" \
            --body "$BODY" \
            --label "일일보고")
          echo "url=$ISSUE_URL" >> $GITHUB_OUTPUT
          echo "number=${ISSUE_URL##*/}" >> $GITHUB_OUTPUT

      - name: Close previous briefing issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW="${{ steps.issue.outputs.number }}"
          gh issue list --label "일일보고" --state open --json number -q '.[].number' | while read -r n; do
            if [ "$n" != "$NEW" ]; then
              gh issue close "$n" --comment "익일 브리핑 발행으로 자동 마감 (→ #${NEW})"
            fi
          done

      - name: Telegram notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY_FILE="${{ steps.gen.outputs.summary_file }}"
          ISSUE_URL="${{ steps.issue.outputs.url }}"
          if [ -f "$SUMMARY_FILE" ]; then
            MSG=$(printf '%s\n\n전문: %s' "$(cat "$SUMMARY_FILE")" "$ISSUE_URL")
          else
            DATE="${{ steps.gen.outputs.run_date }}"
            FILE="${{ steps.gen.outputs.briefing_file }}"
            ALERTS=$(grep "^- 🔴\|^- 🟡" "$FILE" 2>/dev/null || echo "없음")
            MSG=$(printf '📊 <b>데일리 브리핑 %s</b>\n\n%s\n\n전문: %s' "$DATE" "$ALERTS" "$ISSUE_URL")
          fi
          python .github/scripts/telegram_notify.py "$MSG"
