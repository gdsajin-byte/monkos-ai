name: Sync Works Submodule

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update submodule
        run: |
          git -c url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf="git@github.com:" submodule update --init --remote monkos-ops/works

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "monkos-autopilot"
          git config user.email "autopilot@monkos.ai"
          git add monkos-ops/works
          git commit -m "[sync] works submodule 자동 갱신"
          git push
