<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONKOS Photo Coach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030508; color: #fff;
            font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
            height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* 헤더 */
        #header {
            padding: 12px 16px; background: #0a0a0a;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #1a1a1a;
        }
        #header h1 { font-size: 15px; font-weight: 700; }
        .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
        .dot-on { background: #22c55e; }
        .dot-off { background: #ef4444; }
        .dot-wait { background: #f59e0b; }
        #step-label { font-size: 11px; color: #888; }

        /* 카메라 영역 */
        #camera-area {
            flex: 1; position: relative; overflow: hidden;
            background: #000;
        }
        #camera-video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* 셀피 미러링 */
        }

        /* 얼굴 가이드 오버레이 */
        #face-guide {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 5;
        }
        #face-guide::before {
            content: '';
            position: absolute;
            top: 12%; left: 50%; transform: translateX(-50%);
            width: 180px; height: 240px;
            border: 2px dashed rgba(244, 114, 182, 0.5);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }

        /* 코칭 오버레이 */
        #coaching-overlay {
            position: absolute; bottom: 90px; left: 12px; right: 12px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(245,158,11,0.4);
            border-radius: 12px; padding: 12px 16px;
            z-index: 10; display: none;
            transition: opacity 0.3s;
        }
        #coaching-overlay.ready {
            border-color: rgba(34,197,94,0.6);
        }
        #coaching-label {
            font-size: 10px; color: #f59e0b; font-weight: 600;
            margin-bottom: 4px;
        }
        #coaching-overlay.ready #coaching-label { color: #22c55e; }
        #coaching-text { font-size: 15px; line-height: 1.4; }

        /* 결과 오버레이 (Step 2, 3) */
        #result-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #030508; z-index: 20; display: none;
            flex-direction: column; overflow-y: auto;
        }
        #result-overlay.active { display: flex; }

        .result-header {
            padding: 16px; text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }
        .result-header h2 { font-size: 17px; font-weight: 700; }
        .result-header p { font-size: 12px; color: #888; margin-top: 4px; }

        .photo-compare {
            display: flex; gap: 12px; padding: 16px;
            justify-content: center;
        }
        .photo-compare img {
            width: 140px; height: 187px; object-fit: cover;
            border-radius: 12px; border: 2px solid #222;
        }
        .photo-compare .label {
            font-size: 10px; color: #888; text-align: center;
            margin-top: 6px;
        }

        /* QC 결과 */
        #qc-badge {
            margin: 8px 16px; padding: 12px 16px;
            border-radius: 12px; text-align: center;
            font-size: 14px; font-weight: 600;
        }
        #qc-badge.pass { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        #qc-badge.fail { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        #qc-badge.pending { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

        /* 하단 컨트롤 */
        #controls {
            padding: 14px 16px; background: #0a0a0a;
            display: flex; gap: 10px; justify-content: center;
            align-items: center; z-index: 30;
            border-top: 1px solid #1a1a1a;
        }

        /* 촬영 버튼 */
        #btn-capture {
            width: 72px; height: 72px; border-radius: 50%;
            background: #fff; border: 4px solid rgba(244,114,182,0.5);
            cursor: pointer; position: relative;
            transition: all 0.3s;
        }
        #btn-capture::after {
            content: ''; position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 50%; background: #fff;
            border: 2px solid #ddd;
        }
        #btn-capture.ready {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34,197,94,0.4);
        }
        #btn-capture.ready::after { border-color: #22c55e; }
        #btn-capture:disabled { opacity: 0.3; }

        .btn {
            padding: 10px 20px; border-radius: 10px; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-primary { background: #F472B6; color: #fff; }
        .btn-secondary { background: #222; color: #aaa; }
        .btn-success { background: #22c55e; color: #000; }
        .btn:disabled { opacity: 0.3; }

        /* 로딩 스피너 */
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #F472B6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 로그 */
        #log {
            padding: 4px 16px; background: #050505;
            font-size: 9px; color: #444; max-height: 40px;
            overflow-y: auto; font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="header">
        <div>
            <h1>MONKOS Photo Coach</h1>
            <span id="step-label">Step 1: AI 코칭</span>
        </div>
        <div>
            <span class="dot dot-wait" id="ws-dot"></span>
            <span id="ws-status" style="font-size:11px;">연결 중</span>
        </div>
    </div>

    <div id="camera-area">
        <video id="camera-video" autoplay playsinline muted></video>
        <div id="face-guide"></div>

        <div id="coaching-overlay">
            <div id="coaching-label">AI 코칭</div>
            <div id="coaching-text">카메라를 정면으로 맞춰주세요...</div>
        </div>

        <!-- 결과 오버레이 (Step 2, 3) -->
        <div id="result-overlay">
            <div class="result-header">
                <h2 id="result-title">촬영 확인</h2>
                <p id="result-subtitle">촬영된 사진을 확인하세요</p>
            </div>

            <div class="photo-compare">
                <div>
                    <img id="photo-original" src="" alt="원본">
                    <div class="label">원본</div>
                </div>
                <div id="photo-generated-wrap" style="display:none;">
                    <img id="photo-generated" src="" alt="생성">
                    <div class="label">AI 증명사진</div>
                </div>
            </div>

            <div id="qc-badge" class="pending" style="display:none;">검증 중...</div>

            <!-- Step 2 버튼 -->
            <div id="step2-actions" style="display:flex; gap:10px; padding:16px; justify-content:center;">
                <button class="btn btn-secondary" onclick="retakePhoto()">다시 촬영</button>
                <button class="btn btn-primary" onclick="confirmAndGenerate()">이 사진으로 생성</button>
            </div>

            <!-- Step 3 버튼 -->
            <div id="step3-actions" style="display:none; gap:10px; padding:16px; justify-content:center;">
                <button class="btn btn-secondary" onclick="retakePhoto()">다시 촬영</button>
                <button class="btn btn-secondary" onclick="regenerate()">재생성</button>
                <button class="btn btn-success" id="btn-download" onclick="downloadResult()" disabled>저장</button>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-capture" onclick="capturePhoto()"></button>
    </div>

    <div id="log"></div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        const WS_HOST = location.host;
        const MAX_CAPTURE_SIZE = 720;
        const COACHING_DISPLAY_MS = 8000;
        const FRAME_INTERVAL_MS = 1000;
        const CAPTURE_SIZE = 512;

        let ws = null;
        let cameraStream = null;
        let capturedImageData = null;
        let generatedImageData = null;
        let frameTimer = null;
        let coachingTimeout = null;
        let isReady = false; // AI가 "좋아요" 판정
        let currentStep = 1;

        const video = document.getElementById('camera-video');
        const captureCanvas = document.getElementById('capture-canvas');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString('ko-KR');
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
        }

        // === WebSocket ===
        function connectWS() {
            ws = new WebSocket(`wss://${WS_HOST}`);
            setDot('wait', '연결 중');

            ws.onopen = () => {
                setDot('on', '연결됨');
                log('서버 연결됨');
                startFrameCapture();
            };

            ws.onmessage = async (e) => {
                let msg;
                try {
                    const raw = (e.data instanceof Blob) ? await e.data.text() : e.data;
                    msg = JSON.parse(raw);
                } catch { return; }

                if (msg.type === 'ai-coaching') {
                    showCoaching(msg.text);
                } else if (msg.type === 'generate-start') {
                    showStep3Loading();
                } else if (msg.type === 'generate-result') {
                    showGeneratedPhoto(msg.image);
                } else if (msg.type === 'generate-error') {
                    showGenerateError(msg.error);
                } else if (msg.type === 'qc-result') {
                    showQCResult(msg.result);
                } else if (msg.type === 'qc-error') {
                    showQCError(msg.error);
                }
            };

            ws.onclose = () => {
                setDot('off', '끊김');
                stopFrameCapture();
                setTimeout(connectWS, 3000);
            };
        }

        function setDot(state, text) {
            const dot = document.getElementById('ws-dot');
            dot.className = 'dot dot-' + state;
            document.getElementById('ws-status').textContent = text;
        }

        // === 카메라 ===
        async function initCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } },
                    audio: false,
                });
                video.srcObject = cameraStream;
                log('카메라 초기화');
            } catch (err) {
                log('카메라 오류: ' + err.message);
            }
        }

        // === 프레임 캡처 → WS 전송 ===
        let prevFrameData = null;

        function startFrameCapture() {
            if (frameTimer) return;
            frameTimer = setInterval(() => {
                if (currentStep !== 1 || !ws || ws.readyState !== 1) return;
                if (video.videoWidth === 0) return;

                captureCanvas.width = CAPTURE_SIZE;
                captureCanvas.height = CAPTURE_SIZE;
                const ctx = captureCanvas.getContext('2d');

                // 정사각형 크롭 (중앙)
                const vw = video.videoWidth, vh = video.videoHeight;
                const cropSize = Math.min(vw, vh);
                const sx = (vw - cropSize) / 2, sy = (vh - cropSize) / 2;
                ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, CAPTURE_SIZE, CAPTURE_SIZE);

                // 장면 변화 감지
                const imgData = ctx.getImageData(0, 0, CAPTURE_SIZE, CAPTURE_SIZE);
                if (prevFrameData && !detectChange(prevFrameData, imgData)) return;
                prevFrameData = imgData;

                // JPEG → WS 바이너리
                captureCanvas.toBlob((blob) => {
                    if (blob && ws && ws.readyState === 1) {
                        blob.arrayBuffer().then(buf => ws.send(buf));
                    }
                }, 'image/jpeg', 0.6);

            }, FRAME_INTERVAL_MS);
        }

        function stopFrameCapture() {
            if (frameTimer) { clearInterval(frameTimer); frameTimer = null; }
        }

        function detectChange(prev, curr) {
            const d1 = prev.data, d2 = curr.data;
            let diff = 0, samples = 0;
            for (let i = 0; i < d1.length; i += 160) { // 10% 샘플링
                diff += Math.abs(d1[i] - d2[i]);
                samples++;
            }
            return (diff / samples / 255) > 0.03;
        }

        // === 코칭 표시 ===
        function showCoaching(text) {
            const overlay = document.getElementById('coaching-overlay');
            const textEl = document.getElementById('coaching-text');
            const btn = document.getElementById('btn-capture');

            textEl.textContent = text;
            overlay.style.display = 'block';

            // "좋아요" 감지 → 촬영 준비 상태
            if (text.includes('좋아요') || text.includes('촬영하세요') || text.includes('촬영')) {
                isReady = true;
                overlay.classList.add('ready');
                btn.classList.add('ready');
            } else {
                isReady = false;
                overlay.classList.remove('ready');
                btn.classList.remove('ready');
            }

            if (coachingTimeout) clearTimeout(coachingTimeout);
            coachingTimeout = setTimeout(() => {
                overlay.style.display = 'none';
            }, COACHING_DISPLAY_MS);
        }

        // === Step 2: 촬영 ===
        function capturePhoto() {
            if (currentStep !== 1) return;

            const canvas = captureCanvas;
            const ctx = canvas.getContext('2d');
            const vw = video.videoWidth, vh = video.videoHeight;

            // 고해상도 캡처 (720px 맞춤)
            let tw = vw, th = vh;
            if (tw > MAX_CAPTURE_SIZE || th > MAX_CAPTURE_SIZE) {
                const ratio = Math.min(MAX_CAPTURE_SIZE / tw, MAX_CAPTURE_SIZE / th);
                tw = Math.round(tw * ratio);
                th = Math.round(th * ratio);
            }
            canvas.width = tw;
            canvas.height = th;

            // 미러링 해제 캡처 (저장용)
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, vw, vh, 0, 0, tw, th);

            capturedImageData = canvas.toDataURL('image/jpeg', 0.8);

            // Step 2 UI
            currentStep = 2;
            stopFrameCapture();
            document.getElementById('step-label').textContent = 'Step 2: 촬영 확인';
            document.getElementById('photo-original').src = capturedImageData;
            document.getElementById('photo-generated-wrap').style.display = 'none';
            document.getElementById('qc-badge').style.display = 'none';
            document.getElementById('step2-actions').style.display = 'flex';
            document.getElementById('step3-actions').style.display = 'none';
            document.getElementById('result-overlay').classList.add('active');
            document.getElementById('result-title').textContent = '촬영 확인';
            document.getElementById('result-subtitle').textContent = isReady ? 'AI가 촬영 OK 판정한 사진입니다' : '촬영된 사진을 확인하세요';

            log('촬영 완료');
        }

        function retakePhoto() {
            currentStep = 1;
            capturedImageData = null;
            generatedImageData = null;
            prevFrameData = null;
            document.getElementById('step-label').textContent = 'Step 1: AI 코칭';
            document.getElementById('result-overlay').classList.remove('active');
            startFrameCapture();

            // 코칭 세션 재시작
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'restart-coaching' }));
            }
            log('재촬영');
        }

        // === Step 3: 생성 + QC ===
        function confirmAndGenerate() {
            if (!capturedImageData) return;

            currentStep = 3;
            document.getElementById('step-label').textContent = 'Step 3: AI 생성 + QC';
            document.getElementById('step2-actions').style.display = 'none';
            document.getElementById('result-title').textContent = '증명사진 생성 중...';
            document.getElementById('result-subtitle').textContent = 'Imagen 3.0이 작업 중입니다';

            // base64에서 data: prefix 제거
            const base64 = capturedImageData.includes(',') ? capturedImageData.split(',')[1] : capturedImageData;

            ws.send(JSON.stringify({
                type: 'generate',
                image: base64,
                style: 'id_photo',
            }));
        }

        function showStep3Loading() {
            document.getElementById('qc-badge').style.display = 'block';
            document.getElementById('qc-badge').className = 'pending';
            document.getElementById('qc-badge').innerHTML = '<span class="spinner"></span> 생성 중...';
        }

        function showGeneratedPhoto(imageData) {
            generatedImageData = imageData;
            document.getElementById('photo-generated').src = imageData;
            document.getElementById('photo-generated-wrap').style.display = 'block';
            document.getElementById('result-title').textContent = '품질 검증 중...';
            document.getElementById('result-subtitle').textContent = 'Gemini QC가 원본과 비교 중';
            document.getElementById('qc-badge').innerHTML = '<span class="spinner"></span> QC 검증 중...';

            log('생성 완료 → QC 시작');

            // QC 요청
            const origBase64 = capturedImageData.includes(',') ? capturedImageData.split(',')[1] : capturedImageData;
            const genBase64 = imageData.includes(',') ? imageData.split(',')[1] : imageData;

            ws.send(JSON.stringify({
                type: 'qc',
                original: origBase64,
                generated: genBase64,
            }));
        }

        function showQCResult(result) {
            const badge = document.getElementById('qc-badge');
            const passed = result.identity === 'PASS' || result.same_person === true;
            const similarity = result.similarity || '?';

            badge.className = passed ? 'pass' : 'fail';
            badge.textContent = passed
                ? `PASS — 유사도 ${similarity}% | ${result.note || result.quality || ''}`
                : `FAIL — 유사도 ${similarity}% | ${result.note || '재촬영 권장'}`;

            document.getElementById('result-title').textContent = passed ? '완료!' : 'QC 실패';
            document.getElementById('result-subtitle').textContent = passed ? '증명사진이 준비되었습니다' : '다시 시도해주세요';

            document.getElementById('step3-actions').style.display = 'flex';
            document.getElementById('btn-download').disabled = !passed;

            log(`QC: ${passed ? 'PASS' : 'FAIL'} (${similarity}%)`);
        }

        function showGenerateError(error) {
            document.getElementById('qc-badge').className = 'fail';
            document.getElementById('qc-badge').textContent = '생성 실패: ' + error;
            document.getElementById('result-title').textContent = '생성 실패';
            document.getElementById('step3-actions').style.display = 'flex';
            log('생성 오류: ' + error);
        }

        function showQCError(error) {
            document.getElementById('qc-badge').className = 'fail';
            document.getElementById('qc-badge').textContent = 'QC 실패: ' + error;
            document.getElementById('step3-actions').style.display = 'flex';
            document.getElementById('btn-download').disabled = false; // QC 실패해도 저장 허용
            log('QC 오류: ' + error);
        }

        function regenerate() {
            confirmAndGenerate();
        }

        function downloadResult() {
            if (!generatedImageData) return;
            const a = document.createElement('a');
            a.href = generatedImageData;
            a.download = `monkos_photo_${Date.now()}.png`;
            a.click();
            log('저장 완료');
        }

        // === 초기화 ===
        initCamera().then(() => connectWS());
    </script>
</body>
</html>
