<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKOS IMAGE PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monk: '#000000',
                        accent: '#F472B6', // Monk Pink
                        dark: '#111827',
                        glass: 'rgba(255, 255, 255, 0.05)'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Pretendard:wght@300;500;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #000; color: #fff; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(135deg, #F472B6, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .loader { border-top-color: #F472B6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-purple-600 flex items-center justify-center">
                    <i class="fas fa-cube text-white text-sm"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">MONKOS <span class="text-accent font-light">PRO</span></h1>
            </div>
            
            <div id="auth-container">
                <button id="login-btn" onclick="googleLogin()" class="px-4 py-2 rounded-full bg-white text-black text-sm font-bold hover:bg-gray-200 transition-colors flex items-center gap-2">
                    <i class="fab fa-google"></i> 로그인
                </button>
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <span id="user-name" class="text-sm text-gray-400 hidden md:block"></span>
                    <img id="user-avatar" src="" class="w-8 h-8 rounded-full border border-gray-700">
                    <button onclick="logout()" class="text-xs text-gray-500 hover:text-white">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
        
        <!-- Auth Gate Message -->
        <div id="login-required" class="text-center py-20 hidden">
            <h2 class="text-3xl font-bold mb-4">Creative Intelligence Engine</h2>
            <p class="text-gray-400 mb-8">MONKOS Image Pro에 오신 것을 환영합니다.<br>서비스를 이용하려면 로그인이 필요합니다.</p>
            <button onclick="googleLogin()" class="px-8 py-4 bg-accent text-white rounded-xl font-bold text-lg hover:opacity-90 transition-all shadow-lg shadow-accent/20">
                <i class="fab fa-google mr-2"></i> Google 계정으로 시작하기
            </button>
        </div>

        <!-- App Interface -->
        <div id="app-interface" class="w-full max-w-5xl hidden opacity-0 transition-opacity duration-500">
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left: Controls -->
                <div class="lg:col-span-4 space-y-6">
                    <!-- Prompt Input -->
                    <div class="glass-panel rounded-2xl p-5">
                        <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Prompt</label>
                        <textarea id="prompt-input" rows="5" 
                            class="w-full bg-black/50 border border-gray-700 rounded-xl p-3 text-sm focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-all placeholder-gray-600 resize-none"
                            placeholder="Describe your imagination... (e.g. A futuristic city with neon lights, cinematic lighting, 8k)"></textarea>
                        
                        <div class="mt-4">
                            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wider">Negative Prompt</label>
                            <input id="negative-prompt" type="text" 
                                class="w-full bg-black/50 border border-gray-700 rounded-xl p-3 text-sm focus:border-red-500/50 outline-none transition-all placeholder-gray-600"
                                placeholder="low quality, blurry, distorted">
                        </div>
                    </div>

                    <!-- Settings -->
                    <div class="glass-panel rounded-2xl p-5">
                        <label class="block text-xs font-bold text-gray-500 mb-3 uppercase tracking-wider">Aspect Ratio</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setRatio('1:1')" class="ratio-btn active p-2 rounded-lg border border-gray-700 hover:border-accent text-xs text-center transition-all bg-accent/20 border-accent text-white" data-value="1:1">
                                <div class="w-4 h-4 border border-current mx-auto mb-1"></div>1:1
                            </button>
                            <button onclick="setRatio('16:9')" class="ratio-btn p-2 rounded-lg border border-gray-700 hover:border-accent text-xs text-center text-gray-400 transition-all" data-value="16:9">
                                <div class="w-6 h-3.5 border border-current mx-auto mb-1.5 mt-0.5"></div>16:9
                            </button>
                            <button onclick="setRatio('9:16')" class="ratio-btn p-2 rounded-lg border border-gray-700 hover:border-accent text-xs text-center text-gray-400 transition-all" data-value="9:16">
                                <div class="w-3.5 h-6 border border-current mx-auto mb-1"></div>9:16
                            </button>
                        </div>
                    </div>

                    <!-- Generate Button -->
                    <button id="generate-btn" onclick="generateImage()" 
                        class="w-full py-4 bg-gradient-to-r from-accent to-purple-600 rounded-xl font-bold text-white shadow-lg shadow-accent/25 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                        <i class="fas fa-magic group-hover:rotate-12 transition-transform"></i>
                        <span>GENERATE</span>
                    </button>
                    
                    <p class="text-center text-[10px] text-gray-600 mono">Powered by Vertex AI Imagen 3</p>
                </div>

                <!-- Right: Gallery / Result -->
                <div class="lg:col-span-8">
                    <div id="result-area" class="h-full min-h-[500px] glass-panel rounded-2xl p-1 flex items-center justify-center relative overflow-hidden group">
                        
                        <!-- Placeholder -->
                        <div id="placeholder" class="text-center">
                            <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                                <i class="fas fa-image text-3xl text-gray-600"></i>
                            </div>
                            <p class="text-gray-500 text-sm">Ready to create</p>
                        </div>

                        <!-- Loading State -->
                        <div id="loading" class="hidden absolute inset-0 bg-black/80 z-10 flex flex-col items-center justify-center">
                            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12 mb-4"></div>
                            <p class="text-accent font-bold animate-pulse">Dreaming...</p>
                        </div>

                        <!-- Result Image -->
                        <img id="generated-image" src="" class="hidden max-w-full max-h-[80vh] rounded-xl shadow-2xl object-contain">
                        
                        <!-- Overlay Actions -->
                        <div id="image-actions" class="hidden absolute bottom-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <a id="download-link" href="#" target="_blank" class="p-3 bg-black/70 backdrop-blur text-white rounded-full hover:bg-accent transition-colors">
                                <i class="fas fa-download"></i>
                            </a>
                            <button onclick="copyUrl()" class="p-3 bg-black/70 backdrop-blur text-white rounded-full hover:bg-white hover:text-black transition-colors">
                                <i class="fas fa-link"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- Firebase Config Warning Modal -->
    <div id="config-modal" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center hidden">
        <div class="bg-gray-900 border border-red-500 rounded-2xl p-8 max-w-md text-center">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
            <h3 class="text-xl font-bold mb-2">설정 필요</h3>
            <p class="text-gray-400 text-sm mb-6">
                Firebase 설정이 누락되었습니다.<br>
                index.html 파일의 `firebaseConfig` 객체를<br>
                실제 프로젝트 설정으로 업데이트해주세요.
            </p>
            <button onclick="document.getElementById('config-modal').classList.add('hidden')" class="px-6 py-2 bg-gray-800 rounded-lg text-sm hover:bg-gray-700">
                닫기 (테스트 모드)
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ TODO: Firebase 설정을 여기에 입력하세요!
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "monkos.firebaseapp.com",
            projectId: "monkos",
            storageBucket: "monkos.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // Firebase 초기화 (설정값이 있을 때만)
        let auth;
        try {
            if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                // 설정 미입력 시 경고
                document.getElementById('config-modal').classList.remove('hidden');
                // 테스트를 위해 UI 강제 노출 (실제론 막아야 함)
                showApp(); 
            } else {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                
                // Auth State Observer
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        showApp(user);
                    } else {
                        showLogin();
                    }
                });
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
            showApp(); // Fallback for demo
        }

        // ==========================================
        // UI Logic
        // ==========================================
        
        let currentRatio = '1:1';

        function showApp(user) {
            document.getElementById('login-required').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            // Trigger reflow for transition
            setTimeout(() => document.getElementById('app-interface').classList.remove('opacity-0'), 50);

            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
            }
        }

        function showLogin() {
            document.getElementById('login-required').classList.remove('hidden');
            document.getElementById('app-interface').classList.add('hidden');
            document.getElementById('app-interface').classList.add('opacity-0');
            
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('user-profile').classList.add('hidden');
        }

        function googleLogin() {
            if (!auth) {
                alert("Firebase 설정이 완료되지 않았습니다.");
                return;
            }
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                console.error("Login failed:", error);
                alert("로그인 실패: " + error.message);
            });
        }

        function logout() {
            if (auth) auth.signOut();
            else showLogin();
        }

        function setRatio(ratio) {
            currentRatio = ratio;
            document.querySelectorAll('.ratio-btn').forEach(btn => {
                if (btn.dataset.value === ratio) {
                    btn.classList.add('bg-accent/20', 'border-accent', 'text-white');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('bg-accent/20', 'border-accent', 'text-white');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        async function generateImage() {
            const prompt = document.getElementById('prompt-input').value;
            const negativePrompt = document.getElementById('negative-prompt').value;
            
            if (!prompt) {
                alert("프롬프트를 입력해주세요!");
                return;
            }

            // UI Update
            const btn = document.getElementById('generate-btn');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loader ease-linear rounded-full border-2 border-t-2 border-white h-5 w-5 mr-2"></div> Generating...';
            
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('generated-image').classList.add('hidden');
            document.getElementById('image-actions').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                // API Call (Same Domain)
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        negative_prompt: negativePrompt,
                        aspectRatio: currentRatio,
                        sampleCount: 1
                    })
                });

                const data = await response.json();

                if (data.success && data.images && data.images.length > 0) {
                    const imgData = data.images[0];
                    const imgUrl = imgData.signedUrl || imgData.gcsUri || `data:image/png;base64,${imgData.base64}`;
                    
                    const imgEl = document.getElementById('generated-image');
                    imgEl.src = imgUrl;
                    imgEl.onload = () => {
                        document.getElementById('loading').classList.add('hidden');
                        imgEl.classList.remove('hidden');
                        document.getElementById('image-actions').classList.remove('hidden');
                    };

                    // Setup actions
                    document.getElementById('download-link').href = imgUrl;
                } else {
                    throw new Error(data.error || "이미지 생성 실패");
                }

            } catch (error) {
                console.error("Generation Error:", error);
                alert("생성 중 오류가 발생했습니다: " + error.message);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('placeholder').classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        }

        function copyUrl() {
            const url = document.getElementById('generated-image').src;
            navigator.clipboard.writeText(url).then(() => alert("URL 복사 완료!"));
        }
    </script>
</body>
</html>
