<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKOS AI IMAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-text { text-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }
        .loader { border-top-color: #F472B6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* 스크롤바 숨김 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monk: '#F472B6', // Signature Pink
                        dark: '#050505',
                        surface: '#121212'
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 border-b border-white/5 flex items-center justify-between px-6 bg-dark/80 backdrop-blur-md z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-monk to-purple-600 flex items-center justify-center shadow-lg shadow-monk/20">
                <i class="fas fa-brain text-white text-sm"></i>
            </div>
            <h1 class="text-lg font-extrabold tracking-tight">MONKOS <span class="text-monk font-light">AI IMAGE</span></h1>
            <span class="px-2 py-0.5 rounded text-[10px] bg-white/5 border border-white/10 text-gray-400">BETA</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-xs text-gray-500">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Engine Active
            </div>
            <a href="https://monk.kr" target="_blank" class="text-xs text-gray-400 hover:text-white transition-colors">monk.kr</a>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left: Controls -->
        <aside class="w-full md:w-[400px] border-r border-white/5 bg-surface/50 flex flex-col p-6 overflow-y-auto">
            
            <div class="mb-8">
                <h2 class="text-sm font-bold text-gray-400 mb-4 uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-pen-fancy"></i> Generation
                </h2>
                
                <!-- Prompt -->
                <div class="mb-4">
                    <label class="block text-xs text-gray-500 mb-2 ml-1">Prompt</label>
                    <textarea id="prompt" rows="6" 
                        class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-sm text-gray-200 focus:border-monk focus:ring-1 focus:ring-monk outline-none transition-all resize-none placeholder-gray-700"
                        placeholder="상상하는 이미지를 묘사해주세요...&#13;&#10;(예: 네온 사인이 빛나는 사이버펑크 서울의 밤거리, 8k 해상도, 시네마틱 라이팅)"></textarea>
                </div>

                <!-- Negative Prompt -->
                <div class="mb-6">
                    <label class="block text-xs text-gray-500 mb-2 ml-1">Negative Prompt</label>
                    <input id="negative-prompt" type="text" 
                        class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-sm text-gray-200 focus:border-red-500/50 outline-none transition-all placeholder-gray-700"
                        placeholder="low quality, blurry, distorted, ugly">
                </div>

                <!-- Settings -->
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div>
                        <label class="block text-xs text-gray-500 mb-2 ml-1">Aspect Ratio</label>
                        <select id="aspect-ratio" class="w-full bg-black/40 border border-white/10 rounded-lg p-2.5 text-sm text-gray-300 focus:border-monk outline-none">
                            <option value="1:1">1:1 (Square)</option>
                            <option value="16:9">16:9 (Landscape)</option>
                            <option value="9:16">9:16 (Portrait)</option>
                            <option value="4:3">4:3 (Standard)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-2 ml-1">Samples</label>
                        <select id="sample-count" class="w-full bg-black/40 border border-white/10 rounded-lg p-2.5 text-sm text-gray-300 focus:border-monk outline-none">
                            <option value="1">1 Image</option>
                            <option value="2" disabled>2 Images (Pro)</option>
                            <option value="4" disabled>4 Images (Pro)</option>
                        </select>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="generate-btn" onclick="generate()" 
                    class="w-full py-4 bg-gradient-to-r from-monk to-purple-600 rounded-xl font-bold text-white shadow-lg shadow-monk/20 hover:shadow-monk/40 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                    <i class="fas fa-magic group-hover:rotate-12 transition-transform"></i>
                    <span>Generate Image</span>
                </button>
            </div>

            <!-- Footer Info -->
            <div class="mt-auto pt-6 border-t border-white/5">
                <div class="flex items-center justify-between text-[10px] text-gray-600">
                    <span>Model: <span class="text-gray-400">Vertex AI Imagen</span></span>
                    <span>Status: <span class="text-green-500">Ready</span></span>
                </div>
            </div>
        </aside>

        <!-- Right: Preview Area -->
        <main class="flex-1 bg-black relative flex items-center justify-center p-8 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-gray-900/40 via-black to-black">
            
            <!-- Welcome State -->
            <div id="welcome-state" class="text-center opacity-100 transition-opacity duration-300">
                <div class="w-24 h-24 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-image text-4xl text-gray-700"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-300 mb-2">Create with MONKOS</h3>
                <p class="text-sm text-gray-600 max-w-xs mx-auto">Vertex AI의 강력한 성능으로<br>당신의 상상을 현실로 만드세요.</p>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="absolute inset-0 z-20 bg-black/80 backdrop-blur-sm hidden flex-col items-center justify-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-800 h-16 w-16 mb-6"></div>
                <div class="text-center">
                    <h3 class="text-xl font-bold text-white mb-1 animate-pulse">Generating...</h3>
                    <p class="text-sm text-monk">AI가 이미지를 그리고 있습니다</p>
                </div>
            </div>

            <!-- Result State -->
            <div id="result-state" class="hidden w-full h-full flex items-center justify-center relative group">
                <img id="result-img" src="" class="max-w-full max-h-full rounded-lg shadow-2xl shadow-monk/10 object-contain transition-transform duration-500 hover:scale-[1.01]">
                
                <!-- Floating Actions -->
                <div class="absolute bottom-8 flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300 translate-y-4 group-hover:translate-y-0">
                    <a id="download-btn" href="#" target="_blank" class="px-6 py-3 bg-white text-black rounded-full font-bold hover:bg-gray-200 transition-colors shadow-lg flex items-center gap-2">
                        <i class="fas fa-download"></i> Download
                    </a>
                    <button onclick="share()" class="px-6 py-3 bg-black/80 border border-white/20 text-white rounded-full font-bold hover:bg-black hover:border-monk transition-colors backdrop-blur flex items-center gap-2">
                        <i class="fas fa-share-alt"></i> Share
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script>
        async function generate() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) {
                alert('프롬프트를 입력해주세요.');
                return;
            }

            // UI 상태 전환
            const btn = document.getElementById('generate-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            
            document.getElementById('welcome-state').classList.add('hidden');
            document.getElementById('result-state').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('loading-state').style.display = 'flex';

            try {
                // API 호출
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        negative_prompt: document.getElementById('negative-prompt').value,
                        aspectRatio: document.getElementById('aspect-ratio').value,
                        sampleCount: 1
                    })
                });

                const data = await response.json();

                if (data.success && data.images && data.images.length > 0) {
                    const imgData = data.images[0];
                    // Signed URL 우선 사용 (없으면 Base64)
                    const imgUrl = imgData.signedUrl || imgData.gcsUri || `data:image/png;base64,${imgData.base64}`;
                    
                    const imgEl = document.getElementById('result-img');
                    
                    // 이미지 로드 완료 시 표시
                    imgEl.onload = () => {
                        document.getElementById('loading-state').style.display = 'none';
                        document.getElementById('result-state').classList.remove('hidden');
                    };
                    imgEl.src = imgUrl;

                    // 다운로드 링크 설정
                    document.getElementById('download-btn').href = imgUrl;
                } else {
                    throw new Error(data.error || '이미지 생성 실패');
                }

            } catch (error) {
                console.error('Error:', error);
                alert('오류가 발생했습니다: ' + error.message);
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('welcome-state').classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function share() {
            const url = document.getElementById('result-img').src;
            navigator.clipboard.writeText(url).then(() => {
                alert('이미지 링크가 복사되었습니다!');
            });
        }

        // Enter 키로 생성 (Shift+Enter는 줄바꿈)
        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generate();
            }
        });
    </script>
</body>
</html>
