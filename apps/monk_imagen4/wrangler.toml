name = "monk-ai-studio-pro"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# R2 Bucket Binding
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "monk-apps"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "monk-db"
database_id = "6fe2a64b-9144-436c-94f7-1e9375249a1e"

[env.production]
vars = { ENVIRONMENT = "production" }

# Environment Variables (set via wrangler secret put)
# GEMINI_API_KEY - Your Gemini API key
# RATE_LIMIT_PER_HOUR - Default: 3
# DAILY_QUOTA - Default: 100
