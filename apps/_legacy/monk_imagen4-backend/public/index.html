<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKOS IMAGE PRO | Staff Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; }
        .glow { box-shadow: 0 0 40px rgba(234, 179, 8, 0.3); }
        .input-glow:focus { box-shadow: 0 0 20px rgba(234, 179, 8, 0.2); }
    </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-6">
    
    <!-- Background Effect -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-yellow-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-orange-500/5 rounded-full blur-3xl"></div>
    </div>

    <!-- Login Card -->
    <div class="relative w-full max-w-md">
        <!-- Back Link -->
        <a href="https://monkos.ai" class="inline-flex items-center gap-2 text-gray-500 hover:text-white text-sm mb-8 transition-colors">
            <i class="fas fa-arrow-left"></i>
            <span>MONKOS</span>
        </a>

        <div class="bg-gray-900/80 backdrop-blur-xl border border-yellow-500/20 rounded-3xl p-8 glow">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-yellow-500/20 to-orange-500/20 rounded-2xl mb-6">
                    <i class="fas fa-wand-magic-sparkles text-4xl text-yellow-400"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-1">MONKOS <span class="text-yellow-400">IMAGE PRO</span></h1>
                <p class="text-sm text-gray-500">Internal & Enterprise Access</p>
            </div>

            <!-- Access Type Tabs -->
            <div class="flex gap-2 mb-6">
                <button onclick="setAccessType('staff')" id="tab-staff" class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-yellow-500/20 text-yellow-400 border border-yellow-500/50">
                    <i class="fas fa-user-tie mr-2"></i>Staff
                </button>
                <button onclick="setAccessType('enterprise')" id="tab-enterprise" class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-gray-800 text-gray-400 border border-gray-700 hover:border-gray-600">
                    <i class="fas fa-building mr-2"></i>Enterprise
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <!-- Staff Fields -->
                <div id="staff-fields">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">Staff ID</label>
                            <input type="text" id="staff-id" placeholder="staff@monk.kr" 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:border-yellow-500/50 focus:outline-none input-glow transition-all">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">Password</label>
                            <input type="password" id="staff-password" placeholder="••••••••" 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:border-yellow-500/50 focus:outline-none input-glow transition-all">
                        </div>
                    </div>
                </div>

                <!-- Enterprise Fields (Hidden by default) -->
                <div id="enterprise-fields" class="hidden">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">Company Code</label>
                            <input type="text" id="company-code" placeholder="ENT-XXXXXX" 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:border-yellow-500/50 focus:outline-none input-glow transition-all">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 uppercase tracking-wider mb-2">Access Key</label>
                            <input type="password" id="access-key" placeholder="••••••••••••" 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:border-yellow-500/50 focus:outline-none input-glow transition-all">
                        </div>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="error-msg" class="hidden text-red-400 text-sm text-center py-2"></div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-yellow-500 to-orange-500 text-black font-bold rounded-xl hover:from-yellow-400 hover:to-orange-400 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                    <i class="fas fa-lock mr-2"></i>
                    Access IMAGE PRO
                </button>
            </form>

            <!-- Info -->
            <div class="mt-6 pt-6 border-t border-gray-800">
                <p class="text-xs text-gray-600 text-center">
                    <i class="fas fa-shield-halved mr-1"></i>
                    직원 및 계약 기업 전용 접근 권한이 필요합니다
                </p>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="flex justify-center gap-6 mt-6 text-xs text-gray-600">
            <a href="#" class="hover:text-yellow-400 transition-colors">계정 문의</a>
            <a href="#" class="hover:text-yellow-400 transition-colors">Enterprise 도입</a>
        </div>
    </div>

    <script>
        let currentAccessType = 'staff';
        let authData = null;

        // 인증 데이터 로드
        async function loadAuthData() {
            try {
                const res = await fetch('./auth.json');
                authData = await res.json();
            } catch (e) {
                console.error('인증 데이터 로드 실패:', e);
            }
        }

        function setAccessType(type) {
            currentAccessType = type;
            
            // Update tabs
            document.getElementById('tab-staff').className = type === 'staff' 
                ? 'flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-yellow-500/20 text-yellow-400 border border-yellow-500/50'
                : 'flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-gray-800 text-gray-400 border border-gray-700 hover:border-gray-600';
            
            document.getElementById('tab-enterprise').className = type === 'enterprise'
                ? 'flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-yellow-500/20 text-yellow-400 border border-yellow-500/50'
                : 'flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all bg-gray-800 text-gray-400 border border-gray-700 hover:border-gray-600';
            
            // Toggle fields
            document.getElementById('staff-fields').classList.toggle('hidden', type !== 'staff');
            document.getElementById('enterprise-fields').classList.toggle('hidden', type !== 'enterprise');
            
            // Clear error
            document.getElementById('error-msg').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            
            if (!authData) {
                errorMsg.textContent = '인증 시스템 로딩 중... 잠시 후 다시 시도하세요';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            if (currentAccessType === 'staff') {
                const staffId = document.getElementById('staff-id').value;
                const password = document.getElementById('staff-password').value;
                
                // JSON 데이터에서 검증
                const user = authData.staff.find(u => u.id === staffId && u.pw === password);
                
                if (user) {
                    sessionStorage.setItem('MONKOS_IMAGE_PRO_AUTH', JSON.stringify({
                        type: 'staff',
                        id: user.id,
                        name: user.name,
                        role: user.role,
                        timestamp: Date.now()
                    }));
                    window.location.href = './app/';
                } else {
                    errorMsg.textContent = 'Staff ID 또는 비밀번호가 올바르지 않습니다';
                    errorMsg.classList.remove('hidden');
                }
            } else {
                const companyCode = document.getElementById('company-code').value;
                const accessKey = document.getElementById('access-key').value;
                
                // JSON 데이터에서 검증
                const enterprise = authData.enterprise.find(e => e.code === companyCode && e.key === accessKey);
                
                if (enterprise) {
                    sessionStorage.setItem('MONKOS_IMAGE_PRO_AUTH', JSON.stringify({
                        type: 'enterprise',
                        code: enterprise.code,
                        company: enterprise.company,
                        credits: enterprise.credits,
                        timestamp: Date.now()
                    }));
                    window.location.href = './app/';
                } else {
                    errorMsg.textContent = 'Company Code 또는 Access Key가 올바르지 않습니다';
                    errorMsg.classList.remove('hidden');
                }
            }
        }

        // 초기화
        window.onload = async function() {
            // 인증 데이터 로드
            await loadAuthData();
            
            // 기존 세션 체크
            const auth = sessionStorage.getItem('MONKOS_IMAGE_PRO_AUTH');
            if (auth) {
                const session = JSON.parse(auth);
                // 24시간 유효
                if (Date.now() - session.timestamp < 24 * 60 * 60 * 1000) {
                    window.location.href = './app/';
                }
            }
        };
    </script>
</body>
</html>
