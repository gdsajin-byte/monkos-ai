name = "monk-ai-studio-pro"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# R2 Bucket Binding
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "monk-ai-images"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "monk-ai-db"
database_id = "YOUR_D1_DATABASE_ID"

[env.production]
vars = { ENVIRONMENT = "production" }
