<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONKOS Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
      color: white;
      padding: 40px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 40px;
    }
    .status {
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 20px 40px;
      display: inline-block;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .features {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .feature {
      background: rgba(255,255,255,0.15);
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MONKOS Chat</h1>
    <p class="subtitle">AI-Powered Conversation Platform</p>
    <div class="status">
      <span class="status-dot"></span>
      Firebase Connected
    </div>
    <div class="features">
      <div class="feature">Vertex AI LLaMA 4</div>
      <div class="feature">Real-time Chat</div>
      <div class="feature">Google Cloud</div>
    </div>
  </div>
</body>
</html>
