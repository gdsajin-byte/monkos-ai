<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONK 바둑판</title>
<style>
  :root {
    --bg: #f4efe6; --ink: #2b2620; --muted: #6f655a; --wood: #dcb36c; --line: #3a2c18;
    --btn: #fff; --btn-ink: #2b2620; --accent: #b4462b; --bar-b: #222; --bar-w: #f7f7f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 20px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; gap: 24px; flex-wrap: wrap; }
  .board { flex: 1 1 640px; max-width: min(92vh, 760px); }
  svg { width: 100%; height: auto; display: block; cursor: pointer; border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .side { flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 26px; margin: 0; }
  .turn { font-size: 24px; font-weight: 700; min-height: 1.4em; }
  .msg { color: var(--accent); min-height: 1.4em; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 20px; padding: 14px 18px; border-radius: 10px;
                   border: 2px solid #c9bba5; background: var(--btn); color: var(--btn-ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
  .btns button { flex: 1 1 45%; }
  .stat { display: flex; justify-content: space-between; }
  .bar { height: 30px; border-radius: 8px; overflow: hidden; display: flex; border: 2px solid #c9bba5; }
  .bar .b { background: var(--bar-b); }
  .bar .w { background: var(--bar-w); flex: 1; }
  .barlbl { display: flex; justify-content: space-between; font-size: 18px; color: var(--muted); }
  .small { font-size: 16px; color: var(--muted); }
  .hl { border-color: var(--accent); color: #fff; background: var(--accent); font-weight: 700; }
  .hl:hover:not(:disabled) { border-color: var(--ink); }
  .pass { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 17px; }
  /* 생각 중 표시는 판 밖 상태 문구의 점 애니메이션 하나뿐 — 판·화면을 흐리거나 가리지 않는다 */
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="board" id="boardBox"><svg id="svg" viewBox="0 0 400 400" aria-label="바둑판"></svg></div>
  <div class="side">
    <h1>MONK 바둑판</h1>
    <div class="turn" id="turn">불러오는 중…</div>
    <div class="msg" id="msg"></div>

    <div class="row btns">
      <button id="bNew">새 판</button>
      <button id="bUndo">한 수 무르기</button>
      <button id="bSwap">흑백 바꾸기</button>
      <button id="bReview" disabled>리뷰</button>
      <button id="bScore">계가</button>
      <button id="bResign">기권</button>
    </div>
    <div id="scorePanel" hidden style="border:2px solid #c9bba5;border-radius:10px;padding:12px 14px;background:#fffaf0">
      <div id="scoreSum" style="font-weight:700"></div>
      <div class="small" id="scoreDetail"></div>
      <div class="row" style="margin-top:10px">
        <button id="bScoreOk" class="hl" style="flex:1">계가 확정</button>
        <button id="bScoreCancel" style="flex:1">계가 취소</button>
      </div>
    </div>
    <label class="small"><input type="checkbox" id="wrFilter" checked> 리뷰: 승부가 갈리기 전(승률 <span id="wrRange">3~97%</span>) 실수만 <span id="filterWhy"></span></label>
    <div class="small" id="reviewWhy"></div>

    <label>치수 (다음 '새 판'부터)<br>
      <select id="handicap" style="width:100%"></select>
    </label>

    <label>상대 수준<br>
      <select id="level" style="width:100%"></select>
    </label>
    <div class="small" id="levelWhy"></div>

    <div>
      <div class="barlbl"><span>흑</span><span id="scoreTxt">형세 —</span><span>백</span></div>
      <div class="bar"><div class="b" id="barB" style="width:50%"></div><div class="w"></div></div>
    </div>
    <div class="stat"><span>흑이 따낸 돌 <b id="capB">0</b></span><span>백이 따낸 돌 <b id="capW">0</b></span></div>
    <div class="stat small"><span id="moveNo">0수</span>
      <span><button class="pass" id="bPass">패스</button> · <label><input type="checkbox" id="sound" checked> 소리</label></span></div>
    <div class="small" id="sgf"></div>
  </div>
</div>
<script>
const N = 19, M = 20, STEP = (400 - 2 * M) / (N - 1);
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const COLS = 'ABCDEFGHJKLMNOPQRST';
let S = null, busy = false;
let filterDefaultFor = null;  // 리뷰 구간 체크 기본값을 정한 판

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
const P = i => M + i * STEP;

function drawBase() {
  svg.innerHTML = '';
  el('rect', { x: 0, y: 0, width: 400, height: 400, fill: 'var(--wood)' });
  for (let i = 0; i < N; i++) {
    el('line', { x1: P(0), y1: P(i), x2: P(N - 1), y2: P(i), stroke: 'var(--line)', 'stroke-width': .7 });
    el('line', { x1: P(i), y1: P(0), x2: P(i), y2: P(N - 1), stroke: 'var(--line)', 'stroke-width': .7 });
  }
  for (const a of [3, 9, 15]) for (const b of [3, 9, 15]) el('circle', { cx: P(a), cy: P(b), r: 2.2, fill: 'var(--line)' });
  for (let i = 0; i < N; i++) {
    el('text', { x: P(i), y: 9, 'font-size': 7, 'text-anchor': 'middle', fill: 'var(--line)' }).textContent = COLS[i];
    el('text', { x: 6, y: P(i) + 2.5, 'font-size': 7, 'text-anchor': 'middle', fill: 'var(--line)' }).textContent = N - i;
  }
}

function render() {
  drawBase();
  const g = S.board;
  const sc = S.scoring;
  const dead = new Set(sc ? sc.dead.map(([x, y]) => x + ',' + y) : []);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = g[y][x]; if (!c) continue;
    const isDead = dead.has(x + ',' + y);
    el('circle', { cx: P(x), cy: P(y), r: STEP * .47, fill: c === 'B' ? '#151515' : '#fafaf5',
                   stroke: c === 'B' ? '#000' : '#888', 'stroke-width': .6, opacity: isDead ? .35 : 1 });
    if (isDead) {
      const d = STEP * .22, col = '#c0392b';
      el('line', { x1: P(x) - d, y1: P(y) - d, x2: P(x) + d, y2: P(y) + d, stroke: col, 'stroke-width': 1.6 });
      el('line', { x1: P(x) - d, y1: P(y) + d, x2: P(x) + d, y2: P(y) - d, stroke: col, 'stroke-width': 1.6 });
    }
  }
  if (sc) for (const [x, y, o] of sc.terr) {
    const d = STEP * .18;
    el('rect', { x: P(x) - d, y: P(y) - d, width: 2 * d, height: 2 * d, fill: o === 'B' ? '#151515' : '#fafaf5',
                 stroke: o === 'B' ? '#000' : '#777', 'stroke-width': .5 });
  }
  if (S.last) {
    const [x, y] = S.last, c = g[y][x];
    el('circle', { cx: P(x), cy: P(y), r: STEP * .2, fill: 'none', stroke: c === 'B' ? '#fff' : '#c0392b', 'stroke-width': 1.8 });
  }
  const me = S.user === 'B' ? '흑' : '백';
  let turn;
  if (S.result) turn = `대국 종료 — ${S.resultKo}`;
  else if (S.scoring) turn = '계가 중';
  else if (busy) turn = 'KataGo 생각 중';
  else if (S.toMove === S.user) turn = `작가님(${me}) 차례`;
  else turn = 'KataGo 차례';
  const turnEl = document.getElementById('turn');
  turnEl.textContent = turn;
  turnEl.classList.toggle('dots', busy && !S.result);
  let msg = S.error || S.message || '';
  if (!S.error && S.lastPass && !S.result) msg = `${S.lastColor === 'B' ? '흑' : '백'}이 패스했습니다. ` + msg;
  if (!S.strongOk) msg = (S.strongError || '엔진 기동 실패') + ' ' + msg;
  document.getElementById('msg').textContent = msg;
  document.getElementById('capB').textContent = S.captures.B;
  document.getElementById('capW').textContent = S.captures.W;
  const ha = S.handicap ? `${S.handicap}점 접바둑` : '호선';
  document.getElementById('moveNo').textContent = `${S.moveNo}수 · ${ha} · 덤 ${S.komi} · 상대 ${S.levelLabel}`;
  const hs = document.getElementById('handicap');
  if (!hs.options.length) {
    for (const h of S.handicaps) hs.add(new Option(h ? `${h}점 (작가님 흑, 덤 0.5, 백 먼저)` : '호선 (덤 6.5)', h));
    hs.value = S.handicap;
  }
  if (S.score !== null && S.score !== undefined) {
    const s = S.score, pct = Math.max(3, Math.min(97, 50 + s * 2.5));
    document.getElementById('barB').style.width = pct + '%';
    const lead = Math.abs(s) < 0.5 ? '거의 반반' : `${s > 0 ? '흑' : '백'} ${Math.abs(s).toFixed(1)}집 우세`;
    document.getElementById('scoreTxt').textContent = `형세: ${lead}`;
  } else {
    document.getElementById('barB').style.width = '50%';
    document.getElementById('scoreTxt').textContent = '형세 —';
  }
  const lv = document.getElementById('level');
  if (!lv.options.length) {
    lv.add(new Option('KataGo 최강', 'strong'));
    for (const r of S.ranks) lv.add(new Option(`사람처럼 두는 KataGo — ${r.label}`, r.v));
  }
  for (const o of lv.options) if (o.value !== 'strong') o.disabled = !S.humanOk;
  lv.value = S.level;
  document.getElementById('levelWhy').textContent = S.humanOk ? '' : `급수 상대 비활성: ${S.humanReason}`;
  const rb = document.getElementById('bReview');
  rb.disabled = !S.review.ok;
  rb.classList.toggle('hl', !!S.result && S.review.ok);  // 종국 후 리뷰로 시선 유도
  document.getElementById('bUndo').disabled = !!S.result;
  document.getElementById('bScore').disabled = !!S.result || !!S.scoring || !S.moveNo;
  const panel = document.getElementById('scorePanel');
  panel.hidden = !sc;
  if (sc) {
    document.getElementById('scoreSum').textContent = `흑 ${sc.black}집 · 백 ${sc.white}집 → ${sc.resultKo}`;
    document.getElementById('scoreDetail').textContent =
      `흑 = 집 ${sc.terrB} + 따낸 돌·사석 ${sc.prisB} / 백 = 집 ${sc.terrW} + 따낸 돌·사석 ${sc.prisW} + 덤 ${sc.komi}` +
      ` (한국 규칙 집 계산) · KataGo 판정: ${sc.kataKo}` +
      (sc.result !== sc.kata ? ' — 결과가 다르면 사석 표시를 확인해 주세요(돌을 누르면 바뀝니다)' : '');
  }
  document.getElementById('bResign').disabled = !!S.result || !S.moveNo;
  document.getElementById('bPass').disabled = !!S.result || !!S.scoring;
  document.getElementById('reviewWhy').textContent = S.review.ok ? '' : S.review.reason;
  const wf = document.getElementById('wrFilter');
  wf.disabled = !S.review.filterOk;
  // 접바둑은 흑 승률이 처음부터 97%를 넘기 쉬워 구간을 걸면 실수가 거의 안 잡힌다 → 판이 바뀔 때 기본값만 다시 정함
  const gameKey = String(S.handicap);
  if (gameKey !== filterDefaultFor) { wf.checked = !S.handicap; filterDefaultFor = gameKey; }
  if (!S.review.filterOk) wf.checked = false;
  document.getElementById('filterWhy').textContent = S.review.filterOk ? '(임시 기본값)' : `— ${S.review.filterReason || ''}`;
  if (S.review.wrRange) document.getElementById('wrRange').textContent =
    S.review.wrRange.split(',').map(v => Math.round(v * 100)).join('~') + '%';
  if (S.testMode) document.title = 'MONK 바둑판 (테스트)';
  document.getElementById('sgf').textContent = S.sgf ? `기보 자동 저장: ${S.sgf}` : '';
}

// ---- 착수음: 실녹음(Freesound CC0, 출처는 sounds/SOUNDS.md). 작가님 선택(10-23) = Hongsungbock 'baduk2'.
// sounds/custom/ 에 stone*.wav·capture*.wav 를 넣으면 그 녹음을 대신 쓴다(서버가 목록을 알려 줌).
// 지연 0을 위해: 페이지 열 때 받고 바로 디코딩해 두고, 재생은 기다림 없이 즉시 시작한다(디코딩 전이면 그 한 번만 무음).
let STONE_FILES = ['b_hongsungbock_1', 'b_hongsungbock_2', 'b_hongsungbock_3'];
let CAPTURE_FILES = ['capture_mpooman471'];
let actx = null;
let soundOn = true;
const decoded = {};
try {
  soundOn = localStorage.getItem('goBoardSound') !== 'off';
} catch (e) { /* 저장소 불가 — 기본값 */ }

function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC({ latencyHint: 'interactive' });
  }
  return actx;
}

function unlockAudio() {  // 브라우저는 첫 사용자 동작 전에는 소리를 막는다 — 첫 누름에서 연다
  const a = audio();
  if (a.state === 'suspended') a.resume();
}

function preloadSounds(sounds) {
  if (sounds && sounds.stone && sounds.stone.length) STONE_FILES = sounds.stone;
  if (sounds && sounds.capture && sounds.capture.length) CAPTURE_FILES = sounds.capture;
  for (const f of [...STONE_FILES, ...CAPTURE_FILES]) {
    if (decoded[f] !== undefined) continue;
    decoded[f] = null;
    fetch(`/sounds/${f}.wav`).then(r => r.arrayBuffer()).then(b => audio().decodeAudioData(b))
      .then(buf => { decoded[f] = buf; }).catch(() => { delete decoded[f]; });
  }
}

const jitter = (v, r) => v * (1 + (Math.random() * 2 - 1) * r);
const pick = list => list[Math.floor(Math.random() * list.length)];

function playNow(name, delay, gain, rate) {
  const buf = decoded[name];
  if (!buf) return false;
  const a = audio();
  if (a.state === 'suspended') a.resume();
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = buf; src.playbackRate.value = rate; g.gain.value = gain;
  src.connect(g); g.connect(a.destination);
  src.start(a.currentTime + (delay || 0));
  return true;
}

function stoneSound(delay) {
  if (!soundOn) return false;
  try { return playNow(pick(STONE_FILES), delay, jitter(0.9, 0.12), jitter(1, 0.03)); } catch (e) { return false; }
}

function captureSound(delay) {
  if (!soundOn) return false;
  try { return playNow(pick(CAPTURE_FILES), (delay || 0) + 0.06, 0.7, jitter(1, 0.03)); } catch (e) { return false; }
}

// 내 수로 잡히는 상대 돌 — 서버 왕복 전에 따냄 소리를 내고 판에서 바로 걷어내려고 브라우저에서 계산
function capturedBy(board, x, y, c) {
  const o = c === 'B' ? 'W' : 'B', out = [], seen = new Set();
  const g = board.map(r => r.slice()); g[y][x] = c;
  for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || g[ny][nx] !== o || seen.has(nx + ',' + ny)) continue;
    const grp = [], st = [[nx, ny]]; let libs = 0; seen.add(nx + ',' + ny);
    while (st.length) {
      const [cx, cy] = st.pop(); grp.push([cx, cy]);
      for (const [ax, ay] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
        if (ax < 0 || ay < 0 || ax >= N || ay >= N) continue;
        const v = g[ay][ax];
        if (v === null) libs++;
        else if (v === o && !seen.has(ax + ',' + ay)) { seen.add(ax + ',' + ay); st.push([ax, ay]); }
      }
    }
    if (!libs) out.push(...grp);
  }
  return out;
}

function notice(text) {
  document.getElementById('msg').textContent = text;
}

async function call(path, body) {
  if (busy) { notice('상대가 생각 중입니다'); return; }
  busy = true; render();
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (j.busy) {  // 다른 탭 등에서 엔진이 생각 중 — 판은 서버 정본으로 다시 받는다
      busy = false;
      S = await (await fetch('/api/state')).json();
      render(); notice(j.error); return;
    }
    const prev = S;
    S = j;
    playSounds(prev, S, path === '/api/play' && !(body && body.pass));
  } catch (e) { S.error = '서버 연결 실패 — run.sh가 켜져 있는지 확인해 주세요'; }
  busy = false; render();
}

// 응답 전후 비교로 엔진 수의 소리를 낸다(내 수의 딱·따냄은 누르는 순간에 이미 냈다)
function playSounds(prev, cur, myStone) {
  if (!prev || cur.error && myStone) return;
  const me = cur.user, eng = me === 'B' ? 'W' : 'B';
  const theirs = (cur.captures[eng] || 0) - (prev.captures[eng] || 0);
  const engMoved = cur.moveNo > prev.moveNo + (myStone ? 1 : 0) && cur.lastColor === eng && !cur.lastPass;
  if (engMoved && cur.moveNo > prev.moveNo) {
    stoneSound();
    if (theirs > 0) captureSound();
  }
}

document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

function boardXY(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round((p.x - M) / STEP), Math.round((p.y - M) / STEP)];
}

// 누르는 순간(pointerdown) 처리 — click(손을 뗄 때)보다 빠르다
function tapAt(x, y) {
  if (!S || S.result) return;
  if (x < 0 || y < 0 || x >= N || y >= N) return;
  if (S.scoring) {
    if (S.board[y][x]) call('/api/score/toggle', { x, y });
    return;
  }
  if (busy) { notice('상대가 생각 중입니다'); return; }
  if (S.toMove !== S.user || S.board[y][x]) return;
  const t0 = performance.now();
  // 즉시 내 돌·따냄을 그리고 소리를 낸다(서버 응답으로 덮어씀)
  const caps = capturedBy(S.board, x, y, S.user);
  S.board[y][x] = S.user; S.last = [x, y]; S.message = ''; S.error = null;
  for (const [cx, cy] of caps) S.board[cy][cx] = null;
  const played = stoneSound();
  if (caps.length) captureSound();
  window.__lastTap = { ms: performance.now() - t0, played, caps: caps.length };  // 누름 → 재생 예약까지(실측용)
  call('/api/play', { x, y });
}
svg.addEventListener('pointerdown', ev => { const [x, y] = boardXY(ev); tapAt(x, y); });
document.getElementById('bNew').onclick = () => { filterDefaultFor = null; return call('/api/new', { handicap: Number(document.getElementById('handicap').value) }); };
document.getElementById('bUndo').onclick = () => call('/api/undo');
document.getElementById('bSwap').onclick = () => call('/api/swap');
document.getElementById('bReview').onclick = async () => {
  if (busy) { notice('상대가 생각 중입니다'); return; }
  const tab = window.open('', '_blank');  // 클릭 순간에 열어야 팝업 차단을 피한다
  await call('/api/review', { wrFilter: document.getElementById('wrFilter').checked });
  if (S.reviewJob && tab) tab.location = `/review/${S.reviewJob}`;
  else if (tab) tab.close();
};
document.getElementById('bResign').onclick = () => {
  if (busy) { notice('상대가 생각 중입니다'); return; }
  if (confirm('정말 기권하시겠어요? 이 판은 여기서 끝나고 기보에 기권으로 저장됩니다.')) call('/api/resign');
};
const soundBox = document.getElementById('sound');
soundBox.checked = soundOn;
soundBox.onchange = () => {
  soundOn = soundBox.checked;
  try { localStorage.setItem('goBoardSound', soundOn ? 'on' : 'off'); } catch (e) { /* 저장소 불가 — 이번 창에서만 */ }
  if (soundOn) stoneSound();
};
document.getElementById('bPass').onclick = () => call('/api/play', { pass: true });
document.getElementById('bScore').onclick = () => call('/api/score');
document.getElementById('bScoreOk').onclick = () => call('/api/score/confirm');
document.getElementById('bScoreCancel').onclick = () => call('/api/score/cancel');
document.getElementById('level').onchange = e => call('/api/level', { level: e.target.value });

// 테스트 포트 전용 자가 측정(?selftest=1): 누름→재생 예약 지연·따냄 판정. 결과는 #selftest 에 남긴다
async function selftest() {
  const out = [], blank = () => Array.from({ length: N }, () => Array(N).fill(null));
  unlockAudio();
  for (let i = 0; i < 30 && Object.values(decoded).filter(Boolean).length < STONE_FILES.length + CAPTURE_FILES.length; i++) {
    await new Promise(r => setTimeout(r, 100));
  }
  out.push('decoded=' + Object.values(decoded).filter(Boolean).length);
  const b = blank(); b[0][0] = 'W'; b[1][0] = 'B';  // A19 백 1점, A18 흑 → B19 흑이면 따냄
  const ts = [];
  for (let i = 0; i < 20; i++) {
    const t0 = performance.now();
    const caps = capturedBy(b, 1, 0, 'B');
    const ok = stoneSound(); if (caps.length) captureSound();
    ts.push([performance.now() - t0, ok]);
  }
  const ms = ts.map(t => t[0]).sort((p, q) => p - q);
  out.push(`tap_ms_median=${ms[10].toFixed(3)} max=${ms[19].toFixed(3)} played=${ts.filter(t => t[1]).length}/20`);
  const b3 = blank(); b3[0][0] = 'W'; b3[0][1] = 'W'; b3[1][0] = 'B'; b3[1][1] = 'B';
  out.push(`capture1=${capturedBy(b, 1, 0, 'B').length} capture2=${capturedBy(b3, 2, 0, 'B').length} negative=${capturedBy(b3, 5, 5, 'B').length}`);
  out.push(`ctx=${actx.state} baseLatency=${(actx.baseLatency * 1000).toFixed(1)}ms outputLatency=${((actx.outputLatency || 0) * 1000).toFixed(1)}ms`);
  const d = document.createElement('div'); d.id = 'selftest'; d.textContent = 'SELFTEST ' + out.join(' | ');
  document.body.appendChild(d);
}

fetch('/api/state').then(r => r.json()).then(s => {
  S = s; preloadSounds(S.sounds); render();
  if (S.testMode && location.search.includes('selftest=1')) selftest();
})
  .catch(() => { document.getElementById('turn').textContent = '서버 연결 실패'; });
</script>
