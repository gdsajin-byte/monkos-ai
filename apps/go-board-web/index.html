<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONK 바둑판</title>
<style>
  :root {
    --bg: #f4efe6; --ink: #2b2620; --muted: #6f655a; --wood: #dcb36c; --line: #3a2c18;
    --btn: #fff; --btn-ink: #2b2620; --accent: #b4462b; --bar-b: #222; --bar-w: #f7f7f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 20px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: flex; gap: 24px; flex-wrap: wrap; }
  .board { flex: 1 1 640px; max-width: min(92vh, 760px); }
  svg { width: 100%; height: auto; display: block; cursor: pointer; border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .side { flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 26px; margin: 0; }
  .turn { font-size: 24px; font-weight: 700; min-height: 1.4em; }
  .msg { color: var(--accent); min-height: 1.4em; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 20px; padding: 14px 18px; border-radius: 10px;
                   border: 2px solid #c9bba5; background: var(--btn); color: var(--btn-ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
  .btns button { flex: 1 1 45%; }
  .stat { display: flex; justify-content: space-between; }
  .bar { height: 30px; border-radius: 8px; overflow: hidden; display: flex; border: 2px solid #c9bba5; }
  .bar .b { background: var(--bar-b); }
  .bar .w { background: var(--bar-w); flex: 1; }
  .barlbl { display: flex; justify-content: space-between; font-size: 18px; color: var(--muted); }
  .small { font-size: 16px; color: var(--muted); }
  .hl { border-color: var(--accent); color: #fff; background: var(--accent); font-weight: 700; }
  .hl:hover:not(:disabled) { border-color: var(--ink); }
  .clock { flex: 1; padding: 10px 12px; border: 2px solid #c9bba5; border-radius: 10px; font-size: 18px; background: #fff; }
  .clock.run { border-color: var(--ink); font-weight: 700; }
  .clock.urgent { border-color: var(--accent); color: var(--accent); }
  #tMain, #tByo, #tPer { font-size: 17px; padding: 8px; }
  .pass { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 17px; }
  /* 생각 중 표시는 판 밖 상태 문구의 점 애니메이션 하나뿐 — 판·화면을 흐리거나 가리지 않는다 */
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="board" id="boardBox"><svg id="svg" viewBox="0 0 400 400" aria-label="바둑판"></svg></div>
  <div class="side">
    <h1>MONK 바둑판</h1>
    <div class="turn" id="turn">불러오는 중…</div>
    <div class="msg" id="msg"></div>

    <div class="row btns">
      <button id="bNew">새 판</button>
      <button id="bUndo">한 수 무르기</button>
      <button id="bSwap">흑백 바꾸기</button>
      <button id="bReview" disabled>리뷰</button>
      <button id="bScore">계가</button>
      <button id="bResign">기권</button>
    </div>
    <div id="scorePanel" hidden style="border:2px solid #c9bba5;border-radius:10px;padding:12px 14px;background:#fffaf0">
      <div id="scoreSum" style="font-weight:700"></div>
      <div class="small" id="scoreDetail"></div>
      <div class="row" style="margin-top:10px">
        <button id="bScoreOk" class="hl" style="flex:1">계가 확정</button>
        <button id="bScoreCancel" style="flex:1">계가 취소</button>
      </div>
    </div>
    <label class="small"><input type="checkbox" id="wrFilter" checked> 리뷰: 승부가 갈리기 전(승률 <span id="wrRange">3~97%</span>) 실수만 <span id="filterWhy"></span></label>
    <div class="small" id="reviewWhy"></div>

    <div id="clocks" class="row" hidden>
      <div id="clockB" class="clock"></div><div id="clockW" class="clock"></div>
    </div>

    <label>시간 (다음 '새 판'부터) <input type="checkbox" id="tUnl"> 무제한<br>
      <select id="tMain"></select> <select id="tByo"></select> <select id="tPer"></select>
    </label>

    <label>치수 (다음 '새 판'부터)<br>
      <select id="handicap" style="width:100%"></select>
    </label>

    <label>상대 수준<br>
      <select id="level" style="width:100%"></select>
    </label>
    <div class="small" id="levelWhy"></div>

    <div>
      <div class="barlbl"><span>흑</span><span id="scoreTxt">형세 —</span><span>백</span></div>
      <div class="bar"><div class="b" id="barB" style="width:50%"></div><div class="w"></div></div>
    </div>
    <div class="stat"><span>흑이 따낸 돌 <b id="capB">0</b></span><span>백이 따낸 돌 <b id="capW">0</b></span></div>
    <div class="stat small"><span id="moveNo">0수</span>
      <span><button class="pass" id="bPass">패스</button> · <label><input type="checkbox" id="sound" checked> 소리</label></span></div>
    <div class="small" id="sgf"></div>
    <label class="small">판·돌 디자인 <select id="skin" style="font-size:16px;padding:6px"></select>
      <select id="skinBoard" style="font-size:16px;padding:6px" hidden></select>
      <select id="skinStones" style="font-size:16px;padding:6px" hidden></select></label>
    <label class="small">소리 <select id="pack" style="font-size:16px;padding:6px"></select> <span id="packNote"></span></label>
  </div>
</div>
<script>
const N = 19, M = 20, STEP = (400 - 2 * M) / (N - 1);
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const COLS = 'ABCDEFGHJKLMNOPQRST';
let S = null, busy = false;
let filterDefaultFor = null;  // 리뷰 구간 체크 기본값을 정한 판

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
const P = i => M + i * STEP;

// ---- 판·돌 디자인(스킨): 기본 = 우리 SVG. 외부 스킨팩 = 레포 밖 ~/.monkos/go-board-skins/<팩>/ (규격 SKINS.md)
// 판 이미지 위에 격자·화점은 늘 우리가 그린다. 돌은 스프라이트에서 칸을 잘라 판 칸 크기에 맞춰 늘린다.
let skinName = 'builtin', skinBoard = null, skinStones = null;
try {
  skinName = localStorage.getItem('goBoardSkin') || 'builtin';
  skinBoard = localStorage.getItem('goBoardSkinBoard');
  skinStones = localStorage.getItem('goBoardSkinStones');
} catch (e) { /* 저장소 불가 — 기본값 */ }

function skin() {
  const pk = S && S.skins && S.skins[skinName];
  if (!pk) return null;
  const board = pk.boards.includes(skinBoard) ? skinBoard : pk.spec.board;
  const stones = pk.stones.includes(skinStones) ? skinStones : pk.spec.stones;
  return { spec: pk.spec, board: board && `/skin/${skinName}/${board}`, stones: stones && `/skin/${skinName}/${stones}` };
}

function drawBase() {
  svg.innerHTML = '';
  const sk = skin(), line = sk ? sk.spec.grid : 'var(--line)', lw = sk ? sk.spec.gridWidth : .7;
  if (sk && sk.board) {
    el('image', { href: sk.board, x: 0, y: 0, width: 400, height: 400, preserveAspectRatio: 'xMidYMid slice' });
  } else {
    el('rect', { x: 0, y: 0, width: 400, height: 400, fill: 'var(--wood)' });
  }
  if (sk) {  // 돌 그림자
    const sh = sk.spec.shadow || {}, defs = el('defs', {}), f = el('filter', { id: 'stoneShadow', x: '-20%', y: '-20%', width: '150%', height: '150%' }, defs);
    el('feDropShadow', { dx: sh.dx || 0, dy: sh.dy || 0, stdDeviation: sh.blur || 0, 'flood-opacity': sh.opacity || 0 }, f);
  }
  for (let i = 0; i < N; i++) {
    el('line', { x1: P(0), y1: P(i), x2: P(N - 1), y2: P(i), stroke: line, 'stroke-width': lw });
    el('line', { x1: P(i), y1: P(0), x2: P(i), y2: P(N - 1), stroke: line, 'stroke-width': lw });
  }
  for (const a of [3, 9, 15]) for (const b of [3, 9, 15]) el('circle', { cx: P(a), cy: P(b), r: 2.2, fill: line });
  for (let i = 0; i < N; i++) {
    el('text', { x: P(i), y: 9, 'font-size': 7, 'text-anchor': 'middle', fill: line }).textContent = COLS[i];
    el('text', { x: 6, y: P(i) + 2.5, 'font-size': 7, 'text-anchor': 'middle', fill: line }).textContent = N - i;
  }
}

function drawStone(x, y, c, opacity) {
  const sk = skin();
  if (sk && sk.stones) {
    const cell = sk.spec[c === 'B' ? 'black' : 'white'], r = STEP * .5 * (sk.spec.stoneScale || 1);
    const sp = sk.spec.sprite || [256, 240];
    const g = el('g', { filter: 'url(#stoneShadow)', opacity });
    // 0.5px 안쪽으로 잘라 옆 칸 픽셀이 보간으로 묻어나는 것을 막는다
    const vb = [cell[0] + .5, cell[1] + .5, cell[2] - 1, cell[3] - 1].join(' ');
    const box = el('svg', { x: P(x) - r, y: P(y) - r, width: 2 * r, height: 2 * r, viewBox: vb }, g);
    el('image', { href: sk.stones, x: 0, y: 0, width: sp[0], height: sp[1] }, box);
    return;
  }
  el('circle', { cx: P(x), cy: P(y), r: STEP * .47, fill: c === 'B' ? '#151515' : '#fafaf5',
                 stroke: c === 'B' ? '#000' : '#888', 'stroke-width': .6, opacity });
}

function render() {
  drawBase();
  const g = S.board;
  const sc = S.scoring;
  const dead = new Set(sc ? sc.dead.map(([x, y]) => x + ',' + y) : []);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = g[y][x]; if (!c) continue;
    const isDead = dead.has(x + ',' + y);
    drawStone(x, y, c, isDead ? .35 : 1);
    if (isDead) {
      const d = STEP * .22, col = '#c0392b';
      el('line', { x1: P(x) - d, y1: P(y) - d, x2: P(x) + d, y2: P(y) + d, stroke: col, 'stroke-width': 1.6 });
      el('line', { x1: P(x) - d, y1: P(y) + d, x2: P(x) + d, y2: P(y) - d, stroke: col, 'stroke-width': 1.6 });
    }
  }
  if (sc) for (const [x, y, o] of sc.terr) {
    const d = STEP * .18;
    el('rect', { x: P(x) - d, y: P(y) - d, width: 2 * d, height: 2 * d, fill: o === 'B' ? '#151515' : '#fafaf5',
                 stroke: o === 'B' ? '#000' : '#777', 'stroke-width': .5 });
  }
  if (S.last) {
    const [x, y] = S.last, c = g[y][x];
    el('circle', { cx: P(x), cy: P(y), r: STEP * .2, fill: 'none', stroke: c === 'B' ? '#fff' : '#c0392b', 'stroke-width': 1.8 });
  }
  const me = S.user === 'B' ? '흑' : '백';
  let turn;
  if (S.result) turn = `대국 종료 — ${S.resultKo}`;
  else if (S.scoring) turn = '계가 중';
  else if (busy) turn = 'KataGo 생각 중';
  else if (S.toMove === S.user) turn = `작가님(${me}) 차례`;
  else turn = 'KataGo 차례';
  const turnEl = document.getElementById('turn');
  turnEl.textContent = turn;
  turnEl.classList.toggle('dots', busy && !S.result);
  let msg = S.error || S.message || '';
  if (!S.error && S.lastPass && !S.result) msg = `${S.lastColor === 'B' ? '흑' : '백'}이 패스했습니다. ` + msg;
  if (!S.strongOk) msg = (S.strongError || '엔진 기동 실패') + ' ' + msg;
  document.getElementById('msg').textContent = msg;
  document.getElementById('capB').textContent = S.captures.B;
  document.getElementById('capW').textContent = S.captures.W;
  const ha = S.handicap ? `${S.handicap}점 접바둑` : '호선';
  document.getElementById('moveNo').textContent = `${S.moveNo}수 · ${ha} · 덤 ${S.komi} · 상대 ${S.levelLabel}`;
  const tm = document.getElementById('tMain');
  if (!tm.options.length) {
    for (const m of [0, 1, 5, 10, 20, 30, 60]) tm.add(new Option(`기본 ${m}분`, m));
    for (const b of [10, 20, 30, 40, 60]) document.getElementById('tByo').add(new Option(`초읽기 ${b}초`, b));
    for (const n of [1, 3, 5]) document.getElementById('tPer').add(new Option(`${n}회`, n));
    const t = S.time || { main: 0, byo: 20, periods: 3 };
    tm.value = t.main; document.getElementById('tByo').value = t.byo; document.getElementById('tPer').value = t.periods;
    document.getElementById('tUnl').checked = !S.time;
    const pk = document.getElementById('pack');
    pk.add(new Option('기본 (바둑돌 녹음 B)', 'builtin'));
    for (const n in S.packs || {}) pk.add(new Option(`${n}${S.packs[n].note.includes('내부') ? ' (내부 실험 — 출시 전 교체)' : ''}`, n));
    pk.value = S.packs && S.packs[packName] ? packName : 'builtin';
    const sk = document.getElementById('skin');
    sk.add(new Option('기본 (MONK)', 'builtin'));
    for (const n in S.skins || {}) sk.add(new Option(`${n}${S.skins[n].note.includes('내부') ? ' (내부 실험 — 출시 전 교체)' : ''}`, n));
    sk.value = S.skins && S.skins[skinName] ? skinName : 'builtin';
    const save = () => {
      try {
        localStorage.setItem('goBoardSkin', skinName);
        if (skinBoard) localStorage.setItem('goBoardSkinBoard', skinBoard);
        if (skinStones) localStorage.setItem('goBoardSkinStones', skinStones);
      } catch (e) { /* 저장소 불가 — 이번 창에서만 */ }
    };
    const fillSub = () => {
      const pkS = S.skins && S.skins[skinName], sb = document.getElementById('skinBoard'), ss = document.getElementById('skinStones');
      sb.innerHTML = ''; ss.innerHTML = '';
      sb.hidden = ss.hidden = !pkS;
      if (!pkS) return;
      for (const b of pkS.boards) sb.add(new Option(`판 ${b.replace(/\.\w+$/, '')}`, b));
      for (const t of pkS.stones) ss.add(new Option(`돌 ${t.replace(/\.\w+$/, '')}`, t));
      sb.value = pkS.boards.includes(skinBoard) ? skinBoard : pkS.spec.board;
      ss.value = pkS.stones.includes(skinStones) ? skinStones : pkS.spec.stones;
    };
    fillSub();
    sk.onchange = () => { skinName = sk.value; skinBoard = skinStones = null; fillSub(); save(); render(); };
    document.getElementById('skinBoard').onchange = e => { skinBoard = e.target.value; save(); render(); };
    document.getElementById('skinStones').onchange = e => { skinStones = e.target.value; save(); render(); };
    pk.onchange = () => {
      packName = pk.value;
      try { localStorage.setItem('goBoardPack', packName); } catch (e) { /* 저장소 불가 — 이번 창에서만 */ }
      buildSounds(S); setTimeout(() => moveSound(0), 300);
    };
  }
  const hs = document.getElementById('handicap');
  if (!hs.options.length) {
    for (const h of S.handicaps) hs.add(new Option(h ? `${h}점 (작가님 흑, 덤 0.5, 백 먼저)` : '호선 (덤 6.5)', h));
    hs.value = S.handicap;
  }
  if (S.score !== null && S.score !== undefined) {
    const s = S.score, pct = Math.max(3, Math.min(97, 50 + s * 2.5));
    document.getElementById('barB').style.width = pct + '%';
    const lead = Math.abs(s) < 0.5 ? '거의 반반' : `${s > 0 ? '흑' : '백'} ${Math.abs(s).toFixed(1)}집 우세`;
    document.getElementById('scoreTxt').textContent = `형세: ${lead}`;
  } else {
    document.getElementById('barB').style.width = '50%';
    document.getElementById('scoreTxt').textContent = '형세 —';
  }
  const lv = document.getElementById('level');
  if (!lv.options.length) {
    lv.add(new Option('KataGo 최강', 'strong'));
    for (const r of S.ranks) lv.add(new Option(`사람처럼 두는 KataGo — ${r.label}`, r.v));
  }
  for (const o of lv.options) if (o.value !== 'strong') o.disabled = !S.humanOk;
  lv.value = S.level;
  document.getElementById('levelWhy').textContent = S.humanOk ? '' : `급수 상대 비활성: ${S.humanReason}`;
  const rb = document.getElementById('bReview');
  rb.disabled = !S.review.ok;
  rb.classList.toggle('hl', !!S.result && S.review.ok);  // 종국 후 리뷰로 시선 유도
  document.getElementById('bUndo').disabled = !!S.result;
  document.getElementById('bScore').disabled = !!S.result || !!S.scoring || !S.moveNo;
  const panel = document.getElementById('scorePanel');
  panel.hidden = !sc;
  if (sc) {
    document.getElementById('scoreSum').textContent = `흑 ${sc.black}집 · 백 ${sc.white}집 → ${sc.resultKo}`;
    document.getElementById('scoreDetail').textContent =
      `흑 = 집 ${sc.terrB} + 따낸 돌·사석 ${sc.prisB} / 백 = 집 ${sc.terrW} + 따낸 돌·사석 ${sc.prisW} + 덤 ${sc.komi}` +
      ` (한국 규칙 집 계산) · KataGo 판정: ${sc.kataKo}` +
      (sc.result !== sc.kata ? ' — 결과가 다르면 사석 표시를 확인해 주세요(돌을 누르면 바뀝니다)' : '');
  }
  document.getElementById('bResign').disabled = !!S.result || !S.moveNo;
  document.getElementById('bPass').disabled = !!S.result || !!S.scoring;
  document.getElementById('reviewWhy').textContent = S.review.ok ? '' : S.review.reason;
  const wf = document.getElementById('wrFilter');
  wf.disabled = !S.review.filterOk;
  // 접바둑은 흑 승률이 처음부터 97%를 넘기 쉬워 구간을 걸면 실수가 거의 안 잡힌다 → 판이 바뀔 때 기본값만 다시 정함
  const gameKey = String(S.handicap);
  if (gameKey !== filterDefaultFor) { wf.checked = !S.handicap; filterDefaultFor = gameKey; }
  if (!S.review.filterOk) wf.checked = false;
  document.getElementById('filterWhy').textContent = S.review.filterOk ? '(임시 기본값)' : `— ${S.review.filterReason || ''}`;
  if (S.review.wrRange) document.getElementById('wrRange').textContent =
    S.review.wrRange.split(',').map(v => Math.round(v * 100)).join('~') + '%';
  if (S.testMode) document.title = 'MONK 바둑판 (테스트)';
  document.getElementById('sgf').textContent = S.sgf ? `기보 자동 저장: ${S.sgf}` : '';
}

// ---- 소리: 팩 3종 — ① 기본 = 레포 실녹음(Freesound CC0, sounds/SOUNDS.md, 작가님 선택 B)
// ② sounds/custom/ 의 stone*.wav·capture*.wav(작가님 녹음, 있으면 기본을 덮음)
// ③ 외부 팩 = 레포 밖 ~/.monkos/go-board-sounds/<팩>/ (stone0=착수, stone1/2/3=따냄 1·2·3점+, *s=변형,
//    count1~11=초읽기 음성, remain1~3=남은 횟수, start=대국 시작, counting=계가). 팩 선택은 브라우저에 저장.
// 지연 0을 위해 미리 디코딩해 두고, 재생은 기다림 없이 즉시 시작한다(디코딩 전이면 그 한 번만 무음).
const BUILTIN = { stone: ['b_hongsungbock_1', 'b_hongsungbock_2', 'b_hongsungbock_3'], capture: ['capture_mpooman471'] };
let SND = null;  // 현재 팩의 소리 표 — {stone:[url], cap:{1:[url],2:[],3:[]}|null, overlay:[url], count:{}, remain:{}, start, counting}
let actx = null;
let soundOn = true;
let packName = 'builtin';
const decoded = {};
try {
  soundOn = localStorage.getItem('goBoardSound') !== 'off';
  packName = localStorage.getItem('goBoardPack') || 'builtin';
} catch (e) { /* 저장소 불가 — 기본값 */ }

function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC({ latencyHint: 'interactive' });
  }
  return actx;
}

function unlockAudio() {  // 브라우저는 첫 사용자 동작 전에는 소리를 막는다 — 첫 누름에서 연다
  const a = audio();
  if (a.state === 'suspended') a.resume();
}

function buildSounds(state) {
  const pack = state.packs && state.packs[packName];
  if (pack) {
    const base = `/pack/${packName}/`, has = n => pack.files.find(f => f.replace(/\.(mp3|wav)$/, '') === n);
    const urls = names => names.map(has).filter(Boolean).map(f => base + f);
    const one = n => (has(n) ? base + has(n) : null);
    const cap = { 1: urls(['stone1', 'stone1s']), 2: urls(['stone2', 'stone2s']), 3: urls(['stone3', 'stone3s']) };
    const count = {}, remain = {};
    for (let i = 1; i <= 11; i++) count[i] = one('count' + i);
    for (let i = 1; i <= 3; i++) remain[i] = one('remain' + i);
    SND = { stone: urls(['stone0', 'stone0s']), cap: cap[1].length ? cap : null, overlay: [], count, remain,
            start: one('start'), counting: one('counting'), note: pack.note };
  } else {
    packName = 'builtin';
    const c = state.sounds || {};
    const st = (c.stone && c.stone.length ? c.stone : BUILTIN.stone).map(f => `/sounds/${f}.wav`);
    const ov = (c.capture && c.capture.length ? c.capture : BUILTIN.capture).map(f => `/sounds/${f}.wav`);
    SND = { stone: st, cap: null, overlay: ov, count: {}, remain: {}, start: null, counting: null, note: '' };
  }
  const all = [...SND.stone, ...SND.overlay, ...(SND.cap ? [...SND.cap[1], ...SND.cap[2], ...SND.cap[3]] : []),
               ...Object.values(SND.count), ...Object.values(SND.remain), SND.start, SND.counting].filter(Boolean);
  for (const u of all) {
    if (decoded[u] !== undefined) continue;
    decoded[u] = null;
    fetch(u).then(r => r.arrayBuffer()).then(b => audio().decodeAudioData(b))
      .then(buf => { decoded[u] = buf; }).catch(() => { delete decoded[u]; });
  }
}

const jitter = (v, r) => v * (1 + (Math.random() * 2 - 1) * r);
const pick = list => list[Math.floor(Math.random() * list.length)];

function playNow(url, delay, gain, rate) {
  const buf = url && decoded[url];
  if (!buf) return false;
  const a = audio();
  if (a.state === 'suspended') a.resume();
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = buf; src.playbackRate.value = rate || 1; g.gain.value = gain;
  src.connect(g); g.connect(a.destination);
  src.start(a.currentTime + (delay || 0));
  return true;
}

// 착수 1회의 소리 — 따낸 돌 수에 맞춰(팩에 따냄 전용 음이 있으면 그것으로, 없으면 딱 + 따냄 겹침)
function moveSound(caps) {
  if (!soundOn || !SND) return false;
  try {
    if (caps > 0 && SND.cap) return playNow(pick(SND.cap[Math.min(3, caps)]), 0, 0.95, 1);
    const ok = playNow(pick(SND.stone), 0, jitter(0.9, 0.12), SND.cap ? 1 : jitter(1, 0.03));
    if (caps > 0 && SND.overlay.length) playNow(pick(SND.overlay), 0.06, 0.7, jitter(1, 0.03));
    return ok;
  } catch (e) { return false; }
}

function voice(url) {  // 초읽기·안내 음성(팩에 있을 때만)
  if (!soundOn || !url) return false;
  try { return playNow(url, 0, 1, 1); } catch (e) { return false; }
}

// 내 수로 잡히는 상대 돌 — 서버 왕복 전에 따냄 소리를 내고 판에서 바로 걷어내려고 브라우저에서 계산
function capturedBy(board, x, y, c) {
  const o = c === 'B' ? 'W' : 'B', out = [], seen = new Set();
  const g = board.map(r => r.slice()); g[y][x] = c;
  for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || g[ny][nx] !== o || seen.has(nx + ',' + ny)) continue;
    const grp = [], st = [[nx, ny]]; let libs = 0; seen.add(nx + ',' + ny);
    while (st.length) {
      const [cx, cy] = st.pop(); grp.push([cx, cy]);
      for (const [ax, ay] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
        if (ax < 0 || ay < 0 || ax >= N || ay >= N) continue;
        const v = g[ay][ax];
        if (v === null) libs++;
        else if (v === o && !seen.has(ax + ',' + ay)) { seen.add(ax + ',' + ay); st.push([ax, ay]); }
      }
    }
    if (!libs) out.push(...grp);
  }
  return out;
}

function notice(text) {
  document.getElementById('msg').textContent = text;
}

async function call(path, body) {
  if (busy) { notice('상대가 생각 중입니다'); return; }
  busy = true; render();
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (j.busy) {  // 다른 탭 등에서 엔진이 생각 중 — 판은 서버 정본으로 다시 받는다
      busy = false;
      S = await (await fetch('/api/state')).json();
      render(); notice(j.error); return;
    }
    const prev = S;
    S = j;
    playSounds(prev, S, path === '/api/play' && !(body && body.pass));
  } catch (e) { S.error = '서버 연결 실패 — run.sh가 켜져 있는지 확인해 주세요'; }
  busy = false; render();
}

// 응답 전후 비교로 엔진 수의 소리를 낸다(내 수의 딱·따냄은 누르는 순간에 이미 냈다)
function playSounds(prev, cur, myStone) {
  if (!prev || cur.error && myStone) return;
  const me = cur.user, eng = me === 'B' ? 'W' : 'B';
  const theirs = (cur.captures[eng] || 0) - (prev.captures[eng] || 0);
  const engMoved = cur.moveNo > prev.moveNo + (myStone ? 1 : 0) && cur.lastColor === eng && !cur.lastPass;
  if (engMoved && cur.moveNo > prev.moveNo) {
    moveSound(theirs);
    clockMoved(eng);
  }
}

document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

function boardXY(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round((p.x - M) / STEP), Math.round((p.y - M) / STEP)];
}

// 누르는 순간(pointerdown) 처리 — click(손을 뗄 때)보다 빠르다
function tapAt(x, y) {
  if (!S || S.result) return;
  if (x < 0 || y < 0 || x >= N || y >= N) return;
  if (S.scoring) {
    if (S.board[y][x]) call('/api/score/toggle', { x, y });
    return;
  }
  if (busy) { notice('상대가 생각 중입니다'); return; }
  if (S.toMove !== S.user || S.board[y][x]) return;
  const t0 = performance.now();
  // 즉시 내 돌·따냄을 그리고 소리를 낸다(서버 응답으로 덮어씀)
  const caps = capturedBy(S.board, x, y, S.user);
  S.board[y][x] = S.user; S.last = [x, y]; S.message = ''; S.error = null;
  for (const [cx, cy] of caps) S.board[cy][cx] = null;
  const played = moveSound(caps.length);
  clockMoved(S.user);
  window.__lastTap = { ms: performance.now() - t0, played, caps: caps.length };  // 누름 → 재생 예약까지(실측용)
  call('/api/play', { x, y });
}
svg.addEventListener('pointerdown', ev => { const [x, y] = boardXY(ev); tapAt(x, y); });
document.getElementById('bNew').onclick = async () => {
  filterDefaultFor = null;
  const time = document.getElementById('tUnl').checked ? { unlimited: true } :
    { main: Number(document.getElementById('tMain').value), byo: Number(document.getElementById('tByo').value),
      periods: Number(document.getElementById('tPer').value) };
  await call('/api/new', { handicap: Number(document.getElementById('handicap').value), time });
  initClocks();
  voice(SND && SND.start);
};
document.getElementById('bUndo').onclick = () => call('/api/undo');
document.getElementById('bSwap').onclick = () => call('/api/swap');
document.getElementById('bReview').onclick = async () => {
  if (busy) { notice('상대가 생각 중입니다'); return; }
  const tab = window.open('', '_blank');  // 클릭 순간에 열어야 팝업 차단을 피한다
  await call('/api/review', { wrFilter: document.getElementById('wrFilter').checked });
  if (S.reviewJob && tab) tab.location = `/review/${S.reviewJob}`;
  else if (tab) tab.close();
};
document.getElementById('bResign').onclick = () => {
  if (busy) { notice('상대가 생각 중입니다'); return; }
  if (confirm('정말 기권하시겠어요? 이 판은 여기서 끝나고 기보에 기권으로 저장됩니다.')) call('/api/resign');
};
const soundBox = document.getElementById('sound');
soundBox.checked = soundOn;
soundBox.onchange = () => {
  soundOn = soundBox.checked;
  try { localStorage.setItem('goBoardSound', soundOn ? 'on' : 'off'); } catch (e) { /* 저장소 불가 — 이번 창에서만 */ }
  if (soundOn) moveSound(0);
};
document.getElementById('bPass').onclick = () => call('/api/play', { pass: true });
document.getElementById('bScore').onclick = () => { voice(SND && SND.counting); call('/api/score'); };
document.getElementById('bScoreOk').onclick = () => call('/api/score/confirm');
document.getElementById('bScoreCancel').onclick = () => call('/api/score/cancel');
document.getElementById('level').onchange = e => call('/api/level', { level: e.target.value });

// ---- 시계(초읽기): 화면이 재고 서버에는 시간패만 알린다. 엔진 시계는 표시만(초읽기 마지막 1초에서 멈춤 — 시간패 없음)
let clocks = null, clockTimer = null, clockLast = 0;

function makeClock(t) {
  return t ? { main: t.main * 60, byo: t.byo, periods: t.periods, left: t.periods, period: t.byo, inByo: t.main === 0, flagged: false } : null;
}

function initClocks() {
  clocks = S.time ? { B: makeClock(S.time), W: makeClock(S.time) } : null;
  clockLast = performance.now();
  if (!clockTimer) clockTimer = setInterval(clockTick, 100);
  renderClocks();
}

function tickClock(c, dt, emit) {
  if (!c || c.flagged) return;
  if (!c.inByo) {
    c.main -= dt;
    if (c.main > 0) return;
    c.inByo = true; dt = -c.main; c.main = 0; c.period = c.byo; emit('byo');
  }
  const before = c.period;
  c.period -= dt;
  for (let k = 10; k >= 1; k--) if (before > k && c.period <= k) emit('count' + k);
  if (c.period <= 0) {
    c.left -= 1;
    if (c.left <= 0) { c.flagged = true; c.period = 0; emit('flag'); return; }
    c.period += c.byo; emit('remain' + c.left);
  }
}

function clockMoved(color) {  // 한 수를 두면 초읽기 한 회가 처음부터
  const c = clocks && clocks[color];
  if (c && c.inByo) c.period = c.byo;
}

function clockTick() {
  const now = performance.now(), dt = (now - clockLast) / 1000;
  clockLast = now;
  if (!clocks || !S || S.result || S.scoring) return renderClocks();
  const eng = S.user === 'B' ? 'W' : 'B';
  const running = busy || S.toMove !== S.user ? eng : S.user;
  const c = clocks[running];
  if (running === eng) {  // 엔진: 차감만, 시간패 없음
    tickClock(c, dt, () => {});
    if (c.flagged) { c.flagged = false; c.left = 1; c.period = 1; }
  } else {
    tickClock(c, dt, e => {
      if (e.startsWith('count')) voice(SND.count[Number(e.slice(5))]);
      else if (e.startsWith('remain')) voice(SND.remain[Number(e.slice(6))]);
      else if (e === 'flag') call('/api/timeout', { color: S.user });
    });
  }
  renderClocks();
}

function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function renderClocks() {
  const box = document.getElementById('clocks');
  if (!box) return;
  box.hidden = !clocks;
  if (!clocks || !S) return;
  const eng = S.user === 'B' ? 'W' : 'B';
  const running = S.result || S.scoring ? null : (busy || S.toMove !== S.user ? eng : S.user);
  for (const col of ['B', 'W']) {
    const c = clocks[col], el = document.getElementById('clock' + col);
    const who = col === S.user ? '작가님' : 'KataGo';
    const t = c.inByo ? `초읽기 ${fmt(c.period)} · ${c.left}회` : `${fmt(c.main)} + ${c.byo}초 ${c.left}회`;
    el.textContent = `${col === 'B' ? '흑' : '백'} ${who} — ${t}`;
    el.classList.toggle('run', running === col);
    el.classList.toggle('urgent', running === col && c.inByo && c.period <= 10);
  }
}

// 테스트 포트 전용 자가 측정(?selftest=1): 누름→재생 예약 지연·따냄 판정. 결과는 #selftest 에 남긴다
async function selftest() {
  const out = [], blank = () => Array.from({ length: N }, () => Array(N).fill(null));
  const qp = new URLSearchParams(location.search).get('pack');
  if (qp) { packName = qp; buildSounds(S); }
  unlockAudio();
  for (let i = 0; i < 30 && Object.values(decoded).some(v => v === null); i++) {
    await new Promise(r => setTimeout(r, 100));
  }
  out.push('decoded=' + Object.values(decoded).filter(Boolean).length);
  const b = blank(); b[0][0] = 'W'; b[1][0] = 'B';  // A19 백 1점, A18 흑 → B19 흑이면 따냄
  const ts = [];
  for (let i = 0; i < 20; i++) {
    const t0 = performance.now();
    const caps = capturedBy(b, 1, 0, 'B');
    const ok = moveSound(caps.length);
    ts.push([performance.now() - t0, ok]);
  }
  const ms = ts.map(t => t[0]).sort((p, q) => p - q);
  out.push(`tap_ms_median=${ms[10].toFixed(3)} max=${ms[19].toFixed(3)} played=${ts.filter(t => t[1]).length}/20`);
  const b3 = blank(); b3[0][0] = 'W'; b3[0][1] = 'W'; b3[1][0] = 'B'; b3[1][1] = 'B';
  out.push(`capture1=${capturedBy(b, 1, 0, 'B').length} capture2=${capturedBy(b3, 2, 0, 'B').length} negative=${capturedBy(b3, 5, 5, 'B').length}`);
  out.push(`pack=${packName} stone=${SND.stone.length} cap=${SND.cap ? 'pack' : 'overlay'} count=${Object.values(SND.count).filter(Boolean).length} remain=${Object.values(SND.remain).filter(Boolean).length}`);
  // 시계: 20초 3회 가상 진행 — 초읽기 1회 소진·음성 예약·소진 시 시간패 판정
  const c = makeClock({ main: 0, byo: 2, periods: 2 }), ev = [];
  for (let t = 0; t < 50; t++) tickClock(c, 0.1, e => ev.push(e));
  out.push(`clock_events=${ev.join(',')} flagged=${c.flagged}`);
  out.push(`ctx=${actx.state} baseLatency=${(actx.baseLatency * 1000).toFixed(1)}ms outputLatency=${((actx.outputLatency || 0) * 1000).toFixed(1)}ms`);
  const d = document.createElement('div'); d.id = 'selftest'; d.textContent = 'SELFTEST ' + out.join(' | ');
  document.body.appendChild(d);
}

fetch('/api/state').then(r => r.json()).then(s => {
  const qs = new URLSearchParams(location.search);
  if (s.testMode && qs.get('skin')) { skinName = qs.get('skin'); skinBoard = qs.get('board'); skinStones = qs.get('stones'); }
  S = s; buildSounds(S); initClocks(); render();
  if (S.testMode && location.search.includes('selftest=1')) selftest();
})
  .catch(() => { document.getElementById('turn').textContent = '서버 연결 실패'; });
</script>
