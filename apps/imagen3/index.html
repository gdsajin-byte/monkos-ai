<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMAGEN 3 I2I Test | MONK AI LAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Pretendard', system-ui, sans-serif; }
    .glow { box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
    .drop-zone { transition: all 0.3s; }
    .drop-zone.dragover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
  </style>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100">
  
  <!-- Header -->
  <header class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="../../index.html" class="text-gray-500 hover:text-white transition">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-black">
          <span class="text-blue-400">IMAGEN 3</span> I2I Test
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded-full">
          <i class="fas fa-check-circle mr-1"></i> Identity Preservation
        </span>
        <span class="px-3 py-1 bg-purple-500/20 text-purple-400 text-xs font-bold rounded-full">
          BLOCK_NONE
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    
    <!-- Server Status -->
    <div id="server-status" class="mb-6 p-4 bg-gray-900 rounded-xl border border-gray-800">
      <div class="flex items-center gap-3">
        <div id="status-dot" class="w-3 h-3 bg-gray-600 rounded-full animate-pulse"></div>
        <span id="status-text" class="text-sm text-gray-400">서버 연결 확인 중...</span>
      </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-8">
      
      <!-- Left: Input -->
      <div class="space-y-6">
        
        <!-- Image Upload -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-image mr-2 text-blue-400"></i>입력 이미지
          </h2>
          
          <div id="drop-zone" class="drop-zone border-2 border-dashed border-gray-700 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 transition">
            <div id="preview-container" class="hidden">
              <img id="preview-image" class="max-h-64 mx-auto rounded-lg">
              <button onclick="clearImage()" class="mt-4 text-sm text-red-400 hover:text-red-300">
                <i class="fas fa-times mr-1"></i> 이미지 제거
              </button>
            </div>
            <div id="upload-prompt" class="space-y-3">
              <i class="fas fa-cloud-upload-alt text-4xl text-gray-600"></i>
              <p class="text-gray-500">이미지를 드래그하거나 클릭하여 업로드</p>
              <p class="text-xs text-gray-600">PNG, JPG (최대 10MB)</p>
            </div>
          </div>
          <input type="file" id="file-input" accept="image/*" class="hidden">
        </div>

        <!-- Style Selection -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-magic mr-2 text-purple-400"></i>스타일 선택
          </h2>
          
          <div class="grid grid-cols-2 gap-3" id="style-buttons">
            <button onclick="selectStyle('id_photo')" class="style-btn active p-4 bg-gray-800 hover:bg-blue-600/20 border border-gray-700 rounded-xl transition text-left">
              <i class="fas fa-id-card text-blue-400 mb-2"></i>
              <div class="text-sm font-bold">증명사진</div>
              <div class="text-xs text-gray-500">ID Photo</div>
            </button>
            <button onclick="selectStyle('profile')" class="style-btn p-4 bg-gray-800 hover:bg-blue-600/20 border border-gray-700 rounded-xl transition text-left">
              <i class="fas fa-user-tie text-emerald-400 mb-2"></i>
              <div class="text-sm font-bold">프로필</div>
              <div class="text-xs text-gray-500">Business Profile</div>
            </button>
            <button onclick="selectStyle('suit')" class="style-btn p-4 bg-gray-800 hover:bg-blue-600/20 border border-gray-700 rounded-xl transition text-left">
              <i class="fas fa-briefcase text-amber-400 mb-2"></i>
              <div class="text-sm font-bold">정장</div>
              <div class="text-xs text-gray-500">Formal Suit</div>
            </button>
            <button onclick="selectStyle('casual')" class="style-btn p-4 bg-gray-800 hover:bg-blue-600/20 border border-gray-700 rounded-xl transition text-left">
              <i class="fas fa-tshirt text-pink-400 mb-2"></i>
              <div class="text-sm font-bold">캐쥬얼</div>
              <div class="text-xs text-gray-500">Casual Portrait</div>
            </button>
          </div>
        </div>

        <!-- Custom Prompt -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-pen mr-2 text-amber-400"></i>추가 프롬프트 (선택)
          </h2>
          <textarea id="custom-prompt" rows="3" 
            class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none resize-none"
            placeholder="추가 지시사항을 입력하세요 (예: 미소 짓는 표정, 안경 착용 등)"></textarea>
        </div>

        <!-- Options -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-sliders-h mr-2 text-cyan-400"></i>옵션
          </h2>
          
          <div class="space-y-4">
            <!-- Aspect Ratio -->
            <div>
              <label class="text-xs text-gray-500 mb-2 block">비율</label>
              <select id="aspect-ratio" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-sm">
                <option value="3:4">3:4 (증명사진)</option>
                <option value="1:1">1:1 (정사각형)</option>
                <option value="4:3">4:3 (가로)</option>
                <option value="16:9">16:9 (와이드)</option>
              </select>
            </div>
            
            <!-- Identity Preservation Toggle -->
            <div class="flex items-center justify-between">
              <div>
                <div class="text-sm font-bold">정체성 유지</div>
                <div class="text-xs text-gray-500">얼굴/체형 보존 프롬프트 적용</div>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="preserve-identity" checked class="sr-only peer">
                <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
              </label>
            </div>
          </div>
        </div>

        <!-- Generate Button -->
        <button id="generate-btn" onclick="generate()" 
          class="w-full py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-xl font-bold text-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fas fa-wand-magic-sparkles mr-2"></i>
          <span id="btn-text">이미지 변환</span>
        </button>
        
      </div>

      <!-- Right: Output -->
      <div class="space-y-6">
        
        <!-- Result -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6 min-h-[500px]">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-sparkles mr-2 text-yellow-400"></i>생성 결과
          </h2>
          
          <div id="result-container" class="flex items-center justify-center h-[400px]">
            <div id="result-placeholder" class="text-center text-gray-600">
              <i class="fas fa-image text-6xl mb-4 opacity-30"></i>
              <p>이미지를 업로드하고 변환하세요</p>
            </div>
            <img id="result-image" class="hidden max-h-[400px] rounded-xl glow">
          </div>
          
          <!-- Download -->
          <div id="download-section" class="hidden mt-4 flex gap-3">
            <button onclick="downloadResult()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold transition">
              <i class="fas fa-download mr-2"></i>다운로드
            </button>
            <button onclick="sendToInput()" class="flex-1 py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold transition">
              <i class="fas fa-redo mr-2"></i>재변환
            </button>
          </div>
        </div>

        <!-- Metadata -->
        <div id="metadata-section" class="hidden bg-gray-900 rounded-2xl border border-gray-800 p-6">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-info-circle mr-2 text-cyan-400"></i>메타데이터
          </h2>
          <div id="metadata-content" class="text-xs font-mono text-gray-500 bg-gray-950 p-4 rounded-lg overflow-auto max-h-32"></div>
        </div>

        <!-- Logs -->
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
          <h2 class="text-sm font-bold text-gray-400 mb-4">
            <i class="fas fa-terminal mr-2 text-green-400"></i>로그
          </h2>
          <div id="log-container" class="text-xs font-mono text-gray-500 bg-gray-950 p-4 rounded-lg h-32 overflow-auto">
            <div class="text-gray-600">[시스템] 준비 완료</div>
          </div>
        </div>
        
      </div>
    </div>
  </main>

  <script>
    // =====================================================
    // Configuration
    // =====================================================
    const API_URL = 'http://localhost:3003';
    let uploadedImage = null;
    let resultImage = null;
    let selectedStyle = 'id_photo';

    // =====================================================
    // Server Status Check
    // =====================================================
    async function checkServer() {
      try {
        const res = await fetch(`${API_URL}/health`);
        const data = await res.json();
        
        document.getElementById('status-dot').className = 'w-3 h-3 bg-emerald-500 rounded-full';
        document.getElementById('status-text').innerHTML = `
          <span class="text-emerald-400">✓ 서버 연결됨</span>
          <span class="text-gray-600 ml-2">|</span>
          <span class="text-gray-500 ml-2">${data.model}</span>
          <span class="text-gray-600 ml-2">|</span>
          <span class="text-purple-400 ml-2">${data.safetyLevel}</span>
        `;
        addLog('서버 연결 성공', 'success');
      } catch (e) {
        document.getElementById('status-dot').className = 'w-3 h-3 bg-red-500 rounded-full';
        document.getElementById('status-text').innerHTML = `
          <span class="text-red-400">✗ 서버 연결 실패</span>
          <span class="text-gray-600 ml-2">- npm run dev:backend 실행 필요</span>
        `;
        addLog('서버 연결 실패: ' + e.message, 'error');
      }
    }

    // =====================================================
    // Image Upload
    // =====================================================
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        addLog('이미지 파일만 업로드 가능합니다', 'error');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImage = e.target.result;
        showPreview(uploadedImage);
        addLog(`이미지 로드: ${file.name} (${(file.size / 1024).toFixed(1)}KB)`, 'info');
      };
      reader.readAsDataURL(file);
    }

    function showPreview(src) {
      document.getElementById('upload-prompt').classList.add('hidden');
      document.getElementById('preview-container').classList.remove('hidden');
      document.getElementById('preview-image').src = src;
    }

    function clearImage() {
      uploadedImage = null;
      document.getElementById('upload-prompt').classList.remove('hidden');
      document.getElementById('preview-container').classList.add('hidden');
      document.getElementById('preview-image').src = '';
      fileInput.value = '';
      addLog('이미지 제거됨', 'info');
    }

    // =====================================================
    // Style Selection
    // =====================================================
    function selectStyle(style) {
      selectedStyle = style;
      document.querySelectorAll('.style-btn').forEach(btn => {
        btn.classList.remove('active', 'border-blue-500', 'bg-blue-600/20');
        btn.classList.add('border-gray-700');
      });
      event.currentTarget.classList.add('active', 'border-blue-500', 'bg-blue-600/20');
      event.currentTarget.classList.remove('border-gray-700');
      addLog(`스타일 선택: ${style}`, 'info');
    }

    // =====================================================
    // Generate
    // =====================================================
    async function generate() {
      if (!uploadedImage) {
        addLog('이미지를 먼저 업로드하세요', 'error');
        return;
      }

      const btn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');
      
      btn.disabled = true;
      btnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>변환 중...';
      
      addLog('이미지 변환 요청...', 'info');

      try {
        const response = await fetch(`${API_URL}/api/i2i`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            inputImage: uploadedImage,
            prompt: document.getElementById('custom-prompt').value,
            style: selectedStyle,
            aspectRatio: document.getElementById('aspect-ratio').value,
            preserveIdentity: document.getElementById('preserve-identity').checked
          })
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || '변환 실패');
        }

        resultImage = data.image;
        showResult(resultImage, data.metadata);
        addLog('✅ 변환 성공!', 'success');

      } catch (error) {
        addLog('❌ 오류: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btnText.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>이미지 변환';
      }
    }

    function showResult(src, metadata) {
      document.getElementById('result-placeholder').classList.add('hidden');
      document.getElementById('result-image').classList.remove('hidden');
      document.getElementById('result-image').src = src;
      document.getElementById('download-section').classList.remove('hidden');
      
      if (metadata) {
        document.getElementById('metadata-section').classList.remove('hidden');
        document.getElementById('metadata-content').textContent = JSON.stringify(metadata, null, 2);
      }
    }

    // =====================================================
    // Actions
    // =====================================================
    function downloadResult() {
      if (!resultImage) return;
      const link = document.createElement('a');
      link.href = resultImage;
      link.download = `imagen3_${selectedStyle}_${Date.now()}.png`;
      link.click();
      addLog('이미지 다운로드됨', 'success');
    }

    function sendToInput() {
      if (!resultImage) return;
      uploadedImage = resultImage;
      showPreview(resultImage);
      addLog('결과 이미지를 입력으로 전송', 'info');
    }

    // =====================================================
    // Logging
    // =====================================================
    function addLog(message, type = 'info') {
      const container = document.getElementById('log-container');
      const time = new Date().toLocaleTimeString();
      const colors = {
        info: 'text-gray-400',
        success: 'text-emerald-400',
        error: 'text-red-400'
      };
      container.innerHTML += `<div class="${colors[type] || colors.info}">[${time}] ${message}</div>`;
      container.scrollTop = container.scrollHeight;
    }

    // =====================================================
    // Init
    // =====================================================
    document.addEventListener('DOMContentLoaded', () => {
      checkServer();
      // 초기 스타일 버튼 활성화
      document.querySelector('.style-btn').classList.add('border-blue-500', 'bg-blue-600/20');
    });
  </script>

</body>
</html>
