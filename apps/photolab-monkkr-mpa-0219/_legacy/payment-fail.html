<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 | MONK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #030508; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="text-center p-8">
        <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold mb-2">결제 실패</h1>
        <p id="error-msg" class="text-gray-400 mb-6">결제가 취소되었거나 오류가 발생했습니다.</p>
        <button onclick="goBack()" class="px-8 py-3 bg-gray-700 text-white font-bold rounded-xl">
            돌아가기
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const message = urlParams.get('message');
        
        if (message) {
            document.getElementById('error-msg').textContent = message;
        }
        
        function goBack() {
            window.location.href = 'ai_photo.html';
        }
    </script>
</body>
</html>
