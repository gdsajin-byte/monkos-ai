<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKOS Photolab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ai: '#60A5FA',
                        local: '#10B981',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .gradient-text { 
            background: linear-gradient(135deg, #60A5FA 0%, #A78BFA 50%, #F472B6 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .lumina-glow {
            box-shadow: 0 0 80px rgba(96, 165, 250, 0.3);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 80px rgba(96, 165, 250, 0.3); }
            50% { box-shadow: 0 0 120px rgba(96, 165, 250, 0.5); }
        }
    </style>
    <script src="../../config.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="../../../index.html" class="text-2xl font-black tracking-tight">MONK<span class="text-ai">.kr</span></a>
            <div class="flex items-center space-x-6">
                <select id="language" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1 text-xs text-white focus:outline-none focus:border-ai">
                    <option value="ko" selected>🇰🇷 한국어</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="zh">🇨🇳 中文</option>
                </select>
                <a href="../ai_lab.html" class="text-sm text-gray-400 hover:text-white transition-colors">← AI LAB</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12">
        
        <!-- Title -->
        <div class="text-center mb-12">
            <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-black mb-4 text-white tracking-tight">
                Imagen 4.0
            </h1>
            <p class="text-gray-500 uppercase tracking-widest text-xs">Professional Engine</p>
        </div>

        <!-- Lumina Generator Card -->
        <div class="w-full max-w-3xl lumina-glow bg-gray-900 border border-ai/30 rounded-3xl p-8 md:p-12">
            
            <!-- Prompt Input -->
            <div class="space-y-4 mb-6">
                <textarea 
                    id="prompt-input" 
                    placeholder="생성하고 싶은 이미지를 설명하세요...&#10;예: 따뜻한 햇살이 비치는 카페 창가, 감성적인 분위기"
                    class="w-full h-32 bg-gray-950 border border-gray-700 rounded-2xl px-6 py-4 text-white placeholder-gray-600 focus:border-ai focus:outline-none resize-none text-sm"
                ></textarea>

                <!-- Options -->
                <div class="grid grid-cols-2 gap-4">
                    <!-- 비율 선택 (9:16만 활성) -->
                    <select id="aspect-ratio" class="bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-ai focus:outline-none">
                        <option value="1:1" disabled class="text-gray-600">❌ 정사각형 (1:1) - 유료</option>
                        <option value="16:9" disabled class="text-gray-600">❌ 와이드 (16:9) - 유료</option>
                        <option value="9:16" selected>✅ 세로 (9:16) - 무료</option>
                        <option value="4:3" disabled class="text-gray-600">❌ 표준 (4:3) - 유료</option>
                    </select>

                    <!-- 해상도 선택 (1K만 활성) -->
                    <select id="resolution" class="bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-ai focus:outline-none">
                        <option value="1k" selected>✅ 1K (1024px) - 무료</option>
                        <option value="2k" disabled class="text-gray-600">❌ 2K (2048px) - 유료</option>
                    </select>
                </div>

                <!-- 스타일 & 기타 옵션 -->
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <select id="style" class="bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-ai focus:outline-none">
                        <option value="realistic">사실적</option>
                        <option value="artistic">예술적</option>
                        <option value="anime">애니메이션</option>
                        <option value="3d">3D 렌더링</option>
                    </select>

                    <select id="others" class="bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-ai focus:outline-none">
                        <option value="none">기타 옵션 없음</option>
                        <option value="enhance">품질 향상</option>
                        <option value="colorize">컬러마이제이션</option>
                        <option value="restore">복원</option>
                    </select>
                </div>
            </div>

            <!-- Generate Button -->
            <button 
                onclick="generateImage()" 
                id="generate-btn"
                class="w-full py-4 bg-gradient-to-r from-ai via-purple-500 to-pink-500 text-white font-black rounded-2xl uppercase tracking-widest hover:shadow-lg hover:shadow-ai/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <i class="fas fa-wand-magic-sparkles mr-2"></i>Generate Image
            </button>

            <!-- Status -->
            <div id="status" class="text-center mt-4 text-sm text-gray-400"></div>
        </div>

        <!-- Generated Image Display -->
        <div id="result-container" class="w-full max-w-3xl mt-8 hidden">
            <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6">
                <img id="generated-image" src="" alt="Generated" class="w-full rounded-2xl">
                <div class="flex justify-between items-center mt-4">
                    <span class="text-xs text-gray-500">생성 완료</span>
                    <button onclick="downloadImage()" class="px-4 py-2 bg-ai text-white rounded-lg text-sm font-bold hover:bg-ai/80 transition-colors">
                        <i class="fas fa-download mr-2"></i>다운로드
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-8 px-6 text-center text-gray-500 text-xs">
        <p>© 2026 MONK STUDIO. Powered by Google Imagen 4.0</p>
    </footer>

    <script>
        const IMAGEN_API_URL = window.MONK_CONFIG?.API?.IMAGEN_PROXY || 'https://monk-imagen-proxy.gdsajin.workers.dev';
        
        async function generateImage() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const aspectRatio = document.getElementById('aspect-ratio').value;
            const style = document.getElementById('style').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('generate-btn');

            if (!prompt) {
                status.textContent = '⚠️ 프롬프트를 입력하세요';
                status.classList.add('text-yellow-400');
                return;
            }

            // UI 업데이트
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>생성 중...';
            status.textContent = 'Imagen 3.0이 이미지를 생성하고 있습니다...';
            status.classList.remove('text-yellow-400', 'text-red-400');
            status.classList.add('text-ai');

            try {
                const response = await fetch(IMAGEN_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        aspectRatio: aspectRatio,
                        style: style
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.imageUrl) {
                    document.getElementById('generated-image').src = data.imageUrl;
                    document.getElementById('result-container').classList.remove('hidden');
                    status.textContent = '✓ 생성 완료!';
                } else {
                    throw new Error('이미지 URL을 받지 못했습니다');
                }

            } catch (error) {
                status.textContent = `❌ 오류: ${error.message}`;
                status.classList.remove('text-ai');
                status.classList.add('text-red-400');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>Generate Image';
            }
        }

        function downloadImage() {
            const img = document.getElementById('generated-image');
            const link = document.createElement('a');
            link.href = img.src;
            link.download = 'imagen-4.0-generated-' + Date.now() + '.png';
            link.click();
        }

        // Enter 키로 생성
        document.getElementById('prompt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateImage();
            }
        });
    </script>
</body>
</html>
