<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMBG-1.4 배경 제거 테스트</title>
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs",
    "onnxruntime-common": "https://cdn.jsdelivr.net/npm/onnxruntime-common@1.20.1/+esm"
  }
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}
.header{padding:16px 20px;border-bottom:1px solid #222}
.header h1{font-size:1.3rem;margin-bottom:4px}
.header .sub{font-size:.8rem;color:#888}

.upload-zone{display:flex;gap:12px;padding:16px 20px;flex-wrap:wrap;align-items:center}
.drop-area{flex:1;min-width:200px;border:2px dashed #333;border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:.2s;color:#888;font-size:.9rem}
.drop-area:hover,.drop-area.dragover{border-color:#6c5ce7;color:#bbb;background:#1a1a2e}
.drop-area input{display:none}
.camera-btn{padding:12px 24px;background:#2d2d44;border:1px solid #444;border-radius:10px;color:#eee;cursor:pointer;font-size:.9rem;white-space:nowrap}
.camera-btn:hover{background:#3d3d55}
.camera-btn input{display:none}

.status-bar{padding:8px 20px;font-size:.85rem;color:#888;min-height:32px;display:flex;align-items:center;gap:8px}
.status-bar .spinner{display:inline-block;width:16px;height:16px;border:2px solid #444;border-top-color:#6c5ce7;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.compare-area{display:flex;gap:0;padding:0 20px 20px;position:relative}
@media(max-width:700px){.compare-area{flex-direction:column;gap:12px}}
.compare-panel{flex:1;position:relative;min-height:200px}
.compare-panel img,.compare-panel canvas{width:100%;height:auto;border-radius:8px;display:block}
.compare-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 10px;border-radius:4px;font-size:.75rem;font-weight:600;z-index:2}

.slider-container{position:relative;padding:0 20px 20px;display:none}
.slider-wrap{position:relative;overflow:hidden;border-radius:8px;cursor:ew-resize;touch-action:none}
.slider-wrap img{width:100%;display:block}
.slider-overlay{position:absolute;top:0;left:0;height:100%;overflow:hidden}
.slider-overlay img{display:block;height:100%;width:auto;max-width:none}
.slider-line{position:absolute;top:0;width:3px;height:100%;background:#6c5ce7;z-index:3;pointer-events:none}
.slider-handle{position:absolute;top:50%;width:32px;height:32px;background:#6c5ce7;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none}

.controls{display:flex;gap:8px;padding:0 20px 16px;flex-wrap:wrap}
.ctrl-btn{padding:8px 16px;border:1px solid #444;background:#1a1a2e;color:#eee;border-radius:8px;cursor:pointer;font-size:.8rem;transition:.2s}
.ctrl-btn:hover{background:#2d2d44}
.ctrl-btn.active{border-color:#6c5ce7;background:#2a1a4e}
.ctrl-btn:disabled{opacity:.4;cursor:not-allowed}

.metrics{padding:0 20px 16px;font-size:.85rem;color:#aaa;display:flex;gap:16px;flex-wrap:wrap}
.metrics .val{color:#eee;font-weight:600}
.metrics .fast{color:#00b894}
.metrics .slow{color:#e17055}

.history{padding:16px 20px;border-top:1px solid #222}
.history h3{font-size:.9rem;margin-bottom:8px;color:#888}
.history-grid{display:flex;gap:8px;flex-wrap:wrap}
.history-item{width:80px;height:100px;border-radius:6px;border:1px solid #333;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.history-item:hover{border-color:#6c5ce7}
.history-item img{width:100%;height:100%;object-fit:cover}
.history-item .time{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);font-size:.65rem;text-align:center;padding:2px}
.empty{color:#555;font-size:.8rem}
</style>
</head>
<body>

<div class="header">
  <h1>RMBG-1.4 배경 제거 테스트</h1>
  <div class="sub">Transformers.js + briaai/RMBG-1.4 (quantized) · 브라우저 로컬 추론 · 흰배경 합성</div>
</div>

<div class="upload-zone">
  <div class="drop-area" id="dropArea">
    <span>📁 사진을 드래그하거나 클릭하여 업로드</span>
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <label class="camera-btn">
    📷 카메라
    <input type="file" id="cameraInput" accept="image/*" capture="user">
  </label>
</div>

<div class="status-bar" id="statusBar"></div>

<div class="compare-area" id="compareArea" style="display:none">
  <div class="compare-panel">
    <span class="compare-label">원본</span>
    <img id="originalImg" alt="원본">
  </div>
  <div class="compare-panel" id="resultPanel">
    <span class="compare-label" id="resultLabel">배경 제거 (흰배경)</span>
    <canvas id="resultCanvas"></canvas>
  </div>
</div>

<div class="slider-container" id="sliderContainer">
  <div class="slider-wrap" id="sliderWrap">
    <img id="sliderBg" alt="result">
    <div class="slider-overlay" id="sliderOverlay">
      <img id="sliderFg" alt="original">
    </div>
    <div class="slider-line" id="sliderLine"></div>
    <div class="slider-handle" id="sliderHandle"></div>
  </div>
</div>

<div class="controls" id="controlsBar" style="display:none">
  <button class="ctrl-btn active" id="btnWhite" onclick="toggleBg('white')">흰배경</button>
  <button class="ctrl-btn" id="btnTransparent" onclick="toggleBg('transparent')">투명</button>
  <button class="ctrl-btn" id="btnSlider" onclick="toggleSlider()">슬라이더 비교</button>
  <button class="ctrl-btn" id="btnDownload" onclick="downloadResult()">💾 다운로드</button>
</div>

<div class="metrics" id="metricsBar" style="display:none"></div>

<div class="history">
  <h3>히스토리</h3>
  <div class="history-grid" id="historyGrid">
    <span class="empty">아직 테스트 결과가 없습니다</span>
  </div>
</div>

<script>
var pipeline = null;
var currentOriginalUrl = null;
var currentTransparentBlob = null;
var currentWhiteBlob = null;
var currentBgMode = 'white';
var sliderMode = false;
var isProcessing = false;
var isFirstRun = true;
var testHistory = [];

// === Upload ===
var dropArea = document.getElementById('dropArea');
var fileInput = document.getElementById('fileInput');
var cameraInput = document.getElementById('cameraInput');

dropArea.addEventListener('click', function() { fileInput.click(); });
dropArea.addEventListener('dragover', function(e) { e.preventDefault(); dropArea.classList.add('dragover'); });
dropArea.addEventListener('dragleave', function() { dropArea.classList.remove('dragover'); });
dropArea.addEventListener('drop', function(e) {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e) { if (e.target.files[0]) processFile(e.target.files[0]); });
cameraInput.addEventListener('change', function(e) { if (e.target.files[0]) processFile(e.target.files[0]); });

function setStatus(msg, loading) {
  var bar = document.getElementById('statusBar');
  bar.innerHTML = (loading ? '<span class="spinner"></span>' : '') + msg;
}

function loadImage(src) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() { resolve(img); };
    img.src = src;
  });
}

async function processFile(file) {
  if (isProcessing) return;
  isProcessing = true;

  if (currentOriginalUrl) URL.revokeObjectURL(currentOriginalUrl);
  currentOriginalUrl = URL.createObjectURL(file);

  document.getElementById('originalImg').src = currentOriginalUrl;
  document.getElementById('compareArea').style.display = '';
  document.getElementById('controlsBar').style.display = '';
  document.getElementById('sliderContainer').style.display = 'none';
  sliderMode = false;
  document.getElementById('btnSlider').classList.remove('active');

  setStatus('RMBG-1.4 로딩 중...', true);

  try {
    var mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
    mod.env.allowLocalModels = false;

    if (!pipeline) {
      setStatus('모델 다운로드 중... (최초 ~44MB)', true);
      pipeline = await mod.pipeline('image-segmentation', 'briaai/RMBG-1.4', { quantized: true });
    }

    setStatus('추론 중...', true);
    var t0 = performance.now();
    var url = URL.createObjectURL(file);
    var result = await pipeline(url);
    var elapsed = performance.now() - t0;
    URL.revokeObjectURL(url);

    var maskData = result[0].mask;
    var w = maskData.width;
    var h = maskData.height;

    var origImg = await loadImage(currentOriginalUrl);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.drawImage(origImg, 0, 0, w, h);
    var imageData = ctx.getImageData(0, 0, w, h);
    for (var i = 0; i < maskData.data.length; i++) {
      imageData.data[i * 4 + 3] = maskData.data[i];
    }
    ctx.putImageData(imageData, 0, 0);
    currentTransparentBlob = await new Promise(function(resolve) { c.toBlob(resolve, 'image/png'); });

    var wc = document.createElement('canvas');
    wc.width = w; wc.height = h;
    var wctx = wc.getContext('2d');
    wctx.fillStyle = '#FFFFFF';
    wctx.fillRect(0, 0, w, h);
    wctx.drawImage(c, 0, 0);
    currentWhiteBlob = await new Promise(function(resolve) { wc.toBlob(resolve, 'image/png'); });

    drawResult();

    var label = isFirstRun ? 'Cold' : 'Warm';
    isFirstRun = false;
    var sec = (elapsed / 1000).toFixed(1);
    var cls = elapsed < 5000 ? 'fast' : 'slow';

    document.getElementById('metricsBar').style.display = '';
    document.getElementById('metricsBar').innerHTML =
      '<div>' + label + ': <span class="val ' + cls + '">' + sec + 's</span></div>' +
      '<div>이미지: <span class="val">' + w + '×' + h + '</span></div>' +
      '<div>파일: <span class="val">' + (file.size / 1024).toFixed(0) + ' KB</span></div>';

    addHistory(currentWhiteBlob, sec);
    setStatus('완료 — ' + label + ' ' + sec + 's', false);

  } catch (err) {
    setStatus('에러: ' + err.message, false);
    console.error(err);
  }

  isProcessing = false;
}

function drawResult() {
  var blob = currentBgMode === 'white' ? currentWhiteBlob : currentTransparentBlob;
  if (!blob) return;
  var url = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() {
    var canvas = document.getElementById('resultCanvas');
    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');
    if (currentBgMode === 'transparent') {
      for (var y = 0; y < img.height; y += 12) {
        for (var x = 0; x < img.width; x += 12) {
          ctx.fillStyle = ((x / 12 + y / 12) % 2 === 0) ? '#333' : '#222';
          ctx.fillRect(x, y, 12, 12);
        }
      }
    }
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
  };
  img.src = url;
  document.getElementById('resultLabel').textContent =
    currentBgMode === 'white' ? '배경 제거 (흰배경)' : '배경 제거 (투명)';
}

function toggleBg(mode) {
  currentBgMode = mode;
  document.getElementById('btnWhite').classList.toggle('active', mode === 'white');
  document.getElementById('btnTransparent').classList.toggle('active', mode === 'transparent');
  drawResult();
}

function toggleSlider() {
  sliderMode = !sliderMode;
  document.getElementById('btnSlider').classList.toggle('active', sliderMode);
  document.getElementById('compareArea').style.display = sliderMode ? 'none' : '';
  document.getElementById('sliderContainer').style.display = sliderMode ? '' : 'none';
  if (sliderMode) initSlider();
}

function initSlider() {
  var blob = currentBgMode === 'white' ? currentWhiteBlob : currentTransparentBlob;
  if (!blob || !currentOriginalUrl) return;
  var resultUrl = URL.createObjectURL(blob);
  document.getElementById('sliderBg').src = resultUrl;
  document.getElementById('sliderFg').src = currentOriginalUrl;
  setSliderPos(0.5);
}

function setSliderPos(ratio) {
  var wrap = document.getElementById('sliderWrap');
  var w = wrap.offsetWidth;
  var px = Math.round(ratio * w);
  document.getElementById('sliderOverlay').style.width = px + 'px';
  var fgImg = document.getElementById('sliderFg');
  fgImg.style.width = w + 'px';
  document.getElementById('sliderLine').style.left = px + 'px';
  document.getElementById('sliderHandle').style.left = px + 'px';
}

(function() {
  var wrap = document.getElementById('sliderWrap');
  var dragging = false;
  function onMove(clientX) {
    var rect = wrap.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    setSliderPos(ratio);
  }
  wrap.addEventListener('mousedown', function(e) { dragging = true; onMove(e.clientX); });
  window.addEventListener('mousemove', function(e) { if (dragging) onMove(e.clientX); });
  window.addEventListener('mouseup', function() { dragging = false; });
  wrap.addEventListener('touchstart', function(e) { dragging = true; onMove(e.touches[0].clientX); }, {passive: true});
  window.addEventListener('touchmove', function(e) { if (dragging) onMove(e.touches[0].clientX); }, {passive: true});
  window.addEventListener('touchend', function() { dragging = false; });
})();

function downloadResult() {
  var blob = currentBgMode === 'white' ? currentWhiteBlob : currentTransparentBlob;
  if (!blob) return;
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rmbg-result-' + (currentBgMode === 'white' ? 'white' : 'transparent') + '.png';
  a.click();
}

function addHistory(blob, sec) {
  var grid = document.getElementById('historyGrid');
  var empty = grid.querySelector('.empty');
  if (empty) empty.remove();

  var url = URL.createObjectURL(blob);
  var item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = '<img src="' + url + '"><div class="time">' + sec + 's</div>';
  grid.insertBefore(item, grid.firstChild);

  testHistory.push({ url: url, time: sec });
}
</script>
</body>
</html>
