<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiRefNet vs RMBG-2.0 — A/B 비교</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
.header { padding: 16px 20px; text-align: center; border-bottom: 1px solid #222; }
.header h1 { font-size: 22px; font-weight: 700; }
.header .sub { color: #888; font-size: 12px; margin-top: 4px; }
.status-row { padding: 8px 20px; background: #111; font-size: 12px; display: flex; gap: 24px; justify-content: center; }
.status-item { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.dot.on { background: #4ade80; }
.dot.blue { background: #60a5fa; }
.main { max-width: 1400px; margin: 0 auto; padding: 20px; }
.upload-zone { border: 2px dashed #333; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 16px; transition: border-color 0.2s; }
.upload-zone:hover { border-color: #facc15; }
.upload-zone.dragging { border-color: #facc15; background: rgba(250,204,21,0.05); }
.upload-zone input { display: none; }
.upload-zone .icon { font-size: 36px; }
.upload-zone .label { font-size: 15px; font-weight: 600; margin-top: 8px; }
.loading { display: none; text-align: center; padding: 30px; }
.loading .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #facc15; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.results { display: none; }
.compare-row { display: flex; gap: 12px; margin-bottom: 12px; }
.compare-row .col { flex: 1; }
.panel { background: #111; border-radius: 8px; overflow: hidden; position: relative; }
.panel .tag { position: absolute; top: 8px; left: 8px; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; z-index: 2; }
.panel .tag.orig { background: rgba(0,0,0,0.7); }
.panel .tag.biref { background: rgba(96,165,250,0.9); color: #000; }
.panel .tag.rmbg { background: rgba(74,222,128,0.9); color: #000; }
.panel img { width: 100%; display: block; }
.metric-row { display: flex; gap: 12px; margin-bottom: 16px; }
.metric-card { flex: 1; background: #111; border-radius: 8px; padding: 12px 16px; }
.metric-card h3 { font-size: 12px; color: #888; margin-bottom: 8px; }
.metric-card .val { font-size: 22px; font-weight: 700; font-family: monospace; }
.metric-card .val.blue { color: #60a5fa; }
.metric-card .val.green { color: #4ade80; }
.metric-card .label { font-size: 11px; color: #666; margin-top: 2px; }
.winner { border: 1px solid #facc15; }
.bench-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #111; border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
.bench-table th { text-align: left; padding: 8px 12px; color: #888; border-bottom: 1px solid #222; font-size: 11px; }
.bench-table td { padding: 8px 12px; border-bottom: 1px solid #1a1a1a; }
.bench-table td.num { font-family: monospace; }
.bench-table .faster { color: #facc15; font-weight: 700; }
.bg-toggle { display: flex; gap: 4px; justify-content: center; margin-bottom: 12px; }
.bg-toggle .opt { padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid #333; }
.bg-toggle .opt.active { background: #332a00; border-color: #facc15; color: #facc15; }
.checkerboard { background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%), linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%), linear-gradient(-45deg, transparent 75%, #1a1a1a 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
</style>
</head>
<body>

<div class="header">
    <h1>BiRefNet vs RMBG-2.0</h1>
    <div class="sub">RTX 4060 · 동일 이미지 동시 비교 · 교대 추론 (OOM 방지)</div>
</div>
<div class="status-row">
    <div class="status-item"><span class="dot" id="dotBiref"></span> <span id="txtBiref">BiRefNet :5001 확인 중</span></div>
    <div class="status-item"><span class="dot" id="dotRmbg"></span> <span id="txtRmbg">RMBG-2.0 :5000 확인 중</span></div>
</div>

<div class="main">
    <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="icon">📸</div>
        <div class="label">사진을 드래그하거나 클릭 (복수 선택 가능)</div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">처리 중...</div>
    </div>

    <div class="results" id="results">
        <div class="bg-toggle">
            <div class="opt active" onclick="setBg(this,'white')">흰배경</div>
            <div class="opt" onclick="setBg(this,'checker')">투명</div>
        </div>

        <div id="compareArea"></div>

        <table class="bench-table" id="benchTable">
            <thead><tr><th>#</th><th>파일명</th><th>BiRefNet</th><th>RMBG-2.0</th><th>차이</th></tr></thead>
            <tbody id="benchBody"></tbody>
        </table>
    </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const BIREF_API = params.get('biref') || (location.hostname === 'localhost' ? 'http://localhost:5001' : `http://${location.hostname}:5001`);
const RMBG_API = params.get('rmbg') || (location.hostname === 'localhost' ? 'http://localhost:5000' : `http://${location.hostname}:5000`);

let bgMode = 'white';
const allResults = [];

async function checkServer(url, dotId, txtId, name) {
    try {
        const r = await fetch(url + '/health');
        const j = await r.json();
        document.getElementById(dotId).classList.add(name === 'BiRefNet' ? 'blue' : 'on');
        document.getElementById(txtId).textContent = `${name} :${new URL(url).port} OK (${j.device})`;
        return true;
    } catch {
        document.getElementById(txtId).textContent = `${name} 오프라인`;
        return false;
    }
}
checkServer(BIREF_API, 'dotBiref', 'txtBiref', 'BiRefNet');
checkServer(RMBG_API, 'dotRmbg', 'txtRmbg', 'RMBG-2.0');

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragging'); processFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => processFiles(fileInput.files));

async function processFiles(files) {
    if (!files.length) return;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('results').style.display = 'none';

    for (let i = 0; i < files.length; i++) {
        document.getElementById('loadingText').textContent = `처리 중 (${i+1}/${files.length})... BiRefNet`;
        const file = files[i];
        const origUrl = URL.createObjectURL(file);

        const fd1 = new FormData(); fd1.append('file', file);
        const r1 = await fetch(BIREF_API + '/benchmark', { method: 'POST', body: fd1 });
        const j1 = await r1.json();

        document.getElementById('loadingText').textContent = `처리 중 (${i+1}/${files.length})... RMBG-2.0`;

        const fd2 = new FormData(); fd2.append('file', file);
        const r2 = await fetch(RMBG_API + '/benchmark', { method: 'POST', body: fd2 });
        const j2 = await r2.json();

        const birefBlob = await fetch('data:image/png;base64,' + j1.result_png_b64).then(r => r.blob());
        const rmbgBlob = await fetch('data:image/png;base64,' + j2.result_png_b64).then(r => r.blob());

        allResults.push({
            name: file.name,
            origUrl,
            birefUrl: URL.createObjectURL(birefBlob),
            rmbgUrl: URL.createObjectURL(rmbgBlob),
            birefTime: j1.elapsed_sec,
            rmbgTime: j2.elapsed_sec,
            birefVram: j1.vram_peak_mb,
            rmbgVram: j2.vram_peak_mb,
            inputSize: j1.input_size,
        });
    }

    document.getElementById('loading').style.display = 'none';
    renderResults();
}

function renderResults() {
    document.getElementById('results').style.display = 'block';
    const area = document.getElementById('compareArea');
    area.innerHTML = '';

    allResults.forEach((r, i) => {
        const row = document.createElement('div');
        row.className = 'compare-row';
        row.innerHTML = `
            <div class="col"><div class="panel"><div class="tag orig">원본</div><img src="${r.origUrl}"></div></div>
            <div class="col"><div class="panel result-panel"><div class="tag biref">BiRefNet ${r.birefTime}s</div><img src="${r.birefUrl}"></div></div>
            <div class="col"><div class="panel result-panel"><div class="tag rmbg">RMBG-2.0 ${r.rmbgTime}s</div><img src="${r.rmbgUrl}"></div></div>
        `;
        area.appendChild(row);
    });
    applyBg();
    renderTable();
}

function renderTable() {
    const body = document.getElementById('benchBody');
    body.innerHTML = '';
    allResults.forEach((r, i) => {
        const diff = ((r.birefTime - r.rmbgTime) / r.rmbgTime * 100).toFixed(1);
        const faster = r.birefTime < r.rmbgTime ? 'BiRefNet' : 'RMBG-2.0';
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td>${r.name}</td>
            <td class="num ${r.birefTime <= r.rmbgTime ? 'faster' : ''}">${r.birefTime}s</td>
            <td class="num ${r.rmbgTime <= r.birefTime ? 'faster' : ''}">${r.rmbgTime}s</td>
            <td class="num">${diff > 0 ? '+' : ''}${diff}%</td>`;
        body.appendChild(tr);
    });
    if (allResults.length > 1) {
        const avgB = allResults.reduce((s, r) => s + r.birefTime, 0) / allResults.length;
        const avgR = allResults.reduce((s, r) => s + r.rmbgTime, 0) / allResults.length;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="2" style="color:#888">평균</td>
            <td class="num ${avgB <= avgR ? 'faster' : ''}">${avgB.toFixed(3)}s</td>
            <td class="num ${avgR <= avgB ? 'faster' : ''}">${avgR.toFixed(3)}s</td>
            <td class="num">${((avgB-avgR)/avgR*100).toFixed(1)}%</td>`;
        body.appendChild(tr);
    }
}

function setBg(el, mode) {
    bgMode = mode;
    document.querySelectorAll('.bg-toggle .opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    applyBg();
}

function applyBg() {
    document.querySelectorAll('.result-panel').forEach(p => {
        if (bgMode === 'checker') {
            p.classList.add('checkerboard');
            p.style.background = '';
        } else {
            p.classList.remove('checkerboard');
            p.style.background = '#fff';
        }
    });
}
</script>
</body>
</html>
