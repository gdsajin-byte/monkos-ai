<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mirror 테스트 페이지</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f5f5; color: #333;
            font-family: -apple-system, sans-serif;
            min-height: 100vh; padding: 20px;
        }
        h1 { font-size: 18px; margin-bottom: 8px; }
        p { font-size: 14px; color: #666; margin-bottom: 16px; }
        .timestamp { color: #999; font-size: 12px; font-family: monospace; }

        .demo-card {
            background: #fff; border-radius: 12px;
            padding: 20px; margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .demo-card h2 { font-size: 15px; margin-bottom: 8px; }

        .color-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .color-box { aspect-ratio: 1; border-radius: 8px; }

        .counter-area { text-align: center; padding: 20px; }
        .counter { font-size: 48px; font-weight: 700; color: #3b82f6; }
        .counter-btn {
            padding: 12px 32px; border-radius: 8px; border: none;
            background: #3b82f6; color: #fff;
            font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 12px;
        }
        .counter-btn:active { opacity: 0.7; }

        .scroll-test {
            height: 200px; overflow-y: auto;
            background: #f0f0f0; border-radius: 8px; padding: 12px;
        }
        .scroll-item {
            padding: 8px; margin-bottom: 4px;
            background: #fff; border-radius: 6px; font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>Mirror 테스트 페이지</h1>
    <p>이 페이지가 iMac 콘솔에 보이면 성공!</p>
    <p class="timestamp" id="clock"></p>
    <p class="timestamp">해상도: <span id="res"></span></p>

    <div class="demo-card">
        <h2>카운터 (인터랙션 테스트)</h2>
        <div class="counter-area">
            <div class="counter" id="count">0</div>
            <button class="counter-btn" id="btn-count">+1</button>
        </div>
    </div>

    <div class="demo-card">
        <h2>색상 그리드 (렌더링 테스트)</h2>
        <div class="color-grid" id="color-grid"></div>
    </div>

    <div class="demo-card">
        <h2>스크롤 영역</h2>
        <div class="scroll-test" id="scroll-area"></div>
    </div>

    <script>
        // 시계
        setInterval(() => {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('ko-KR', { hour12: false });
        }, 1000);

        // 해상도
        document.getElementById('res').textContent = `${window.innerWidth}x${window.innerHeight}`;

        // 카운터
        let count = 0;
        document.getElementById('btn-count').addEventListener('click', () => {
            count++;
            document.getElementById('count').textContent = count;
        });

        // 색상 그리드
        const colors = [
            '#ef4444', '#f59e0b', '#22c55e', '#3b82f6',
            '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16',
            '#f97316', '#14b8a6', '#6366f1', '#e11d48',
        ];
        const grid = document.getElementById('color-grid');
        colors.forEach(c => {
            const div = document.createElement('div');
            div.className = 'color-box';
            div.style.background = c;
            grid.appendChild(div);
        });

        // 스크롤 목록
        const scrollArea = document.getElementById('scroll-area');
        for (let i = 1; i <= 30; i++) {
            const item = document.createElement('div');
            item.className = 'scroll-item';
            item.textContent = `항목 #${i} — 스크롤 테스트 아이템`;
            scrollArea.appendChild(item);
        }
    </script>
</body>
</html>
