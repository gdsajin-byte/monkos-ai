<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKOS 캠 수신</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111; color: #fff;
            font-family: -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
        }
        #status-bar {
            padding: 12px 16px; background: #1a1a1a;
            font-size: 14px; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        #status-bar .left { display: flex; gap: 16px; }
        .indicator {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
        .connected { background: #22c55e; }
        .disconnected { background: #ef4444; }
        .connecting { background: #f59e0b; }
        #video-container {
            flex: 1; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        #remote-video {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        #waiting {
            position: absolute; font-size: 18px; color: #666;
        }
        #stats-overlay {
            position: absolute; top: 16px; right: 16px;
            background: rgba(0,0,0,0.8); padding: 12px 16px;
            border-radius: 8px; font-family: monospace; font-size: 13px;
            line-height: 1.8;
        }
        .stat-label { color: #888; }
        .stat-value { color: #22c55e; font-size: 15px; }
        .stat-warn { color: #f59e0b; }
        .stat-bad { color: #ef4444; }
        #log {
            padding: 8px 16px; background: #0a0a0a;
            font-size: 11px; color: #888; max-height: 100px;
            overflow-y: auto; font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="status-bar">
        <div class="left">
            <span>
                <span class="indicator disconnected" id="ws-dot"></span>
                <span id="ws-status">시그널링 연결 중...</span>
            </span>
            <span>
                <span class="indicator disconnected" id="rtc-dot"></span>
                <span id="rtc-status">P2P 대기</span>
            </span>
        </div>
        <span id="elapsed" style="color: #666;">00:00</span>
    </div>

    <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <div id="waiting">송신자 대기 중...</div>
        <div id="stats-overlay" style="display:none;">
            <div><span class="stat-label">해상도: </span><span class="stat-value" id="s-resolution">-</span></div>
            <div><span class="stat-label">FPS: </span><span class="stat-value" id="s-fps">-</span></div>
            <div><span class="stat-label">비트레이트: </span><span class="stat-value" id="s-bitrate">-</span></div>
            <div><span class="stat-label">RTT: </span><span class="stat-value" id="s-rtt">-</span></div>
            <div><span class="stat-label">패킷 손실: </span><span class="stat-value" id="s-loss">-</span></div>
            <div><span class="stat-label">코덱: </span><span class="stat-value" id="s-codec">-</span></div>
            <div><span class="stat-label">전송 방식: </span><span class="stat-value" id="s-transport">-</span></div>
            <div><span class="stat-label">스트리밍: </span><span class="stat-value" id="s-duration">-</span></div>
        </div>
    </div>

    <div id="log"></div>

    <script>
        const WS_HOST = location.host;

        let ws = null;
        let pc = null;
        let statsInterval = null;
        let prevBytesReceived = 0;
        let prevTimestamp = 0;
        let streamStartTime = null;
        let elapsedInterval = null;

        const remoteVideo = document.getElementById('remote-video');
        const waitingEl = document.getElementById('waiting');
        const statsOverlay = document.getElementById('stats-overlay');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString('ko-KR');
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
            console.log(msg);
        }

        function setStatus(id, cls, text) {
            document.getElementById(id + '-dot').className = 'indicator ' + cls;
            document.getElementById(id + '-status').textContent = text;
        }

        // 경과 시간 표시
        function startElapsed() {
            streamStartTime = Date.now();
            elapsedInterval = setInterval(() => {
                const sec = Math.floor((Date.now() - streamStartTime) / 1000);
                const mm = String(Math.floor(sec / 60)).padStart(2, '0');
                const ss = String(sec % 60).padStart(2, '0');
                document.getElementById('elapsed').textContent = `${mm}:${ss}`;
            }, 1000);
        }

        // WebRTC 통계 수집
        function startStats() {
            statsOverlay.style.display = 'block';
            statsInterval = setInterval(async () => {
                if (!pc) return;
                const stats = await pc.getStats();

                stats.forEach(report => {
                    if (report.type === 'inbound-rtp' && report.kind === 'video') {
                        // FPS
                        document.getElementById('s-fps').textContent =
                            report.framesPerSecond ? `${report.framesPerSecond}` : '-';

                        // 해상도
                        if (report.frameWidth && report.frameHeight) {
                            document.getElementById('s-resolution').textContent =
                                `${report.frameWidth}x${report.frameHeight}`;
                        }

                        // 비트레이트
                        if (prevTimestamp > 0) {
                            const dt = (report.timestamp - prevTimestamp) / 1000;
                            const db = report.bytesReceived - prevBytesReceived;
                            const kbps = Math.round((db * 8) / dt / 1000);
                            const el = document.getElementById('s-bitrate');
                            el.textContent = `${kbps} kbps`;
                            el.className = kbps < 500 ? 'stat-value stat-bad' :
                                           kbps < 1500 ? 'stat-value stat-warn' : 'stat-value';
                        }
                        prevBytesReceived = report.bytesReceived;
                        prevTimestamp = report.timestamp;

                        // 패킷 손실
                        if (report.packetsLost !== undefined && report.packetsReceived) {
                            const total = report.packetsReceived + report.packetsLost;
                            const pct = ((report.packetsLost / total) * 100).toFixed(2);
                            const el = document.getElementById('s-loss');
                            el.textContent = `${pct}%`;
                            el.className = pct > 5 ? 'stat-value stat-bad' :
                                           pct > 1 ? 'stat-value stat-warn' : 'stat-value';
                        }

                        // 코덱
                        if (report.codecId) {
                            const codecReport = stats.get(report.codecId);
                            if (codecReport) {
                                document.getElementById('s-codec').textContent =
                                    codecReport.mimeType?.split('/')[1] || '-';
                            }
                        }
                    }

                    // RTT
                    if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                        const rtt = report.currentRoundTripTime;
                        if (rtt !== undefined) {
                            const ms = Math.round(rtt * 1000);
                            const el = document.getElementById('s-rtt');
                            el.textContent = `${ms}ms`;
                            el.className = ms > 200 ? 'stat-value stat-bad' :
                                           ms > 100 ? 'stat-value stat-warn' : 'stat-value';
                        }

                        // 전송 방식
                        const localId = report.localCandidateId;
                        const localCandidate = stats.get(localId);
                        if (localCandidate) {
                            const type = localCandidate.candidateType;
                            document.getElementById('s-transport').textContent =
                                type === 'host' ? 'P2P 직결' :
                                type === 'srflx' ? 'STUN 반사' :
                                type === 'relay' ? 'TURN 릴레이' : type;
                        }
                    }
                });

                // 스트리밍 시간
                if (streamStartTime) {
                    const sec = Math.floor((Date.now() - streamStartTime) / 1000);
                    document.getElementById('s-duration').textContent = `${sec}초`;
                }
            }, 1000);
        }

        // WebSocket 시그널링
        function connectSignaling() {
            ws = new WebSocket(`wss://${WS_HOST}`);
            setStatus('ws', 'connecting', '시그널링 연결 중...');

            ws.onopen = () => {
                setStatus('ws', 'connected', '시그널링 연결됨');
                ws.send(JSON.stringify({ type: 'register', role: 'receiver' }));
                log('시그널링 서버 연결됨');
            };

            ws.onmessage = async (e) => {
                try {
                    const raw = (e.data instanceof Blob) ? await e.data.text() : e.data;
                    const msg = JSON.parse(raw);
                    log(`수신: ${msg.type}`);

                    if (msg.type === 'offer') {
                        log('SDP Offer 수신 — P2P 연결 시작');
                        await createAnswer(msg);
                    } else if (msg.type === 'ice-candidate') {
                        if (pc && pc.remoteDescription) {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } else {
                            log('ICE 보류 — PC 미준비');
                        }
                    } else if (msg.type === 'peer-joined') {
                        log('송신자 접속 감지');
                    }
                } catch (err) {
                    log('오류: ' + err.message);
                }
            };

            ws.onclose = () => {
                setStatus('ws', 'disconnected', '시그널링 끊김');
                log('시그널링 연결 끊김 — 3초 후 재연결');
                setTimeout(connectSignaling, 3000);
            };
        }

        // WebRTC Answer 생성
        async function createAnswer(offer) {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.ontrack = (e) => {
                log(`트랙 수신: ${e.track.kind}, readyState: ${e.track.readyState}`);
                remoteVideo.srcObject = e.streams[0];
                remoteVideo.muted = true;
                remoteVideo.play().then(() => {
                    log('비디오 재생 시작');
                }).catch(err => {
                    log('재생 오류: ' + err.message);
                });
                waitingEl.style.display = 'none';
                startStats();
                startElapsed();
            };

            pc.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
                }
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                log(`P2P 상태: ${state}`);
                if (state === 'connected') {
                    setStatus('rtc', 'connected', 'P2P 연결됨');
                } else if (state === 'failed' || state === 'disconnected') {
                    setStatus('rtc', 'disconnected', 'P2P 끊김');
                    if (statsInterval) clearInterval(statsInterval);
                    if (elapsedInterval) clearInterval(elapsedInterval);
                }
            };

            setStatus('rtc', 'connecting', 'P2P 연결 중...');

            try {
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                log('RemoteDescription 설정 완료');
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify(answer));
                log('SDP Answer 전송 완료');
            } catch (err) {
                log('Answer 생성 오류: ' + err.message);
            }
        }

        connectSignaling();
    </script>
</body>
</html>
