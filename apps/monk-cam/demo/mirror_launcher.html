<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MONKOS Mirror</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MONKOS Mirror">
    <link rel="apple-touch-icon" href="/mirror_icon_192.png">
    <meta name="theme-color" content="#111">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #111; color: #fff;
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            -webkit-text-size-adjust: none;
        }
        .app {
            display: flex; flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        }

        /* 헤더 */
        .header {
            text-align: center;
            padding: 32px 0 24px;
        }
        .header .logo {
            font-size: 20px; font-weight: 700;
            letter-spacing: 3px; opacity: 0.4;
        }
        .header .subtitle {
            font-size: 13px; color: #555;
            margin-top: 6px;
        }

        /* 퀵 링크 목록 */
        .links {
            flex: 1;
            display: flex; flex-direction: column;
            gap: 10px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        .link-card {
            display: block;
            padding: 16px 18px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #ccc;
            text-decoration: none;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .link-card:active { background: #252525; }
        .link-card .card-title {
            font-size: 15px; font-weight: 600; color: #fff;
        }
        .link-card .card-desc {
            font-size: 12px; color: #666; margin-top: 4px;
            line-height: 1.4;
        }
        .link-card .card-badge {
            display: inline-block;
            margin-top: 6px; padding: 2px 8px;
            background: #222; border-radius: 4px;
            font-size: 10px; color: #555;
            font-family: 'SF Mono', monospace;
        }

        /* 구분선 */
        .divider {
            border: none; border-top: 1px solid #222;
            margin: 8px 0;
        }

        /* URL 직접 입력 */
        .url-bar {
            display: flex; gap: 8px;
            max-width: 400px; width: 100%;
            margin: 16px auto 0;
        }
        .url-input {
            flex: 1; height: 40px;
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 10px; padding: 0 12px;
            color: #fff; font-size: 13px; outline: none;
            min-width: 0;
        }
        .url-input:focus { border-color: #3b82f6; }
        .btn-go {
            height: 40px; padding: 0 16px;
            background: #3b82f6; color: #fff;
            border: none; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; flex-shrink: 0;
        }
        .btn-go:active { opacity: 0.7; }

        /* 푸터 */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 11px; color: #333;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">MONKOS MIRROR</div>
            <div class="subtitle">mirror_client.js 자동 주입 — 전체 페이지 미러링</div>
        </div>

        <div class="links">
            <a class="link-card" href="/mirror_test.html">
                <div class="card-title">Mirror 테스트 페이지</div>
                <div class="card-desc">기본 테스트용 — 버튼, 스크롤, 색상 변화 확인</div>
                <div class="card-badge">mirror_test.html</div>
            </a>

            <a class="link-card" href="/sender.html">
                <div class="card-title">Presentation Sender</div>
                <div class="card-desc">WebRTC 카메라 송출 — 프레젠테이션 모드</div>
                <div class="card-badge">sender.html</div>
            </a>

            <hr class="divider">

            <a class="link-card" id="link-photolab" href="#">
                <div class="card-title">Photolab (증명사진)</div>
                <div class="card-desc">monk.kr AI 증명사진 앱 미러링 테스트</div>
                <div class="card-badge">monk.kr/ai_lab/photolab/</div>
            </a>
        </div>

        <!-- URL 직접 입력 -->
        <div class="url-bar">
            <input class="url-input" id="url-input"
                   type="url" placeholder="URL 직접 입력...">
            <button class="btn-go" id="btn-go">이동</button>
        </div>

        <div class="footer">
            mirror_client.js 뱃지로 P2P 제어 | 서버가 자동 주입
        </div>
    </div>

    <script>
        // 전체 페이지 이동 (iframe 아님)
        function go(url) {
            if (url) location.href = url;
        }

        document.getElementById('btn-go').addEventListener('click', () => {
            go(document.getElementById('url-input').value.trim());
        });

        document.getElementById('url-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                go(e.target.value.trim());
                e.target.blur();
            }
        });

        // 외부 URL 퀵링크 — 서버 자동 주입 범위 밖이므로 안내만
        document.getElementById('link-photolab').addEventListener('click', (e) => {
            e.preventDefault();
            alert('외부 URL은 mirror_client.js 수동 삽입 필요.\n\n<script src="https://100.97.103.10:8443/mirror_client.js"><\\/script>\n\n위 태그를 해당 페이지에 추가하세요.');
        });

        // URL 파라미터 자동 이동
        const autoUrl = new URLSearchParams(location.search).get('url');
        if (autoUrl) go(autoUrl);
    </script>
</body>
</html>
