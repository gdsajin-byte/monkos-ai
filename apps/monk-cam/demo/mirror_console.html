<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKOS Mirror Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a; color: #fff;
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* 상단 상태 바 */
        #status-bar {
            padding: 10px 16px; background: #1a1a1a;
            font-size: 13px; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        #status-bar .left { display: flex; gap: 16px; align-items: center; }
        .indicator {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
        .connected { background: #22c55e; }
        .disconnected { background: #ef4444; }
        .connecting { background: #f59e0b; }

        /* 메인 영역: 화면 + 사이드바 */
        #main {
            flex: 1; display: flex; overflow: hidden;
        }

        /* 미러 화면 */
        #mirror-viewport {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: #111; position: relative; overflow: hidden;
        }
        #mirror-frame {
            position: relative;
            background: #000; border-radius: 16px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #mirror-img {
            display: block; width: 100%; height: 100%;
            object-fit: contain;
        }
        #waiting {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px; color: #666;
            text-align: center;
        }
        #waiting .icon { font-size: 48px; margin-bottom: 12px; }

        /* 사이드 패널 */
        #sidebar {
            width: 280px; background: #1a1a1a;
            border-left: 1px solid #333;
            display: flex; flex-direction: column;
            flex-shrink: 0; overflow-y: auto;
        }
        .panel-section {
            padding: 14px 16px;
            border-bottom: 1px solid #2a2a2a;
        }
        .panel-title {
            font-size: 11px; color: #888;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* 버튼 */
        .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-row:last-child { margin-bottom: 0; }
        .btn {
            flex: 1; padding: 10px 8px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-green { background: #22c55e; color: #000; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-blue { background: #3b82f6; color: #fff; }
        .btn-gray { background: #333; color: #fff; }
        .btn-yellow { background: #f59e0b; color: #000; }

        /* FPS/품질 선택 */
        .option-group { display: flex; gap: 4px; }
        .option-btn {
            flex: 1; padding: 6px 4px; border-radius: 6px; border: 1px solid #444;
            background: transparent; color: #aaa; font-size: 12px;
            cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .option-btn.active {
            background: #3b82f6; color: #fff; border-color: #3b82f6;
        }

        /* 통계 */
        .stat-row {
            display: flex; justify-content: space-between;
            padding: 3px 0; font-size: 12px;
        }
        .stat-label { color: #888; }
        .stat-value { color: #22c55e; font-family: monospace; }

        /* 스크린샷 갤러리 */
        #gallery {
            flex: 1; padding: 14px 16px; overflow-y: auto;
        }
        #gallery-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .gallery-thumb {
            aspect-ratio: 9/19.5; border-radius: 6px;
            overflow: hidden; cursor: pointer;
            border: 1px solid #333; position: relative;
            transition: border-color 0.2s;
        }
        .gallery-thumb:hover { border-color: #3b82f6; }
        .gallery-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .gallery-thumb .thumb-num {
            position: absolute; top: 2px; left: 4px;
            font-size: 9px; color: #fff; background: rgba(0,0,0,0.6);
            padding: 1px 4px; border-radius: 3px;
        }

        /* 로그 */
        #log {
            padding: 6px 16px; background: #0a0a0a;
            font-size: 10px; color: #666; max-height: 60px;
            overflow-y: auto; font-family: monospace;
            flex-shrink: 0; border-top: 1px solid #222;
        }
    </style>
</head>
<body>
    <!-- 상단 상태 바 -->
    <div id="status-bar">
        <div class="left">
            <span>
                <span class="indicator disconnected" id="ws-dot"></span>
                <span id="ws-status">시그널링 연결 중...</span>
            </span>
            <span>
                <span class="indicator disconnected" id="rtc-dot"></span>
                <span id="rtc-status">DataChannel 대기</span>
            </span>
        </div>
        <span id="elapsed" style="color: #666;">--:--</span>
    </div>

    <!-- 메인 영역 -->
    <div id="main">
        <!-- 미러 화면 -->
        <div id="mirror-viewport">
            <div id="mirror-frame">
                <img id="mirror-img" alt="미러링 화면">
                <div id="waiting">
                    <div class="icon">📱</div>
                    모바일 디바이스 연결 대기 중...<br>
                    <small style="color:#555; margin-top:8px; display:block;">
                        대상 페이지에 mirror_client.js 주입 필요
                    </small>
                </div>
            </div>
        </div>

        <!-- 사이드 패널 -->
        <div id="sidebar">
            <!-- 카메라 제어 -->
            <div class="panel-section">
                <div class="panel-title">카메라 제어</div>
                <div class="btn-row">
                    <button class="btn btn-green" id="btn-cam-on">🟢 카메라 ON</button>
                    <button class="btn btn-red" id="btn-cam-off">🔴 OFF</button>
                </div>
                <div class="btn-row">
                    <button class="btn btn-blue" id="btn-cam-flip">🔄 전면/후면</button>
                    <button class="btn btn-yellow" id="btn-screenshot">📸 스크린샷</button>
                </div>
            </div>

            <!-- FPS / 품질 -->
            <div class="panel-section">
                <div class="panel-title">캡쳐 FPS</div>
                <div class="option-group" id="fps-group">
                    <button class="option-btn active" data-fps="0">멈춤</button>
                    <button class="option-btn" data-fps="0.5">0.5</button>
                    <button class="option-btn" data-fps="1">1</button>
                    <button class="option-btn" data-fps="2">2</button>
                    <button class="option-btn" data-fps="3">3</button>
                </div>
                <div class="panel-title" style="margin-top:10px;">이미지 품질</div>
                <div class="option-group" id="quality-group">
                    <button class="option-btn" data-quality="0.3">낮음</button>
                    <button class="option-btn active" data-quality="0.6">중간</button>
                    <button class="option-btn" data-quality="0.8">높음</button>
                </div>
            </div>

            <!-- 통계 -->
            <div class="panel-section">
                <div class="panel-title">통계</div>
                <div class="stat-row">
                    <span class="stat-label">수신 FPS</span>
                    <span class="stat-value" id="s-fps">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">지연</span>
                    <span class="stat-value" id="s-latency">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">해상도</span>
                    <span class="stat-value" id="s-resolution">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">프레임 크기</span>
                    <span class="stat-value" id="s-size">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">총 수신</span>
                    <span class="stat-value" id="s-total">0</span>
                </div>
            </div>

            <!-- 스크린샷 갤러리 -->
            <div id="gallery">
                <div class="panel-title">📸 스크린샷 갤러리</div>
                <div id="gallery-grid"></div>
            </div>
        </div>
    </div>

    <!-- 하단 로그 -->
    <div id="log"></div>

    <script>
        const WS_HOST = location.host;

        let ws = null;
        let pc = null;
        let dc = null;
        let connectedTime = null;
        let elapsedTimer = null;
        let frameCount = 0;
        let totalFrames = 0;
        let fpsCounter = 0;
        let fpsTimer = null;
        let lastFrameTs = 0;
        let screenshotCount = 0;
        let chunkBuffers = {};    // 청크 조립용 버퍼
        let pendingCandidates = []; // ICE candidate 버퍼

        const mirrorImg = document.getElementById('mirror-img');
        const waitingEl = document.getElementById('waiting');
        const galleryGrid = document.getElementById('gallery-grid');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString('ko-KR');
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
            console.log('[Console]', msg);
        }

        function setStatus(id, cls, text) {
            document.getElementById(id + '-dot').className = 'indicator ' + cls;
            document.getElementById(id + '-status').textContent = text;
        }

        // --- 경과 시간 ---
        function startElapsed() {
            connectedTime = Date.now();
            elapsedTimer = setInterval(() => {
                const sec = Math.floor((Date.now() - connectedTime) / 1000);
                const mm = String(Math.floor(sec / 60)).padStart(2, '0');
                const ss = String(sec % 60).padStart(2, '0');
                document.getElementById('elapsed').textContent = `${mm}:${ss}`;
            }, 1000);
        }

        // --- FPS 카운터 ---
        function startFpsCounter() {
            fpsTimer = setInterval(() => {
                document.getElementById('s-fps').textContent = `${fpsCounter}`;
                fpsCounter = 0;
            }, 1000);
        }

        // --- 미러 뷰포트 크기 조정 (모바일 비율 9:19.5) ---
        function resizeMirrorFrame() {
            const viewport = document.getElementById('mirror-viewport');
            const frame = document.getElementById('mirror-frame');
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            const ratio = 9 / 19.5;
            const padding = 32;

            let frameH = vh - padding;
            let frameW = frameH * ratio;

            if (frameW > vw - padding) {
                frameW = vw - padding;
                frameH = frameW / ratio;
            }

            frame.style.width = `${Math.round(frameW)}px`;
            frame.style.height = `${Math.round(frameH)}px`;
        }

        window.addEventListener('resize', resizeMirrorFrame);

        // --- 프레임 표시 ---
        function displayFrame(dataUrl, width, height, isScreenshot) {
            mirrorImg.src = dataUrl;
            waitingEl.style.display = 'none';

            // 통계 갱신
            fpsCounter++;
            totalFrames++;
            const now = Date.now();
            if (lastFrameTs > 0) {
                document.getElementById('s-latency').textContent = `${now - lastFrameTs}ms`;
            }
            lastFrameTs = now;
            document.getElementById('s-resolution').textContent = `${width}x${height}`;
            document.getElementById('s-size').textContent = `${Math.round(dataUrl.length / 1024)}KB`;
            document.getElementById('s-total').textContent = totalFrames;

            // 스크린샷이면 갤러리에 추가
            if (isScreenshot) {
                addToGallery(dataUrl);
            }
        }

        // --- 청크 조립 ---
        function handleChunk(msg) {
            const key = msg.id;
            if (!chunkBuffers[key]) {
                chunkBuffers[key] = {
                    chunks: new Array(msg.total),
                    received: 0,
                    w: msg.w,
                    h: msg.h,
                    isScreenshot: msg.type === 'screenshot-chunk',
                };
            }
            const buf = chunkBuffers[key];
            buf.chunks[msg.idx] = msg.data;
            buf.received++;

            if (buf.received === msg.total) {
                const fullData = buf.chunks.join('');
                displayFrame(fullData, buf.w, buf.h, buf.isScreenshot);
                delete chunkBuffers[key];
            }

            // 오래된 불완전 버퍼 정리 (5초 이상)
            const cutoff = Date.now() - 5000;
            for (const k of Object.keys(chunkBuffers)) {
                if (parseInt(k) < cutoff) {
                    delete chunkBuffers[k];
                }
            }
        }

        // --- 스크린샷 갤러리 ---
        function addToGallery(dataUrl) {
            screenshotCount++;
            const thumb = document.createElement('div');
            thumb.className = 'gallery-thumb';
            thumb.innerHTML = `
                <img src="${dataUrl}" alt="스크린샷 #${screenshotCount}">
                <span class="thumb-num">#${screenshotCount}</span>
            `;
            thumb.addEventListener('click', () => {
                // 클릭 시 원본 다운로드
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `mirror_screenshot_${screenshotCount}.jpg`;
                a.click();
            });
            galleryGrid.prepend(thumb);
            log(`스크린샷 #${screenshotCount} 저장됨`);
        }

        // --- 명령 전송 ---
        function sendCommand(cmd) {
            if (dc && dc.readyState === 'open') {
                dc.send(JSON.stringify(cmd));
                log(`명령 전송: ${cmd.type}`);
            } else {
                log('DataChannel 미연결 — 명령 전송 불가');
            }
        }

        // --- 대기 화면 복원 ---
        function showWaiting() {
            waitingEl.style.display = '';
            mirrorImg.src = '';
            document.getElementById('s-fps').textContent = '-';
            document.getElementById('s-latency').textContent = '-';
            document.getElementById('s-resolution').textContent = '-';
            document.getElementById('s-size').textContent = '-';
        }

        // --- 상태 초기화 (재연결 시) ---
        function resetState() {
            if (dc) { try { dc.close(); } catch {} dc = null; }
            if (pc) { try { pc.close(); } catch {} pc = null; }
            if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
            if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
            connectedTime = null;
            fpsCounter = 0;
            lastFrameTs = 0;
            chunkBuffers = {};
            pendingCandidates = [];
            setStatus('rtc', 'disconnected', 'DataChannel 대기');
            document.getElementById('elapsed').textContent = '--:--';
        }

        // --- WebSocket 시그널링 ---
        function connectSignaling() {
            if (ws && ws.readyState <= 1) return; // 이미 연결 중이면 중복 방지
            ws = new WebSocket(`wss://${WS_HOST}`);
            setStatus('ws', 'connecting', '시그널링 연결 중...');

            ws.onopen = () => {
                setStatus('ws', 'connected', '시그널링 연결됨');
                ws.send(JSON.stringify({ type: 'register', role: 'mirror-receiver' }));
                log('시그널링 서버 연결됨');
            };

            ws.onmessage = async (e) => {
                try {
                    const raw = (e.data instanceof Blob) ? await e.data.text() : e.data;
                    const msg = JSON.parse(raw);

                    if (msg.type === 'offer') {
                        log('Offer 수신 → Answer 생성');
                        await createAnswer(msg);
                    } else if (msg.type === 'ice-candidate') {
                        if (pc && pc.remoteDescription) {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } else {
                            pendingCandidates.push(msg.candidate);
                        }
                    } else if (msg.type === 'peer-joined') {
                        log('미러 송신자 접속 감지');
                    } else if (msg.type === 'peer-left') {
                        log('미러 송신자 끊김 — 재접속 대기');
                        resetState();
                        showWaiting();
                    }
                } catch (err) {
                    log('오류: ' + err.message);
                }
            };

            ws.onclose = () => {
                setStatus('ws', 'disconnected', '시그널링 끊김');
                resetState();
                log('시그널링 끊김 — 1초 후 재연결');
                setTimeout(connectSignaling, 1000);
            };

            ws.onerror = () => {
                log('WebSocket 오류');
            };
        }

        // --- WebRTC Answer ---
        async function createAnswer(offer) {
            resetState();

            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            // DataChannel 수신 대기
            pc.ondatachannel = (e) => {
                dc = e.channel;
                log(`DataChannel 수신: "${dc.label}"`);

                dc.onopen = () => {
                    log('DataChannel 열림 — 미러링 시작');
                    setStatus('rtc', 'connected', 'DataChannel 연결됨');
                    startElapsed();
                    startFpsCounter();
                };

                dc.onmessage = (evt) => {
                    try {
                        const msg = JSON.parse(evt.data);

                        if (msg.type === 'frame') {
                            displayFrame(msg.data, msg.w, msg.h, false);
                        } else if (msg.type === 'screenshot') {
                            displayFrame(msg.data, msg.w, msg.h, true);
                        } else if (msg.type === 'frame-chunk' || msg.type === 'screenshot-chunk') {
                            handleChunk(msg);
                        } else if (msg.type === 'cam-status') {
                            log(`카메라: ${msg.active ? 'ON' : 'OFF'}${msg.facingMode ? ` (${msg.facingMode})` : ''}`);
                        }
                    } catch (err) {
                        // 파싱 실패 무시
                    }
                };

                dc.onclose = () => {
                    log('DataChannel 닫힘 — 재접속 대기');
                    setStatus('rtc', 'disconnected', 'DataChannel 끊김');
                    if (elapsedTimer) clearInterval(elapsedTimer);
                    if (fpsTimer) clearInterval(fpsTimer);
                    showWaiting();
                };
            };

            pc.onicecandidate = (e) => {
                if (e.candidate && ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
                }
            };

            pc.onconnectionstatechange = () => {
                log(`P2P 상태: ${pc.connectionState}`);
                if (pc.connectionState === 'connected') {
                    setStatus('rtc', 'connected', 'P2P 연결됨');
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    // 온디맨드: 정리만, 재연결 안 함 (클라이언트가 재접속하면 새 Offer 수신)
                    setStatus('rtc', 'disconnected', 'P2P 끊김 — 재접속 대기');
                    showWaiting();
                }
            };

            setStatus('rtc', 'connecting', 'P2P 연결 중...');

            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify(answer));
            log('Answer 전송');

            // 보류된 ICE candidate 처리
            for (const c of pendingCandidates) {
                await pc.addIceCandidate(new RTCIceCandidate(c));
            }
            pendingCandidates = [];
        }

        // --- 버튼 이벤트 ---
        document.getElementById('btn-cam-on').addEventListener('click', () => {
            sendCommand({ type: 'cam-on' });
        });

        document.getElementById('btn-cam-off').addEventListener('click', () => {
            sendCommand({ type: 'cam-off' });
        });

        document.getElementById('btn-cam-flip').addEventListener('click', () => {
            sendCommand({ type: 'cam-flip' });
        });

        document.getElementById('btn-screenshot').addEventListener('click', () => {
            sendCommand({ type: 'screenshot' });
        });

        // FPS 선택
        document.getElementById('fps-group').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn) return;
            document.querySelectorAll('#fps-group .option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            sendCommand({ type: 'set-fps', fps: parseFloat(btn.dataset.fps) });
        });

        // 품질 선택
        document.getElementById('quality-group').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn) return;
            document.querySelectorAll('#quality-group .option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            sendCommand({ type: 'set-quality', quality: parseFloat(btn.dataset.quality) });
        });

        // --- 포그라운드 복귀 시 즉시 재연결 (Safari 백그라운드 suspension 대응) ---
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (!ws || ws.readyState > 1) {
                    log('포그라운드 복귀 → 즉시 재연결');
                    connectSignaling();
                }
            }
        });

        // --- 초기화 ---
        resizeMirrorFrame();
        connectSignaling();
    </script>
</body>
</html>
