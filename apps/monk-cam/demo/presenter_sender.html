<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONKOS 프레젠테이션 - 송신</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111; color: #fff;
            font-family: -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
        }
        #status-bar {
            padding: 10px 16px; background: #1a1a1a;
            font-size: 13px; border-bottom: 1px solid #333;
        }
        .indicator {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
        .connected { background: #22c55e; }
        .disconnected { background: #ef4444; }
        .connecting { background: #f59e0b; }
        #video-container {
            flex: 1; position: relative; overflow: hidden;
        }
        #local-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* AI 코칭 오버레이 */
        #coaching-overlay {
            position: absolute; bottom: 80px; left: 12px; right: 12px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(245,158,11,0.5);
            border-radius: 12px; padding: 14px 16px;
            display: none; transition: opacity 0.3s;
        }
        #coaching-overlay .header {
            font-size: 11px; color: #f59e0b; margin-bottom: 6px;
            font-weight: 600;
        }
        #coaching-overlay .text {
            font-size: 15px; line-height: 1.5; color: #fff;
        }
        #coaching-overlay .time {
            font-size: 10px; color: #666; margin-top: 6px; text-align: right;
        }
        /* 타이머 오버레이 */
        #timer-overlay {
            position: absolute; top: 12px; left: 12px;
            background: rgba(0,0,0,0.7); padding: 6px 12px;
            border-radius: 6px; font-size: 20px; font-family: monospace;
            color: #22c55e;
        }
        #controls {
            padding: 14px 16px; background: #1a1a1a;
            display: flex; gap: 10px; justify-content: center;
        }
        button {
            padding: 10px 20px; border-radius: 8px; border: none;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        #btn-start { background: #22c55e; color: #000; }
        #btn-stop { background: #ef4444; color: #fff; }
        #btn-switch { background: #3b82f6; color: #fff; }
        button:disabled { opacity: 0.4; }
        #log {
            padding: 6px 16px; background: #0a0a0a;
            font-size: 10px; color: #666; max-height: 60px;
            overflow-y: auto; font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="status-bar">
        <span class="indicator disconnected" id="ws-dot"></span>
        <span id="ws-status">연결 중...</span>
        &nbsp;|&nbsp;
        <span class="indicator disconnected" id="rtc-dot"></span>
        <span id="rtc-status">P2P 대기</span>
    </div>

    <div id="video-container">
        <video id="local-video" autoplay playsinline muted></video>
        <div id="timer-overlay">0.0</div>
        <div id="coaching-overlay">
            <div class="header">AI 코칭</div>
            <div class="text" id="coaching-text"></div>
            <div class="time" id="coaching-time"></div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-start">송신 시작</button>
        <button id="btn-switch">카메라 전환</button>
        <button id="btn-stop" disabled>중지</button>
    </div>

    <div id="log"></div>

    <script>
        const WS_HOST = location.host;
        const COACHING_DISPLAY_MS = 10000; // 코칭 메시지 10초 표시

        let ws = null;
        let pc = null;
        let localStream = null;
        let facingMode = 'environment';
        let timerRAF = null;
        let coachingTimeout = null;

        const localVideo = document.getElementById('local-video');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString('ko-KR');
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
        }

        function setStatus(id, cls, text) {
            document.getElementById(id + '-dot').className = 'indicator ' + cls;
            document.getElementById(id + '-status').textContent = text;
        }

        // 타이머
        function startTimer() {
            (function update() {
                document.getElementById('timer-overlay').textContent = (performance.now() / 1000).toFixed(1) + 's';
                timerRAF = requestAnimationFrame(update);
            })();
        }
        function stopTimer() { if (timerRAF) cancelAnimationFrame(timerRAF); }

        // AI 코칭 오버레이 표시
        function showCoaching(text) {
            const overlay = document.getElementById('coaching-overlay');
            document.getElementById('coaching-text').textContent = text;
            document.getElementById('coaching-time').textContent = new Date().toLocaleTimeString('ko-KR');
            overlay.style.display = 'block';

            if (coachingTimeout) clearTimeout(coachingTimeout);
            coachingTimeout = setTimeout(() => {
                overlay.style.display = 'none';
            }, COACHING_DISPLAY_MS);
        }

        // WebSocket
        function connectWS() {
            ws = new WebSocket(`wss://${WS_HOST}`);
            setStatus('ws', 'connecting', '연결 중...');

            ws.onopen = () => {
                setStatus('ws', 'connected', '연결됨');
                ws.send(JSON.stringify({ type: 'register', role: 'sender' }));
                log('서버 연결됨');
            };

            const pendingCandidates = [];

            ws.onmessage = async (e) => {
                try {
                    const raw = (e.data instanceof Blob) ? await e.data.text() : e.data;
                    const msg = JSON.parse(raw);

                    if (msg.type === 'answer') {
                        log('Answer 수신');
                        await pc.setRemoteDescription(new RTCSessionDescription(msg));
                        for (const c of pendingCandidates) {
                            await pc.addIceCandidate(new RTCIceCandidate(c));
                        }
                        pendingCandidates.length = 0;
                    } else if (msg.type === 'ice-candidate') {
                        if (pc && pc.remoteDescription) {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } else {
                            pendingCandidates.push(msg.candidate);
                        }
                    } else if (msg.type === 'peer-joined') {
                        log('수신자 접속');
                    } else if (msg.type === 'ai-coaching') {
                        // AI 코칭 메시지 → 오버레이 표시
                        showCoaching(msg.text);
                        log(`[AI] ${msg.text.substring(0, 40)}`);
                    }
                } catch (err) {
                    log('오류: ' + err.message);
                }
            };

            ws.onclose = () => {
                setStatus('ws', 'disconnected', '끊김');
                setTimeout(connectWS, 3000);
            };
        }

        // 카메라
        async function getCamera() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            localVideo.srcObject = localStream;
        }

        // WebRTC
        async function startStreaming() {
            await getCamera();
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
                }
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                log(`P2P: ${state}`);
                if (state === 'connected') setStatus('rtc', 'connected', 'P2P 연결됨');
                else if (state === 'failed' || state === 'disconnected') setStatus('rtc', 'disconnected', 'P2P 끊김');
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify(offer));
            log('Offer 전송');

            setStatus('rtc', 'connecting', 'P2P 연결 중...');
            startTimer();

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
        }

        function stopStreaming() {
            if (pc) { pc.close(); pc = null; }
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            stopTimer();
            setStatus('rtc', 'disconnected', '중지');
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
        }

        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await getCamera();
            if (pc) {
                const sender = pc.getSenders().find(s => s.track?.kind === 'video');
                if (sender) await sender.replaceTrack(localStream.getVideoTracks()[0]);
            }
        }

        document.getElementById('btn-start').addEventListener('click', startStreaming);
        document.getElementById('btn-stop').addEventListener('click', stopStreaming);
        document.getElementById('btn-switch').addEventListener('click', switchCamera);

        connectWS();
    </script>
</body>
</html>
