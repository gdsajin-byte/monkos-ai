<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONKOS 캠 송신</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111; color: #fff;
            font-family: -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
        }
        #status-bar {
            padding: 12px 16px; background: #1a1a1a;
            font-size: 14px; border-bottom: 1px solid #333;
        }
        #status-bar .indicator {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
        .connected { background: #22c55e; }
        .disconnected { background: #ef4444; }
        .connecting { background: #f59e0b; }
        #video-container {
            flex: 1; position: relative; overflow: hidden;
        }
        #local-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        #timer-overlay {
            position: absolute; top: 16px; left: 16px;
            background: rgba(0,0,0,0.7); padding: 8px 14px;
            border-radius: 8px; font-size: 24px; font-family: monospace;
            color: #22c55e;
        }
        #controls {
            padding: 16px; background: #1a1a1a;
            display: flex; gap: 12px; justify-content: center;
        }
        button {
            padding: 12px 24px; border-radius: 8px; border: none;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        #btn-start { background: #22c55e; color: #000; }
        #btn-stop { background: #ef4444; color: #fff; }
        #btn-switch { background: #3b82f6; color: #fff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #log {
            padding: 8px 16px; background: #0a0a0a;
            font-size: 11px; color: #888; max-height: 80px;
            overflow-y: auto; font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="status-bar">
        <span class="indicator disconnected" id="ws-dot"></span>
        <span id="ws-status">시그널링 연결 중...</span>
        &nbsp;|&nbsp;
        <span class="indicator disconnected" id="rtc-dot"></span>
        <span id="rtc-status">P2P 대기</span>
    </div>

    <div id="video-container">
        <video id="local-video" autoplay playsinline muted></video>
        <div id="timer-overlay">0.000</div>
    </div>

    <div id="controls">
        <button id="btn-start">송신 시작</button>
        <button id="btn-switch">카메라 전환</button>
        <button id="btn-stop" disabled>중지</button>
    </div>

    <div id="log"></div>

    <script>
        const WS_HOST = location.host; // hostname:port 포함

        let ws = null;
        let pc = null;
        let localStream = null;
        let facingMode = 'environment';
        let timerRAF = null;

        const localVideo = document.getElementById('local-video');
        const timerOverlay = document.getElementById('timer-overlay');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnSwitch = document.getElementById('btn-switch');
        const logEl = document.getElementById('log');

        function log(msg) {
            const t = new Date().toLocaleTimeString('ko-KR');
            logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
            console.log(msg);
        }

        function setStatus(id, cls, text) {
            document.getElementById(id + '-dot').className = 'indicator ' + cls;
            document.getElementById(id + '-status').textContent = text;
        }

        // 타이머 오버레이 (레이턴시 측정용)
        function startTimer() {
            function update() {
                timerOverlay.textContent = performance.now().toFixed(1);
                timerRAF = requestAnimationFrame(update);
            }
            update();
        }

        function stopTimer() {
            if (timerRAF) cancelAnimationFrame(timerRAF);
        }

        // WebSocket 시그널링
        function connectSignaling() {
            ws = new WebSocket(`wss://${WS_HOST}`);
            setStatus('ws', 'connecting', '시그널링 연결 중...');

            ws.onopen = () => {
                setStatus('ws', 'connected', '시그널링 연결됨');
                ws.send(JSON.stringify({ type: 'register', role: 'sender' }));
                log('시그널링 서버 연결됨');
            };

            const pendingCandidates = [];

            ws.onmessage = async (e) => {
                try {
                    const raw = (e.data instanceof Blob) ? await e.data.text() : e.data;
                    const msg = JSON.parse(raw);
                    log(`수신: ${msg.type}`);

                    if (msg.type === 'answer') {
                        log('SDP Answer 수신');
                        await pc.setRemoteDescription(new RTCSessionDescription(msg));
                        // 보류된 ICE candidate 처리
                        for (const c of pendingCandidates) {
                            await pc.addIceCandidate(new RTCIceCandidate(c));
                        }
                        pendingCandidates.length = 0;
                    } else if (msg.type === 'ice-candidate') {
                        if (pc && pc.remoteDescription) {
                            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        } else {
                            pendingCandidates.push(msg.candidate);
                            log('ICE 보류 (answer 대기)');
                        }
                    } else if (msg.type === 'peer-joined') {
                        log('수신자 접속 감지');
                    }
                } catch (err) {
                    log('오류: ' + err.message);
                }
            };

            ws.onclose = () => {
                setStatus('ws', 'disconnected', '시그널링 끊김');
                log('시그널링 연결 끊김 — 3초 후 재연결');
                setTimeout(connectSignaling, 3000);
            };
        }

        // 카메라 잡기
        async function getCamera() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            localVideo.srcObject = localStream;
            log(`카메라 획득: ${facingMode}`);
        }

        // WebRTC 연결
        async function startStreaming() {
            await getCamera();

            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            pc.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
                }
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                log(`P2P 상태: ${state}`);
                if (state === 'connected') {
                    setStatus('rtc', 'connected', 'P2P 연결됨');
                } else if (state === 'failed' || state === 'disconnected') {
                    setStatus('rtc', 'disconnected', 'P2P 끊김');
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify(offer));
            log('SDP Offer 전송');

            setStatus('rtc', 'connecting', 'P2P 연결 중...');
            startTimer();

            btnStart.disabled = true;
            btnStop.disabled = false;
        }

        function stopStreaming() {
            if (pc) { pc.close(); pc = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); }
            stopTimer();
            setStatus('rtc', 'disconnected', 'P2P 중지');
            btnStart.disabled = false;
            btnStop.disabled = true;
            log('스트리밍 중지');
        }

        // 카메라 전환 (전면/후면)
        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await getCamera();
            if (pc) {
                const sender = pc.getSenders().find(s => s.track?.kind === 'video');
                if (sender) {
                    await sender.replaceTrack(localStream.getVideoTracks()[0]);
                }
            }
            log(`카메라 전환: ${facingMode}`);
        }

        btnStart.addEventListener('click', startStreaming);
        btnStop.addEventListener('click', stopStreaming);
        btnSwitch.addEventListener('click', switchCamera);

        connectSignaling();
    </script>
</body>
</html>
